<title>Remiel Amicura</title>
<style>html,body{margin:0;height:100%;background:#080a10}</style>
<script src="/assets/bigate.js"></script>
</head>
<body>
<script>
(function(){
  var c=''; try{ c=sessionStorage.getItem('cc:access')||localStorage.getItem('cc:access')||''; }catch(e){}
  function back(){ try{sessionStorage.removeItem('cc:access');localStorage.removeItem('cc:access');}catch(e){} location.replace('index.html'); }
  if(!c){ back(); return; }
  BIGate.open('app.enc.json', c).then(function(ok){ if(!ok) back(); }).catch(back);
})();
</script>
