<meta charset="utf-8">

<style>
/* Layout: dark glass world. Header with views and language. Find = AI finding lists. Patient = orb path + voice companion + thread. Navigator = BLUF, worklist, case panel. Program = funnel, equity, van plan. Brief = reading column. */
:root{
  color-scheme:dark;
  --void:#06060e; --deep:#0b0b1f; --elev:#161640;
  --ink:#FFFFFF; --ink2:#b0b0d0; --ink3:#8282bc;
  --blue:#4A9CE8; --purple:#9B6AE8; --cyan:#00D4FF; --rose:#E84A8A; --teal:#4AE8C4; --gold:#E8A44A;
  --crit:#E84A4A; --high:#E8A84A; --mod:#4A9CE8; --low:#4AE88A;
  --glass:rgba(255,255,255,.03); --glass2:rgba(255,255,255,.055);
  --edge:rgba(155,106,232,.2); --edge2:rgba(155,106,232,.42);
  --f-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1100px 650px at 78% -8%,rgba(74,156,232,.22),transparent 60%),radial-gradient(900px 620px at -12% 105%,rgba(155,106,232,.2),transparent 60%),linear-gradient(180deg,var(--void),var(--deep) 55%,var(--void));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
#field{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}
.wrap{position:relative;z-index:1;max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible,tr:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 40px rgba(0,0,0,.35)}
h2.view{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.6vw,38px);line-height:1.08;text-wrap:balance;background:linear-gradient(180deg,#fff,#c9c9ea);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;margin-right:auto}
.brand h1{font-size:clamp(24px,2.4vw,30px)!important}
.top .tabs button{padding:8px 12px}
.top{gap:12px 14px}
.brand .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .ral{height:64px;width:auto;flex:0 0 auto}
@media (max-width:620px){.brand .ral{height:52px}}
.brand .by{font-family:var(--f-mono);font-size:11px;letter-spacing:.24em;background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.8vw,40px);line-height:1.05}
.wt{display:inline-block;margin-left:10px;vertical-align:middle;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border:1px dashed rgba(176,176,208,.5);padding:3px 8px;border-radius:999px}
.tabs{display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:8px 15px;border-radius:999px;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,rgba(74,156,232,.32),rgba(155,106,232,.32));color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge2),0 0 18px rgba(74,156,232,.25)}
.tabs .ai{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;color:var(--cyan);margin-left:5px;vertical-align:1px}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;gap:3px;padding:4px;border-radius:999px;border:1px solid var(--edge);background:var(--glass)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.lang button[aria-pressed="true"]{background:rgba(0,212,255,.16);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(0,212,255,.5)}
.sample{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rose);border:1px solid rgba(232,74,138,.45);border-radius:999px;padding:4px 10px;white-space:nowrap}

/* BLUF */
.bluf{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:15px 18px;margin:14px 0 18px;border-radius:16px;background:linear-gradient(100deg,rgba(74,156,232,.16),rgba(155,106,232,.12) 60%,rgba(0,212,255,.06));border:1px solid rgba(0,212,255,.35);box-shadow:0 0 30px rgba(0,212,255,.08)}
.bluf-tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;color:#06060e;background:var(--cyan);padding:3px 8px;border-radius:6px;font-weight:500}
.bluf .v{font-size:15.5px;font-weight:500;flex:1 1 320px;min-width:0}
.bluf .v b{font-weight:700}
.bluf button{border:1px solid rgba(0,212,255,.55);background:rgba(0,212,255,.14);padding:8px 15px;border-radius:999px;font-weight:600;font-size:14px}

.btn{border:1px solid var(--edge2);background:var(--glass2);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn.pri{background:linear-gradient(135deg,rgba(0,212,255,.26),rgba(74,156,232,.32));border-color:rgba(0,212,255,.6);box-shadow:0 0 16px rgba(0,212,255,.15)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"],.btn.done{background:rgba(155,106,232,.22);border-color:rgba(155,106,232,.7)}
.btn:hover{filter:brightness(1.15)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.okmsg{margin-top:12px;padding:10px 14px;border-radius:12px;background:rgba(74,156,232,.1);border:1px solid rgba(74,156,232,.45);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink2)}
button.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--purple);background:rgba(155,106,232,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.lrchip{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;color:#06060e;white-space:nowrap}
.sig{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--rose);border:1px solid rgba(232,74,138,.5);background:rgba(232,74,138,.1);border-radius:999px;padding:2px 9px;white-space:nowrap}
.sig::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
.aitag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:var(--cyan);border:1px solid rgba(0,212,255,.45);border-radius:999px;padding:2px 8px;white-space:nowrap}

/* FIND */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat .n{font-family:var(--f-display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink2);margin-top:4px}
.stat.hot .n{color:var(--cyan);text-shadow:0 0 18px rgba(0,212,255,.45)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.fcol h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:24px}
.fcol .sub{font-size:13px;color:var(--ink2);margin-bottom:12px}
.cards{display:flex;flex-direction:column;gap:12px}
.fcard{padding:16px 18px}
.fcard.no{opacity:.72}
.fhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.fhead .nm{font-weight:600;font-size:16px}
.fhead .mt{font-size:12.5px;color:var(--ink3)}
.src{font-family:var(--f-mono);font-size:11px;color:var(--ink3);margin:8px 0 6px}
blockquote{margin:0;padding:10px 12px;border-radius:10px;background:rgba(6,6,14,.55);border:1px solid rgba(155,106,232,.18);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;color:#d8d8f0}
blockquote mark{background:rgba(0,212,255,.18);color:#fff;border-bottom:1px solid var(--cyan);padding:0 2px;border-radius:2px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fact{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(74,156,232,.12);border:1px solid rgba(74,156,232,.35)}
.fact.warn{background:rgba(232,74,138,.1);border-color:rgba(232,74,138,.45)}
.verdictline{font-size:13.5px;margin-top:4px}
.verdictline b{font-weight:600}
.conf{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--ink3);margin-top:8px}
.conf .bar{flex:0 0 90px;height:5px;border-radius:3px;background:rgba(155,106,232,.2);overflow:hidden}
.conf .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan))}

/* PATIENT */
.pv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.who .nm{font-family:var(--f-display);font-size:30px;line-height:1}
.who .meta{color:var(--ink2);font-size:13px;margin-top:4px}
.pgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.ring{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.core{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.6),rgba(120,170,255,.55) 16%,rgba(110,90,232,.45) 42%,rgba(22,22,64,.65) 66%,rgba(6,6,14,.25) 72%);
  box-shadow:0 0 70px rgba(74,156,232,.35),0 0 130px rgba(155,106,232,.28),inset 0 0 30px rgba(255,255,255,.12);border:1px solid rgba(155,106,232,.5);animation:breatheC 5s ease-in-out infinite}
.core .init{font-family:var(--f-display);font-size:clamp(26px,4.4vw,46px);line-height:1}
.core .stp{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px;color:#dfe6ff}
.stn{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;width:124px}
.orb{--c:var(--purple);width:62px;height:62px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 27%,rgba(255,255,255,.88),var(--c) 24%,color-mix(in srgb,var(--c) 42%,#06060e) 60%,rgba(6,6,14,.5) 74%);
  box-shadow:0 0 24px color-mix(in srgb,var(--c) 70%,transparent),inset 0 0 14px rgba(255,255,255,.18);border:1px solid color-mix(in srgb,var(--c) 70%,transparent);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.7);animation:breathe 4.5s ease-in-out infinite}
.stn[data-state="ahead"] .orb{--c:#4a3f86;opacity:.7;animation:none}
.stn[data-state="now"] .orb{--c:var(--cyan)}
.stn[data-state="now"] .orb::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1.5px solid var(--cyan);animation:ping 2.4s ease-out infinite}
.stn[data-state="done"] .orb::before{content:"✓";position:absolute;right:-3px;top:-3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;background:#0b0b1f;border:1px solid var(--c);color:#fff}
.stn[aria-current="true"] .orb{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 36px color-mix(in srgb,var(--c) 90%,transparent)}
.stn .t{font-size:13px;font-weight:600;line-height:1.2;text-align:center}
.stn .s{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.stn:hover .orb{filter:brightness(1.2)}
.key{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:8px;font-size:12.5px;color:var(--ink2)}
.key span{display:inline-flex;align-items:center;gap:7px}
.key i{width:10px;height:10px;border-radius:50%;display:inline-block}
.detail{padding:22px;min-width:0}
.detail h2{margin:4px 0 6px;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;text-wrap:balance}
.detail p{margin:0 0 12px;color:var(--ink2);max-width:62ch}
.detail .when{font-family:var(--f-mono);font-size:12px;color:var(--cyan);margin-bottom:12px}
.detail h3{margin:16px 0 8px;font-size:11.5px;font-family:var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:500}
.elig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.elig label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2)}
.elig input,.elig select{width:100%;background:rgba(6,6,14,.6);border:1px solid var(--edge);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit;font-size:15px}
.elig .full{grid-column:1/-1}
.pky{font-family:var(--f-mono);font-size:12px;color:var(--ink3);margin-top:8px}
.verdict{margin-top:10px;padding:12px 14px;border-radius:12px;border:1px solid;font-size:14.5px}
.verdict.yes{background:rgba(74,156,232,.12);border-color:rgba(74,156,232,.55)}
.verdict.no{background:rgba(155,106,232,.1);border-color:rgba(155,106,232,.5)}
.verdict b{display:block;font-size:15.5px;margin-bottom:3px}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:999px;border:1px solid var(--edge);background:var(--glass);margin-bottom:10px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:rgba(155,106,232,.25);color:var(--ink)}
.report{padding:12px 14px;border-radius:12px;background:rgba(6,6,14,.5);border:1px solid var(--edge);font-size:14.5px}
.report.orig{font-family:var(--f-mono);font-size:12.5px;color:#d8d8f0}
.report .rv{display:block;margin-top:8px;font-family:var(--f-mono);font-size:11px;color:var(--ink3)}
.lr{display:flex;flex-direction:column;gap:5px}
.lr div{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;padding:7px 10px;border-radius:10px;border:1px solid transparent;font-size:13.5px;color:var(--ink2)}
.lr .c{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:3px 0;border-radius:6px;text-align:center;color:#06060e}
.lr .me{border-color:rgba(0,212,255,.55);background:rgba(0,212,255,.07);color:var(--ink)}
.lr .you{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--cyan);margin-left:6px}

.comp{margin-top:22px;padding:22px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.comp h2{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:28px}
.comp .sub{color:var(--ink2);font-size:14px;margin:0 0 12px;max-width:60ch}
.voice{display:flex;flex-direction:column;align-items:center;gap:10px}
#voiceOrb{width:220px;height:220px;max-width:100%}
.voice .st{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.convo{max-height:340px;overflow-y:auto;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-height:60px}
.convo li{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14.5px;animation:rise .4s ease both}
.convo li.me{align-self:flex-end;background:rgba(155,106,232,.2);border:1px solid rgba(155,106,232,.45);border-bottom-right-radius:4px}
.convo li.ai{align-self:flex-start;background:rgba(74,156,232,.12);border:1px solid rgba(74,156,232,.4);border-bottom-left-radius:4px}
.convo .who{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.consent{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(0,212,255,.5);background:rgba(0,212,255,.06);font-size:13.5px}
.consent .chips{margin-top:8px}

.thread{margin-top:22px;padding:20px 22px}
.thread h2{margin:0 0 14px;font-family:var(--f-display);font-weight:400;font-size:26px}
.tl{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--blue),var(--purple),var(--cyan))}
.tl li{position:relative;padding:4px 0 14px}
.tl li::before{content:"";position:absolute;left:-21px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--blue));box-shadow:0 0 10px var(--c,var(--blue))}
.tl .d{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.tl li.gap{padding:2px 0 12px}
.tl li.gap::before{display:none}
.tl li.gap span{display:inline-block;font-family:var(--f-mono);font-size:11.5px;color:var(--rose);border:1px dashed rgba(232,74,138,.6);border-radius:999px;padding:3px 10px}
.tl li.future{opacity:.75}

/* NAVIGATOR */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.pipe button{border:1px solid var(--edge);background:var(--glass);border-radius:12px;padding:10px 10px 9px;text-align:left;position:relative;overflow:hidden;min-width:0}
.pipe button::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:var(--w);background:linear-gradient(90deg,var(--blue),var(--purple))}
.pipe .pc{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.pipe .pl{font-size:12px;color:var(--ink2);line-height:1.25}
.pipe button[aria-pressed="true"]{border-color:var(--cyan);background:rgba(0,212,255,.1)}
.ngrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:14px}
.tablewrap{overflow-x:auto;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.025)}
table{width:100%;border-collapse:collapse;min-width:680px;font-size:13.5px}
th{text-align:left;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:500;padding:12px;border-bottom:1px solid var(--edge);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(155,106,232,.1);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:rgba(255,255,255,.03)}
tbody tr[aria-selected="true"]{background:rgba(0,212,255,.08);box-shadow:inset 3px 0 0 var(--cyan)}
tbody tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}
.pn{font-weight:600}
.small{color:var(--ink3);font-size:12px}
.risk{display:flex;align-items:center;gap:8px;white-space:nowrap}
.risk .bar{width:54px;height:6px;border-radius:3px;background:rgba(155,106,232,.18);overflow:hidden}
.risk .bar i{display:block;height:100%;border-radius:3px}
.risk .rv{font-family:var(--f-mono);font-size:12px;width:22px;text-align:right}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap}
.flag i{width:8px;height:8px;border-radius:50%;display:inline-block}
.case{padding:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0}
.case h3{margin:2px 0;font-family:var(--f-display);font-weight:400;font-size:28px}
.case .sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
.mini{display:flex;gap:4px;margin:4px 0 14px}
.mini span{flex:1;height:6px;border-radius:3px;background:rgba(155,106,232,.22)}
.mini span.on{background:linear-gradient(90deg,var(--blue),var(--purple))}
.mini span.cur{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.act{padding:12px 14px;border-radius:12px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.38);margin-bottom:12px}
.act.urgent{background:rgba(232,74,74,.1);border-color:rgba(232,74,74,.6)}
.act .label{color:var(--cyan)}
.act.urgent .label{color:#ff8a8a}
.act p{margin:4px 0 0;font-size:14.5px}
.sec{margin-top:14px}
.why{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.why li{display:flex;justify-content:space-between;gap:10px}
.why .pts{font-family:var(--f-mono);font-size:12px;color:var(--ink3)}
.nous{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(232,74,138,.45);background:rgba(232,74,138,.07);font-size:13.5px}
.nous .label{color:var(--rose)}
.nous p{margin:4px 0 0}
.nous .fine{font-size:12px;color:var(--ink3);margin-top:6px}
textarea{width:100%;min-height:118px;resize:vertical;background:rgba(6,6,14,.6);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px;line-height:1.5;margin-top:6px}
.log{list-style:none;margin:10px 0 0;padding:0;font-size:13px;color:var(--ink2)}
.log li{padding:6px 0;border-top:1px solid rgba(155,106,232,.12)}
.log .d{font-family:var(--f-mono);color:var(--ink3);font-size:11.5px;margin-right:6px}

/* PROGRAM */
.pgm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start;margin-top:4px}
.panel{padding:20px 22px;min-width:0}
.panel h3{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:24px}
.panel .sub{font-size:13px;color:var(--ink2);margin-bottom:14px}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13.5px}
.hb .tr{height:12px;border-radius:6px;background:rgba(155,106,232,.14);overflow:hidden;position:relative}
.hb .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.hb .tr i.cy{background:linear-gradient(90deg,var(--purple),var(--cyan))}
.hb .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.8}
.hb .vv{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.legend{font-size:12px;color:var(--ink3);margin-top:10px;display:flex;gap:14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* BRIEF */
.brief{max-width:900px;margin:0 auto;padding:28px clamp(18px,4vw,42px)}
.brief .label{color:var(--cyan)}
.brief h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,42px);line-height:1.08;margin:6px 0 10px;text-wrap:balance}
.brief h3{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:500;margin:28px 0 10px}
.brief ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;color:var(--ink2)}
.brief li b{color:var(--ink);font-weight:600}
.brief .lede{color:var(--ink2);font-size:16.5px;max-width:66ch;margin:0}
.bstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.bstats div{padding:14px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--glass)}
.bstats .n{font-family:var(--f-display);font-size:36px;line-height:1;color:var(--cyan);text-shadow:0 0 16px rgba(0,212,255,.35)}
.bstats .l{font-size:12.5px;color:var(--ink2);margin-top:4px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lane{padding:14px 16px;border-radius:14px;border:1px solid var(--edge);background:var(--glass);font-size:13.5px;color:var(--ink2)}
.lane b{display:block;color:var(--ink);font-size:14.5px;margin-bottom:4px}
.lane.us{border-color:rgba(0,212,255,.55);background:rgba(0,212,255,.07)}
.stab{width:100%;border-collapse:collapse;min-width:560px;font-size:13.5px}
.stab th{background:rgba(155,106,232,.18);color:var(--ink);font-family:var(--f-mono);font-size:10.5px}
.stab td{border-bottom:1px solid rgba(155,106,232,.15);color:var(--ink2);cursor:default}
.stab td:first-child{color:var(--ink)}
.status{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.s-built{color:var(--low);border-color:rgba(74,232,138,.5);background:rgba(74,232,138,.08)}
.s-pilot{color:var(--cyan);border-color:rgba(0,212,255,.5);background:rgba(0,212,255,.08)}
.s-res{color:var(--rose);border-color:rgba(232,74,138,.5);background:rgba(232,74,138,.08)}
.srcs{font-size:12px;color:var(--ink3);margin-top:24px}
.srcs a{color:var(--ink2)}

.vb{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid rgba(74,156,232,.55);background:rgba(74,156,232,.1);color:#cfe4ff;white-space:normal;line-height:1.35}
.vb::before{content:"";flex:0 0 auto;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff 0 22%,var(--blue) 26%);box-shadow:0 0 8px rgba(74,156,232,.8)}
.vb.rev{border-color:rgba(232,74,138,.6);background:rgba(232,74,138,.1);color:#ffd0e2}
.vb.rev::before{background:radial-gradient(circle,#fff 0 22%,var(--rose) 26%);box-shadow:0 0 8px rgba(232,74,138,.8)}
.vbs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.convo li .vb{margin-top:6px}
.slot{-webkit-box-decoration-break:clone;box-decoration-break:clone;background:rgba(74,156,232,.18);border-bottom:1px solid var(--blue);padding:0 3px;border-radius:3px;color:#fff}
.worst{padding:14px 16px;border-radius:14px;border:1px solid rgba(232,74,74,.5);background:rgba(232,74,74,.08);color:var(--ink);font-size:14.5px}
.safelede{color:var(--ink2);max-width:70ch;margin:0 0 12px}
.foot{margin-top:28px;font-size:12px;color:var(--ink3);text-align:center;max-width:84ch;margin-inline:auto}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes breatheC{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
@keyframes ping{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.45);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:1000px){
  .pgrid,.ngrid,.fgrid,.pgm{grid-template-columns:minmax(0,1fr)}
  .case{position:static}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .comp{grid-template-columns:minmax(0,1fr)}
  .lanes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .ring{aspect-ratio:auto;max-width:none}
  .ring svg,.core{display:none}
  .stations{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 6px}
  .stn{position:static;transform:none;width:auto}
  .orb{width:54px;height:54px}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .elig{grid-template-columns:minmax(0,1fr)}
  .bstats{grid-template-columns:minmax(0,1fr)}
  .hb{grid-template-columns:minmax(0,1fr) 80px}
  .hb .tr{grid-column:1/-1;order:3}
  .stat .n{font-size:32px}
}
/* DATA */
.dsteps{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dstep{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.dstep .dn{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;border:1px solid var(--edge2);color:var(--ink2)}
.dstep[data-st="done"] .dn{background:rgba(74,232,138,.14);border-color:rgba(74,232,138,.6);color:var(--low)}

.dstep b{display:block;font-size:14.5px;font-weight:600}
.dstep small{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px}
.dsub{margin:4px 0 16px}
.dk5{grid-template-columns:repeat(5,minmax(0,1fr));margin:14px 0}
.dk6{grid-template-columns:repeat(6,minmax(0,1fr))}

.dgrp{margin:16px 0 12px}
.dsel{font:inherit;font-size:13px;color:var(--ink);background:var(--deep);border:1px solid var(--edge2);border-radius:999px;padding:5px 10px}
.dsel[data-v="a"]{border-color:rgba(74,232,138,.7);color:var(--low)}
.dsel[data-v="c"]{border-color:rgba(232,164,74,.7);color:var(--gold)}
.dsel[data-v="x"]{color:var(--ink3)}
.dhb{grid-template-columns:minmax(150px,230px) minmax(0,1fr) 128px}
.dhb small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--ink3);letter-spacing:.04em}
.panel .dh3{margin-top:22px}
.dlist{margin-top:18px}
.dlist td small{display:block;color:var(--ink3);font-size:12px}
.dlist .facts{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.dnote{font-size:12.5px;color:var(--ink3);margin:8px 0 14px}
.dbar{margin-top:0}
.dbar .chip{align-self:center}
.dpar{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.dgate{list-style:none;padding:0;margin:8px 0 16px;display:flex;flex-direction:column;gap:10px}
.dgate li{padding-left:26px;position:relative;font-size:14px;color:var(--ink2)}
.dgate li::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink3)}
.dgate li[data-ok="true"]::before{background:var(--low);border-color:var(--low)}
.dgate li[data-ok="true"]{color:var(--ink)}
#v-data .fact{white-space:nowrap}
.dpar .dprog{grid-template-columns:72px minmax(0,1fr) 120px}
#dbody>.panel+.stats{margin-top:18px}
@media (max-width:1000px){.dsteps{grid-template-columns:repeat(2,minmax(0,1fr))}.dk5,.dk6{grid-template-columns:repeat(3,minmax(0,1fr))}.dpar{grid-template-columns:minmax(0,1fr)}}
@media (max-width:620px){.dsteps{grid-template-columns:minmax(0,1fr)}.dk5,.dk6{grid-template-columns:repeat(2,minmax(0,1fr))}.dhb,.dprog{grid-template-columns:minmax(0,1fr) 120px}.dhb .tr,.dprog .tr{grid-column:1/-1;order:3}}

 /* brief */
 b_eyebrow:"Prepared for discussion with the California Lung Cancer Coalition · Beverly Index",
 b_title:"AI for the people side of lung screening",
 b_lede:"AI in lung screening has focused on the image: finding nodules and scoring their risk. That work is strong, and program tracking tools in Epic and from specialist vendors already manage follow-up lists. But more than 80% of eligible people are not up to date with screening, so the largest loss happens before any image exists. Built on Remiel Amicura, formerly CareCircle, Remiel Amicura Lung brings AI to that part of the program, working alongside the current tracking system: finding eligible people, helping them decide, keeping them in follow-up, and showing which communities are being missed.",
 b_s1:"of eligible adults up to date with lung screening nationally, 2024", b_s2:"in California, the lowest of any state", b_s3:"fewer lung cancer deaths with annual low-dose CT in the National Lung Screening Trial",
 b_land:"Where AI already works in lung screening",
 lanes:[["Image AI","Detects nodules on CT, measures growth and scores malignancy risk. Used by radiologists. We integrate with it; we do not compete with it."],["Program tracking","Finds nodules in reports, schedules follow-up and tracks who is due. Offered in Epic and by specialist vendors. We work alongside it, or provide tracking where none exists."],["Remiel Amicura Lung","Finds the people not yet in the program, speaks with them in their language, notices fear and hesitation, ranks who needs a call today, and measures equity."]],
 b_five:"How it works: Reach, Return, Verify, Prove", five:[["Reach.", "AI reads clinic notes and CT reports to find eligible people never screened and incidental nodules with no follow-up. A navigator confirms each one, then takes the person to a first scan: counseling, a complete order, coverage, booking near home and a ride."], ["Return.", "Every positive result becomes one tracked loop with one next action. Results are explained in plain English or Spanish and reviewed by the care team; a voice and text companion answers from clinician-approved answers; the navigator worklist is ranked by drop-off risk, with the reasons and a drafted message."], ["Verify.", "Outside prior images are checked against the patient's identity and anatomy before they are attached, so every comparison is made on the right person's scans."], ["Prove.", "Every notice, booking and action is recorded. The program view shows the full funnel, completion by language, where to send the van next and registry readiness; the coalition view compares members through Federated Outcomes."]],

$("#v-navigator").addEventListener("click",e=>{
  const s=e.target.closest("[data-stage]");if(s){const i=+s.dataset.stage;state.stage=state.stage===i?null:i;renderNavigator();return;}
  const f=e.target.closest("[data-f]");if(f){state.filter=f.dataset.f;state.stage=null;renderNavigator();return;}
  const id=e.target.id;
  if(id==="bApprove"){state.approved[state.sel]=true;renderCase();return;}
  if(id==="bLog"){(state.logs[state.sel]=state.logs[state.sel]||[]).push(1);renderCase();return;}
  if(id==="bCopy"){const ta=$("#draft"),b=e.target;const done=()=>{b.textContent=L().c_copied;setTimeout(()=>{if(b.isConnected)b.textContent=L().c_copy;},1500);};
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();done();});}catch(_){ta.select();done();}return;}
  const r=e.target.closest("tr[data-id]");if(r){state.sel=r.dataset.id;document.querySelectorAll("#v-navigator tbody tr").forEach(x=>x.setAttribute("aria-selected",x===r));renderCase();if(innerWidth<1000)$("#case").scrollIntoView({behavior:"smooth",block:"start"});}
});
$("#v-navigator").addEventListener("input",e=>{if(e.target.id==="draft")state.drafts[state.sel+state.lang]=e.target.value;});
$("#v-navigator").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-id]")){e.preventDefault();e.target.click();}});

/* CSV */
function parseCSV(t){const out=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";if(row.length>1||row[0]!=="")out.push(row);row=[];}else f+=c;}
  if(f!==""||row.length){row.push(f);out.push(row);}return out;}
const csvCell=v=>/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':String(v);
function toCSV(cols,rows){return[cols.map(csvCell).join(","),...rows.map(r=>cols.map(c=>csvCell(r[c]||"")).join(","))].join("\n");}
function readTable(text){const t=parseCSV(text.replace(/^﻿/,""));if(!t.length)return null;
  const known={};TPL.concat([C.mrn,"Next scan due date"]).forEach(n=>known[n.toLowerCase().trim()]=n);
  const hdr=t[0].map(h=>h.trim()),map=hdr.map(h=>known[h.toLowerCase()]||null);
  const rows=t.slice(1).map(a=>{const r={};map.forEach((k,i)=>{if(k)r[k]=(a[i]||"").trim();});return r;});
  return{rows,cols:new Set(map.filter(Boolean)),extra:hdr.filter((h,i)=>!map[i])};}

/* rules: plain code, no AI */
const low=s=>String(s||"").trim().toLowerCase();
function analyse(ds){
  const has=k=>ds.cols.has(k),v=(r,k)=>(r[k]||"").trim();
  const out=ds.rows.map((r,idx)=>{
    const iss=[];const inc=has(C.odept)&&v(r,C.odept)!=="";
    if((has(C.mrn)&&!v(r,C.mrn))||(has(C.name)&&!v(r,C.name))||(has(C.dob)&&!v(r,C.dob)))iss.push(["id"]);
    const bad=[];DATECOLS.forEach(k=>{if(has(k)&&v(r,k)&&!pDate(v(r,k)))bad.push(k);});
    [C.ordnpi,C.radnpi].forEach(k=>{if(has(k)&&v(r,k)&&!/(^|\D)\d{10}$/.test(v(r,k)))bad.push(k);});
    if(has(C.zip)&&v(r,C.zip)&&!/^\d{5}$/.test(v(r,C.zip)))bad.push(C.zip);
    if(has(C.lr)&&v(r,C.lr)&&!LRS.includes(v(r,C.lr).toUpperCase()))bad.push(C.lr);
    if(bad.length)iss.push(["fmt",bad]);
    const sm=low(v(r,C.smoke)),scanned=[C.exam,C.lr,C.ind,C.report].some(k=>has(k)&&v(r,k));
    let due=null;
    if(!inc){
      const miss=[];if(has(C.dob)&&!pDate(v(r,C.dob)))miss.push(C.dob);if(has(C.smoke)&&!sm)miss.push(C.smoke);
      const smoker=sm&&!sm.startsWith("never");
      if(smoker&&has(C.py)&&!v(r,C.py))miss.push(C.py);if(sm.startsWith("former")&&has(C.quit)&&!v(r,C.quit))miss.push(C.quit);
      if(miss.length)iss.push(["elig",miss]);
      else{const why=[];const d=pDate(v(r,C.dob));if(d){const a=(TODAY-d)/DAY/365.25;if(a<50||a>=81)why.push("age");}
        if(sm.startsWith("never"))why.push("never");else if(has(C.py)&&+v(r,C.py)<20)why.push("py");
        if(sm.startsWith("former")&&has(C.quit)&&TODAY.getFullYear()-+v(r,C.quit)>15)why.push("quit");
        if(why.length)iss.push(["notelig",why]);}
      if(scanned){const lr=v(r,C.lr).toUpperCase(),ex=pDate(v(r,C.exam));
        if(!LRS.includes(lr)||!ex)iss.push(["fu"]);
        else{due=addM(ex,LRM[lr]);const fu=pDate(v(r,C.fudate));if(due<TODAY&&!(fu&&fu>ex))iss.push(["overdue",Math.round((TODAY-due)/DAY)]);}
        if(has(C.ind)&&low(v(r,C.ind)).startsWith("baseline")&&((has(C.dv)&&!v(r,C.dv))||(has(C.sdm)&&!low(v(r,C.sdm)).startsWith("y"))))iss.push(["sdm"]);
        const rg=[C.ht,C.wt,C.scanner,C.dose,C.radnpi].filter(k=>has(k)&&!v(r,k));if(rg.length)iss.push(["reg",rg]);}
    }else{if(!low(v(r,C.fuord)).startsWith("y"))iss.push(["inc"]);const rd=pDate(v(r,C.ref));if(rd)due=new Date(rd.getTime()+90*DAY);}
    if(has(C.lang)&&!v(r,C.lang))iss.push(["lang"]);if(has(C.phone)&&!v(r,C.phone))iss.push(["contact"]);
    return{r,idx,iss,inc,scanned,due};
  });
  const seen={},nd={};out.forEach(o=>{const m=(o.r[C.mrn]||"").trim(),k=low(o.r[C.name])+"|"+(o.r[C.dob]||"");
    if(m){if(seen[m]!=null){o.iss.push(["dup"]);}else seen[m]=o.idx;}
    if(o.r[C.name]&&o.r[C.dob]){if(nd[k]&&nd[k]!==m&&!o.iss.some(i=>i[0]==="dup"))o.iss.push(["dup"]);else if(!nd[k])nd[k]=m;}});
  const block=["id","fmt","elig","fu","lang","contact","dup"];
  const cnt={};out.forEach(o=>o.iss.forEach(i=>cnt[i[0]]=(cnt[i[0]]||0)+1));
  const ready=out.filter(o=>!o.iss.some(i=>block.includes(i[0]))).length;
  /* completeness where the field applies */
  const appl=(k,o)=>{const r=o.r,sm=low(r[C.smoke]),lr=(r[C.lr]||"").toUpperCase();
    if(o.inc)return[C.mrn,C.name,C.dob,C.sex,C.lang,C.interp,C.zip,C.phone,C.ins,C.ref,C.site,C.fuord].includes(k);
    if(k===C.odept||k===C.fuord)return false;
    if(k===C.mbi)return low(r[C.ins])==="medicare";if(k===C.quit)return sm.startsWith("former");if(k===C.py)return sm&&!sm.startsWith("never");
    if(k===C.yrsprior)return low(r[C.prior]).startsWith("y");if(k===C.cess)return sm&&!sm.startsWith("never");
    if([C.order,C.appt,C.exam,C.ind,C.mod,C.scanner,C.dose,C.radnpi,C.report,C.lr,C.s,C.dv,C.sdm,C.ht,C.wt].includes(k))return o.scanned;
    if(k===C.fudate||k===C.futype)return["4A","4B","4X"].includes(lr)&&!!o.due&&o.due<TODAY;if(k===C.tb||k===C.dx)return["4B","4X"].includes(lr)&&!!(r[C.fudate]||"").trim();
    if([C.dxdate,C.hist,C.stage].includes(k))return low(r[C.dx]).startsWith("y");
    return true;};
  const comp=TPL.filter(k=>ds.cols.has(k)&&FBY[k][4]!=="n").map(k=>{let n=0,f=0;out.forEach(o=>{if(appl(k,o)){n++;if((o.r[k]||"").trim())f++;}});return{k,n,f,p:n?f/n:1};})
    .filter(c=>c.n>0).sort((a,b)=>a.p-b.p||b.n-a.n);
  return{out,cnt,ready,comp};
}

        trk.push({m,d:o.due});return;}
      if(o.scanned){const ex=pDate(o.r[C.exam])||pDate((o.r[C.appt]||"").slice(0,10));if(ex){trk.push({m,d:addM(ex,12)});reason[m]=["miss"];}}});}
  else return null;
  const tm={};trk.forEach(t=>tm[t.m]=t);const rows=[];let match=0;const seen=new Set();
  mine.forEach(o=>{if(o.iss.some(i=>i[0]==="dup"))return;const m=(o.r[C.mrn]||"").trim();if(!m||seen.has(m))return;seen.add(m);const t=tm[m];
    if(o.due&&t&&t.d){if(Math.abs(t.d-o.due)<3*DAY)match++;else rows.push({m,k:"date",a:o.due,b:t.d,why:reason[m]||(Math.abs(Math.abs(t.d-o.due)/DAY-((12-LRM[(o.r[C.lr]||"").toUpperCase()])*30.4))<20?["int",(o.r[C.lr]||"").toUpperCase(),LRM[(o.r[C.lr]||"").toUpperCase()]]:["diff"])});}
    else if(o.due&&!t)rows.push({m,k:"ours",a:o.due,b:null,why:reason[m]||(o.inc?["inc"]:["notrk"])});

  trk.forEach(t=>{if(!seen.has(t.m)&&!byM[t.m])rows.push({m:t.m,k:"trk",a:null,b:t.d,why:["absent"]});});
  const why=w=>{let s=D.rs[w[0]];if(w[0]==="int")s=s.replace("{lr}",w[1]).replace("{m}",w[2]);return s;};
  rows.forEach(x=>x.txt=why(x.why));
  return{match,rows,n:{date:rows.filter(x=>x.k==="date").length,ours:rows.filter(x=>x.k==="ours").length,trk:rows.filter(x=>x.k==="trk").length}};
}

const siteL=s=>{if(state.lang!=="es")return s;return s.replace("Main campus","Campus principal").replace("Mobile van","Unidad móvil").replace("Community clinic","Clínica comunitaria");};
const fmtD=d=>d?d.toLocaleDateString(state.lang==="es"?"es-US":"en-US",{year:"numeric",month:"short",day:"numeric"}):"·";
const nf=n=>n.toLocaleString(state.lang==="es"?"es-US":"en-US");
function srcStore(){try{return JSON.parse(localStorage.getItem("lsn:src")||"{}");}catch(_){return{};}}
async function dlFile(name,text){let d=null;try{d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;}catch(_){}
  if(!d){dmsg(DL().dl_fail);return;}
  try{await d.save({filename:name,data:"\uFEFF"+text});}catch(e){if(e&&e.code!=="declined")dmsg(DL().dl_fail);}}
function dmsg(t){const m=$("#dmsg");if(m){m.textContent=t;m.hidden=false;clearTimeout(dmsg.t);dmsg.t=setTimeout(()=>m.hidden=true,3200);}}

function renderData(){
  const D=DL(),r=$("#v-data"),sub=state.dsub||"roster";
  const stepState=i=>{if(i===0)return"done";if(i===1){const s=srcStore(),a=FIELDS.filter((f,j)=>s[j]==="a"||s[j]==="x").length;return a===FIELDS.length?"done":"now";}if(i===2)return state.dset?"done":"next";return state.dset?"now":"next";};
  r.innerHTML=`<span class="label">${D.eyebrow}</span><h2 class="view">${D.title}</h2>
  <div class="bluf"><span class="v">${D.bluf}</span></div>
  <ol class="dsteps">${D.steps.map((s,i)=>`<li class="dstep glass" data-st="${stepState(i)}"><span class="dn">${s[0]}</span><span><b>${s[1]}</b><small>${s[2]}</small></span></li>`).join("")}</ol>
  <div class="chips dsub" role="tablist">${["roster","ready","par"].map(k=>`<button class="chip" role="tab" data-dsub="${k}" aria-pressed="${sub===k}">${D.sub[k]}</button>`).join("")}</div>
  <div class="okmsg" id="dmsg" hidden></div>
  <div id="dbody"></div>
  <input type="file" id="dfile" accept=".csv,text/csv" hidden><input type="file" id="tfile" accept=".csv,text/csv" hidden>`;
  ({roster:renderRoster,ready:renderReady,par:renderPar})[sub]();
}
function renderRoster(){
  const D=DL(),s=srcStore(),g=state.dgrp||"all";
  const groups=[...new Set(FIELDS.map(f=>f[0]))];
  const cnt=k=>FIELDS.filter(f=>!f[7]&&k.includes(f[6])).length;
  const ag=FIELDS.filter((f,j)=>s[j]==="a"||s[j]==="x").length;
  $("#dbody").innerHTML=`<section class="panel glass"><h3>${D.r_t}</h3><div class="sub">${D.r_s}</div>
   <div class="stats dk5">${[[FIELDS.length,D.r_k[0]],[TPL.length,D.r_k[1]],[cnt(["ne","psr"]),D.r_k[2]],[cnt(["co"]),D.r_k[3]],[cnt(["aix"]),D.r_k[4]]].map(([n,l],i)=>`<div class="stat glass ${i===1?"hot":""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
   <div class="hb dprog"><span>${ag} / ${FIELDS.length} ${D.agreed}</span><span class="tr"><i class="cy" style="width:${ag/FIELDS.length*100}%"></i></span><span class="vv">${Math.round(ag/FIELDS.length*100)}%</span></div>
   <div class="btnrow"><button class="btn pri" data-act="tpl">${D.dl_t}</button><button class="btn" data-act="smp">${D.dl_s}</button><button class="btn ghost" data-act="copy">${D.copy}</button></div>
   <div class="chips dgrp">${["all",...groups].map(x=>`<button class="chip" data-grp="${x}" aria-pressed="${g===x}">${x==="all"?D.all:(state.lang==="es"?FIELDS.find(f=>f[0]===x)[1]:x)}</button>`).join("")}</div>
   <div class="tablewrap"><table class="stab dtab"><thead><tr>${D.th_r.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
   ${FIELDS.map((f,j)=>g!=="all"&&f[0]!==g?"":`<tr><td>${esc(FN(f))}</td><td>${D.req[f[4]]}</td><td>${D.src[f[5]]}</td><td>${D.cap[f[6]]}</td><td>${f[7]?D.yes:"·"}</td>
     <td><select class="dsel" data-f="${j}" data-v="${s[j]||"p"}" aria-label="${esc(FN(f))}">${["p","a","c","x"].map(k=>`<option value="${k}" ${(s[j]||"p")===k?"selected":""}>${D.st[k]}</option>`).join("")}</select></td></tr>`).join("")}
   </tbody></table></div></section>`;
}
function dataBar(){const D=DL(),ds=state.dset;return`<div class="btnrow dbar"><button class="btn pri" data-act="load">${D.load_s}</button><button class="btn" data-act="file">${D.load_f}</button>${ds?`<button class="btn ghost" data-act="clear">${D.clear}</button><span class="chip">${ds.source==="sample"?D.src_sample:D.src_file+": "+esc(ds.name)} · ${nf(ds.rows.length)} ${D.rows}</span>`:""}</div><p class="dnote">${D.sec_note}</p>`;}
function renderReady(){
  const D=DL(),ds=state.dset,b=$("#dbody");
  if(!ds){b.innerHTML=dataBar()+`<section class="panel glass dempty"><h3>${D.none_t}</h3><div class="sub">${D.none_s}</div></section>`;return;}
  const A=state.dA||(state.dA=analyse(ds)),N=A.out.length,c=k=>A.cnt[k]||0;
  const kp=[[nf(N),D.k[0]],[Math.round(A.ready/N*100)+"%",D.k[1]],[nf(c("elig")),D.k[2]],[nf(c("fu")),D.k[3]],[nf(c("overdue")),D.k[4]],[nf(c("dup")),D.k[5]]];
  const comp=state.dall?A.comp:A.comp.slice(0,12);
  const f=state.dflt||"all",codes=Object.keys(D.code).filter(k=>c(k));
  const list=A.out.filter(o=>o.iss.length&&(f==="all"||o.iss.some(i=>i[0]===f)));
  const fixOf=i=>{const x=D.fix[i[0]];if(i[0]==="fmt"||i[0]==="elig"||i[0]==="reg")return x+i[1].map(k=>FN(FBY[k])).join(", ");if(i[0]==="notelig")return x+i[1].map(w=>D.why[w]).join("; ");if(i[0]==="overdue")return x+" ("+i[1]+" "+D.days+")";return x;};
  const order=["id","dup","fmt","overdue","fu","elig","contact","lang","inc","sdm","reg","notelig"];
  const missingCols=TPL.filter(k=>!ds.cols.has(k));
  b.innerHTML=dataBar()+`<div class="stats dk6">${kp.map(([n,l],i)=>`<div class="stat glass ${i===1?"hot":""}"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("")}</div>
  <div class="pgm">
   <section class="panel glass"><h3>${D.comp_t}</h3><div class="sub">${D.comp_s}</div><div class="hbars">
    ${comp.map(x=>`<div class="hb dhb"><span title="${esc(D.src[FBY[x.k][5]])}">${esc(FN(FBY[x.k]))}<small>${D.src[FBY[x.k][5]]}</small></span><span class="tr"><i class="${x.p<.9?"cy":""}" style="width:${x.p*100}%"></i></span><span class="vv">${Math.round(x.p*100)}%${x.n-x.f?` · ${x.n-x.f} ${D.missing}`:""}</span></div>`).join("")}</div>
    ${A.comp.length>12?`<div class="btnrow"><button class="btn ghost" data-act="all">${state.dall?D.showless:D.showall}</button></div>`:""}</section>
   <section class="panel glass"><h3>${D.cols_t}</h3><div class="sub">${nf(TPL.length-missingCols.length)} ${D.cols_in} · ${nf(missingCols.length)} ${D.cols_out}${ds.extra&&ds.extra.length?` · ${ds.extra.length} ${D.cols_x}`:""}</div>
    ${missingCols.length?`<div class="facts">${missingCols.map(k=>`<span class="fact warn">${esc(FN(FBY[k]))}</span>`).join("")}</div>`:""}
    ${ds.extra&&ds.extra.length?`<div class="facts">${ds.extra.map(k=>`<span class="fact">${esc(k)}</span>`).join("")}</div>`:""}
    <h3 class="dh3">${D.iss_t}</h3><div class="sub">${D.iss_s}</div>
    <div class="chips">${["all",...order.filter(k=>codes.includes(k))].map(k=>`<button class="chip" data-flt="${k}" aria-pressed="${f===k}">${k==="all"?D.all:D.code[k]} <b>${k==="all"?nf(A.out.filter(o=>o.iss.length).length):nf(c(k))}</b></button>`).join("")}</div></section>
  </div>
  <div class="tablewrap dlist"><table class="stab"><thead><tr>${D.th_i.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
   ${list.slice(0,60).map(o=>{const is=o.iss.slice().sort((a,b)=>order.indexOf(a[0])-order.indexOf(b[0]));const lead=f==="all"?is[0]:is.find(i=>i[0]===f);
     return`<tr><td><span class="mono">${esc(o.r[C.mrn]||"·")}</span><small>${esc(o.r[C.name]||"")}</small></td><td>${esc(siteL(o.r[C.site]||""))}</td><td><div class="facts">${is.map(i=>`<span class="fact ${["id","dup","fmt","overdue","fu"].includes(i[0])?"warn":""}">${D.code[i[0]]}</span>`).join("")}</div></td><td>${esc(fixOf(lead))}</td></tr>`;}).join("")}
  </tbody></table></div><p class="dnote">${D.showing} ${nf(Math.min(60,list.length))} ${D.of} ${nf(list.length)}</p>`;
}
function renderPar(){
  const D=DL(),ds=state.dset,b=$("#dbody");
  if(!ds){b.innerHTML=dataBar()+`<section class="panel glass dempty"><h3>${D.p_t}</h3><div class="sub">${D.needdata}</div></section>`;return;}
  const A=state.dA||(state.dA=analyse(ds));
  const sites=[...new Set(A.out.map(o=>o.r[C.site]).filter(Boolean))];
  const site=state.dsite&&(state.dsite==="all"||sites.includes(state.dsite))?state.dsite:(sites.includes("Mobile van")?"Mobile van":"all");
  const P=compare(A,site);
  const head=`${dataBar()}<section class="panel glass"><h3>${D.p_t}</h3><div class="sub">${D.p_s}</div>
    <div class="chips">${["all",...sites].map(s=>`<button class="chip" data-site="${esc(s)}" aria-pressed="${site===s}">${s==="all"?D.allsites:esc(siteL(s))}</button>`).join("")}</div>
    <div class="btnrow"><button class="btn" data-act="tfile">${D.load_t}</button>${state.trk?`<span class="chip">${D.trk_file}: ${esc(state.trk.name)}</span>`:(ds.source==="sample"?`<span class="chip">${D.trk_sample}</span>`:"")}</div><p class="dnote">${D.trk_hint}</p></section>`;
  if(!P){b.innerHTML=head;return;}
  const tot=P.rows.length,expl=P.rows.filter(x=>x.why[0]!=="notrk"&&x.why[0]!=="diff").length;
  b.innerHTML=head+`<div class="stats">${[[P.match,D.pk[0]],[P.n.date,D.pk[1]],[P.n.ours,D.pk[2]],[P.n.trk,D.pk[3]]].map(([n,l],i)=>`<div class="stat glass ${i===0?"hot":""}"><div class="n">${nf(n)}</div><div class="l">${l}</div></div>`).join("")}</div>
  <div class="ngrid dpar"><div class="tablewrap"><table class="stab"><thead><tr>${D.th_p.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
   ${tot?P.rows.map(x=>`<tr><td class="mono">${esc(x.m)}</td><td><span class="fact ${x.k==="trk"?"warn":""}">${D.dk[x.k]}</span></td><td>${fmtD(x.a)}</td><td>${fmtD(x.b)}</td><td>${esc(x.txt)}</td></tr>`).join(""):`<tr><td colspan="5">${D.nodiff}</td></tr>`}
  </tbody></table></div>
  <section class="panel glass"><h3>${D.gate_t}</h3><ul class="dgate">${D.gate.map((g,i)=>`<li data-ok="${i===0?(expl===tot):"pending"}">${g}</li>`).join("")}</ul>
   <div class="hb dprog"><span>${D.gate_now}</span><span class="tr"><i class="cy" style="width:${tot?expl/tot*100:100}%"></i></span><span class="vv">${expl}/${tot} ${D.explained}</span></div></section></div>`;
}
$("#v-data").addEventListener("click",e=>{
  const D=DL(),t=e.target.closest("button");if(!t)return;
  if(t.dataset.dsub){state.dsub=t.dataset.dsub;renderData();return;}
  if(t.dataset.grp){state.dgrp=t.dataset.grp;renderRoster();return;}
  if(t.dataset.flt){state.dflt=t.dataset.flt;renderReady();return;}
  if(t.dataset.site){state.dsite=t.dataset.site;renderPar();return;}
  const a=t.dataset.act;
  if(a==="tpl")dlFile("remiel-amicura-lung-template.csv",toCSV(TPL,[]));
  if(a==="smp")dlFile("remiel-amicura-lung-fictional-sample.csv",toCSV(TPL,makeSample()));
  if(a==="copy"){const txt=TPL.join("\t");try{navigator.clipboard.writeText(txt).then(()=>dmsg(D.copied),()=>dmsg(txt));}catch(_){dmsg(txt);}}
  if(a==="load"){state.dset={rows:makeSample(),cols:new Set(TPL),source:"sample",extra:[]};state.dA=null;state.trk=null;renderData();}
  if(a==="file")$("#dfile").click();
  if(a==="tfile")$("#tfile").click();
  if(a==="clear"){state.dset=null;state.dA=null;state.trk=null;renderData();}
  if(a==="all"){state.dall=!state.dall;renderReady();}
});
$("#v-data").addEventListener("change",e=>{
  const t=e.target;
  if(t.matches(".dsel")){const s=srcStore();s[t.dataset.f]=t.value;t.dataset.v=t.value;try{localStorage.setItem("lsn:src",JSON.stringify(s));}catch(_){}renderData();return;}
  if(t.id==="dfile"||t.id==="tfile"){const f=t.files&&t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const T=readTable(String(rd.result));if(!T)return;
    if(t.id==="dfile"){state.dset={rows:T.rows,cols:T.cols,source:"file",name:f.name,extra:T.extra};state.dA=null;state.trk=null;state.dsub="ready";}
    else{state.trk={rows:T.rows,name:f.name};}
    renderData();};rd.readAsText(f);}
});

/* ================= SHELL ================= */
const VIEWS=["find","patient","navigator","program","coalition","data","brief"];
function chrome(){
  const l=L();
  document.documentElement.lang=state.lang;
  $("#sampleTag").textContent=l.sample;$("#foot").textContent=l.foot;
  $("#tabs").innerHTML=VIEWS.map(v=>`<button role="tab" data-view="${v}" aria-selected="${state.view===v}">${l.tabs[v]}</button>`).join("");
  document.querySelectorAll("#langSw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===state.lang));
}
function show(v){
  if(!VIEWS.includes(v))v="find";state.view=v;
  VIEWS.forEach(x=>$("#v-"+x).hidden=x!==v);chrome();
  ({find:renderFind,patient:renderPatient,navigator:renderNavigator,program:renderProgram,coalition:renderCoalition,data:renderData,brief:renderBrief})[v]();
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;if(location.hash!=="#"+b.dataset.view)location.hash=b.dataset.view;else show(b.dataset.view);});
$("#langSw").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;state.lang=b.dataset.lang;try{localStorage.setItem("lsn:lang",state.lang);}catch(_){}show(state.view);});
addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));

/* ================= living background ================= */
const cv=$("#field"),cx=cv.getContext("2d");let W,H,pts=[];
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){const r=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(r,0,0,r,0,0);
  const n=Math.min(75,Math.round(W*H/21000));pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,c:Math.random()<.5?"0,212,255":"155,106,232"}));}
function frame(){
  cx.clearRect(0,0,W,H);cx.globalCompositeOperation="lighter";
  for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;}
  for(let i=0;i<pts.length;i++){const a=pts[i];
    for(let j=i+1;j<pts.length;j++){const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<150){cx.strokeStyle=`rgba(${a.c},${(1-d/150)*.22})`;cx.lineWidth=.6;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke();}}
    cx.fillStyle=`rgba(${a.c},.7)`;cx.beginPath();cx.arc(a.x,a.y,1.3,0,7);cx.fill();}
  cx.globalCompositeOperation="source-over";
  drawVoice();
  if(!still)requestAnimationFrame(frame);
}
size();addEventListener("resize",size);frame();
})();
</script>
