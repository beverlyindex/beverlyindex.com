<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Remiel Sentinel: Private Access</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=78">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=78">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=78">
<style>
  :root{ --navy:#002147; --gold:#b8924e; --ink:#eef1f7; --dim:#9aa6b8; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:radial-gradient(ellipse at 50% 35%, #071d3a 0%, #010e22 50%, #000a18 100%);
    color:var(--ink); font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{width:min(400px,92vw); text-align:center;}
  .mark{font-family:Fraunces,Georgia,serif; letter-spacing:.14em; font-size:13px;
    color:var(--gold); text-transform:uppercase; margin-bottom:6px;}
  h1{font-family:Fraunces,Georgia,serif; font-weight:600; font-size:26px; margin-bottom:8px;}
  .gate-logo{width:min(300px,80vw); height:auto; margin:0 auto 14px; display:block;}
  h1 span{color:var(--gold);}
  p.sub{color:var(--dim); font-size:13.5px; line-height:1.6; margin-bottom:26px;}
  input{width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(184,146,78,.45);
    border-radius:10px; color:var(--ink); font-size:19px; letter-spacing:.18em; text-align:center;
    padding:13px 14px; outline:none; text-transform:uppercase;}
  input:focus{border-color:var(--gold);}
  button{margin-top:14px; width:100%; background:var(--gold); border:none; color:#0b1526;
    font-size:15px; font-weight:600; padding:13px; border-radius:10px; cursor:pointer;}
  button:hover{filter:brightness(1.08);}
  .err{color:#ff9b9b; font-size:13px; margin-top:12px; min-height:18px;}
  .foot{margin-top:30px; color:var(--dim); font-size:11.5px;}
  .foot a{color:var(--dim);}
  .shake{animation:sh .35s;}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
<body>
<div class="card">
  <div class="mark">Beverly Index</div>
  <img class="gate-logo" src="remiel-logo.png" alt="Remiel Sentinel">
  <p class="sub">This tool is in private evaluation. Enter your access code to continue.</p>
  <input id="code" autocomplete="off" spellcheck="false" placeholder="RM-XXXX-XXXX" aria-label="Access code">
  <button id="go">Enter</button>
  <div class="err" id="err"></div>
  <div class="foot"><a href="https://beverly-index.com">&larr; Return to beverly-index.com</a></div>
</div>
<script>
/* -- Telemetry helper -- */
var RM_URL='https://beverlyindex-com.vercel.app';
var RM_TK='rm-9f2m-x81q-vt44-2026';
function t(ev,extra){
  try{
    var p={v:1,sid:sessionStorage.getItem('rm:sid')||'',code:'',ev:ev,ts:Date.now(),
      n:{screen:screen.width+'x'+screen.height,tz:'',lang:navigator.language||'',
         cores:navigator.hardwareConcurrency||0,build:'gate'}};
    try{p.n.tz=Intl.DateTimeFormat().resolvedOptions().timeZone;}catch(e){}
    if(extra) for(var k in extra) p[k]=extra[k];
    if(!RM_URL) return;
    if(RM_TK) p.tk=RM_TK;
    var body=JSON.stringify(p);
    if(navigator.sendBeacon){navigator.sendBeacon(RM_URL+'/api/t',new Blob([body],{type:'application/json'}));}
    else{fetch(RM_URL+'/api/t',{method:'POST',headers:{'Content-Type':'application/json','x-rm-t':RM_TK},body:body,keepalive:true}).catch(function(){});}
  }catch(e){}
}
(function(){var s=sessionStorage.getItem('rm:sid');if(!s){s=Math.random().toString(36).slice(2)+Date.now().toString(36);sessionStorage.setItem('rm:sid',s);}})();

/* Same code list as the app gate (28 Sep 2026). Expiring codes carry an epoch ms. */
const KEYS={
  '02c9549ac193f3287f532293c5df0264965ccba60e79bd712919e7bd12bba5f9':'architect',
  'a3fe4af273bc66ef078dd5b61f6a39d4e8d61ad5642c36136131d5d972c2a17b':'qa1',
  '1217d2bbb98144178898c681aeb42c444fc1c76a0b56534ae477a6e6198ef2fd':'qa2',
  'b943f277d7aeb73f9da98d6a3cc78fcbef17aa12feba4f99abaa57190d067c96':'qa3',
  'b7c45d5f9f9f78ea2d8db327dad90bf42ccdb9cae38afbde0e684e2461c5bdcd':'qa4',
  '3bb9248e9acc6c71d50eac5130425b7d8eda0e20893d28ebec69c19e71506483':'qa5',
  'c064090e162444cdf80d4a8bb850b509ae7841e6fc5fabeed83b37a5b520edc1':'qa6'
};
/* These stop working 24 hours after their first use anywhere (the API records
   the first use; this device's own record is the fallback). */
const KEY_TTL={
  'b7c45d5f9f9f78ea2d8db327dad90bf42ccdb9cae38afbde0e684e2461c5bdcd':86400000,
  '3bb9248e9acc6c71d50eac5130425b7d8eda0e20893d28ebec69c19e71506483':86400000,
  'c064090e162444cdf80d4a8bb850b509ae7841e6fc5fabeed83b37a5b520edc1':86400000
};
const GATE_API='https://remiel-sentinel-api.vercel.app';
async function firstUse(h){
  const key='rm:firstUse:'+h.slice(0,16); let local=0;
  try{ local=Number(localStorage.getItem(key))||0; }catch(e){}
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),6000);
    const r=await fetch(GATE_API+'/gate/use',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hash:h}),signal:ctl.signal});
    clearTimeout(tm);
    if(r.ok){ const j=await r.json(); if(j&&j.first_used_at){ try{localStorage.setItem(key,String(j.first_used_at));}catch(e){} return j.first_used_at; } }
  }catch(e){}
  if(!local){ local=Date.now(); try{localStorage.setItem(key,String(local));}catch(e){} }
  return local;
}
async function hashCode(c){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('carecircle:'+c));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function attempt(){
  const el=document.getElementById('code'), err=document.getElementById('err');
  const code=el.value.trim().toUpperCase();
  if(!code) return;
  if(!(window.crypto&&crypto.subtle)){ err.textContent='This gate requires a secure (https) connection.'; return; }
  const h=await hashCode(code);
  const who=KEYS[h];
  if(who && KEY_TTL[h] && Date.now()>(await firstUse(h))+KEY_TTL[h]){
    t('gate_fail',{code:'expired'});
    err.textContent='This access code has expired. Ask Beverly Index for a current one.';
    el.value=''; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus();
    return;
  }
  if(who){
    sessionStorage.setItem('rm:access', code);
    sessionStorage.setItem('rm:who', who);
    /* The app gate reads the same code from localStorage: one entry, not two */
    try{ localStorage.setItem('rm:access', code); }catch(e){}
    t('gate_success',{code:who});
    notifyAccess(who);
    setTimeout(()=>location.replace('app.html'), 250);
  } else {
    t('gate_fail',{code:'fail'});
    err.textContent='That code was not recognized.';
    el.value=''; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus();
  }
}
async function notifyAccess(who){
  try{
    let ip='unknown';
    try{ const r=await Promise.race([fetch('https://api.ipify.org?format=json'),
      new Promise((_,rej)=>setTimeout(rej,1200))]); ip=(await r.json()).ip; }catch(e){}
    const ua=navigator.userAgent;
    const body='Identity: '+who+'\nIP: '+ip+'\nMachine: '+ua+
      '\nScreen: '+screen.width+'x'+screen.height+
      '\nTimezone: '+Intl.DateTimeFormat().resolvedOptions().timeZone+
      '\nLocal time: '+new Date().toString();
    fetch('https://ntfy.sh/bi-rm-f03017c5381b7562f8',{method:'POST',
      headers:{'Title':'Remiel access: '+who,'Email':'rrbjr@remielengine.ai','Tags':'key'},
      body: body, keepalive:true});
  }catch(e){}
}
document.getElementById('go').onclick=attempt;
document.getElementById('code').addEventListener('keydown',e=>{ if(e.key==='Enter') attempt(); });
document.getElementById('code').focus();
</script>
</body>
</html>
