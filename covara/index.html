<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06090f">
<title>Remiel: Covara</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../halo/icon-192.png">
<style>
/* Fonts are served with the app (SIL Open Font License), so nothing is fetched from a third party. */
@font-face{font-family:'DM Sans';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/instrument-serif-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;font-display:swap;src:url('fonts/instrument-serif-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-600-normal.woff2') format('woff2')}
/* The Remiel Sentinel way of showing things: one sphere is highlighted at a time, its picture breathes large in the dream
   circle, and what belongs to that person floats beside it. Real pictures only: faces, and the medicines Home photographs. */
:root{
  color-scheme:dark;
  --bg:#05080d; --panel:rgba(12,17,29,.94); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#e8edf7; --mut:#9aa6bd; --dim:#5d6a85;
  --amber:#e8a24a; --amber2:#f3c27a; --cyan:#4fc3ff; --ring:#1d8fd6; --green:#3ee08a; --red:#ff2a2a;
  --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
body{background:radial-gradient(70vmin 60vmin at 50% 72%,rgba(22,96,128,.40),rgba(10,44,64,.15) 50%,transparent 75%),radial-gradient(60vmin 40vmin at 85% 28%,rgba(124,111,214,.10),transparent 70%),var(--bg)}
button{font:inherit;color:inherit}
.hide{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px;z-index:5}
.top .wm{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1}
.top .wm b{font-family:var(--mono);font-style:normal;font-weight:400;font-size:13px;letter-spacing:.22em;color:var(--mut);margin-right:6px}
.top .sp{flex:1}
.flag{background:none;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;border-radius:4px}.flag svg{display:block;width:30px;height:20px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
/* words for actions, in NOUS's neon-outlined capitals */
.w{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border-radius:12px;border:1.5px solid rgba(79,195,255,.6);background:rgba(79,195,255,.07);color:#bfe9ff;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.w.g{border-color:rgba(62,224,138,.7);background:rgba(62,224,138,.08);color:#9ff5c6}
.w.a{border-color:rgba(243,194,122,.75);background:rgba(232,162,74,.08);color:var(--amber2)}
.w.r{border-color:var(--red);background:transparent;color:#ff5a5a}
.w.gold{border:none;background:linear-gradient(180deg,#f0c67e,#d39a45);color:#1A1A2E;box-shadow:0 8px 26px rgba(232,162,74,.32)}
.w.big{min-height:60px;font-size:15px;padding:12px 22px;border-radius:16px}
.w.on{border-color:var(--green);background:rgba(62,224,138,.12);color:#9ff5c6;box-shadow:0 0 16px rgba(62,224,138,.22)}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* the question region: always here, under the title */
#ask{position:absolute;left:12px;right:12px;top:calc(max(12px,env(safe-area-inset-top)) + 54px);height:116px;z-index:12;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;transform:translateY(-6px);
  background:rgba(6,12,22,.84);border:1px solid rgba(79,195,255,.25);border-radius:22px;padding:12px 14px;backdrop-filter:blur(8px);max-width:560px;margin:0 auto}
#ask.in{opacity:1;pointer-events:auto;transform:none}
#ask .q{font-family:var(--serif);font-size:26px;line-height:1.05;color:var(--amber2);flex:1;min-width:0}
#ask .faces{display:flex;gap:10px}
#ask .faces button{width:62px;height:62px;border-radius:50%;border:2px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center;padding:0}
#ask .faces svg{width:42px;height:42px}
#ask .faces .good{border-color:rgba(62,224,138,.7);color:#8ff0bd}#ask .faces .okay{border-color:rgba(243,194,122,.7);color:var(--amber2)}#ask .faces .low{border-color:rgba(255,42,42,.7);color:#ff7b7b}
/* the dream state, as in Sentinel: faded until highlighted. Upper right, the close-up picture of what matters now;
   upper left, how urgent it is and where: the place on a map, or the pharmacy when a medicine is due. */
.dream{position:absolute;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.38;transition:opacity .8s;pointer-events:none}
.dream.hi{opacity:1}
.dream.urg{opacity:1}
.dream .circ{width:var(--dd);height:var(--dd);border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle,rgba(var(--rgb),.30),rgba(var(--rgb),.05) 70%);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 calc(var(--dd)*.2) rgba(var(--rgb),.45),inset 0 0 calc(var(--dd)*.14) rgba(var(--rgb),.55)}
.dream .circ>img,.dream .circ>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:breathe 8s ease-in-out infinite}
.dream .circ .ini{position:absolute;inset:0;display:grid;place-items:center;font-weight:600;font-size:calc(var(--dd)*.3);color:rgb(var(--rgb))}
.dream .circ::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 58%,rgba(5,8,13,.8) 100%);pointer-events:none}
.dream .tiles2{position:absolute;left:50%;top:50%}
.dream .tiles2 img{position:absolute;width:256px;height:256px;max-width:none}
.dream .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#4fc3ff;box-shadow:0 0 0 4px rgba(79,195,255,.35),0 0 18px #4fc3ff;animation:pulse 1.4s ease-in-out infinite;z-index:2}
.dream.urg .dot{background:var(--red);box-shadow:0 0 0 5px rgba(255,42,42,.4),0 0 22px var(--red)}
.dream .h1{font-family:var(--serif);font-size:20px;line-height:1.1;color:#d8f3ff;margin-top:8px;max-width:calc(var(--dd) + 30px)}
.dream.urg .h1{color:#ffb3b3}
.dream .h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--amber2);margin-top:4px;max-width:calc(var(--dd) + 30px);line-height:1.4;text-transform:uppercase}
.dream .h3{font-family:var(--mono);font-size:12px;color:#bfe9ff;margin-top:2px;pointer-events:auto}
.dream .h3 a{color:#9ff5c6;text-decoration:none;border-bottom:1px solid rgba(62,224,138,.5)}
.sph.m-good .ball{box-shadow:0 0 0 4px var(--green),0 0 0 10px rgba(62,224,138,.22),0 0 0 15px rgba(197,165,90,.35),0 0 calc(var(--d)*.45) rgba(62,224,138,.35)}
.sph.m-okay .ball{box-shadow:0 0 0 4px var(--amber),0 0 0 10px rgba(232,162,74,.22),0 0 0 15px rgba(197,165,90,.35),0 0 calc(var(--d)*.45) rgba(232,162,74,.35)}
.sph.m-low .ball{box-shadow:0 0 0 4px var(--red),0 0 0 10px rgba(255,42,42,.22),0 0 0 15px rgba(197,165,90,.35),0 0 calc(var(--d)*.45) rgba(255,42,42,.35)}
/* one sphere at a time, as in Sentinel: what belongs to that person on its left, how to reach them on its right */
#strip{position:absolute;left:8px;overscroll-behavior:contain;z-index:4;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding:2px 4px 8px 2px}
#strip::-webkit-scrollbar{display:none}
#reach{position:absolute;right:8px;z-index:4;display:flex;flex-direction:column;gap:12px;justify-content:center}
#reach .w{width:100%;min-height:58px;font-size:12px;letter-spacing:.12em;padding:8px 6px}
.sec{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:#cfd8ea;display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;opacity:0;transition:opacity .7s}
.sec.in{opacity:1}.sec:first-child{margin-top:0}
.sec button{appearance:none;background:none;border:1px solid rgba(243,194,122,.6);color:var(--amber2);border-radius:50%;font-family:var(--mono);font-size:16px;width:30px;height:30px;line-height:1;cursor:pointer;flex:none}
.sec .none{color:var(--dim);font-weight:400;letter-spacing:.08em;text-transform:none;font-family:var(--sans);font-size:12px}
.fl{display:flex;align-items:center;gap:9px;padding:6px 8px 6px 6px;border-radius:18px;background:rgba(8,14,24,.72);border:1.5px solid rgba(79,195,255,.22);cursor:pointer;
  opacity:0;transform:translateX(-14px);transition:opacity .7s ease,transform .7s ease,border-color .3s;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fl.in{opacity:1;transform:none}
.fl.out{opacity:0;transform:translateX(-20px) scale(.96)}
.fl .ph{width:46px;height:46px;border-radius:12px;flex:none;overflow:hidden;background:#0b1424;display:grid;place-items:center;position:relative}
.fl .ph img{width:100%;height:100%;object-fit:cover}
.fl .ph .nm0{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mut);text-align:center;padding:4px;line-height:1.2}
.fl .t{font-size:14px;font-weight:600;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fl .tm{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--mut);margin-top:3px}
.fl>div:last-child{min-width:0}
.fl.late{border-color:var(--red);box-shadow:0 0 18px rgba(255,42,42,.28)}.fl.late .tm{color:#ff8a8a}
.fl.due{border-color:var(--amber);box-shadow:0 0 18px rgba(232,162,74,.28)}.fl.due .tm{color:var(--amber2)}
.fl.done{border-color:var(--green)}
.fl.ev{border-color:var(--red);background:rgba(40,6,10,.75)}.fl.ev .t{font-family:var(--serif);font-weight:400;font-size:18px;color:#ffc9c9}
.fl.info{cursor:default;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 14px}
.fl.info .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.fl.info .v{font-size:15px;line-height:1.35}
.fl.act{cursor:default;background:none;border:none;box-shadow:none;padding:0;flex-wrap:wrap;gap:8px}
/* spheres, as in Remiel Sentinel */
.sph{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:left .6s ease,top .6s ease;cursor:pointer;touch-action:manipulation;z-index:2}
.sph .ball{width:var(--d);height:var(--d);border-radius:50%;position:relative;display:grid;place-items:center;transition:width .4s,height .4s;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.28),rgba(79,195,255,.14) 30%,#0a2236 70%,#050f1a);
  box-shadow:0 0 0 3px var(--ring),0 0 0 calc(var(--d)*.06) rgba(29,143,214,.18),0 0 0 calc(var(--d)*.11) rgba(29,143,214,.08),0 0 calc(var(--d)*.35) rgba(47,211,232,.38)}
.sph .ball .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.sph .ball img,.sph .ball video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sph .ball .ini{font-weight:600;font-size:calc(var(--d)*.32);color:#e6f6ff;text-shadow:0 0 12px rgba(79,195,255,.6)}
.sph .ball .in::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.2),transparent 40%);pointer-events:none}
.sph.home .ball{box-shadow:0 0 0 4px var(--ring),0 0 0 9px rgba(29,143,214,.22),0 0 0 15px rgba(197,165,90,.45),0 0 0 17px rgba(197,165,90,.12),0 0 calc(var(--d)*.45) rgba(47,211,232,.42)}
.sph.foc .ball .in img,.sph.foc .ball .in video,.sph.foc .ball .in .ini{animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}
.sph.foc .nm{color:#d8f3ff}
.sph .nm{margin-top:10px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8fd8ee;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.sph.home .nm{font-family:var(--sans);font-size:24px;letter-spacing:.01em;text-transform:none;color:#7fd3ea;margin-top:16px}
.sph .tag{position:absolute;top:-17px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;color:var(--amber2);white-space:nowrap}
.sph.ask .ball{box-shadow:0 0 0 3px var(--amber),0 0 0 9px rgba(232,162,74,.22),0 0 28px rgba(232,162,74,.55);animation:pulse 1.6s ease-in-out infinite}
.sph.alarm .ball{box-shadow:0 0 0 4px var(--red),0 0 0 11px rgba(255,42,42,.25),0 0 40px rgba(255,42,42,.55);animation:pulse 1.2s ease-in-out infinite}
.sph.warn .ball{box-shadow:0 0 0 4px var(--amber),0 0 0 11px rgba(232,162,74,.25),0 0 36px rgba(232,162,74,.5)}
.sph.mine .ball{box-shadow:0 0 0 3px #7c6fd6,0 0 22px rgba(124,111,214,.5)}
.sph.add .ball{background:transparent;box-shadow:none;border:2px dashed rgba(143,216,238,.55)}
.sph.add .ball span{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:#8fd8ee}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes drift{0%,100%{translate:0 0}50%{translate:0 -5px}}
.sph:not(.home):not(.ask):not(.alarm) .ball{animation:drift 6s ease-in-out infinite}
.link{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Help, Remiel Sentinel style: a true-red outline, held to send */
#help{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(78vw,340px);height:68px;border-radius:999px;border:2.5px solid var(--red);background:transparent;color:var(--red);
  font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.42em;padding-left:.42em;cursor:pointer;overflow:hidden;touch-action:none;z-index:6;box-shadow:0 0 26px rgba(255,42,42,.2)}
#help .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,42,42,.25);pointer-events:none}
/* pop-ups */
.veil{position:fixed;inset:0;z-index:20;background:rgba(2,5,10,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .3s}
.veil.in{opacity:1}
.pop{width:min(100%,440px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid rgba(232,162,74,.45);border-radius:24px;padding:18px;box-shadow:-3px 0 0 0 var(--amber) inset,0 20px 60px rgba(0,0,0,.6);transform:translateY(12px) scale(.98);transition:transform .3s}
.veil.in .pop{transform:none}
.pop .hd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pop .hd .who{font-family:var(--serif);font-size:28px;line-height:1.05;color:#9fdcff;flex:1;min-width:0}
.pop .x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--mut);font-size:24px;line-height:1;flex:none}
.mini{--d:64px;position:relative;transform:none;left:auto;top:auto}
.mini .ball{animation:none!important}
.k{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 2px 7px}
.rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber2);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{min-height:64px;padding:12px;border-radius:16px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;color:var(--mut);font-size:15px;font-weight:600;text-align:left;line-height:1.2}
.tile.on{border-color:var(--green);background:rgba(62,224,138,.10);color:#d8fbe9;box-shadow:0 0 18px rgba(62,224,138,.22)}
.go{display:flex;gap:12px;justify-content:center;margin-top:20px}
.code{font-family:var(--mono);font-size:52px;font-weight:600;letter-spacing:.16em;text-align:center;color:var(--amber2);text-shadow:0 0 22px rgba(232,162,74,.45);margin:8px 0 10px}
.timer{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}.timer i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:#0a101e;border:1px solid var(--line2);border-radius:14px;padding:14px;min-height:54px}
input:focus{outline:none;border-color:rgba(167,139,250,.7);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.codein{font-family:var(--mono);font-size:40px;letter-spacing:.3em;text-align:center;padding:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{height:62px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-family:var(--mono);font-size:22px;cursor:pointer}
.shot{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:4/3;border-radius:18px;border:2px dashed rgba(79,195,255,.45);overflow:hidden;cursor:pointer;background:#0a101e}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot span{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:#9fdcff;z-index:1;background:rgba(5,8,13,.6);padding:8px 12px;border-radius:10px}
/* calls */
#call{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#call video.remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#call video.local{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:28vw;max-width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid rgba(79,195,255,.6)}
#call .bar{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;gap:16px}
#call .who{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
#call .who .mini{--d:150px}
#call .who .mini .ball{animation:pulse 1.2s ease-in-out infinite!important}
#call .nm3{font-family:var(--serif);font-size:34px;color:#9fdcff}
/* urgent: the whole screen until someone answers */
#urgent{position:fixed;inset:0;z-index:50;background:radial-gradient(700px 500px at 50% 40%,#3a0610,#140207 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;border:4px solid var(--red)}
#urgent .mini{--d:150px}#urgent .mini .ball{box-shadow:0 0 0 4px var(--red),0 0 40px rgba(255,42,42,.6)}
#urgent h1{font-family:var(--serif);font-weight:400;font-size:38px;margin:0;color:#ffd0d0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:rgba(16,24,40,.95);border:1px solid var(--line2);padding:12px 20px;border-radius:999px;max-width:92vw;opacity:0;transition:all .3s;z-index:60;pointer-events:none;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.toast.show{opacity:1;transform:translateX(-50%)}
/* first run */
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;background:radial-gradient(70vmin 60vmin at 50% 40%,rgba(22,96,128,.42),transparent 75%),var(--bg)}
#start .wm{font-family:var(--serif);font-style:italic;font-size:48px}#start .wm b{font-family:var(--mono);font-style:normal;font-weight:400;font-size:16px;letter-spacing:.24em;color:var(--mut);display:block;text-align:center}
.pick{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.pick button{background:none;border:0;cursor:pointer;padding:0}
.pick .ball{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;padding:16px;text-align:center;font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#d8f3ff;line-height:1.4;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.22),rgba(79,195,255,.14) 30%,#0a2236 70%,#050f1a);box-shadow:0 0 0 3px var(--ring),0 0 0 14px rgba(29,143,214,.15),0 0 50px rgba(47,211,232,.35)}
.pick .home .ball{box-shadow:0 0 0 3px var(--ring),0 0 0 9px rgba(29,143,214,.2),0 0 0 15px rgba(197,165,90,.45),0 0 50px rgba(47,211,232,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg class="link" id="links"></svg>
  <div class="top"><div class="wm"><b>REMIEL</b>Covara</div><div class="sp"></div><button class="flag" data-act="lang" id="lngBtn" aria-label="Language: English / Italiano"></button></div>
  <div id="ask" role="dialog" aria-modal="false"></div>
  <div class="dream" id="dreamL"></div>
  <div class="dream" id="dreamR"></div>
  <div id="strip" aria-live="polite"></div>
  <div id="reach"></div>
  <div id="orbit"></div>
  <button id="help" class="hide" aria-label="Help: hold for 2 seconds"><span class="fill"></span>HELP</button>
</div>
<div id="start" class="hide"></div>
<div id="pop"></div>
<div id="call" class="hide"></div>
<div id="urgent" class="hide"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* Remiel: Covara, in the way Remiel Sentinel shows things. One sphere is highlighted at a time: it grows, its picture breathes
   large in the dream circle, and what belongs to that person floats beside it. Home is highlighted unless someone else is
   tapped, and Home comes back after half a minute. Home (the person looked after) is the sphere in the middle on every phone. */
const BUILD='2026-10-19.05';
const API=(window.COVARA_API||'https://remiel-sentinel-api.vercel.app').replace(/\/$/,'');
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){ try{ const v=localStorage.getItem('cv:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('cv:'+k, JSON.stringify(v)); }catch(e){} }};

/* The language button is the flag of the language in use, as in DREAM CODE. The faces are the answers to How are you? */
const flag=l=>l==='it'?'<svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#CE2B37"/></svg>'
  :'<svg viewBox="0 0 19 10" aria-hidden="true"><rect width="19" height="10" fill="#B22234"/><path d="M0 1.15h19M0 2.7h19M0 4.23h19M0 5.77h19M0 7.3h19M0 8.85h19" stroke="#fff" stroke-width=".77"/><rect width="7.6" height="5.38" fill="#3C3B6E"/><g fill="#fff">'+
   [0.6,1.9,3.2,4.5,5.8,7.0].map((x,i)=>[0.55,1.6,2.65,3.7,4.75].map((y,j)=>((i+j)%2===0?'<circle cx="'+x+'" cy="'+y+'" r=".22"/>':'')).join('')).join('')+'</g></svg>';
const FACE={good:'<path d="M8.5 14.2a4.2 4.2 0 0 0 7 0"/>', okay:'<path d="M8.5 15h7"/>', low:'<path d="M8.5 16a4.2 4.2 0 0 1 7 0"/>'};
const face=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/>'+FACE[k]+'<path d="M9 9.5v.1M15 9.5v.1"/></svg>';

/* ---------- words, English and Italian ---------- */
const IT={'How are you?':'Come stai?','Taken':'Fatto','Video':'Video','Call':'Chiama','Email':'Email','What they see':'Cosa vede','Open':'Apri','Add':'Aggiungi',
 'Where I am':'Dove sono','Which room I am in':'In quale stanza sono','If I fall':'Se cado','My medicines':'Le mie medicine','How I feel':'Come mi sento','If my phone stays still':'Se il telefono resta fermo',
 'Son':'Figlio','Daughter':'Figlia','Partner':'Partner','Friend':'Amico','Nurse':'Infermiere','Doctor':'Medico','Neighbour':'Vicino','Family':'Famiglia',
 'Help sent':'Aiuto inviato','Not connected':'Non connesso','Added':'Aggiunto','Saved':'Salvato','is calling':'ti chiama','Calling':'Chiamata','No answer':'Nessuna risposta','Answer':'Rispondi','End':'Chiudi',
 'I look after someone':'Mi prendo cura di qualcuno','I am looked after':'Sono assistito','Your first name':'Il tuo nome','Phone':'Telefono','What I do':'Cosa faccio','Asks to help':'Chiede di aiutare','Waiting':'In attesa','Me':'Io',
 'Yes':'Sì','No':'No','Save':'Salva','Remove':'Rimuovi','Delete':'Canc','OK':'OK','Medicine':'Medicina','Photo of the medicine':'Foto della medicina','Name of the medicine':'Nome della medicina','When':'Quando',
 'Morning':'Mattina','Midday':'Mezzogiorno','Evening':'Sera','Night':'Notte','Other time':'Altro orario','Change photo':'Cambia foto','Sees':'Vede','Nothing yet':'Ancora niente',
 'I have seen it':'Ho visto','Last moved':'Ultimo movimento','Battery':'Batteria','Place':'Luogo','Room':'Stanza','Mood':'Umore','Not good':'Non bene','Good':'Bene','Okay':'Così così',
 'Pharmacy':'Farmacia','Choose your pharmacy':'Scegli la tua farmacia','Appointments':'Appuntamenti','Medications':'Medicine','Subscriptions':'Abbonamenti','Photo':'Foto','Name':'Nome','Next renewal':'Prossimo rinnovo','just now':'ora','min ago':'min fa','h ago':'h fa','d ago':'g fa','Today':'Oggi','No email yet':'Nessuna email','Continue':'Continua'};
let LANG=store.get('lang', /^it/i.test(navigator.language||'')?'it':'en');
const T=s=>LANG==='it'&&IT[s]?IT[s]:s;
const EV_W={en:{help:'§ is asking for help',fall:'§ may have fallen',fall_ok:'§ is all right',left_home:'§ has left home',room_long:'§ in one room a long time',inactive:'§\'s phone has not moved',mood_low:'§ is not feeling good',overdue:'§ missed a medicine',battery:'§\'s battery is low'},
  it:{help:'§ chiede aiuto',fall:'§ potrebbe essere caduto',fall_ok:'§ sta bene',left_home:'§ è uscito di casa',room_long:'§ da molto in una stanza',inactive:'Il telefono di § è fermo',mood_low:'§ non si sente bene',overdue:'§ ha saltato una medicina',battery:'Batteria scarica per §'}};
const first=n=>String(n||'').trim().split(/\s+/)[0]||'';
const evTitle=(kind,name,fb)=>{ const w=(EV_W[LANG]||EV_W.en)[String(kind).replace(/^care-/,'')]; return w?w.replace('§',first(name)):fb; };
const ago=t=>{ if(!t) return '…'; const m=Math.round((Date.now()-t)/60000); return m<2?T('just now'):m<90?m+' '+T('min ago'):m<48*60?Math.round(m/60)+' '+T('h ago'):Math.round(m/1440)+' '+T('d ago'); };
const hhmm=t=>new Date(t).toLocaleTimeString(LANG==='it'?'it-IT':'en-US',{hour:'2-digit',minute:'2-digit'});
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';

/* ---------- account: a device account on the Sentinel server, with a Sentinel ID for calls ---------- */
const ACC={at:store.get('at',null), rt:store.get('rt',null), uid:store.get('uid',null)};
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function mySid(){ let s=store.get('sid',null); if(!/^[A-Z0-9]{8}$/.test(s||'')){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(8); crypto.getRandomValues(b); s=[...b].map(x=>A[x%A.length]).join(''); store.set('sid',s); } return s; }
async function identity(){ const name=store.get('name',''); if(!name) return false;
  let did=store.get('did',null), sec=store.get('sec',null); if(!did){ did='cv-'+rnd(12); store.set('did',did); } if(!sec){ sec=rnd(32); store.set('sec',sec); }
  const r=await fetch(API+'/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:did, device_secret:sec, display_name:name, sentinel_id:mySid()})});
  if(!r.ok) return false; const j=await r.json(); ACC.at=j.access_token; ACC.rt=j.refresh_token; ACC.uid=j.user_id; store.set('at',ACC.at); store.set('rt',ACC.rt); store.set('uid',ACC.uid);
  if(j.user && j.user.sentinel_id && j.user.sentinel_id!==mySid()) store.set('sid', j.user.sentinel_id);
  return true; }
async function refresh(){ if(!ACC.rt) return false; try{ const r=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ACC.rt})});
  if(!r.ok) return false; const j=await r.json(); ACC.at=j.access_token; if(j.refresh_token) ACC.rt=j.refresh_token; store.set('at',ACC.at); store.set('rt',ACC.rt); return true; }catch(e){ return false; } }
async function api(method, path, body, raw){ if(!ACC.at && !(await identity())) throw new Error('offline');
  const go=()=>fetch(API+path,{method, headers:Object.assign({'Authorization':'Bearer '+ACC.at}, body&&!raw?{'Content-Type':'application/json'}:{}), body:body?(raw?body:JSON.stringify(body)):undefined});
  let r=await go(); if(r.status===401 && ((await refresh()) || (await identity()))) r=await go();
  let j=null; try{ j=await r.json(); }catch(e){} return {s:r.status, j:j||{}}; }
async function upload(blob, type, name){ const fd=new FormData(); fd.append('blob_type',type); fd.append('file', blob, name); return api('POST','/storage/upload', fd, true).catch(()=>null); }

let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- who is where ---------- */
const S={role:store.get('role',null), links:{as_home:[],as_away:[]}, today:null, items:{}, me:{}, sums:{}, cur:store.get('cur',null), focus:null, pop:null};
const meP=()=>({name:store.get('name',''), sphere:S.me.sphere||'', vid:S.me.vid, local:S.localSphere||''});
const aways=()=>S.links.as_home.map(l=>({id:l.away.id, p:l.away, l, pending:l.status==='pending'}));
const homes=()=>S.links.as_away.map(l=>({id:l.home.id, p:l.home, l, pending:l.status==='pending'}));
// The sphere in the middle is always Home: me on Home's phone, the person I look after on a caregiver's phone.
function centre(){ if(S.role==='home') return {id:'me', p:meP(), me:true, home:true};
  const hs=homes().filter(h=>!h.pending); const c=hs.find(h=>h.id===S.cur)||hs[0]; if(c){ S.cur=c.id; store.set('cur',c.id); return Object.assign({home:true}, c); } return {id:'me', p:meP(), me:true}; }
function orbiters(){ if(S.role==='home') return aways(); const c=centre(); const me={id:'me', p:meP(), me:true};
  return c.me ? homes() : [me, ...homes().filter(h=>h.id!==c.id)]; }
const findP=id=>{ const c=centre(); if(id===c.id) return c; if(id==='me') return {id:'me', p:meP(), me:true}; const o=[...aways(), ...homes()].find(o=>o.id===id); return o; };
const focused=()=>findP(S.focus)||centre();

/* ---------- spheres ---------- */
function media(p){ const u=(p && p.local) || (p && p.sphere ? API+p.sphere : '');
  let inner; if(u && p.vid) inner='<video src="'+esc(u)+'" autoplay muted loop playsinline></video>'; else if(u) inner='<img src="'+esc(u)+'" alt="">'; else inner='<span class="ini">'+esc(initials(p && p.name))+'</span>';
  return '<div class="in">'+inner+'</div>'; }
function sphereHTML(id, d, x, y, cls, inner, tag, nm){ return '<div class="sph '+(cls||'')+'" style="--d:'+d+'px;left:'+x+'px;top:'+y+'px" data-act="sph" data-k="'+esc(id||'')+'">'+
  (tag?'<div class="tag">'+esc(tag)+'</div>':'')+'<div class="ball">'+inner+'</div>'+(nm!=null?'<div class="nm">'+esc(nm)+'</div>':'')+'</div>'; }
// Whether a Home needs a caregiver's eyes: red for help or a fall in the last six hours, amber for a late medicine or a low mood.
function alertOf(id){ if(S.role!=='away') return ''; const s=S.sums[id]; if(!s) return ''; const seen=store.get('seenAt',0);
  if((s.events||[]).some(e=>e.level>=3 && e.at>seen && Date.now()-e.at<6*3600000)) return 'alarm';
  if(s.today && s.today.items.some(x=>x.state==='late')) return 'warn';
  if(s.mood && s.mood.mood==='low' && Date.now()-s.mood.at<12*3600000) return 'warn';
  return ''; }
let LAY={at:{}};
// The highlighted person is the large sphere in the middle; everyone else waits in a row above and below.
// Their things are on the sphere's left, the ways to reach them on its right.
function layout(n){ const W=innerWidth, H=innerHeight, top=S.qTop||178, bottom=H-(S.role==='home'?96:20);
  const dO=Math.min(W*0.15,H*0.075,88), rowB=bottom-dO/2-30;
  const dd=Math.min((W-48)/2, H*0.2, 230), band={top:top+4, dd};
  // Ways to reach on the right are short words; the left gets the rest of the width for names and photos.
  const zTop=top+dd+64, zBot=rowB-dO/2-24, rw=Math.min(150, Math.max(92, W*0.23)), dMe=Math.max(90, Math.min(W*0.31, zBot-zTop, 220, W-rw-150-40));
  const lw=Math.min(W-rw-dMe-40, Math.max(150, W*0.36)), cx=8+lw+12+(W-rw-16-(8+lw+12))/2, cy=(zTop+zBot)/2;
  const pos=[]; for(let i=0;i<n;i++) pos.push([W*(i+1)/(n+1), rowB]);
  return {cx,cy,dMe,dO,pos,at:{}, band, rw, side:{w:lw, top:zTop-8, bottom:rowB-dO/2-30}}; }
function renderStage(){ const c=centre(), f=focused(), all=[c, ...orbiters()].filter(o=>o.id!==f.id), L=layout(all.length+1); LAY=L; let h='';
  h+=sphereHTML(f.id, L.dMe, L.cx, L.cy, 'foc '+(f.home?'home ':'')+(f.me&&!f.home?'mine ':'')+(f.home?moodRing(f):'')+(f.me?'':alertOf(f.id)), media(f.p), f.home||f.me?'':(f.l&&f.l.relation?T(f.l.relation).toUpperCase():''), f.p.name); L.at[f.id]=[L.cx,L.cy];
  all.forEach((o,i)=>{ const [x,y]=L.pos[i]; L.at[o.id]=[x,y];
    const tag=o.pending?(S.role==='home'?T('Asks to help'):T('Waiting')):o.home?'':o.me?T('Me'):(o.l&&o.l.relation?T(o.l.relation):'');
    h+=sphereHTML(o.id, L.dO, x, y, (o.pending?'ask ':'')+(o.home?'home '+moodRing(o):'')+(o.me&&!o.home?'mine ':'')+(o.me?'':alertOf(o.id)), media(o.p), tag.toUpperCase(), first(o.p.name)); });
  const [ax,ay]=L.pos[all.length]; h+=sphereHTML('add', L.dO*0.8, ax, ay, 'add', '<span>'+esc(T('Add').toUpperCase())+'</span>', '', null);
  $('#orbit').innerHTML=h;
  $('#links').innerHTML=all.map((o,i)=>'<line x1="'+L.cx+'" y1="'+L.cy+'" x2="'+L.pos[i][0]+'" y2="'+L.pos[i][1]+'" stroke="'+(o.pending?'rgba(232,162,74,.35)':'rgba(79,195,255,.18)')+'" stroke-width="1"/>').join('');
  $('#help').classList.toggle('hide', S.role!=='home');
  $('#lngBtn').innerHTML=flag(LANG);
  renderStrip(); renderReach(); renderDreams(); }

// The status ring tells how Home is feeling, from Home's own answer today.
function moodOf(o){ if(!o||!o.home) return null; if(S.role==='home'){ const m=store.get('mood',''); const [k,d]=String(m).split('|'); return d===new Date().toDateString()?k:null; }
  const s=S.sums[o.id]; if(!s||!s.mood) return null; return new Date(s.mood.at).toDateString()===new Date().toDateString()?s.mood.mood:null; }
const moodRing=o=>{ const m=moodOf(o); return m?'m-'+m+' ':''; };

/* ---------- the dream state ---------- */
// A small map in a circle: OpenStreetMap tiles drawn by CARTO, as Sentinel's WHEREIS uses, with the place pulsing in the middle.
function mapCircle(lat, lon, dd){ const z=16, n=2**z, x=(lon+180)/360*n, r=lat*Math.PI/180, y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n, tx=Math.floor(x), ty=Math.floor(y), ox=(x-tx)*256, oy=(y-ty)*256; let h='<div class="tiles2">';
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++) h+='<img alt="" src="https://'+'abc'[(tx+dx+ty+dy+3)%3]+'.basemaps.cartocdn.com/dark_all/'+z+'/'+(tx+dx)+'/'+(ty+dy)+'.png" style="left:'+(dx*256-ox)+'px;top:'+(dy*256-oy)+'px" onerror="this.remove()">';
  return h+'</div><div class="dot"></div>'; }
const picOf=p=>{ const u=(p&&p.local)||(p&&p.sphere?API+p.sphere:''); return u?(p.vid?'<video src="'+esc(u)+'" autoplay muted loop playsinline></video>':'<img src="'+esc(u)+'" alt="">'):'<div class="ini">'+esc(initials(p&&p.name))+'</div>'; };
function urgentOf(f){ if(!f.home) return null; if(S.role==='home') return S.helpAt&&Date.now()-S.helpAt<15*60000?{kind:'help', at:S.helpAt}:null;
  const s=S.sums[f.id]; const seen=store.get('seenAt',0); return s?(s.events||[]).find(e=>e.level>=3 && e.at>seen && Date.now()-e.at<6*3600000)||null:null; }
function dueMedOf(f){ if(!f.home) return null; const day=S.role==='home'?S.today:(S.sums[f.id]||{}).today; if(!day) return null;
  return day.items.filter(x=>x.item.kind==='med' && (x.state==='late'||x.state==='due')).sort((a,b)=>(a.state==='late'?0:1)-(b.state==='late'?0:1))[0]||null; }
function placeOf(f){ if(S.role==='home') return f.home&&S.here?{lat:S.here.lat, lon:S.here.lon, at:S.here.at}:null; const s=S.sums[f.id]; return s&&s.location?{lat:s.location.lat, lon:s.location.lon, at:s.location.at, label:s.place}:null; }
function pharmacyOf(f){ return S.role==='home'?(S.me.pharmacy||null):((S.sums[f.id]||{}).pharmacy||null); }
function renderDreams(){ const f=focused(), B=LAY.band, W=innerWidth, urg=urgentOf(f), med=urg?null:dueMedOf(f), hi=!!S.hiUntil && Date.now()<S.hiUntil;
  const R=$('#dreamR'), Lf=$('#dreamL'); const place=placeOf(f);
  let rgb=f.home?(moodOf(f)==='low'?'255,42,42':moodOf(f)==='okay'?'232,162,74':moodOf(f)==='good'?'62,224,138':'197,165,90'):f.me?'124,111,214':'79,195,255';
  let right, left;
  if(urg){ rgb='255,42,42'; right={inner:picOf(f.p), h1:f.p.name, h2:hhmm(urg.at)};
    left={inner:place?mapCircle(place.lat,place.lon,B.dd):'<div class="ini">!</div>', h1:evTitle(urg.kind,f.p.name,urg.title||''), h2:place?(place.label||place.lat.toFixed(5)+', '+place.lon.toFixed(5)):''}; }
  else if(med){ const ph=pharmacyOf(f); right={inner:med.item.photo?'<img src="'+esc(API+med.item.photo)+'" alt="">':'<div class="ini" style="font-size:18px;padding:12px">'+esc(med.item.title)+'</div>', h1:med.item.title, h2:med.slot};
    left=ph?{inner:mapCircle(ph.lat,ph.lon,B.dd), h1:ph.name, h2:ph.address||'', h3:ph.phone?'<a href="tel:'+esc(ph.phone.replace(/[^\d+]/g,''))+'">'+esc(ph.phone)+'</a>':''}
      :{inner:'<div class="ini" style="font-size:14px;letter-spacing:.14em;padding:18px;font-family:var(--mono)">'+esc(T('Pharmacy').toUpperCase())+'</div>', h1:T('Pharmacy'), h2:S.role==='home'||pharmacyEditable(f)?T('Choose your pharmacy'):''}; }
  else { right={inner:picOf(f.p), h1:'', h2:''};
    left=place&&f.home?{inner:mapCircle(place.lat,place.lon,B.dd), h1:f.p.name, h2:(place.label?place.label+' · ':'')+ago(place.at)}:null; }
  const put=(el,x,cls,d)=>{ if(!d){ el.innerHTML=''; el._k=''; return; } const key=d.inner+d.h1+d.h2+(d.h3||'')+B.dd+rgb;
    el.style.left=x+'px'; el.style.top=B.top+'px'; el.className='dream '+cls+(urg?' urg':'')+(hi||urg||med?' hi':'');
    if(el._k===key) return; el._k=key; el.innerHTML='<div class="circ" style="--dd:'+B.dd+'px;--rgb:'+rgb+'">'+d.inner+'</div>'+(d.h1?'<div class="h1" style="--dd:'+B.dd+'px">'+esc(d.h1)+'</div>':'')+(d.h2?'<div class="h2" style="--dd:'+B.dd+'px">'+esc(d.h2)+'</div>':'')+(d.h3?'<div class="h3">'+d.h3+'</div>':''); };
  put(R, W-B.dd-16, 'r', right); put(Lf, 16, 'l', left);
  if(med && !pharmacyOf(f) && (S.role==='home'||pharmacyEditable(f))){ Lf.style.pointerEvents='auto'; Lf.dataset.act='pharmacy'; } else { Lf.style.pointerEvents='none'; delete Lf.dataset.act; } }
const pharmacyEditable=f=>S.role==='away' && !!(S.sums[f.id]||{}).today;

/* ---------- how to reach the highlighted person: on the sphere's right ---------- */
function renderReach(){ const f=focused(), L=LAY, box=$('#reach'); box.style.width=L.rw+'px';
  const midTop=L.cy-110; box.style.top=Math.max(L.side.top, midTop)+'px'; box.style.height='220px';
  let h;
  if(f.me && !f.home) h='<button class="w" data-act="profile">'+esc(T('Change photo'))+'</button>';

function shrink(f, max){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b||f),'image/jpeg',0.86); }; img.onerror=()=>res(f); img.src=URL.createObjectURL(f); }); }

/* ---------- Help: hold two seconds, so it is never sent by accident ---------- */
function bindHelp(){ const b=$('#help'), f=b.querySelector('.fill'); let t0=0, raf=0;
  const stop=()=>{ cancelAnimationFrame(raf); t0=0; f.style.width='0'; };
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/2000); f.style.width=(p*100)+'%'; if(p>=1){ stop(); sendHelp(); return; } raf=requestAnimationFrame(step); };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); try{ navigator.vibrate&&navigator.vibrate(30); }catch(x){} raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,stop)); }
async function sendHelp(){ try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
  S.helpAt=Date.now(); renderDreams(); const r=await api('POST','/care/events',{kind:'help', client_ref:'help-'+Date.now()}).catch(()=>null);

/* ---------- Home's phone reports: movement, battery, place ---------- */
const MOVE={last:0};
function watchMotion(){ let prev=null;
  window.addEventListener('devicemotion',e=>{ const a=e.accelerationIncludingGravity; if(!a||a.x==null) return; const v=[a.x,a.y,a.z];
    if(prev){ const d=Math.abs(v[0]-prev[0])+Math.abs(v[1]-prev[1])+Math.abs(v[2]-prev[2]); if(d>1.2) MOVE.last=Date.now(); } prev=v; });
  ['pointerdown','keydown','touchstart'].forEach(k=>window.addEventListener(k,()=>{ MOVE.last=Date.now(); touchIdle(); },{passive:true})); }
function herePos(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}), ()=>res(null), {enableHighAccuracy:true, timeout:8000, maximumAge:60000}); }); }
async function report(){ if(S.role!=='home' || !store.get('name','')) return; const b={tz:Intl.DateTimeFormat().resolvedOptions().timeZone};
  if(MOVE.last) b.moved_at=MOVE.last;
  try{ if(navigator.getBattery){ const bt=await navigator.getBattery(); b.battery=Math.round(bt.level*100); b.charging=bt.charging; } }catch(e){}
  await api('POST','/care/state',b).catch(()=>null);
  if(S.links.as_home.some(l=>l.status==='active' && l.share.location)){ const p=await herePos(); if(p){ S.here={lat:p.lat, lon:p.lon, at:Date.now()}; renderDreams(); await api('POST','/location',{latitude:p.lat, longitude:p.lon, accuracy:p.acc, continuous:true}).catch(()=>null); } } }

/* ---------- data ---------- */
async function load(){ if(!S.role || !store.get('name','')) return; try{
  const r=await api('GET','/care/links'); if(r.s===200) S.links=r.j;
  const m=await api('GET','/care/me'); if(m.s===200) S.me=Object.assign({vid:store.get('meVid',false)}, m.j);
  if(S.role==='home'){ const t=await api('GET','/care/today'); if(t.s===200) S.today=t.j; }
  if(S.role==='away') for(const o of homes().filter(o=>!o.pending)){ const s=await api('GET','/care/summary?home='+encodeURIComponent(o.id)); if(s.s===200) S.sums[o.id]=s.j; }
  await loadItems(); await alarmsPoll(); }catch(e){}
  renderStage(); maybeAsk(); peerStart(); }

// Appointments and subscriptions of the Home in the middle (the day's medicines come with the day).
async function loadItems(){ const c=centre(); if(!c.home) return; const hid=S.role==='home'?'me':c.id; if(S.role==='away' && !(S.sums[c.id]||{}).today) return;
  const r=await api('GET','/care/items'+(S.role==='away'?'?home='+encodeURIComponent(c.id):'')).catch(()=>null); if(r && r.s===200) S.items[hid]=r.j.items||[]; }

/* ---------- alarms: an urgent one takes the whole screen until someone answers ---------- */
async function alarmsPoll(){ if(S.role!=='away') return; const r=await api('GET','/alarms?state=open').catch(()=>null); if(!r||r.s!==200) return;
  const a=(r.j.alarms||[]).filter(x=>/^care-/.test(x.kind) && x.owner_id===ACC.uid).sort((x,y)=>y.level-x.level)[0];
  const box=$('#urgent'); if(!a || a.level<3){ box.classList.add('hide'); box.innerHTML=''; return; }
  const o=findP(a.member_ref); const p=o?o.p:{name:a.member_name||a.raised_by_name};
  box.innerHTML=mini(p)+'<h1>'+esc(evTitle(a.kind, p.name, a.title))+'</h1><div style="font-family:var(--mono);color:#ffb3b3;letter-spacing:.1em">'+esc(hhmm(a.created_at))+'</div>'+
    '<div class="go" style="flex-wrap:wrap"><button class="w g big" data-act="video" data-k="'+esc(a.member_ref||'')+'">'+esc(T('Video'))+'</button><button class="w g big" data-act="call" data-k="'+esc(a.member_ref||'')+'">'+esc(T('Call'))+'</button></div><button class="w gold big" data-act="ack" data-k="'+a.id+'">'+esc(T('I have seen it'))+'</button>';
  box.classList.remove('hide'); try{ navigator.vibrate&&navigator.vibrate([400,200,400,200,400]); }catch(e){} }

/* ---------- video calls: Sentinel Call's servers and Sentinel IDs ---------- */
const CALL={peer:null, cfg:null, cur:null, stream:null, tries:0, timer:0};
function loadPeer(){ return window.Peer ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function peerStart(){ if(CALL.peer || CALL.starting || !store.get('name','')) return; CALL.starting=true;
  try{ await loadPeer(); const r=await fetch(API+'/call/config'); CALL.cfg=await r.json();
    const o={debug:0, config:{iceServers:CALL.cfg.ice||[]}}; if(CALL.cfg.peer) Object.assign(o,{host:CALL.cfg.peer.host, port:CALL.cfg.peer.port, path:CALL.cfg.peer.path, secure:CALL.cfg.peer.secure, key:'remiel'});
    const p=new Peer(mySid(), o); p.on('call', incoming); p.on('error',()=>{}); p.on('disconnected',()=>{ try{ p.reconnect(); }catch(e){} }); CALL.peer=p; }catch(e){} CALL.starting=false; }
function cam(){ return navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true}); }
function callScreen(p, state){ const c=$('#call'); c.classList.remove('hide');
  c.innerHTML='<video class="remote" autoplay playsinline></video><video class="local" autoplay playsinline muted></video><div class="who">'+mini(p)+'<div class="nm3">'+esc(p.name||'')+'</div><div style="font-family:var(--mono);letter-spacing:.2em;color:var(--mut);font-size:12px">'+esc((state==='in'?T('is calling'):T('Calling')).toUpperCase())+'</div></div>'+
    '<div class="bar">'+(state==='in'?'<button class="w r big" data-act="hang">'+esc(T('End'))+'</button><button class="w g big" data-act="answer">'+esc(T('Answer'))+'</button>':'<button class="w r big" data-act="hang">'+esc(T('End'))+'</button>')+'</div>';
  if(CALL.stream) c.querySelector('video.local').srcObject=CALL.stream; }
function attach(call){ CALL.cur=call; call.on('stream',st=>{ clearInterval(CALL.timer); const c=$('#call'); const v=c.querySelector('video.remote'); if(v) v.srcObject=st; const w=c.querySelector('.who'); if(w) w.classList.add('hide'); });
  call.on('close',hangUp); call.on('error',()=>{}); }
async function startCall(o){ if(!o.p.sentinel_id) return toast(T('No answer')); await peerStart(); if(!CALL.peer) return toast(T('Not connected'));
  try{ CALL.stream=await cam(); }catch(e){ return toast(T('Not connected')); }
  callScreen(o.p,'out'); api('POST','/call/ring',{to_sentinel_id:o.p.sentinel_id, app:'covara'}).catch(()=>{});
  CALL.tries=0; const dial=()=>{ if(CALL.cur && CALL.cur.open) return; CALL.tries++; if(CALL.tries>12){ api('POST','/call/ring',{to_sentinel_id:o.p.sentinel_id, state:'missed', app:'covara'}).catch(()=>{}); toast(T('No answer')); return hangUp(); }
    try{ const c=CALL.peer.call(o.p.sentinel_id, CALL.stream, {metadata:{name:store.get('name',''), app:'covara'}}); if(c) attach(c); }catch(e){} };
  dial(); CALL.timer=setInterval(dial, 4000); }
function incoming(call){ if(CALL.cur && CALL.cur.open){ try{ call.close(); }catch(e){} return; } CALL.pending=call; const o=[...aways(),...homes()].find(x=>x.p.sentinel_id===call.peer); const p=o?o.p:{name:(call.metadata&&call.metadata.name)||''};
  callScreen(p,'in'); try{ navigator.vibrate&&navigator.vibrate([500,300,500,300,500]); }catch(e){} }
async function answer(){ const call=CALL.pending; if(!call) return; try{ CALL.stream=await cam(); }catch(e){ CALL.stream=null; }
  call.answer(CALL.stream||undefined); attach(call); const l=$('#call video.local'); if(l && CALL.stream) l.srcObject=CALL.stream; }
function hangUp(){ clearInterval(CALL.timer); try{ CALL.cur&&CALL.cur.close(); }catch(e){} try{ CALL.pending&&CALL.pending!==CALL.cur&&CALL.pending.close(); }catch(e){}
  CALL.cur=null; CALL.pending=null; if(CALL.stream){ CALL.stream.getTracks().forEach(t=>t.stop()); CALL.stream=null; } const c=$('#call'); c.classList.add('hide'); c.innerHTML=''; }

/* ---------- push ---------- */
const b64=s=>{ const p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); };
async function pushOn(){ try{ if(!('Notification' in window) || Notification.permission==='denied') return; if(Notification.permission!=='granted' && (await Notification.requestPermission())!=='granted') return;
  const reg=await navigator.serviceWorker.ready; const k=await api('GET','/push/vapid-key'); if(k.s!==200) return;
  const sub=(await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(k.j.publicKey)}); const j=sub.toJSON();
  await api('POST','/push/subscribe',{endpoint:j.endpoint, keys:j.keys}); }catch(e){} }

/* ---------- first run ---------- */
function startScreen(){ const s=$('#start'); if(store.get('name','') && S.role){ s.classList.add('hide'); return; } s.classList.remove('hide');
  if(!store.get('name','')) s.innerHTML='<div class="wm"><b>REMIEL</b>Covara</div><div style="width:min(86vw,360px)"><div class="k">'+esc(T('Your first name'))+'</div><input id="nm" autocomplete="given-name" maxlength="40"></div><button class="w gold big" data-act="name">'+esc(T('Continue'))+'</button>';
  else s.innerHTML='<div class="wm"><b>REMIEL</b>Covara</div><div class="pick"><button class="home" data-act="role" data-k="home"><div class="ball">'+esc(T('I am looked after'))+'</div></button><button data-act="role" data-k="away"><div class="ball">'+esc(T('I look after someone'))+'</div></button></div>'; }

/* ---------- taps ---------- */
document.addEventListener('click', async e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const k=el.dataset.k;
  const reach=id=>findP(id);
  switch(el.dataset.act){
    case 'lang': { LANG=LANG==='en'?'it':'en'; store.set('lang',LANG); document.documentElement.lang=LANG; const a=$('#ask'); if(a.classList.contains('in')) a.querySelector('.q').textContent=T('How are you?'); $('#strip').innerHTML=''; renderStage(); break; }
    case 'name': { const v=($('#nm').value||'').trim(); if(!v) return $('#nm').focus(); store.set('name',v); identity(); startScreen(); break; }
    case 'role': S.role=k; store.set('role',k); startScreen(); load(); pushOn(); break;
    case 'role-reset': S.role=S.role==='home'?'away':'home'; store.set('role',S.role); S.focus=null; unpop(); S.sums={}; load(); break;
    case 'sph': if(k==='add') return addPop(); if(k==='me' && S.focus==='me') return profilePop(); highlight(k); break;
    case 'profile': profilePop(); break;
    case 'video': case 'call': case 'mail': { let o=reach(k); if(!o) return;
      // Home reaching out from their own sphere: straight to the one caregiver, or a choice of them
      if(o.me){ const as=aways().filter(a=>!a.pending); if(!as.length) return addPop(); if(as.length>1) return choosePop(el.dataset.act, as); o=as[0]; }
      doReach(el.dataset.act, o); break; }
    case 'pick-reach': { const o=reach(k); if(o){ unpop(); doReach(el.dataset.how, o); } break; }
    case 'eye': { const o=reach(k); if(o&&o.l) consentPop(o.l); break; }
    case 'open': personPop(k); break;
    case 'veil': if(e.target===el) unpop(); break;
    case 'unpop': unpop(); break;
    case 'share': { S.ask.share[k]=S.ask.share[k]?0:1; el.classList.toggle('on', !!S.ask.share[k]); el.setAttribute('aria-pressed', S.ask.share[k]?'true':'false'); break; }
    case 'rel': S.ask.rel=S.ask.rel===k?'':k; document.querySelectorAll('#rel .w').forEach(c=>c.classList.toggle('on', c.dataset.k===S.ask.rel)); break;
    case 'consent-save': { const r=await api('PUT','/care/links/'+S.ask.l.id,{approve:true, share:S.ask.share, relation:S.ask.rel}); if(r.s===200){ unpop(); toast(T('Saved')); S.focus=S.ask.l.away.id; load(); } break; }
    case 'link-end': await api('DELETE','/care/links/'+k); unpop(); S.focus=null; load(); break;
    case 'me-save': { const b={phone:($('#mePh')||{}).value||'', email:($('#meEm')||{}).value||''}; if($('#meRo')) b.role=$('#meRo').value; const r=await api('PUT','/care/me',b); if(r.s===200){ S.me=Object.assign(S.me,r.j); unpop(); toast(T('Saved')); renderStage(); } break; }
    case 'pad': { const i=$('#cd'); if(k==='del') i.value=i.value.slice(0,-1); else if(k==='ok'){ if(i.value.length!==6) return; const r=await api('POST','/care/claim',{code:i.value}); if(r.s<300){ unpop(); toast(T('Added')); load(); } else { i.value=''; toast(r.j.detail||T('Not connected')); } } else if(i.value.length<6) i.value+=k; break; }
    case 'mood': { await api('POST','/care/state',{mood:k}).catch(()=>null); store.set('asked', new Date().toDateString()); store.set('mood', k+'|'+new Date().toDateString()); renderStage(); $('#ask').classList.remove('in'); toast(T('Saved')); break; }
    case 'float': { const x=el._x; if(!x) return; if(x.mark && S.role==='home'){ const r=await api('POST','/care/items/'+x.mark.id+'/mark',{slot:x.mark.slot}); if(r.s===200){ el.classList.add('done'); toast(T('Taken')); S.today=r.j; setTimeout(renderStrip, 600); } } else if(S.role==='away') personPop(focused().id); break; }
    case 'item-new': { const c=centre(); const hid=S.role==='home'?ACC.uid:c.id; if(k==='med') medPop(hid); else datedPop(k, hid); break; }
    case 'slot': { const t=k; if(S.med.times.has(t)) S.med.times.delete(t); else S.med.times.add(t); el.classList.toggle('on', S.med.times.has(t)); break; }
    case 'med-save': { const name=($('#medName').value||'').trim(); if(!name) return $('#medName').focus(); const other=$('#medOther').value; if(other) S.med.times.add(other); if(!S.med.times.size) return;
      let photo=null; if(S.med.blob){ const u=await upload(S.med.blob,'photo','medicine.jpg'); if(u && u.s===201) photo=u.j.id; }
      const body={kind:'med', title:name, times:[...S.med.times], photo}; if(S.med.home && S.med.home!==ACC.uid) body.home=S.med.home;
      const r=await api('POST','/care/items', body); if(r.s===201){ unpop(); toast(T('Added')); load(); } else toast(r.j.detail||T('Not connected')); break; }
    case 'dated-save': { const name=($('#medName').value||'').trim(); if(!name) return $('#medName').focus(); const at=new Date($('#dtWhen').value).getTime(); if(!at) return $('#dtWhen').focus();
      let photo=null; if(S.med.blob){ const u=await upload(S.med.blob,'photo','item.jpg'); if(u && u.s===201) photo=u.j.id; }
      const body={kind:S.med.kind, title:name, at, photo}; if(S.med.home && S.med.home!==ACC.uid) body.home=S.med.home;
      const r=await api('POST','/care/items', body); if(r.s===201){ unpop(); toast(T('Added')); load(); } else toast(r.j.detail||T('Not connected')); break; }
    case 'ack': store.set('seenAt', Date.now()); await api('POST','/alarms/'+k+'/ack'); $('#urgent').classList.add('hide'); load(); break;
    case 'pharmacy': pharmacyPop(); break;
    case 'ph-pick': { const p=S.phs[Number(k)]; const body={pharmacy:p}; if(S.phHome) body.home=S.phHome; const r=await api('PUT','/care/pharmacy', body); if(r.s===200){ if(!S.phHome) S.me.pharmacy=r.j.pharmacy; else if(S.sums[S.phHome]) S.sums[S.phHome].pharmacy=r.j.pharmacy; unpop(); toast(T('Saved')); renderDreams(); } break; }
    case 'answer': answer(); break;
    case 'hang': hangUp(); break;
  } });
window.addEventListener('resize',()=>{ renderStage(); });

/* ---------- start ---------- */
document.documentElement.lang=LANG;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message',e=>{ if(e.data && (e.data.type==='PUSH_RECEIVED'||e.data.type==='NOTIFICATION_CLICK')) load(); });
watchMotion(); bindHelp(); startScreen(); renderStage(); load();
setInterval(load, 30000); setInterval(report, 120000); setTimeout(report, 4000); setInterval(()=>{ if(S.hiUntil && Date.now()>S.hiUntil){ S.hiUntil=0; renderDreams(); } }, 5000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ MOVE.last=Date.now(); load(); report(); } });
if(/#call=/.test(location.hash)) peerStart();
</script>
