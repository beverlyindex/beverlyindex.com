<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06090f">
<title>Remiel: Covara</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../halo/icon-192.png">
<style>
/* Fonts are served with the app (SIL Open Font License), so nothing is fetched from a third party. */
@font-face{font-family:'DM Sans';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/dm-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/instrument-serif-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Instrument Serif';font-weight:400;font-style:italic;font-display:swap;src:url('fonts/instrument-serif-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:600;font-style:normal;font-display:swap;src:url('fonts/jetbrains-mono-latin-600-normal.woff2') format('woff2')}
/* The NOUS and Remiel Sentinel look: near-black navy, a teal glow behind glass spheres, amber serif, monospaced capitals,
   neon outlines, true-red outlines for Help. Pictures first: a person is their sphere, a task is its icon. */
:root{
  color-scheme:dark;
  --bg:#05080d; --panel:rgba(12,17,29,.94); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#e8edf7; --mut:#9aa6bd; --dim:#5d6a85;
  --amber:#e8a24a; --amber2:#f3c27a; --teal:#2fd3e8; --cyan:#4fc3ff; --ring:#1d8fd6; --green:#3ee08a; --purple:#a78bfa; --red:#ff2a2a;
  --serif:'Instrument Serif',Georgia,serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden}
body{background:radial-gradient(70vmin 60vmin at 60% 48%,rgba(22,96,128,.42),rgba(10,44,64,.16) 50%,transparent 75%),radial-gradient(90vmin 50vmin at 50% 115%,rgba(197,165,90,.08),transparent 70%),var(--bg)}
button{font:inherit;color:inherit}
.hide{display:none!important}
#stage{position:fixed;inset:0;overflow:hidden}
.top{position:absolute;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;align-items:center;gap:10px;z-index:5}
.top .wm{font-family:var(--serif);font-style:italic;font-size:24px;line-height:1}
.top .wm b{font-family:var(--mono);font-style:normal;font-weight:400;font-size:13px;letter-spacing:.22em;color:var(--mut);margin-right:6px}
.top .sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:rgba(16,22,36,.8);display:grid;place-items:center;cursor:pointer}
.lng{font-family:var(--mono);font-size:12px;letter-spacing:.08em}
/* spheres, as in Remiel Sentinel: picture or video inside glass, a bright blue ring and soft outer halos */
.sph{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;transition:left .6s ease,top .6s ease,opacity .4s;cursor:pointer;touch-action:manipulation}
.sph .ball{width:var(--d);height:var(--d);border-radius:50%;position:relative;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.28),rgba(79,195,255,.14) 30%,#0a2236 70%,#050f1a);
  box-shadow:0 0 0 3px var(--ring),0 0 0 calc(var(--d)*.06) rgba(29,143,214,.18),0 0 0 calc(var(--d)*.11) rgba(29,143,214,.08),0 0 calc(var(--d)*.35) rgba(47,211,232,.38)}
.sph .ball .in{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.sph .ball img,.sph .ball video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sph .ball .ini{font-weight:600;font-size:calc(var(--d)*.32);letter-spacing:.03em;color:#e6f6ff;text-shadow:0 0 12px rgba(79,195,255,.6)}
.sph .ball .in::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.sph.mid .ball{box-shadow:0 0 0 4px var(--ring),0 0 0 9px rgba(29,143,214,.22),0 0 0 15px rgba(197,165,90,.45),0 0 0 17px rgba(197,165,90,.12),0 0 calc(var(--d)*.45) rgba(47,211,232,.42)}
.sph .nm{margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8fd8ee;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.sph.mid .nm{font-family:var(--sans);font-size:28px;letter-spacing:.01em;text-transform:none;color:#7fd3ea;max-width:80vw;margin-top:18px}
.sph .tag{position:absolute;top:-18px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.14em;color:var(--amber2);white-space:nowrap}
.sph.ask .ball{box-shadow:0 0 0 3px var(--amber),0 0 0 9px rgba(232,162,74,.22),0 0 28px rgba(232,162,74,.55)}
.sph.add .ball{background:transparent;box-shadow:none;border:2px dashed rgba(143,216,238,.55)}
.sph.add .ball svg{width:40%;height:40%;color:#8fd8ee}
.sph.mine .ball{box-shadow:0 0 0 3px #7c6fd6,0 0 22px rgba(124,111,214,.5)}
.sph .badge{position:absolute;right:-4px;top:-4px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#1b0b0e;border:2px solid var(--red);color:#ff6b6b;z-index:2}
.sph .badge.warn{border-color:var(--amber);color:var(--amber2);background:#1d1408}
.sph .badge svg{width:17px;height:17px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes drift{0%,100%{translate:0 0}50%{translate:0 -6px}}
.sph:not(.mid) .ball{animation:drift 6s ease-in-out infinite}
.sph.ask .ball{animation:pulse 1.6s ease-in-out infinite}
.link{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* the quick actions that open round a sphere */
.qa{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;display:grid;place-items:center;cursor:pointer;z-index:8;
  background:rgba(10,18,30,.94);border:1.5px solid rgba(79,195,255,.7);color:#bfe9ff;box-shadow:0 0 18px rgba(47,211,232,.35);opacity:0;transform:scale(.4);transition:opacity .25s,transform .25s}
.qa.on{opacity:1;transform:scale(1)}
.qa svg{width:26px;height:26px}
.qa.g{border-color:rgba(62,224,138,.8);color:#9ff5c6;box-shadow:0 0 18px rgba(62,224,138,.35)}
.qa.a{border-color:rgba(243,194,122,.85);color:var(--amber2);box-shadow:0 0 18px rgba(232,162,74,.35)}
.qa i{position:absolute;top:62px;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#9fdcff;white-space:nowrap}
/* the dream column: what is needed, fading in one by one, fading out once done */
#dream{position:absolute;left:12px;top:calc(max(12px,env(safe-area-inset-top)) + 64px);width:min(38vw,190px);display:flex;flex-direction:column;gap:10px;z-index:4}
.dt{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 8px;border-radius:16px;background:rgba(8,14,24,.6);border:1px solid rgba(79,195,255,.18);cursor:pointer;
  opacity:0;transform:translateX(-14px);transition:opacity .7s ease,transform .7s ease}
.dt.in{opacity:1;transform:none}
.dt.out{opacity:0;transform:translateX(-20px) scale(.96)}
.dt .ic{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid rgba(79,195,255,.6);color:#bfe9ff;background:rgba(79,195,255,.08)}
.dt .ic svg{width:24px;height:24px}
.dt.late .ic{border-color:var(--red);color:#ff7b7b;background:rgba(255,42,42,.10);box-shadow:0 0 14px rgba(255,42,42,.35)}
.dt.due .ic{border-color:var(--amber);color:var(--amber2);background:rgba(232,162,74,.10);box-shadow:0 0 14px rgba(232,162,74,.35)}
.dt.done .ic{border-color:var(--green);color:#9ff5c6}
.dt .tx{min-width:0}
.dt .t{font-size:14px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dt .w{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Help, Remiel Sentinel style: a true-red outline, held to send */
#help{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(78vw,340px);height:74px;border-radius:999px;border:2.5px solid var(--red);background:transparent;color:var(--red);
  font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:.42em;padding-left:.42em;cursor:pointer;overflow:hidden;touch-action:none;z-index:6;box-shadow:0 0 26px rgba(255,42,42,.2)}
#help .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,42,42,.25);pointer-events:none}
/* pop-ups */
.veil{position:fixed;inset:0;z-index:20;background:rgba(2,5,10,.62);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .3s}
.veil.in{opacity:1}
.pop{width:min(100%,440px);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid rgba(232,162,74,.45);border-radius:24px;padding:18px;box-shadow:-3px 0 0 0 var(--amber) inset,0 20px 60px rgba(0,0,0,.6);transform:translateY(12px) scale(.98);transition:transform .3s}
.veil.in .pop{transform:none}
.pop .hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.pop .hd .who{font-family:var(--serif);font-size:28px;line-height:1.05;color:#9fdcff;flex:1;min-width:0}
.pop .x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--mut);flex:none}
.pop .x svg{width:18px;height:18px}
.mini{--d:64px;position:relative;transform:none;left:auto;top:auto}
.mini .ball{animation:none!important}
.rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber2);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tg{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:18px;border:1.5px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;color:var(--mut);transition:all .2s}
.tg svg{width:34px;height:34px}
.tg span{font-size:13px;font-weight:600;text-align:center;line-height:1.15}
.tg.on{border-color:var(--green);background:rgba(62,224,138,.10);color:#9ff5c6;box-shadow:0 0 18px rgba(62,224,138,.25)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);font-size:15px;font-weight:600;cursor:pointer;color:var(--mut)}
.chip.on{border-color:var(--cyan);color:#bfe9ff;background:rgba(79,195,255,.12)}
.go{display:flex;gap:16px;justify-content:center;margin-top:20px}
.round{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:2px solid var(--line2);background:transparent}
.round svg{width:34px;height:34px}
.round.yes{border:none;background:linear-gradient(180deg,#f0c67e,#d39a45);color:#1A1A2E;box-shadow:0 0 0 4px rgba(243,194,122,.25),0 10px 30px rgba(232,162,74,.4)}
.round.no{border-color:var(--red);color:var(--red)}
.round.call{border:none;background:#16c26a;color:#fff;box-shadow:0 0 0 6px rgba(22,194,106,.25)}
.round.end{border:none;background:#e0182d;color:#fff;box-shadow:0 0 0 6px rgba(224,24,45,.25)}
.code{font-family:var(--mono);font-size:52px;font-weight:600;letter-spacing:.16em;text-align:center;color:var(--amber2);text-shadow:0 0 22px rgba(232,162,74,.45);margin:8px 0 10px}
.timer{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}.timer i{display:block;height:100%;background:var(--amber);transition:width 1s linear}
input{width:100%;font:inherit;font-size:18px;color:var(--ink);background:#0a101e;border:1px solid var(--line2);border-radius:14px;padding:14px;min-height:54px}
input:focus{outline:none;border-color:rgba(167,139,250,.7);box-shadow:0 0 0 3px rgba(167,139,250,.18)}
.codein{font-family:var(--mono);font-size:40px;letter-spacing:.3em;text-align:center;padding:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.pad button{height:62px;border-radius:18px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-family:var(--mono);font-size:24px;cursor:pointer;display:grid;place-items:center}
.pad svg{width:24px;height:24px}
.field{display:flex;align-items:center;gap:10px;margin-top:10px}.field>svg{width:22px;height:22px;color:#8fd8ee;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st{border-radius:18px;border:1px solid var(--line);padding:12px 6px;text-align:center;background:rgba(255,255,255,.02);color:inherit;text-decoration:none}
.st svg{width:28px;height:28px;color:#8fd8ee}.st b{display:block;font-size:15px;margin-top:6px}.st.bad svg,.st.bad b{color:#ff7b7b}.st.warn svg,.st.warn b{color:var(--amber2)}.st.ok svg{color:#9ff5c6}
.evl{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ev{display:flex;align-items:center;gap:12px}.ev svg{width:24px;height:24px;flex:none;color:#8fd8ee}.ev.l3 svg{color:#ff7b7b}.ev.l2 svg{color:var(--amber2)}
.ev .t{font-family:var(--serif);font-size:19px;line-height:1.1}.ev .w{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.06em}
/* the daily question: fades in, fades out once answered */
#ask{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:12;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s,transform .8s;width:min(92vw,420px);
  background:rgba(6,12,22,.86);border:1px solid rgba(79,195,255,.25);border-radius:28px;padding:20px 14px 22px;backdrop-filter:blur(8px)}
#ask.in{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
#ask .q{font-family:var(--serif);font-size:34px;color:var(--amber2);margin-bottom:16px}
#ask .faces{display:flex;justify-content:center;gap:16px}
#ask .faces button{width:96px;height:96px;border-radius:50%;border:2px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center}
#ask .faces svg{width:62px;height:62px}
#ask .faces .good{border-color:rgba(62,224,138,.7);color:#8ff0bd}#ask .faces .okay{border-color:rgba(243,194,122,.7);color:var(--amber2)}#ask .faces .low{border-color:rgba(255,42,42,.7);color:#ff7b7b}
/* calls */
#call{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#call video.remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#call video.local{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));width:28vw;max-width:140px;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:2px solid rgba(79,195,255,.6)}
#call .bar{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;gap:30px}
#call .who{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px}
#call .who .mini{--d:150px}
#call .who .nm3{font-family:var(--serif);font-size:34px;color:#9fdcff}
#call .ringing .ball{animation:pulse 1.2s ease-in-out infinite!important}
/* urgent: the whole screen until someone answers */
#urgent{position:fixed;inset:0;z-index:50;background:radial-gradient(700px 500px at 50% 40%,#3a0610,#140207 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;border:4px solid var(--red)}
#urgent .mini{--d:140px}#urgent .mini .ball{box-shadow:0 0 0 4px var(--red),0 0 40px rgba(255,42,42,.6)}
#urgent h1{font-family:var(--serif);font-weight:400;font-size:38px;margin:0;color:#ffd0d0}
#urgent .big svg{width:44px;height:44px;color:#ffb3b3}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:rgba(16,24,40,.95);border:1px solid var(--line2);padding:12px 18px;border-radius:999px;max-width:92vw;opacity:0;transition:all .3s;z-index:60;display:flex;align-items:center;gap:10px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}.toast svg{width:22px;height:22px;color:#9ff5c6}
/* first run */
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:radial-gradient(70vmin 60vmin at 50% 40%,rgba(22,96,128,.42),transparent 75%),var(--bg)}
#start .wm{font-family:var(--serif);font-style:italic;font-size:48px}#start .wm b{font-family:var(--mono);font-style:normal;font-weight:400;font-size:16px;letter-spacing:.24em;color:var(--mut);display:block;text-align:center}
.pick{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.pick button{display:flex;flex-direction:column;align-items:center;gap:14px;background:none;border:0;cursor:pointer}
.pick .ball{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.28),rgba(79,195,255,.14) 30%,#0a2236 70%,#050f1a);box-shadow:0 0 0 3px var(--ring),0 0 0 14px rgba(29,143,214,.15),0 0 50px rgba(47,211,232,.35)}
.pick .ball svg{width:62px;height:62px;color:#bfe9ff}
.pick .home .ball{box-shadow:0 0 0 3px var(--ring),0 0 0 9px rgba(29,143,214,.2),0 0 0 15px rgba(197,165,90,.45),0 0 50px rgba(47,211,232,.35)}
.pick span{font-size:17px;font-weight:600;max-width:150px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <svg class="link" id="links"></svg>
  <div class="top"><div class="wm"><b>REMIEL</b>Covara</div><div class="sp"></div><button class="ib lng" data-act="lang" id="lngBtn" aria-label="Language"></button></div>
  <div id="dream" aria-live="polite"></div>
  <div id="orbit"></div>
  <button id="help" class="hide" aria-label="Help: hold for 2 seconds"><span class="fill"></span>HELP</button>
  <div id="ask" role="dialog" aria-modal="false"></div>
</div>
<div id="start" class="hide"></div>
<div id="pop"></div>
<div id="call" class="hide"></div>
<div id="urgent" class="hide"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* Remiel: Covara. The person looked after (Home) is the sphere in the middle, on every phone: on Home's own phone, and on each
   caregiver's (Away) phone. Around Home orbit the people in Home's circle. What Home needs to do fades in on the left and
   fades out once done. Pictures carry the meaning: a sphere is a person, an icon is a task, a face is an answer. */
const BUILD='2026-10-19.02';
const API=(window.COVARA_API||'https://remiel-sentinel-api.vercel.app').replace(/\/$/,'');
const $=s=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){ try{ const v=localStorage.getItem('cv:'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('cv:'+k, JSON.stringify(v)); }catch(e){} }};

/* ---------- icons ---------- */
const P='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';

/* ---------- account: a device account on the Sentinel server, with a Sentinel ID for calls ---------- */
const ACC={at:store.get('at',null), rt:store.get('rt',null), uid:store.get('uid',null)};
function rnd(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function mySid(){ let s=store.get('sid',null); if(!/^[A-Z0-9]{8}$/.test(s||'')){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', b=new Uint8Array(8); crypto.getRandomValues(b); s=[...b].map(x=>A[x%A.length]).join(''); store.set('sid',s); } return s; }
async function identity(){ const name=store.get('name',''); if(!name) return false;
  let did=store.get('did',null), sec=store.get('sec',null); if(!did){ did='cv-'+rnd(12); store.set('did',did); } if(!sec){ sec=rnd(32); store.set('sec',sec); }
  const r=await fetch(API+'/auth/device',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_id:did, device_secret:sec, display_name:name, sentinel_id:mySid()})});
  if(!r.ok) return false; const j=await r.json(); ACC.at=j.access_token; ACC.rt=j.refresh_token; ACC.uid=j.user_id; store.set('at',ACC.at); store.set('rt',ACC.rt); store.set('uid',ACC.uid);
  if(j.user && j.user.sentinel_id && j.user.sentinel_id!==mySid()) store.set('sid', j.user.sentinel_id);
  return true; }
async function refresh(){ if(!ACC.rt) return false; try{ const r=await fetch(API+'/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:ACC.rt})});
  if(!r.ok) return false; const j=await r.json(); ACC.at=j.access_token; if(j.refresh_token) ACC.rt=j.refresh_token; store.set('at',ACC.at); store.set('rt',ACC.rt); return true; }catch(e){ return false; } }
async function api(method, path, body, raw){ if(!ACC.at && !(await identity())) throw new Error('offline');
  const go=()=>fetch(API+path,{method, headers:Object.assign({'Authorization':'Bearer '+ACC.at}, body&&!raw?{'Content-Type':'application/json'}:{}), body:body?(raw?body:JSON.stringify(body)):undefined});
  let r=await go(); if(r.status===401 && ((await refresh()) || (await identity()))) r=await go();
  let j=null; try{ j=await r.json(); }catch(e){} return {s:r.status, j:j||{}}; }

let toastT; function toast(m, icon){ const t=$('#toast'); t.innerHTML=(icon?ic(icon):'')+'<span>'+esc(m)+'</span>'; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 2600); }

/* ---------- who is where ---------- */
const S={role:store.get('role',null), links:{as_home:[],as_away:[]}, today:null, me:{}, sums:{}, cur:store.get('cur',null), open:null, pop:null};
const meP=()=>({name:store.get('name',''), sphere:S.me.sphere||'', vid:S.me.vid, local:S.localSphere||''});
const aways=()=>S.links.as_home.map(l=>({id:l.away.id, p:l.away, l, pending:l.status==='pending'}));
const homes=()=>S.links.as_away.map(l=>({id:l.home.id, p:l.home, l, pending:l.status==='pending'}));
// The sphere in the middle is always Home: me on Home's phone, the person I look after on a caregiver's phone.
function centre(){ if(S.role==='home') return {id:'me', p:meP(), me:true};
  const hs=homes().filter(h=>!h.pending); const c=hs.find(h=>h.id===S.cur)||hs[0]; if(c){ S.cur=c.id; store.set('cur',c.id); return c; } return {id:'me', p:meP(), me:true}; }
// Round Home: the caregivers on Home's phone; on a caregiver's phone, me and anyone else I look after.
function orbiters(){ if(S.role==='home') return aways(); const c=centre(); const me={id:'me', p:meP(), me:true};
  return c.me ? homes() : [me, ...homes().filter(h=>h.id!==c.id)]; }
const findP=id=>{ if(id==='me') return {id:'me', p:meP(), me:true}; return [...aways(), ...homes()].find(o=>o.id===id); };

/* ---------- spheres ---------- */
function media(p){ const u=(p && p.local) || (p && p.sphere ? API+p.sphere : '');
  let inner; if(u && p.vid) inner='<video src="'+esc(u)+'" autoplay muted loop playsinline></video>'; else if(u) inner='<img src="'+esc(u)+'" alt="">'; else inner='<span class="ini">'+esc(initials(p && p.name))+'</span>';
  return '<div class="in">'+inner+'</div>'; }
function sphereHTML(id, d, x, y, cls, inner, tag, badge, nm){ return '<div class="sph '+(cls||'')+'" style="--d:'+d+'px;left:'+x+'px;top:'+y+'px" data-act="sph" data-k="'+esc(id||'')+'">'+
  (tag?'<div class="tag">'+esc(tag)+'</div>':'')+'<div class="ball">'+inner+(badge||'')+'</div>'+(nm!=null?'<div class="nm">'+esc(nm)+'</div>':'')+'</div>'; }
let LAY={at:{}};
// Home in the middle, a little low so what needs doing has room above on the left; the people round Home
// on the sides first, then below, then above, never over Home's sphere or its name.
const ANG=[-28,28,152,208,90,-90,-62,242];
function layout(n){ const W=innerWidth, H=innerHeight, narrow=W<700;
  const dMe=Math.min(W*0.36,H*0.2,190), dO=Math.min(W*0.2,H*0.1,112), cx=W*(narrow?0.5:0.55), cy=H*(narrow?0.56:0.5);
  const R=Math.max(dMe/2+dO/2+46, Math.min(W,H)*0.26);
  const pos=[]; for(let i=0;i<n;i++){ const a=ANG[i%ANG.length]*Math.PI/180, rr=R*(i>=ANG.length?1.5:1); let x=cx+rr*Math.cos(a)*(narrow?1:1.15), y=cy+rr*Math.sin(a)*(Math.abs(Math.sin(a))>0.9?1.05:1);
    x=Math.max(dO/2+8, Math.min(W-dO/2-8, x)); pos.push([x,y]); }
  return {cx,cy,dMe,dO,pos,at:{}}; }
// What a caregiver needs to know at a glance, as one badge on Home's sphere.
function badgeFor(id){ if(S.role!=='away') return ''; const s=S.sums[id]; if(!s) return '';
  const recent=(s.events||[]).find(e=>e.level>=3 && Date.now()-e.at<6*3600000); if(recent) return '<div class="badge">'+ic(EV_I[recent.kind]||'alert')+'</div>';
  if(s.today && s.today.items.some(x=>x.state==='late')) return '<div class="badge warn">'+ic('pill')+'</div>';
  if(s.mood && s.mood.mood==='low' && Date.now()-s.mood.at<12*3600000) return '<div class="badge warn">'+ic('sad')+'</div>';
  if(s.activity && s.activity.battery!=null && s.activity.battery<15 && !s.activity.charging) return '<div class="badge warn">'+ic('battery')+'</div>';
  return ''; }
function renderStage(){ const c=centre(), os=orbiters(), L=layout(os.length+1); LAY=L; let h='';
  h+=sphereHTML(c.id, L.dMe, L.cx, L.cy, 'mid', media(c.p), '', c.me?'':badgeFor(c.id), c.me?c.p.name:c.p.name); L.at[c.id]=[L.cx,L.cy,L.dMe];
  os.forEach((o,i)=>{ const [x,y]=L.pos[i]; L.at[o.id]=[x,y,L.dO];
    const tag=o.pending?(S.role==='home'?T('ASKS TO HELP'):T('WAITING')):o.me?T('ME'):(o.l&&o.l.relation?T(o.l.relation).toUpperCase():'');
    h+=sphereHTML(o.id, L.dO, x, y, (o.pending?'ask ':'')+(o.me?'mine':''), media(o.p), tag, o.me?'':badgeFor(o.id), first(o.p.name)); });
  const [ax,ay]=L.pos[os.length]; h+=sphereHTML('add', L.dO*0.78, ax, ay, 'add', ic('plus'), '', '', '');
  $('#orbit').innerHTML=h;
  $('#links').innerHTML=os.map((o,i)=>'<line x1="'+L.cx+'" y1="'+L.cy+'" x2="'+L.pos[i][0]+'" y2="'+L.pos[i][1]+'" stroke="'+(o.pending?'rgba(232,162,74,.4)':'rgba(79,195,255,.25)')+'" stroke-width="1.2"/>').join('');
  $('#help').classList.toggle('hide', S.role!=='home');
  $('#lngBtn').textContent=LANG.toUpperCase();
  if(S.open && L.at[S.open]) openActions(S.open, true); }

/* the quick actions round a sphere: video, call, email, and what they see (Home) or the day (caregiver) */
function openActions(id, keep){ closeActions(); const o=findP(id), at=LAY.at[id]; if(!o || !at) return;
  if(o.me) return profilePop();
  if(o.pending){ if(S.role==='home') return consentPop(o.l); return toast(T('WAITING'),'key'); }
  if(S.role==='away' && id!==centre().id){ S.cur=id; store.set('cur',id); S.open=null; renderStage(); renderDream(); return; }
  S.open=id; const [x,y,d]=at, mid=id===centre().id, r=d*0.5+(mid?62:52);
  const acts=[['video','Video',''],['phone','Call','g'],['mail','Email','']]; acts.push(S.role==='home'?['eye','Sees','a']:['info','Open','a']);
  const base=mid?Math.PI/2:Math.atan2(y-LAY.cy, x-LAY.cx), spread=mid?Math.PI*1.1:Math.PI*0.95;
  const html=acts.map((a,k)=>{ const ang=base-spread/2+spread*k/(acts.length-1), qx=Math.max(34,Math.min(innerWidth-34,x+r*Math.cos(ang))), qy=Math.max(90,Math.min(innerHeight-60,y+r*Math.sin(ang)));
    return '<button class="qa '+a[2]+'" style="left:'+qx+'px;top:'+qy+'px" data-act="qa" data-q="'+a[0]+'" data-k="'+esc(id)+'" aria-label="'+T(a[1])+'">'+ic(a[0])+'<i>'+T(a[1])+'</i></button>'; }).join('');
  const box=document.createElement('div'); box.id='qas'; box.innerHTML=html; $('#stage').appendChild(box);
  requestAnimationFrame(()=>box.querySelectorAll('.qa').forEach((q,k)=>setTimeout(()=>q.classList.add('on'), keep?0:k*45))); }
function closeActions(){ const b=$('#qas'); if(b) b.remove(); }

/* ---------- the dream column: what Home needs to do, fading in one by one, fading out once done ---------- */
function dreamItems(){ const out=[], c=centre(); const day=S.role==='home'?S.today:(S.sums[c.id]||{}).today;
  if(S.role==='away' && !c.me){ const s=S.sums[c.id]||{}; const seen=store.get('seenAt',0); (s.events||[]).filter(e=>e.level>=2 && e.at>seen && Date.now()-e.at<6*3600000).slice(0,2).forEach(e=>out.push({key:'e'+e.id, icon:EV_I[e.kind]||'alert', t:evTitle(e.kind,c.p.name,e.title), w:hhmm(e.at), cls:e.level>=3?'late':'due', ev:true, open:c.id})); }
  if(day){ const open=day.items.filter(x=>x.state!=='done'); const shown=open.filter(x=>x.state!=='later').concat(open.filter(x=>x.state==='later').slice(0,1)).slice(0,5);
    shown.forEach(x=>out.push({key:x.item.id+'|'+x.slot, icon:x.item.kind==='med'?'pill':x.item.kind==='appt'?'cal':'check', t:x.item.title, w:x.slot==='appt'?hhmm(x.at):x.slot, cls:x.state==='late'?'late':x.state==='due'?'due':'',
      mark:S.role==='home'?{id:x.item.id, slot:x.slot}:null, open:S.role==='away'?c.id:null})); }
  return out.slice(0,6); }
function renderDream(){ const box=$('#dream'), want=dreamItems(), keys=new Set(want.map(x=>x.key));
  [...box.children].forEach(el=>{ if(!keys.has(el.dataset.key) && !el.classList.contains('out')){ el.classList.add('out'); el.classList.remove('in'); setTimeout(()=>el.remove(), 700); } });
  want.forEach((x,i)=>{ let el=[...box.children].find(c=>c.dataset.key===x.key && !c.classList.contains('out'));
    const html='<div class="ic">'+ic(x.icon)+'</div><div class="tx"><div class="t">'+esc(x.t)+'</div><div class="w">'+esc(x.w)+(x.ev?'':x.cls==='late'?' · '+T('Late'):x.cls==='due'?' · '+T('Now'):'')+'</div></div>';
    if(!el){ el=document.createElement('div'); el.dataset.key=x.key; el.dataset.act='dream'; box.appendChild(el); el.className='dt '+(x.cls||''); setTimeout(()=>el.classList.add('in'), 150+i*280); }
    else el.className='dt '+(x.cls||'')+' in';
    el.innerHTML=html; el._x=x; }); }

/* ---------- the daily question ---------- */
function maybeAsk(){ if(S.role!=='home' || S.pop) return; const day=new Date().toDateString(); if(store.get('asked','')===day) return; const a=$('#ask'); if(a.classList.contains('in')) return;
  a.innerHTML='<div class="q">'+T('How are you?')+'</div><div class="faces"><button class="good" data-act="mood" data-k="good" aria-label="Good">'+ic('smile')+'</button><button class="okay" data-act="mood" data-k="okay" aria-label="Okay">'+ic('meh')+'</button><button class="low" data-act="mood" data-k="low" aria-label="Not good">'+ic('sad')+'</button></div>';
  setTimeout(()=>a.classList.add('in'), 900); }

function unpop(){ const v=$('#pop'); const f=v.firstChild; S.pop=null; if(!f) return; f.classList.remove('in'); setTimeout(()=>{ if(!S.pop) v.innerHTML=''; }, 300); }
const xBtn='<button class="x" data-act="unpop" aria-label="Close">'+ic('x')+'</button>';
const mini=(p, extra)=>'<div class="sph mini '+(extra||'')+'"><div class="ball">'+media(p)+'</div></div>';

const SHARES=[['location','pin','Where'],['rooms','door','Room'],['falls','fall','Fall'],['care','pill','Medicine'],['mood','smile','Mood'],['activity','still','Still phone']];
const RELS=['Son','Daughter','Partner','Family','Friend','Nurse','Doctor','Neighbour'];
// Home taps a caregiver's sphere: who they are, what they may see, and how they are related. Confirming links the two.
function consentPop(l){ S.ask={l, share:Object.assign({}, l.status==='pending'?{falls:1, care:1, activity:1}:l.share), rel:l.relation||''};
  const a=l.away; let h='<div class="hd">'+mini(a)+'<div class="who">'+esc(a.name)+(a.role?'<div class="rl">'+esc(a.role)+'</div>':'')+'</div>'+xBtn+'</div>';
  h+='<div class="grid">'+SHARES.map(([k,i,w])=>'<button class="tg'+(S.ask.share[k]?' on':'')+'" data-act="share" data-k="'+k+'" aria-pressed="'+(S.ask.share[k]?'true':'false')+'">'+ic(i)+'<span>'+T(w)+'</span></button>').join('')+'</div>';
  h+='<div class="chips" style="margin-top:14px" id="rel">'+RELS.map(r=>'<button class="chip'+(S.ask.rel===r?' on':'')+'" data-act="rel" data-k="'+r+'">'+T(r)+'</button>').join('')+'</div>';
  h+='<div class="go">'+'<button class="round no" data-act="link-end" data-k="'+esc(l.id)+'" aria-label="'+(l.status==='pending'?'No':'Remove')+'">'+ic('x')+'</button><button class="round yes" data-act="consent-save" aria-label="Yes">'+ic('check')+'</button></div>';
  pop(h); }

// My own sphere: my picture or short video, how I am reached, and what I do.
function profilePop(){ const me=S.me||{};
  let h='<div class="hd"><label style="cursor:pointer;position:relative">'+mini(meP())+'<span style="position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:#0b1424;border:1.5px solid rgba(79,195,255,.7);display:grid;place-items:center;color:#bfe9ff">'+ic('camera','width:16px;height:16px')+'</span><input type="file" accept="image/*,video/*" id="pick" class="hide"></label><div class="who">'+esc(store.get('name',''))+'</div>'+xBtn+'</div>';
  h+='<div class="field">'+ic('phone')+'<input id="mePh" inputmode="tel" placeholder="'+T('Phone')+'" value="'+esc(me.phone||'')+'"></div>';
  h+='<div class="field">'+ic('mail')+'<input id="meEm" inputmode="email" placeholder="'+T('Email')+'" value="'+esc(me.email||'')+'"></div>';
  if(S.role==='away') h+='<div class="field">'+ic('heart')+'<input id="meRo" placeholder="'+T('What I do')+'" value="'+esc(me.role||'')+'"></div>';
  h+='<div class="go"><button class="round yes" data-act="me-save" aria-label="Save">'+ic('check')+'</button></div>';
  h+='<div style="display:flex;justify-content:center;margin-top:18px"><button class="chip" data-act="role-reset">'+ic('swap','width:16px;height:16px;vertical-align:-3px;margin-right:6px')+(S.role==='home'?T('I look after someone'):T('I am looked after'))+'</button></div>';
  h+='<div style="text-align:center;margin-top:12px;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.08em">Beverly Index LLC · Remiel: Covara · '+BUILD+'</div>';
  pop(h); const pk=$('#pick'); if(pk) pk.addEventListener('change',()=>{ const f=pk.files&&pk.files[0]; if(f) setSphere(f); }); }

// Adding someone: Home shows a six-digit code, large, counting down; a caregiver types it on a big pad.
async function addPop(){ if(S.role==='home'){ const r=await api('POST','/care/code').catch(()=>null); if(!r||r.s!==201) return toast(T('Not connected'),'alert');
    const exp=r.j.expires_at; pop('<div class="hd"><div class="who" style="color:var(--amber2)">'+ic('key','width:30px;height:30px')+'</div>'+xBtn+'</div><div class="code">'+esc(r.j.code.replace(/(\d{3})(\d{3})/,'$1 $2'))+'</div><div class="timer"><i id="tmr" style="width:100%"></i></div>');
    const tick=()=>{ const t=$('#tmr'); if(!t) return; t.style.width=Math.max(0,(exp-Date.now())/(15*60000)*100)+'%'; setTimeout(tick,1000); }; tick(); return; }
  pop('<div class="hd"><div class="who" style="color:var(--amber2)">'+ic('key','width:30px;height:30px')+'</div>'+xBtn+'</div><input id="cd" class="codein" inputmode="numeric" maxlength="6" readonly placeholder="······"><div class="pad">'+
    [1,2,3,4,5,6,7,8,9,'x',0,'ok'].map(k=>'<button data-act="pad" data-k="'+k+'"'+(k==='ok'?' style="background:linear-gradient(180deg,#f0c67e,#d39a45);color:#1A1A2E;border:none"':'')+'>'+(k==='x'?ic('back'):k==='ok'?ic('check'):k)+'</button>').join('')+'</div>'); }

// A caregiver opens Home: the day in pictures.
function personPop(id){ const o=findP(id); const s=S.sums[id]; if(!o) return;
  let h='<div class="hd">'+mini(o.p)+'<div class="who">'+esc(o.p.name)+'<div class="rl" style="color:var(--mut)">'+(s&&s.seen_at?ago(s.seen_at):'')+'</div></div>'+xBtn+'</div>';
  if(s){ const tiles=[];
    if(s.activity){ const m=s.activity.moved_at; tiles.push(['still', ago(m), m&&Date.now()-m>3*3600000?'warn':'ok']); const b=s.activity.battery; tiles.push(['battery', b==null?'…':b+'%'+(s.activity.charging?' ⚡':''), b!=null&&b<15?'bad':'ok']); }
    if(s.mood!==undefined){ const md=s.mood&&s.mood.mood; tiles.push([md==='low'?'sad':md==='okay'?'meh':'smile', md?ago(s.mood.at):'…', md==='low'?'bad':md==='okay'?'warn':'ok']); }
    if(s.room!==undefined) tiles.push(['door', s.room?s.room.room:'…', 'ok']);
    if(s.location!==undefined) tiles.push(['pin', s.location?(s.place||ago(s.location.at)):'…', 'ok', s.location]);
    if(s.today){ const late=s.today.items.filter(x=>x.state==='late').length, done=s.today.items.filter(x=>x.state==='done').length; tiles.push(['pill', done+'/'+s.today.items.length, late?'bad':'ok']); }
    h+='<div class="stats">'+tiles.map(t=>t[3]?'<a class="st '+t[2]+'" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+t[3].lat+'&mlon='+t[3].lon+'#map=17/'+t[3].lat+'/'+t[3].lon+'">'+ic(t[0])+'<b>'+esc(t[1])+'</b></a>':'<div class="st '+t[2]+'">'+ic(t[0])+'<b>'+esc(t[1])+'</b></div>').join('')+'</div>';
    if((s.events||[]).length) h+='<div class="evl">'+s.events.slice(0,6).map(e=>'<div class="ev l'+e.level+'">'+ic(EV_I[e.kind]||'alert')+'<div><div class="t">'+esc(evTitle(e.kind,o.p.name,e.title))+'</div><div class="w">'+esc(hhmm(e.at))+' · '+esc(ago(e.at))+'</div></div></div>').join('')+'</div>';
    if(s.today){ h+='<div class="evl">'+s.today.items.map(x=>'<div class="ev '+(x.state==='late'?'l3':x.state==='due'?'l2':'')+'">'+ic(x.state==='done'?'check':x.item.kind==='med'?'pill':'cal')+'<div><div class="t">'+esc(x.item.title)+'</div><div class="w">'+esc(x.slot==='appt'?hhmm(x.at):x.slot)+'</div></div></div>').join('')+'</div>';
      h+='<div class="field" style="margin-top:16px">'+ic('pill')+'<input id="itT" placeholder="'+T('Medicine')+'"></div><div class="field">'+ic('cal')+'<input id="itH" placeholder="08:00, 20:00" inputmode="numeric"></div><div class="go"><button class="round yes" data-act="item-add" data-k="'+esc(id)+'" aria-label="Add">'+ic('plus')+'</button></div>'; } }
  pop(h); }

/* ---------- my sphere picture or video ---------- */
async function setSphere(f){ const isV=/^video\//.test(f.type); let blob=f;
  if(!isV) blob=await shrink(f, 640);
  if(blob.size>3.9*1024*1024) return toast('4 MB','alert');
  S.localSphere=URL.createObjectURL(blob); S.me.vid=isV; store.set('meVid',isV); renderStage(); profilePop();
  const fd=new FormData(); fd.append('blob_type','avatar'); fd.append('file', blob, isV?'sphere.mp4':'sphere.jpg');
  const r=await api('POST','/storage/upload', fd, true).catch(()=>null);
  if(r && r.s===201){ const m=await api('PUT','/care/me',{sphere:r.j.id}); if(m.s===200){ S.me.sphere=m.j.sphere; toast(T('Saved'),'check'); } } else toast(T('Not connected'),'alert'); }
function shrink(f, max){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b||f),'image/jpeg',0.85); }; img.onerror=()=>res(f); img.src=URL.createObjectURL(f); }); }

/* ---------- Help: hold two seconds, so it is never sent by accident ---------- */
function bindHelp(){ const b=$('#help'), f=b.querySelector('.fill'); let t0=0, raf=0;
  const stop=()=>{ cancelAnimationFrame(raf); t0=0; f.style.width='0'; };
  const step=()=>{ const p=Math.min(1,(performance.now()-t0)/2000); f.style.width=(p*100)+'%'; if(p>=1){ stop(); sendHelp(); return; } raf=requestAnimationFrame(step); };
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); t0=performance.now(); try{ navigator.vibrate&&navigator.vibrate(30); }catch(x){} raf=requestAnimationFrame(step); });
  ['pointerup','pointerleave','pointercancel'].forEach(k=>b.addEventListener(k,stop)); }
async function sendHelp(){ try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){}
  const r=await api('POST','/care/events',{kind:'help', client_ref:'help-'+Date.now()}).catch(()=>null);
  toast(r && r.s<300 ? T('Help sent') : T('Not connected'), r && r.s<300 ? 'check' : 'alert');
  if(S.links.as_home.some(l=>l.status==='active' && l.share.location)){ const p=await herePos(); if(p) api('POST','/location',{latitude:p.lat, longitude:p.lon, accuracy:p.acc}).catch(()=>null); } }

/* ---------- Home's phone reports: movement, battery, place ---------- */
const MOVE={last:0};
function watchMotion(){ let prev=null;
  window.addEventListener('devicemotion',e=>{ const a=e.accelerationIncludingGravity; if(!a||a.x==null) return; const v=[a.x,a.y,a.z];
    if(prev){ const d=Math.abs(v[0]-prev[0])+Math.abs(v[1]-prev[1])+Math.abs(v[2]-prev[2]); if(d>1.2) MOVE.last=Date.now(); } prev=v; });
  ['pointerdown','keydown','touchstart'].forEach(k=>window.addEventListener(k,()=>{ MOVE.last=Date.now(); },{passive:true})); }
function herePos(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy}), ()=>res(null), {enableHighAccuracy:true, timeout:8000, maximumAge:60000}); }); }
async function report(){ if(S.role!=='home' || !store.get('name','')) return; const b={tz:Intl.DateTimeFormat().resolvedOptions().timeZone};
  if(MOVE.last) b.moved_at=MOVE.last;
  try{ if(navigator.getBattery){ const bt=await navigator.getBattery(); b.battery=Math.round(bt.level*100); b.charging=bt.charging; } }catch(e){}
  await api('POST','/care/state',b).catch(()=>null);
  if(S.links.as_home.some(l=>l.status==='active' && l.share.location)){ const p=await herePos(); if(p) await api('POST','/location',{latitude:p.lat, longitude:p.lon, accuracy:p.acc, continuous:true}).catch(()=>null); } }

/* ---------- data ---------- */
async function load(){ if(!S.role || !store.get('name','')) return; try{
  const r=await api('GET','/care/links'); if(r.s===200) S.links=r.j;
  const m=await api('GET','/care/me'); if(m.s===200) S.me=Object.assign({vid:store.get('meVid',false)}, m.j);
  if(S.role==='home'){ const t=await api('GET','/care/today'); if(t.s===200) S.today=t.j; }
  if(S.role==='away') for(const o of homes().filter(o=>!o.pending)){ const s=await api('GET','/care/summary?home='+encodeURIComponent(o.id)); if(s.s===200) S.sums[o.id]=s.j; }
  await alarmsPoll(); }catch(e){}
  renderStage(); renderDream(); maybeAsk(); peerStart(); }

/* ---------- alarms: an urgent one takes the whole screen until someone answers ---------- */
async function alarmsPoll(){ if(S.role!=='away') return; const r=await api('GET','/alarms?state=open').catch(()=>null); if(!r||r.s!==200) return;
  const a=(r.j.alarms||[]).filter(x=>/^care-/.test(x.kind) && x.owner_id===ACC.uid).sort((x,y)=>y.level-x.level)[0];
  const box=$('#urgent'); if(!a || a.level<3){ box.classList.add('hide'); box.innerHTML=''; return; }
  const o=findP(a.member_ref); const p=o?o.p:{name:a.member_name||a.raised_by_name};
  box.innerHTML=mini(p)+'<div class="big">'+ic(EV_I[String(a.kind).replace('care-','')]||'alert')+'</div><h1>'+esc(evTitle(a.kind, p.name, a.title))+'</h1><div style="font-family:var(--mono);color:#ffb3b3;letter-spacing:.1em">'+esc(hhmm(a.created_at))+'</div>'+
    '<div class="go"><button class="round call" data-act="qa" data-q="video" data-k="'+esc(a.member_ref||'')+'" aria-label="Video">'+ic('video')+'</button><button class="round call" data-act="qa" data-q="phone" data-k="'+esc(a.member_ref||'')+'" aria-label="Call">'+ic('phone')+'</button><button class="round yes" data-act="ack" data-k="'+a.id+'" aria-label="Seen">'+ic('check')+'</button></div>';
  box.classList.remove('hide'); try{ navigator.vibrate&&navigator.vibrate([400,200,400,200,400]); }catch(e){} }

/* ---------- video calls: Sentinel Call's servers and Sentinel IDs ---------- */
const CALL={peer:null, cfg:null, cur:null, stream:null, tries:0, timer:0};
function loadPeer(){ return window.Peer ? Promise.resolve() : new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js'; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function peerStart(){ if(CALL.peer || CALL.starting || !store.get('name','')) return; CALL.starting=true;
  try{ await loadPeer(); const r=await fetch(API+'/call/config'); CALL.cfg=await r.json();
    const o={debug:0, config:{iceServers:CALL.cfg.ice||[]}}; if(CALL.cfg.peer) Object.assign(o,{host:CALL.cfg.peer.host, port:CALL.cfg.peer.port, path:CALL.cfg.peer.path, secure:CALL.cfg.peer.secure, key:'remiel'});
    const p=new Peer(mySid(), o); p.on('call', incoming); p.on('error',()=>{}); p.on('disconnected',()=>{ try{ p.reconnect(); }catch(e){} }); CALL.peer=p; }catch(e){} CALL.starting=false; }
function cam(){ return navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:true}); }
function callScreen(p, state){ const c=$('#call'); c.classList.remove('hide');
  c.innerHTML='<video class="remote" autoplay playsinline></video><video class="local" autoplay playsinline muted></video><div class="who">'+mini(p, state!=='in'?'ringing':'ringing')+'<div class="nm3">'+esc(p.name||'')+'</div><div style="font-family:var(--mono);letter-spacing:.2em;color:var(--mut);font-size:12px">'+(state==='in'?T('is calling').toUpperCase():T('Calling').toUpperCase())+'</div></div>'+
    '<div class="bar">'+(state==='in'?'<button class="round end" data-act="hang" aria-label="Decline">'+ic('x')+'</button><button class="round call" data-act="answer" aria-label="Answer">'+ic('video')+'</button>':'<button class="round end" data-act="hang" aria-label="End">'+ic('phone')+'</button>')+'</div>';
  if(CALL.stream) c.querySelector('video.local').srcObject=CALL.stream; }
function attach(call){ CALL.cur=call; call.on('stream',st=>{ clearInterval(CALL.timer); const c=$('#call'); const v=c.querySelector('video.remote'); if(v) v.srcObject=st; const w=c.querySelector('.who'); if(w) w.classList.add('hide'); });
  call.on('close',hangUp); call.on('error',()=>{}); }
async function startCall(o){ if(!o.p.sentinel_id) return toast(T('No answer'),'alert'); await peerStart(); if(!CALL.peer) return toast(T('Not connected'),'alert');
  try{ CALL.stream=await cam(); }catch(e){ return toast(T('Not connected'),'alert'); }
  callScreen(o.p,'out'); api('POST','/call/ring',{to_sentinel_id:o.p.sentinel_id, app:'covara'}).catch(()=>{});
  CALL.tries=0; const dial=()=>{ if(CALL.cur && CALL.cur.open) return; CALL.tries++; if(CALL.tries>12){ api('POST','/call/ring',{to_sentinel_id:o.p.sentinel_id, state:'missed', app:'covara'}).catch(()=>{}); toast(T('No answer'),'phone'); return hangUp(); }
    try{ const c=CALL.peer.call(o.p.sentinel_id, CALL.stream, {metadata:{name:store.get('name',''), app:'covara'}}); if(c) attach(c); }catch(e){} };
  dial(); CALL.timer=setInterval(dial, 4000); }
function incoming(call){ if(CALL.cur && CALL.cur.open){ try{ call.close(); }catch(e){} return; } CALL.pending=call; const o=[...aways(),...homes()].find(x=>x.p.sentinel_id===call.peer); const p=o?o.p:{name:(call.metadata&&call.metadata.name)||''};
  callScreen(p,'in'); try{ navigator.vibrate&&navigator.vibrate([500,300,500,300,500]); }catch(e){} }
async function answer(){ const call=CALL.pending; if(!call) return; try{ CALL.stream=await cam(); }catch(e){ CALL.stream=null; }
  call.answer(CALL.stream||undefined); attach(call); const l=$('#call video.local'); if(l && CALL.stream) l.srcObject=CALL.stream; }
function hangUp(){ clearInterval(CALL.timer); try{ CALL.cur&&CALL.cur.close(); }catch(e){} try{ CALL.pending&&CALL.pending!==CALL.cur&&CALL.pending.close(); }catch(e){}
  CALL.cur=null; CALL.pending=null; if(CALL.stream){ CALL.stream.getTracks().forEach(t=>t.stop()); CALL.stream=null; } const c=$('#call'); c.classList.add('hide'); c.innerHTML=''; }

/* ---------- push ---------- */
const b64=s=>{ const p='='.repeat((4-s.length%4)%4), b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); };
async function pushOn(){ try{ if(!('Notification' in window) || Notification.permission==='denied') return; if(Notification.permission!=='granted' && (await Notification.requestPermission())!=='granted') return;
  const reg=await navigator.serviceWorker.ready; const k=await api('GET','/push/vapid-key'); if(k.s!==200) return;
  const sub=(await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(k.j.publicKey)}); const j=sub.toJSON();
  await api('POST','/push/subscribe',{endpoint:j.endpoint, keys:j.keys}); }catch(e){} }

/* ---------- first run: a name, then a picture of who I am here ---------- */
function startScreen(){ const s=$('#start'); if(store.get('name','') && S.role){ s.classList.add('hide'); return; } s.classList.remove('hide');
  if(!store.get('name','')) s.innerHTML='<div class="wm"><b>REMIEL</b>Covara</div><div style="width:min(86vw,360px)" class="field">'+ic('user')+'<input id="nm" autocomplete="given-name" maxlength="40" placeholder="'+T('Your first name')+'"></div><button class="round yes" data-act="name" aria-label="Continue">'+ic('check')+'</button>';
  else s.innerHTML='<div class="wm"><b>REMIEL</b>Covara</div><div class="pick"><button class="home" data-act="role" data-k="home"><div class="ball">'+ic('home')+'</div><span>'+T('I am looked after')+'</span></button><button data-act="role" data-k="away"><div class="ball">'+ic('heart')+'</div><span>'+T('I look after someone')+'</span></button></div>'; }

/* ---------- taps ---------- */
document.addEventListener('click', async e=>{ const el=e.target.closest('[data-act]'); if(!el){ S.open=null; closeActions(); return; } const k=el.dataset.k;
  switch(el.dataset.act){
    case 'lang': LANG=LANG==='en'?'it':'en'; store.set('lang',LANG); document.documentElement.lang=LANG; renderStage(); renderDream(); break;
    case 'name': { const v=($('#nm').value||'').trim(); if(!v) return $('#nm').focus(); store.set('name',v); identity(); startScreen(); break; }
    case 'role': S.role=k; store.set('role',k); startScreen(); load(); pushOn(); break;
    case 'role-reset': S.role=S.role==='home'?'away':'home'; store.set('role',S.role); unpop(); S.sums={}; load(); break;
    case 'sph': if(k==='add') return addPop(); if(S.open===k){ S.open=null; closeActions(); } else openActions(k); break;
    case 'qa': { const o=findP(k); if(!o) return; const q=el.dataset.q; S.open=null; closeActions();
      if(q==='video') return startCall(o);
      if(q==='phone'){ if(o.p.phone) location.href='tel:'+o.p.phone.replace(/[^\d+]/g,''); else startCall(o); return; }
      if(q==='mail'){ if(o.p.email) location.href='mailto:'+o.p.email; else toast(T('No email yet'),'mail'); return; }
      if(q==='eye') return consentPop(o.l);
      if(q==='info') return personPop(o.id); break; }
    case 'veil': if(e.target===el) unpop(); break;
    case 'unpop': unpop(); break;
    case 'share': { S.ask.share[k]=S.ask.share[k]?0:1; el.classList.toggle('on', !!S.ask.share[k]); el.setAttribute('aria-pressed', S.ask.share[k]?'true':'false'); break; }
    case 'rel': S.ask.rel=S.ask.rel===k?'':k; document.querySelectorAll('#rel .chip').forEach(c=>c.classList.toggle('on', c.dataset.k===S.ask.rel)); break;
    case 'consent-save': { const r=await api('PUT','/care/links/'+S.ask.l.id,{approve:true, share:S.ask.share, relation:S.ask.rel}); if(r.s===200){ unpop(); toast(T('Saved'),'check'); load(); } break; }
    case 'link-end': await api('DELETE','/care/links/'+k); unpop(); load(); break;
    case 'me-save': { const b={phone:($('#mePh')||{}).value||'', email:($('#meEm')||{}).value||''}; if($('#meRo')) b.role=$('#meRo').value; const r=await api('PUT','/care/me',b); if(r.s===200){ S.me=Object.assign(S.me,r.j); unpop(); toast(T('Saved'),'check'); } break; }
    case 'pad': { const i=$('#cd'); if(k==='x') i.value=i.value.slice(0,-1); else if(k==='ok'){ if(i.value.length!==6) return; const r=await api('POST','/care/claim',{code:i.value}); if(r.s<300){ unpop(); toast(T('Added'),'check'); load(); } else { i.value=''; toast(r.j.detail||T('Not connected'),'alert'); } } else if(i.value.length<6) i.value+=k; break; }
    case 'mood': { await api('POST','/care/state',{mood:k}).catch(()=>null); store.set('asked', new Date().toDateString()); $('#ask').classList.remove('in'); toast(T('Saved'), k==='low'?'heart':'check'); break; }
    case 'dream': { const x=el._x; if(!x) return; if(x.mark){ const r=await api('POST','/care/items/'+x.mark.id+'/mark',{slot:x.mark.slot}); if(r.s===200){ el.classList.add('done'); S.today=r.j; setTimeout(renderDream, 500); toast(T('Taken'),'check'); } } else if(x.open) personPop(x.open); break; }
    case 'item-add': { const t=($('#itT').value||'').trim(), times=($('#itH').value||'').split(/[ ,;]+/).map(x=>x.trim()).filter(Boolean).map(x=>/^\d:\d\d$/.test(x)?'0'+x:x); if(!t) return $('#itT').focus();
      const r=await api('POST','/care/items',{home:k, kind:'med', title:t, times}); if(r.s===201){ toast(T('Added'),'check'); await load(); personPop(k); } else toast(r.j.detail||'','alert'); break; }
    case 'ack': store.set('seenAt', Date.now()); await api('POST','/alarms/'+k+'/ack'); $('#urgent').classList.add('hide'); load(); break;
    case 'answer': answer(); break;
    case 'hang': hangUp(); break;
  } });
window.addEventListener('resize',()=>{ renderStage(); });

/* ---------- start ---------- */
document.documentElement.lang=LANG;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message',e=>{ if(e.data && (e.data.type==='PUSH_RECEIVED'||e.data.type==='NOTIFICATION_CLICK')) load(); });
watchMotion(); bindHelp(); startScreen(); renderStage(); load();
setInterval(load, 30000); setInterval(report, 120000); setTimeout(report, 4000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ MOVE.last=Date.now(); load(); report(); } });
if(/#call=/.test(location.hash)) peerStart();
</script>
