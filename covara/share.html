<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Remiel: Covara · Care sheet</title>
<link rel="icon" href="favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05070d; --card:#0c111c; --line:rgba(255,255,255,.1); --ink:#f0eef5; --dim:#9aa3b5; --gold:#C5A55A; --cyan:#38bdf8; --good:#22d3a6; --warn:#ffd24d; --bad:#ef4444;
    --f:'DM Sans','Hanken Grotesk',system-ui,-apple-system,sans-serif; --m:'JetBrains Mono',ui-monospace,monospace; }
  * { box-sizing:border-box }
  body { margin:0; background:radial-gradient(1200px 600px at 50% -200px,#0f1a2e,var(--bg)); background-color:var(--bg); color:var(--ink); font:16px/1.5 var(--f); padding:20px 16px 60px }
  main { max-width:760px; margin:0 auto }
  .brand { display:flex; align-items:center; gap:10px; font:700 11px var(--m); letter-spacing:.22em; color:var(--gold) }
  .brand img { width:28px; height:28px; border-radius:50% }
  h1 { font-weight:700; font-size:30px; margin:14px 0 2px }
  .sub { color:var(--dim); font-size:14px }
  .ro { display:inline-block; margin-top:8px; padding:3px 9px; border:1px solid var(--line); border-radius:20px; font:700 10.5px var(--m); letter-spacing:.14em; color:var(--cyan) }
  section { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px }
  h2 { margin:0 0 10px; font:700 11px var(--m); letter-spacing:.2em; color:var(--gold) }
  .alert { border-color:rgba(239,68,68,.6) } .alert h2 { color:#ff8a8a }
  dl { display:grid; grid-template-columns:minmax(110px,32%) 1fr; gap:6px 14px; margin:0 }
  dt { color:var(--dim); font-size:13.5px } dd { margin:0; font-weight:500 }
  ul { list-style:none; margin:0; padding:0 } li { padding:9px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:baseline } li:first-child { border-top:0 }
  .t { font-weight:700 } .m { color:var(--dim); font-size:13.5px } .r { text-align:right; font:500 13px var(--m); white-space:nowrap }
  .done { color:var(--good) } .late { color:var(--bad) } .due { color:var(--warn) } .later { color:var(--dim) }
  a { color:var(--cyan); text-decoration:none } a:hover { text-decoration:underline }
  .msg { margin-top:40px; text-align:center; color:var(--dim) }
  .foot { margin-top:22px; color:var(--dim); font-size:12.5px; text-align:center }
  button.p { margin-top:14px; min-height:42px; padding:0 18px; border-radius:21px; border:1px solid var(--line); background:transparent; color:var(--ink); font:600 14px var(--f); cursor:pointer }
  @media (max-width:520px) { h1 { font-size:25px } dl { grid-template-columns:1fr } dt { margin-top:6px } }
  @media print { body { background:#fff; color:#000; padding:0 } section { border-color:#bbb; background:#fff } .brand,h2 { color:#000 } dt,.m,.sub,.foot { color:#444 } button.p,.ro { display:none } a { color:#000 } }
</style>
</head>
<body>
<main id="root">
  <div class="brand"><img src="covara-logo.png" alt="">REMIEL: COVARA</div>
  <p class="msg" id="msg">Opening the care sheet…</p>
</main>
<script>
(function () {
  'use strict';
  var API = 'https://remiel-covara-api.vercel.app';
  try { var q = new URLSearchParams(location.search).get('api'); if (q && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(q)) API = q; } catch (e) {}
  var token = (location.hash || '').replace(/^#/, '');
  var root = document.getElementById('root');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function msg(t) { document.getElementById('msg').textContent = t; }
  function tel(p) { var d = String(p || '').replace(/[^\d+]/g, ''); return d ? '<a href="tel:' + esc(d) + '">' + esc(p) + '</a>' : ''; }
  function row(k, v) { return v ? '<dt>' + esc(k) + '</dt><dd>' + esc(v) + '</dd>' : ''; }
  var DNR = { full: 'Full treatment', dnr: 'Do not resuscitate (DNR)', polst: 'POLST on file', unknown: 'Not known' };
  var STATE = { done: 'Taken', late: 'Late', due: 'Due now', later: 'Later', skipped: 'Skipped' };
  if (!/^[A-Za-z0-9_-]{20,64}$/.test(token)) { msg('This link is not complete. Ask the team to send it again.'); return; }
  fetch(API + '/care-share/' + encodeURIComponent(token), { credentials: 'omit', referrerPolicy: 'no-referrer' })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      if (!x.ok) { msg(x.j && x.j.detail ? x.j.detail : 'This link could not be opened.'); return; }
      var d = x.j, s = d.sheet || {}, h = '';
      h += '<div class="brand"><img src="covara-logo.png" alt="">REMIEL: COVARA</div>';
      h += '<h1>' + esc(d.name || 'Care sheet') + (s.nickname ? ' <span class="m">(' + esc(s.nickname) + ')</span>' : '') + '</h1>';
      h += '<div class="sub">Shared by the team for care. Read only.</div><span class="ro">VIEW ENDS ' + esc(new Date(d.expires_at).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }).toUpperCase()) + '</span>';
      var crit = row('Allergies', s.allergies) + row('Diagnosis', [s.diagnosis, s.stage].filter(Boolean).join(', ')) + row('Other conditions', s.conditions) + row('Wishes', DNR[s.dnr] || '') + row('Advance directive', s.directive) + row('Blood type', s.blood) + row('Preferred hospital', s.hospital) + row('Insurance', s.insurance);
      if (crit) h += '<section class="alert"><h2>FIRST, PLEASE KNOW</h2><dl>' + crit + '</dl></section>';
      if (d.meds && d.meds.length) h += '<section><h2>MEDICINES</h2><ul>' + d.meds.map(function (m) { var mt = m.meta || {}; return '<li><div><div class="t">' + esc(m.title) + (mt.strength ? ' ' + esc(mt.strength) + ' ' + esc(mt.unit || '') : '') + '</div><div class="m">' + esc([mt.purpose, mt.prescriber ? 'Prescribed by ' + mt.prescriber : ''].filter(Boolean).join(' · ')) + '</div></div><div class="r">' + esc(mt.as_needed ? 'As needed' : (m.times || []).join(' · ')) + '</div></li>'; }).join('') + '</ul></section>';
      if (d.today && d.today.length) h += '<section><h2>TODAY</h2><ul>' + d.today.map(function (x) { return '<li><div class="t">' + esc(x.title) + ' <span class="m">' + esc(x.slot) + '</span></div><div class="r ' + esc(x.state) + '">' + esc(STATE[x.state] || x.state) + (x.done_at ? ' ' + esc(new Date(x.done_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })) : '') + '</div></li>'; }).join('') + '</ul></section>';
      var talk = row('How to talk with them', s.talk) + row('What calms them', s.calms) + row('What upsets them', s.upsets) + row('Language', s.language) + row('Aids', s.aids);
      if (talk) h += '<section><h2>HOW TO HELP</h2><dl>' + talk + '</dl></section>';
      var ppl = [];
      if (d.proxy && d.proxy.name) ppl.push('<li><div><div class="t">' + esc(d.proxy.name) + '</div><div class="m">Health care proxy' + (d.proxy.active ? ', now deciding' : '') + '</div></div></li>');
      (d.family || []).forEach(function (f) { ppl.push('<li><div><div class="t">' + esc(f.name) + '</div><div class="m">' + esc(f.relation || 'Team') + '</div></div><div class="r">' + tel(f.phone) + '</div></li>'); });
      (d.doctors || []).forEach(function (f) { ppl.push('<li><div><div class="t">' + esc(f.name) + '</div><div class="m">' + esc(f.relation || 'Doctor') + '</div></div><div class="r">' + tel(f.phone) + '</div></li>'); });
      if (ppl.length) h += '<section><h2>WHO TO CALL</h2><ul>' + ppl.join('') + '</ul></section>';
      h += '<div style="text-align:center"><button class="p" type="button" onclick="print()">Print</button></div>';
      h += '<p class="foot">This page shows what the team chose to share, as of ' + esc(new Date().toLocaleString()) + '. It stops working when the time ends or the team ends it.</p>';
      root.innerHTML = h;
    })
    .catch(function () { msg('This link could not be opened. Check the internet and try again.'); });
})();
</script>
</body>
</html>
