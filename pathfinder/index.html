<title>Women of Color — PATHFINDER</title>
<style>
  :root{ --navy:#150A14; --gold:#E0218A; --ink:#F6EDE9; --dim:#B295A6; }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{background:radial-gradient(ellipse at 50% 35%, #341932 0%, var(--navy) 45%, #08040A 100%);
    color:var(--ink); font-family:"Hanken Grotesk","Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:20px;}
  .card{width:min(400px,92vw); text-align:center;}
  .mark{font-family:Fraunces,Georgia,serif; letter-spacing:.14em; font-size:13px;
    color:var(--gold); text-transform:uppercase; margin-bottom:6px;}
  h1{font-family:Fraunces,Georgia,serif; font-weight:600; font-size:26px; margin-bottom:8px;}
  h1 span{color:var(--gold);}
  p.sub{color:var(--dim); font-size:13.5px; line-height:1.6; margin-bottom:26px;}
  input{width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(184,146,78,.45);
    border-radius:10px; color:var(--ink); font-size:19px; letter-spacing:.18em; text-align:center;
    padding:13px 14px; outline:none; text-transform:uppercase;}
  input:focus{border-color:var(--gold);}
  button{margin-top:14px; width:100%; background:var(--gold); border:none; color:#0b1526;
    font-size:15px; font-weight:600; padding:13px; border-radius:10px; cursor:pointer;}
  button:hover{filter:brightness(1.08);}
  .err{color:#ff9b9b; font-size:13px; margin-top:12px; min-height:18px;}
  .foot{margin-top:30px; color:var(--dim); font-size:11.5px;}
  .foot a{color:var(--dim);}
  .shake{animation:sh .35s;}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style>
</head>
