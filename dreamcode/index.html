    Promise.all([loadSymbols()]).then(async ([symbols]) => {
      mine = await journalIndex(symbols);
      if (!alive) return;
      items = symbols.map(s => ({ s, letter: letterOf(s.name), hay: ' ' + norm([s.name].concat(list(s.aliases)).join(' ')), el: null, on: true }));
      DC.clear(listEl);
      items.forEach(it => {
        if (!letters[it.letter]) {
          const body = h('div.dc-sym-rows');
          const card = h('section.dc-sym-letter', { id: 'dc-sym-L-' + (it.letter === '#' ? 'num' : it.letter), 'aria-label': it.letter }, h('h2.dc-sym-letter-title', null, it.letter), body);
          letters[it.letter] = { card, body };
          letterOrder.push(it.letter);
          listEl.appendChild(card);
        }
      });
      const azLetters = LETTERS.concat(letters['#'] ? ['#'] : []);
      azLetters.forEach(L => { azBtns[L] = h('button.dc-sym-az-btn', { type: 'button', disabled: !letters[L], onclick: () => goLetter(L) }, L); az.appendChild(azBtns[L]); });
      ready = true;
      apply();
      buildMore();
      requestAnimationFrame(azEdges);
    });

    const offDreams = DC.on('dreams', DC.debounce(async () => {
      if (!alive || !ready) return;
      mine = await journalIndex(items.map(it => it.s));
      if (!alive) return;
      items.forEach(setMineMark);
      apply();
    }, 300));
    return () => { alive = false; offDreams(); window.removeEventListener('scroll', onScroll); if (sraf) cancelAnimationFrame(sraf); if (raf) cancelAnimationFrame(raf); };
  }

  // ---------- symbol page (#/symbols/:id) ----------
  function dateOf(d) { return d.dreamt_on || d.created_at; }
  function msOf(v) {
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) { const p = v.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]).getTime(); }
    const n = new Date(v).getTime();
    return isNaN(n) ? 0 : n;
  }
  function affectPill(a) {
    if (!AFFECT[a]) return null;
    return h('span.dc-sym-affect', { style: { color: AFFECT[a], borderColor: AFFECT[a] } }, h('span.dot', { style: { background: AFFECT[a] } }), t('affect.' + a));
  }
  function historyEl(entries) {
    if (!entries.length) return DC.ui.empty({ icon: 'history', title: t('history_empty'), text: t('history_empty_text') });
    const rows = entries.map(e => ({ d: e.d, x: e.x, ms: msOf(dateOf(e.d)) || e.d.created_at || 0 })).sort((a, b) => a.ms - b.ms || (a.d.created_at || 0) - (b.d.created_at || 0));
    const min = rows[0].ms, max = rows[rows.length - 1].ms;
    const span = max - min;
    const tl = h('div.dc-sym-tl', { role: 'img', 'aria-label': t('timeline') },
      h('div.dc-sym-tl-line'),
      rows.map(r => {
        const pct = span > 0 ? 4 + 92 * (r.ms - min) / span : 50;
        const c = AFFECT[r.x.affect] || AFFECT.neutral;
        return h('span.dc-sym-tl-dot', { style: { left: pct + '%', background: c, boxShadow: '0 0 8px ' + c }, title: DC.fmtDate(dateOf(r.d), 'short') + (AFFECT[r.x.affect] ? ', ' + t('affect.' + r.x.affect) : '') });
      }));
    const ends = h('div.dc-sym-tl-ends', null, h('span', null, DC.fmtDate(dateOf(rows[0].d), 'short')), rows.length > 1 ? h('span', null, DC.fmtDate(dateOf(rows[rows.length - 1].d), 'short')) : null);
    const legend = h('div.dc-sym-tl-legend', null, Object.keys(AFFECT).map(a => h('span', null, h('i', { style: { background: AFFECT[a] } }), t('affect.' + a))));
    const items = rows.slice().reverse().map(({ d, x }) => {
      const tone = d.analysis && TONES.indexOf(d.analysis.tone) >= 0 ? d.analysis.tone : null;
      return h('a.dc-sym-hist', { href: '#/dream/' + encodeURIComponent(d.id) },
        h('div.dc-sym-hist-main', null,
          h('div.dc-sym-hist-top', null, h('span.dc-sym-hist-date', null, DC.icon('calendar', 14), DC.fmtDate(dateOf(d), 'long')), affectPill(x.affect)),
          x.name ? h('div.dc-sym-hist-as', null, t('appeared_as', { name: x.name })) : null,
          x.personal ? h('div.dc-sym-hist-personal', null, x.personal) : null,
          tone ? h('div.dc-sym-hist-tone', null, t('tone.label') + ': ' + t('tone.' + tone)) : null),
        DC.icon('chevron-right', 18, 'chev'));
    });
    return h('div.dc-sym-history', null, h('div.dc-card.dc-sym-tl-card', null, tl, ends, legend), h('div.dc-sym-hist-list', null, items));
  }
  function lensCard(icon, title, text) {
    return h('div.dc-sym-lens', null, h('div.dc-sym-lens-title', null, DC.icon(icon, 18), h('span', null, title)), h('p', null, text));
  }

  function renderSymbol(el, id) {
    let alive = true;
    const root = h('div.dc-sym.dc-sym-page');
    const body = h('div', null, DC.ui.spinner());
    DC.append(el, root);
    DC.append(root, [h('a.dc-sym-back', { href: '#/symbols' }, DC.icon('arrow-left', 16), t('back')), body]);
    let histEl = null, all = [];

    async function refreshHistory() {
      if (!histEl) return;
      const idx = await journalIndex(all);
      if (!alive) return;
      DC.clear(histEl);
      histEl.appendChild(historyEl(idx.get(id) || []));
    }

    loadSymbols().then(symbols => {
      if (!alive) return;
      all = symbols;
      DC.clear(body);
      const s = symbols.find(x => x.id === id);
      if (!s) {
        memo.restore = false;
        body.appendChild(DC.ui.empty({ icon: 'book-open', title: t('not_found'), action: { label: t('back'), onClick: () => DC.go('#/symbols') } }));
        return;
      }
      document.title = s.name + ' · DREAM CODE';
      const L = s.lenses && typeof s.lenses === 'object' ? s.lenses : {};
      const has = k => typeof L[k] === 'string' && L[k].trim();
      const contexts = Array.isArray(s.contexts) ? s.contexts.filter(c => c && (c.when || c.reading)) : [];
      const reflect = list(s.reflect);
      const related = list(s.related).map(rid => symbols.find(x => x.id === rid)).filter(Boolean);
      histEl = h('div');
      const sec = (icon, key, content) => DC.ui.section({ icon, title: t('sections.' + key), subtitle: t('subs.' + key), body: content });

      DC.append(body, [
        h('header.dc-sym-head', null,
          h('h1.dc-sym-name-big', null, s.name),
          h('div.dc-sym-meta', null,
            GROUPS.indexOf(s.group) >= 0 ? h('a.dc-pill', { href: '#/symbols?group=' + s.group }, groupLabel(s.group)) : null,
            s.universal ? uniPill() : null,
            AFFECT[s.affect] ? h('span.dc-sym-feels', null, t('often_feels'), ' ', affectPill(s.affect)) : null),
          s.summary ? h('p.dc-sym-summary', null, s.summary) : null),
        s.meaning ? sec('lightbulb', 'meaning', h('div.dc-card.glow', null, String(s.meaning).split(/\n\s*\n/).map(p => h('p.dc-text-glow', null, p)))) : null,
        contexts.length ? sec('layers', 'contexts', h('div.dc-sym-contexts', null, contexts.map(c => h('div.dc-card.dc-sym-context', null, c.when ? h('h3', null, c.when) : null, c.reading ? h('p', null, c.reading) : null)))) : null,
        (has('freud') || has('jung') || has('hvdc') || has('modern')) ? sec('brain', 'lenses', h('div.dc-sym-lenses', null,
          has('freud') ? lensCard('brain', t('lens.freud'), L.freud) : null,
          has('jung') ? lensCard('notebook', t('lens.jung'), L.jung) : null,
          has('hvdc') ? lensCard('book', t('lens.hvdc'), L.hvdc) : null,
          has('modern') ? lensCard('activity', t('lens.modern'), L.modern) : null)) : null,
        reflect.length ? sec('help-circle', 'reflect', h('div.dc-card.glow.dc-sym-reflect', null, reflect.map(q => h('p', null, DC.icon('sparkle', 14), h('span', null, q))))) : null,
        related.length ? sec('network', 'related', h('div.dc-chips.dc-sym-related', null, related.map(r => h('a.dc-chip', { href: '#/symbols/' + encodeURIComponent(r.id) }, r.name)))) : null,
        sec('history', 'history', histEl),
        DC.ui.bookCard({ title: DC.t('book.symbol_card.title'), text: DC.t('book.symbol_card.text') })
      ]);
      refreshHistory();
    });

    const off = DC.on('dreams', DC.debounce(() => { if (alive) refreshHistory(); }, 300));
    return () => { alive = false; off(); };
  }

  DC.on('route', r => { if (!r || r.name !== 'symbols') memo.restore = false; });

  DC.screen('symbols', {
    route: ['#/symbols', /^#\/symbols\/([^/?]+)$/],
    title: 'symbols.title',
    render(el, params, query) {
      return params && params[0] ? renderSymbol(el, params[0]) : renderList(el, query);
    }
  });
})();

</script>
<script>/* web/src/screens/types.js */
/* Dream Types Dictionary (S8) and the full type page. Also holds the hidden entry point of SPEC section 10:
   five taps on the title of the fourth category card within three seconds open a plain access code field.
   Nothing about the gated module lives in this file: its row and every string of its welcome dialog arrive
   from the server after unlock and are kept in memory for this session only. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const t = (k, v) => DC.t('types.' + k, v);
  const GROUPS = ['consciousness', 'emotional', 'narrative', 'significance'];
  const SPECIAL = 'significance';
  const GATE = '#/practice';
  const HEX = /^#[0-9a-f]{3,8}$/i;
  const colorOf = ty => (ty && HEX.test(String(ty.color || '')) ? ty.color : '#2EE6C8');
  const paras = s => String(s || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);
  const list = v => (Array.isArray(v) ? v.filter(x => x != null && String(x).trim()) : (v ? [v] : []));
  const prettyId = id => String(id || '').replace(/[-_]+/g, ' ').replace(/^\w/, c => c.toUpperCase());

  async function loadAll() {
    let raw = null;
    try { raw = await DC.data.load('types'); } catch (e) { raw = null; }
    const ok = !!raw;
    raw = raw && typeof raw === 'object' ? raw : {};
    const types = (Array.isArray(raw.types) ? raw.types : []).filter(x => x && x.id && x.name && !x.hidden);
    const groups = Array.isArray(raw.groups) ? raw.groups.filter(g => g && g.id) : [];
    return { ok, types, groups, about: typeof raw.about === 'string' ? raw.about : '', hidden: (Array.isArray(raw.types) ? raw.types : []).filter(x => x && x.hidden) };
  }
  const groupName = (groups, id) => { const g = groups.find(x => x.id === id); return (g && g.name) || (DC.hasT('types.groups.' + id) ? t('groups.' + id) : prettyId(id)); };

  function titleBlock(icon, text) {
    return h('div.dc-types-title', null, DC.icon(icon, 30), h('h1', null, text));
  }

  // ---------- gated extra row (memory only, never stored on the device) ----------
  let extra = null; // {key, p}
  function localize(rec) {
    if (!rec || typeof rec !== 'object' || Array.isArray(rec)) return null;
    const L = DC.lang();
    const loc = rec[L] && typeof rec[L] === 'object' ? rec[L] : (rec.en && typeof rec.en === 'object' ? rec.en : null);
    const o = Object.assign({}, rec, loc || {});
    delete o.en; delete o.it;
    return o;
  }
  function extraContent(force) {
    const a = DC.state.account;
    if (!a || (!a.rv_unlocked && !force)) return Promise.resolve(null);
    const key = a.id + ':' + DC.lang();
    if (!extra || extra.key !== key) {
      const rec = { key, p: null };
      rec.p = DC.api.get('/rv/content?lang=' + encodeURIComponent(DC.lang())).catch(e => { if (extra === rec) extra = null; throw e; });
      extra = rec;
    }
    return extra.p;
  }
  DC.on('account', a => { if (!a || !a.rv_unlocked || (extra && extra.key.split(':')[0] !== a.id)) extra = null; });

  async function extraType(content) {
    let rec = content && typeof content === 'object' ? localize(content.type && content.type.type && typeof content.type.type === 'object' ? content.type.type : content.type) : null;
    if (!rec || !rec.name) {
      // Development (mock) builds keep the hidden record in the local data; production data never contains it.
      try { const d = await loadAll(); rec = d.hidden[0] || null; } catch (e) { rec = null; }
    }
    return rec && rec.name ? rec : null;
  }

  // Strings for the welcome dialog, read only from the server response (ui may be per language or carry both).
  function pickLang(v, L, depth) {
    if (depth > 8 || !v || typeof v !== 'object' || Array.isArray(v)) return v;
    if ('en' in v || 'it' in v) {
      const sel = v[L] != null ? v[L] : (v.en != null ? v.en : v.it);
      const rest = {};
      Object.keys(v).forEach(k => { if (k !== 'en' && k !== 'it') rest[k] = v[k]; });
      if (sel && typeof sel === 'object' && !Array.isArray(sel)) return pickLang(Object.assign(rest, sel), L, depth + 1);
      return Object.keys(rest).length ? pickLang(Object.assign(rest, { text: sel }), L, depth + 1) : sel;
    }
    const out = {};
    Object.keys(v).forEach(k => { out[k] = pickLang(v[k], L, depth + 1); });
    return out;
  }
  function welcomeStrings(content) {
    const L = DC.lang();
    let ui = content && typeof content === 'object' ? pickLang(content.ui, L, 0) : null;
    if (ui && typeof ui === 'object' && ui.ui && typeof ui.ui === 'object' && Object.keys(ui).length === 1) ui = ui.ui;
    if (!ui || typeof ui !== 'object') return {};
    const flat = {};
    (function walk(o, p, depth) {
      if (depth > 8) return;
      Object.keys(o).forEach(k => {
        const v = o[k], key = p ? p + '.' + k : k;
        if (typeof v === 'string') flat[key] = v;
        else if (v && typeof v === 'object' && !Array.isArray(v)) walk(v, key, depth + 1);
      });
    })(ui, '', 0);
    const keys = Object.keys(flat), vals = keys.map(k => flat[k]);
    const byKey = res => { for (const re of res) { const k = keys.find(x => re.test(x)); if (k) return flat[k]; } return ''; };
    const byVal = re => vals.find(v => re.test(v.trim())) || '';
    const scope = '(grant\\w*|unlock\\w*|access\\w*|welcome\\w*|modal)';
    const R = tail => [new RegExp('(^|[._])grant\\w*[._]?(' + tail + ')$', 'i'), new RegExp('(^|[._])' + scope + '[._]?(' + tail + ')$', 'i')];
    return {
      title: byKey(R('title|heading|header')) || byVal(/^(access granted|accesso (consentito|concesso|garantito))$/i),
      text: byKey(R('text|body|lead|sub|subtitle|intro|desc|description|message|msg')) || byVal(/^(you now have access|ora hai accesso)/i),
      box: byKey(R('box|note|validated|confirm|confirmed|callout|detail|details|success|info')) || byVal(/(validated|convalidat)/i),
      button: byKey(R('button|btn|cta|begin|start|action|go|open|enter')) || byVal(/^(begin|start|inizia|comincia)\b/i)
    };
  }

  // ---------- hidden entry point ----------
  function watchTaps(el, fn) {
    let taps = [];
    el.addEventListener('click', () => {
      const now = Date.now();
      taps = taps.filter(x => now - x < 3000);
      taps.push(now);
      if (taps.length >= 5) { taps = []; fn(); }
    });
  }
  function openAccess() {
    if (!DC.signedIn()) {
      const m0 = DC.ui.modal({
        title: t('access.title'), body: t('access.signin'),
        actions: [
          { label: DC.t('core.signin'), onClick: c => { c(); DC.go('#/auth?next=' + encodeURIComponent('#/types')); } },
          { label: DC.t('core.cancel'), kind: 'outline' }
        ]
      });
      m0.el.classList.add('dc-types-modal');
      return;
    }
    const input = h('input.dc-input', { type: 'text', autocomplete: 'off', autocapitalize: 'none', autocorrect: 'off', spellcheck: 'false', maxlength: '200', 'aria-label': t('access.title') });
    const err = h('div.dc-error', { role: 'alert', 'aria-live': 'assertive' });
    let busy = false, btn = null, m = null;
    async function submit() {
      if (busy) return;
      const code = input.value.trim();
      if (!code) { input.focus(); return; }
      busy = true; err.textContent = ''; if (btn) btn.disabled = true;
      try {
        const r = await DC.api.post('/rv/unlock', { code });
        m.close();
        if (r && r.id) DC.auth.setAccount(r);
        DC.auth.refreshAccount().catch(() => { /* the account from the unlock answer is enough */ });
        showWelcome();
      } catch (e) {
        const s = e && e.status;
        err.textContent = s === 429 ? t('access.limit') : s === 401 ? t('access.signin') : (s === 400 || s === 403 || s === 404 || s === 422) ? t('access.wrong') : DC.api.message(e);
        busy = false; if (btn) btn.disabled = false;
        input.focus(); input.select();
      }
    }
    m = DC.ui.modal({
      title: t('access.title'),
      body: h('form.dc-types-code', { onsubmit: e => { e.preventDefault(); submit(); } }, input, err),
      actions: [{ label: t('access.enter'), onClick: () => submit() }]
    });
    m.el.classList.add('dc-types-modal');
    btn = m.el.querySelector('.actions .dc-btn');
    setTimeout(() => input.focus(), 40);
  }
  async function showWelcome() {
    DC.ui.loading(true);
    let content = null;
    try { content = await extraContent(true); } catch (e) { content = null; }
    DC.ui.loading(false);
    const s = welcomeStrings(content);
    const emblem = content && content.media && content.media.emblem ? h('div.dc-types-emblem', { 'aria-hidden': 'true' }) : null;
    if (emblem) DC.api.blob('/rv/media/emblem').then(b => { const u = URL.createObjectURL(b); const img = h('img', { src: u, alt: '' }); img.onload = () => emblem.classList.add('on'); emblem.appendChild(img); }).catch(() => emblem.remove());
    const body = h('div.dc-types-welcome',
      null,
      emblem,
      s.text ? h('p.dc-types-welcome-text', null, s.text) : null,
      s.box ? h('div.dc-callout.green.dc-types-welcome-box', null, DC.icon('check-circle', 18), h('span', null, s.box)) : null);
    const m = DC.ui.modal({
      title: s.title || t('access.done'), icon: 'check-circle', body,
      actions: [{ label: s.button || DC.t('core.continue'), icon: 'eye', onClick: c => { c(); DC.go(GATE); } }]
    });
    m.el.classList.add('dc-types-modal', 'dc-types-granted');
  }

  // ---------- list (#/types) ----------
  function renderList(el) {
    let alive = true;
    const root = h('div.dc-types');
    DC.append(el, root);

    const aboutBody = h('div.dc-types-about-body.dc-hidden', { id: 'dc-types-about' });
    const aboutBtn = h('button.dc-types-about', {
      type: 'button', 'aria-expanded': 'false', 'aria-controls': 'dc-types-about',
      onclick: () => { const open = aboutBody.classList.toggle('dc-hidden') === false; aboutBtn.setAttribute('aria-expanded', String(open)); aboutBtn.classList.toggle('open', open); }
    }, DC.icon('notebook', 20, 'nb'), h('span', null, t('about')), DC.icon('info', 16, 'i'));

    const search = h('input.dc-input', { type: 'search', placeholder: t('search'), 'aria-label': t('search_label'), autocomplete: 'off', enterkeyhint: 'search' });
    const chips = h('div.dc-types-chips', { role: 'group', 'aria-label': t('filter_label') });
    const cardsEl = h('div.dc-types-cards', { 'aria-busy': 'true' }, DC.ui.spinner());
    const none = h('div.dc-hidden', null, DC.ui.empty({ icon: 'search', title: t('none_found'), action: { label: t('view_all'), onClick: () => { search.value = ''; q = ''; setGroup('all'); } } }));

    DC.append(root, [
      titleBlock('notebook', t('title')),
      h('p.dc-types-intro', null, t('intro')),
      aboutBtn, aboutBody,
      h('div.dc-types-search', null, DC.icon('search', 18), search),
      h('div.dc-types-filter', null, h('div.dc-types-filter-label', null, DC.icon('filter', 13), h('span', null, t('filter'))), chips),
      cardsEl, none
    ]);

    let group = 'all', q = '';
    const cards = {};   // id -> {el, body, rows:[{el, hay}], empty}
    let extraRow = null;
    const chipEls = {};

    function setGroup(g) {
      group = g;
      Object.keys(chipEls).forEach(k => { chipEls[k].classList.toggle('active', k === g); chipEls[k].setAttribute('aria-pressed', String(k === g)); });
      apply();
    }
    function apply() {
      const nq = DC.data.norm(q);
      let any = false;
      Object.keys(cards).forEach(g => {
        const c = cards[g];
        const on = group === 'all' || group === g;
        let n = 0;
        c.rows.forEach(r => { const vis = on && (!nq || r.hay.indexOf(nq) >= 0); r.el.classList.toggle('dc-hidden', !vis); if (vis) n++; });
        c.el.classList.toggle('dc-hidden', !on || (!!nq && n === 0));
        if (c.empty) c.empty.classList.toggle('dc-hidden', c.rows.length > 0);
        if (n) any = true;
      });
      none.classList.toggle('dc-hidden', !(nq && !any));
    }
    search.addEventListener('input', () => { q = search.value; apply(); });

    function typeRow(ty) {
      const color = colorOf(ty);
      const did = 'dc-type-d-' + String(ty.id).replace(/[^\w-]/g, '');
      const item = h('div.dc-types-item');
      const detail = h('div.dc-types-detail', { id: did },
        ty.short ? h('p', null, ty.short) : null,
        h('a.dc-types-more', { href: '#/types/' + encodeURIComponent(ty.id) }, t('read_more'), DC.icon('arrow-right', 15)));
      const head = h('button.dc-types-row', {
        type: 'button', 'aria-expanded': 'false', 'aria-controls': did,
        onclick: () => { const o = item.classList.toggle('open'); head.setAttribute('aria-expanded', String(o)); }
      }, h('span.dc-types-dot', { style: { background: color } }), h('span.dc-types-label', { style: { color } }, ty.name), DC.icon('chevron-down', 18, 'chev'));
      DC.append(item, [head, detail]);
      return item;
    }
    function gateRow(ty) {
      const color = colorOf(ty);
      return h('div.dc-types-item.dc-types-extra', null,
        h('button.dc-types-row', { type: 'button', onclick: () => DC.go(GATE) },
          h('span.dc-types-dot', { style: { background: color } }), h('span.dc-types-label', { style: { color } }, ty.name), DC.icon('chevron-right', 18, 'chev')));
    }
    async function syncExtra() {
      const a = DC.state.account;
      const card = cards[SPECIAL];
      if (!card) return;
      if (!a || !a.rv_unlocked) {
        if (extraRow) { extraRow.el.remove(); card.rows = card.rows.filter(r => r !== extraRow); extraRow = null; apply(); }
        return;
      }
      if (extraRow) return;
      let content = null;
      try { content = await extraContent(); } catch (e) { content = null; }
      const ty = await extraType(content);
      if (!alive || !ty || extraRow || !(DC.state.account && DC.state.account.rv_unlocked)) return;
      extraRow = { el: gateRow(ty), hay: DC.data.norm(ty.name + ' ' + (ty.short || '')) };
      card.rows.push(extraRow);
      card.body.appendChild(extraRow.el);
      apply();
    }
    const offAccount = DC.on('account', () => { if (alive) syncExtra(); });

    loadAll().then(d => {
      if (!alive) return;
      // About panel
      DC.append(aboutBody, [
        paras(d.about).map(p => h('p', null, p)),
        h('h3.dc-types-about-h', null, t('about_groups')),
        h('dl.dc-types-about-groups', null, GROUPS.map(g => {
          const gr = d.groups.find(x => x.id === g);
          return [h('dt', null, groupName(d.groups, g)), gr && gr.about ? h('dd', null, gr.about) : h('dd.dc-hidden')];
        }))
      ]);
      // Chips: All Categories, then the four groups
      ['all'].concat(GROUPS).forEach(g => {
        chipEls[g] = h('button.dc-chip' + (g === group ? '.active' : ''), { type: 'button', 'aria-pressed': String(g === group), onclick: () => setGroup(g) }, g === 'all' ? t('all') : groupName(d.groups, g));
        chips.appendChild(chipEls[g]);
      });
      // Cards
      DC.clear(cardsEl);
      cardsEl.removeAttribute('aria-busy');
      if (!d.ok) cardsEl.appendChild(h('p.dc-types-note', null, t('load_error')));
      const ids = GROUPS.concat(d.groups.map(g => g.id).filter(id => GROUPS.indexOf(id) < 0));
      ids.forEach(g => {
        const titleEl = h('h2.dc-types-card-title', null, groupName(d.groups, g));
        const body = h('div.dc-types-rows');
        const rows = d.types.filter(ty => ty.group === g).map(ty => ({ el: typeRow(ty), hay: DC.data.norm([ty.name, ty.id, ty.short].join(' ')) }));
        rows.forEach(r => body.appendChild(r.el));
        const empty = h('p.dc-types-empty', null, t('empty_group'));
        const card = h('section.dc-types-card', { 'aria-label': groupName(d.groups, g) }, titleEl, body, empty);
        if (g === SPECIAL) { titleEl.classList.add('dc-types-tap'); watchTaps(titleEl, openAccess); }
        cards[g] = { el: card, body, rows, empty };
        cardsEl.appendChild(card);
      });
      apply();
      syncExtra();
    });

    return () => { alive = false; offAccount(); };
  }

  // ---------- full type page (#/types/:id) ----------
  function lensCard(icon, title, text, note) {
    return h('div.dc-card.dc-types-lens', null,
      h('div.dc-types-lens-title', null, DC.icon(icon, 20), h('span', null, title)),
      paras(text).map(p => h('p.dc-text-glow', null, p)),
      note ? h('p.dc-types-lens-note', null, note) : null);
  }
  function section(icon, key, body, withSub) {
    return DC.ui.section({ icon, title: t('sections.' + key), subtitle: withSub ? t('subs.' + key) : null, body });
  }
  function dreamDate(d) { return d.dreamt_on || d.created_at; }
  function dreamsOfType(dreams, id) {
    return dreams.map(d => {
      const fromAnalysis = !!(d.analysis && Array.isArray(d.analysis.types) && d.analysis.types.some(x => x && x.id === id));
      const tagged = Array.isArray(d.categories) && d.categories.indexOf(id) >= 0;
      return fromAnalysis || tagged ? { d, fromAnalysis, tagged } : null;
    }).filter(Boolean).sort((a, b) => String(dreamDate(b.d)).localeCompare(String(dreamDate(a.d))) || (b.d.created_at || 0) - (a.d.created_at || 0));
  }
  function mineList(entries) {
    if (!entries.length) {
      return DC.ui.empty({ icon: 'moon', title: t('yours_empty'), text: t('yours_empty_text'), action: { label: t('record'), onClick: () => DC.go('#/analyze') } });
    }
    return h('div.dc-types-mine', null, entries.map(({ d, fromAnalysis, tagged }) => {
      const title = (d.analysis && d.analysis.title) || d.title || String(d.text || '').trim().split(/\s+/).slice(0, 10).join(' ') || t('untitled');
      return h('a.dc-types-mine-row', { href: d.analysis ? '#/dream/' + encodeURIComponent(d.id) : '#/journal' },
        h('div.dc-types-mine-main', null,
          h('div.dc-types-mine-date', null, DC.icon('calendar', 14), DC.fmtDate(dreamDate(d), 'long')),
          h('div.dc-types-mine-title', null, title),
          h('div.dc-pills', null,
            fromAnalysis ? DC.ui.pill(t('from_analysis'), { icon: 'sparkle' }) : null,
            tagged ? DC.ui.pill(t('tagged'), { icon: 'check' }) : null)),
        DC.icon('chevron-right', 18, 'chev'));
    }));
  }

  function renderType(el, id) {
    let alive = true;
    const root = h('div.dc-types.dc-types-page');
    const body = h('div', null, DC.ui.spinner());
    DC.append(el, root);
    DC.append(root, [h('a.dc-types-back', { href: '#/types' }, DC.icon('arrow-left', 16), t('back')), body]);
    let mineEl = null;

    async function refreshMine() {
      if (!mineEl) return;
      let dreams = [];
      try { dreams = await DC.store.allDreams(); } catch (e) { dreams = []; }
      if (!alive) return;
      DC.clear(mineEl);
      mineEl.appendChild(mineList(dreamsOfType(dreams, id)));
    }

    Promise.all([loadAll(), DC.data.symbols().catch(() => [])]).then(([d, symbols]) => {
      if (!alive) return;
      DC.clear(body);
      const ty = d.types.find(x => x.id === id);
      if (!ty) {
        body.appendChild(DC.ui.empty({ icon: 'notebook', title: t('not_found'), action: { label: t('view_all'), onClick: () => DC.go('#/types') } }));
        return;
      }
      document.title = ty.name + ' · DREAM CODE';
      const color = colorOf(ty);
      const L = ty.lenses && typeof ty.lenses === 'object' ? ty.lenses : {};
      const has = k => typeof L[k] === 'string' && L[k].trim();
      const relTypes = list(ty.related_types).map(rid => d.types.find(x => x.id === rid)).filter(Boolean);
      const symList = Array.isArray(symbols) ? symbols : [];
      const relSyms = list(ty.related_symbols).map(sid => { const s = symList.find(x => x.id === sid); return { id: sid, name: s ? s.name : prettyId(sid) }; });
      mineEl = h('div');

      DC.append(body, [
        h('header.dc-types-head', null,
          h('h1.dc-types-name', null, h('span.dc-types-dot.big', { style: { background: color, boxShadow: '0 0 12px ' + color } }), h('span', null, ty.name)),
          h('div.dc-pills', null, h('a.dc-pill.dc-types-group', { href: '#/types' }, groupName(d.groups, ty.group))),
          ty.short ? h('p.dc-types-short', null, ty.short) : null),
        paras(ty.description).length ? h('div.dc-card.glow.dc-types-desc', null,
          h('div.dc-card-title', null, DC.icon('book-open', 20), t('sections.description')),
          paras(ty.description).map(p => h('p.dc-text-glow', null, p))) : null,
        list(ty.signs).length ? section('eye', 'signs', DC.ui.bullets(list(ty.signs)), true) : null,
        paras(ty.may_reflect).length ? section('lightbulb', 'may_reflect', paras(ty.may_reflect).map(p => h('p.dc-text-glow', null, p)), true) : null,
        list(ty.practices).length ? section('activity', 'practices', h('ol.dc-types-steps', null, list(ty.practices).map(p => h('li', null, p))), true) : null,
        paras(ty.science).length ? section('graduation', 'science', h('div.dc-card.dc-types-science', null, paras(ty.science).map(p => h('p', null, p))), true) : null,
        (has('freud') || has('jung') || has('hvdc') || has('haudenosaunee') || has('modern')) ? section('layers', 'lenses', h('div.dc-types-lenses', null,
          has('freud') ? lensCard('brain', t('lens.freud'), L.freud) : null,
          has('jung') ? lensCard('notebook', t('lens.jung'), L.jung) : null,
          has('hvdc') ? lensCard('book', t('lens.hvdc'), L.hvdc) : null,
          has('haudenosaunee') ? lensCard('feather', t('lens.haudenosaunee'), L.haudenosaunee, t('cultural_note')) : null,
          has('modern') ? lensCard('brain', t('lens.modern'), L.modern) : null), true) : null,
        typeof ty.caution === 'string' && ty.caution.trim() ? h('div.dc-types-caution', { role: 'note' },
          DC.icon('heart', 20),
          h('div', null, h('div.dc-types-caution-title', null, t('caution')), paras(ty.caution).map(p => h('p', null, p)))) : null,
        (relTypes.length || relSyms.length) ? section('compass', 'related', [
          relTypes.length ? h('div.dc-types-rel', null, h('h3', null, t('sections.related_types')),
            h('div.dc-pills', null, relTypes.map(rt => h('a.dc-pill.dc-types-rel-type', { href: '#/types/' + encodeURIComponent(rt.id), style: { color: colorOf(rt), borderColor: colorOf(rt) } }, h('span.dc-types-dot.small', { style: { background: colorOf(rt) } }), rt.name)))) : null,
          relSyms.length ? h('div.dc-types-rel', null, h('h3', null, t('sections.related_symbols')),
            h('div.dc-chips', null, relSyms.map(s => h('a.dc-chip.dc-types-rel-sym', { href: '#/symbols/' + encodeURIComponent(s.id) }, s.name)))) : null
        ], true) : null,
        section('notebook', 'yours', mineEl, true)
      ]);
      refreshMine();
    });

    const off = DC.on('dreams', DC.debounce(() => { if (alive) refreshMine(); }, 250));
    return () => { alive = false; off(); };
  }

  DC.screen('types', {
    route: ['#/types', /^#\/types\/([^/?]+)$/],
    title: 'types.title',
    render(el, params) {
      return params && params[0] ? renderType(el, params[0]) : renderList(el);
    }
  });
})();

</script>
</body>
</html>
