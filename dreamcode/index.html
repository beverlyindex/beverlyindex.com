        else if (nm === 1) add('medium', 'moon', '#FF5A6E', T('rec.nightmare_once'), () => DC.go('#/types/nightmare'));
        if ((m.typeCount.get('lucid') || 0) + (m.typeCount.get('semi_lucid') || 0) > 0) add('high', 'brain', '#B48CFF', T('rec.lucid'), () => openActivity(/reality/i, 'lucid'));
        const u = m.unanalysed.length;
        if (u) add(u >= 3 ? 'high' : 'medium', 'sparkles', '#2AFCE4', TN('rec.unanalyzed', u), () => DC.go('#/journal'));
        if (!DC.signedIn()) add('medium', 'shield', '#2EE6C8', T('rec.account'), () => DC.go('#/auth'));
        if (m.recurring.length) {
          add('medium', 'book-open', '#3BE37A', T('rec.recurring_symbols'), () => showTab('patterns', true));
          const top = m.recurring.find(e => e.id);
          if (top) add('medium', 'book-open', '#6A9BEF', T('rec.symbol', { symbol: top.name }), () => DC.go('#/symbols/' + encodeURIComponent(top.id)));
        } else if (m.latestAnalysed) {
          const s = (m.latestAnalysed.analysis.symbols || []).find(x => x && x.id);
          if (s) add('medium', 'book-open', '#6A9BEF', T('rec.latest_symbol', { symbol: s.name || s.id }), () => DC.go('#/symbols/' + encodeURIComponent(s.id)));
        }
        if (m.typeCount.get('grief')) add('low', 'heart', '#7E7BFF', T('rec.grief'), () => DC.go('#/types/grief'));
        if (m.coded.length >= ((window.HVDC && Number(window.HVDC.minDreams)) || 10)) add('low', 'graduation', '#2EE6C8', T('rec.profile'), () => showTab('science', true));
        if (m.lastWeek < 3) add('low', 'lightbulb', '#F2C14E', T('rec.few_dreams'), () => DC.go('#/analyze'));
        return out.map((r, i) => Object.assign(r, { i })).sort((a, b) => PRIORITY[a.priority] - PRIORITY[b.priority] || a.i - b.i).slice(0, 5);
      }
      function recsCard() {
        return h('div.dc-card.glow.dc-dash-recs', null,
          h('div.dc-dash-rtitle', null, DC.icon('clock', 22), T('rec.title')),
          h('div.dc-dash-ritems', null, recommendations().map(r => h('button.dc-dash-rec', { type: 'button', onclick: r.action },
            h('span.ic', { style: { color: r.color } }, DC.icon(r.icon, 20)),
            h('span.tx', null, h('span.t', null, r.text), h('span.dc-dash-prio.' + r.priority, null, T('rec.priority.' + r.priority))),
            h('span.ar', null, DC.icon('arrow-right', 18))))),
          h('div.dc-dash-rfoot', null, T('rec.footer')));
      }

      // ================= Dream Pattern Analysis =================
      function chartCard(icon, title, sub, drawFn, after) {
        const holder = h('div.dc-dash-chart');
        if (drawFn) addChart(holder, drawFn);
        return h('div.dc-card.dc-dash-ccard', null, h('div.dc-card-title', null, DC.icon(icon, 20), title), sub ? h('p.dc-dash-csub', null, sub) : null, drawFn ? holder : null, after || null);
      }
      function patternsTab(box) {
        const m = ctx.m, A = m.analysed;
        if (A.length < 2) {
          const u = m.unanalysed.length;
          box.appendChild(DC.ui.empty({
            icon: 'trending-up', title: T('pat.empty_title'), text: T('pat.empty_text'),
            action: u ? { label: T('pat.empty_journal'), onClick: () => DC.go('#/journal') } : { label: T('empty.action'), onClick: () => DC.go('#/analyze') }
          }));
          return;
        }
        // 1. Recurring symbols over time
        const rec = m.recurring.slice(0, 8);
        const affLegend = legend(AFFECTS.map(k => [AFFECT_COLORS[k], T('pat.affect.' + k)]));
        box.appendChild(rec.length
          ? chartCard('sparkles', T('pat.symbols_title'), T('pat.symbols_sub'), w => timelineSvg(w, rec.map(e => ({
            label: e.name,
            points: e.items.map(it => ({ t: it.t, color: AFFECT_COLORS[it.affect], title: e.name + ', ' + DC.fmtDate(it.key, 'short') + ': ' + T('pat.affect.' + it.affect) }))
          })), m.t0, m.t1, T('pat.symbols_title')), affLegend)
          : chartCard('sparkles', T('pat.symbols_title'), null, null, h('p.dc-dash-none', null, T('pat.symbols_none'))));

        // 2. Type distribution
        const items = Array.from(m.typeCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 10).map(e => { const ti = typeInfo(ctx, e[0]); return { label: ti.name, color: ti.color, count: e[1] }; });
        if (items.length) box.appendChild(chartCard('pie-chart', T('pat.types_title'), T('pat.types_sub', { n: A.length }), w => barsSvg(w, items, T('pat.types_title'))));

        // 3. Emotional tone by week (up to the last 8 weeks of analysed dreams)
        const last = weekStart(m.t1);
        let first = last;
        for (let i = 0; i < 7 && first > weekStart(m.t0); i++) first = addDays(first, -7);
        const weeks = [];
        for (let t = first; t <= last; t = addDays(t, 7)) weeks.push({ t, counts: {} });
        A.forEach(x => {
          const wk = weeks.find(w => w.t === weekStart(x.t));
          if (!wk) return;
          const tone = TONES.indexOf(x.a.tone) >= 0 ? x.a.tone : 'neutral';
          wk.counts[tone] = (wk.counts[tone] || 0) + 1;
        });
        box.appendChild(chartCard('activity', T('pat.tone_title'), T('pat.tone_sub'), w => stackedSvg(w, weeks, T('pat.tone_title')),
          legend(TONES.map(k => [TONE_COLORS[k], T('pat.tone.' + k)]))));

        // 4. The book's four emotional patterns over time
        const none = A.filter(x => PATTERNS.indexOf(x.a.emotion_pattern) < 0).length;
        box.appendChild(chartCard('compass', T('pat.emo_title'), T('pat.emo_sub'), w => timelineSvg(w, PATTERNS.map(p => ({
          label: T('pat.emo.' + p + '.name'),
          points: A.filter(x => x.a.emotion_pattern === p).map(x => ({ t: x.t, color: PATTERN_COLORS[p], title: T('pat.emo.' + p + '.name') + ', ' + DC.fmtDate(x.key, 'short') + ': ' + dreamTitle(x.d) }))
        })), m.t0, m.t1, T('pat.emo_title')), h('div', null,
          none ? h('p.dc-dash-note2', null, TN('pat.emo_none', none)) : null,
          h('div.dc-dash-emo', null, PATTERNS.map(p => h('div.it', null,
            h('div.nm', null, h('i', { style: { background: PATTERN_COLORS[p] } }), T('pat.emo.' + p + '.name')),
            h('p', null, T('pat.emo.' + p + '.text'))))))));

        // 5. How your symbols changed
        const changeList = m.recurring.slice(0, 6).map(e => {
          const a = e.items.map(it => it.affect);
          const s0 = AFFECT_SCORE[a[0]], s1 = AFFECT_SCORE[a[a.length - 1]];
          let verdict;
          if (a.every(x => x === a[0])) verdict = h('span.vd', null, T('pat.change.same', { affect: T('pat.affect.' + a[0]).toLowerCase() }));
          else if (s1 > s0) verdict = h('span.vd.up', null, DC.icon('trending-up', 15), T('pat.change.better'));
          else if (s1 < s0) verdict = h('span.vd.down', null, T('pat.change.worse'));
          else verdict = h('span.vd', null, T('pat.change.varied'));
          const seq = [];
          e.items.forEach((it, i) => {
            if (i) seq.push(h('span.sep', { 'aria-hidden': 'true' }, DC.icon('chevron-right', 14)));
            seq.push(h('span.ch', { style: { borderColor: AFFECT_COLORS[it.affect] } }, h('i', { style: { background: AFFECT_COLORS[it.affect] } }),
              h('span.d', null, shortDate(it.t)), h('span.a', null, T('pat.affect.' + it.affect))));
          });
          return h('div.dc-dash-chg', null,
            h('div.hd', null, e.id ? h('a.nm', { href: '#/symbols/' + encodeURIComponent(e.id) }, e.name) : h('span.nm', null, e.name), verdict),
            h('div.seq', null, seq));
        });
        box.appendChild(chartCard('history', T('pat.change_title'), T('pat.change_sub'), null,
          changeList.length ? h('div.dc-dash-chgs', null, changeList) : h('p.dc-dash-none', null, T('pat.change_none'))));
      }

      // ================= Dream Science Profile =================
      function scienceTab(box) {
        const token = sciToken;
        box.appendChild(DC.ui.section({ icon: 'graduation', title: T('sci.title'), body: [h('p.dc-dash-p', null, T('sci.p0')), h('p.dc-dash-p', null, T('sci.p1')), h('p.dc-dash-p', null, T('sci.p2'))] }));
        const area = h('div.dc-dash-sci', null, h('div.dc-dash-loading', null, DC.ui.spinner(true), T('loading')));
        box.appendChild(area);
        loadHvdc().then(r => r, e => { console.warn('[dashboard] Hall and Van de Castle module not available:', e && e.message); return null; })
          .then(r => { if (alive && token === sciToken) fillScience(area, r); });
      }
      function fillScience(area, r) {
        DC.clear(area);
        const m = ctx.m, n = m.coded.length;
        const min = (r && Number(r.mod.minDreams)) || 10;
        if (n < min) { area.appendChild(progressCard(n, min)); return; }
        if (!r) {
          area.appendChild(h('div.dc-card.dc-dash-err', null, DC.icon('alert-circle', 20), h('div', null, h('p', null, T('sci.load_error')),
            h('button.dc-btn.secondary.small.auto', { type: 'button', onclick: () => { area.replaceChildren(h('div.dc-dash-loading', null, DC.ui.spinner(true), T('loading'))); loadHvdc().then(x => fillScience(area, x), () => fillScience(area, null)); } }, T('sci.retry')))));
          return;
        }
        let set = DC.settings.get('dashNorms', 'both');
        if (NORM_SETS.indexOf(set) < 0) set = 'both';
        let res;
        try { res = profile(r.mod, r.norms, m.coded, set); }
        catch (e) { console.error('[dashboard] profile', e); area.appendChild(h('div.dc-card.dc-dash-err', null, DC.icon('alert-circle', 20), h('p', null, T('sci.load_error')))); return; }
        const chooser = h('div.dc-dash-normsel', { role: 'radiogroup', 'aria-label': T('sci.compare') },
          h('span.l', null, T('sci.compare')),
          h('div.dc-chips', null, NORM_SETS.map(k => h('button.dc-chip' + (k === set ? '.active' : ''), {
            type: 'button', role: 'radio', 'aria-checked': String(k === set),
            onclick: () => { DC.settings.set('dashNorms', k); fillScience(area, r); }
          }, T('sci.norms.' + k)))));
        const head = h('div.dc-dash-ind.head', { role: 'row' },
          h('div.lab', { role: 'columnheader' }, T('sci.col.indicator')), h('div.you', { role: 'columnheader' }, T('sci.col.you')),
          h('div.norm', { role: 'columnheader' }, T('sci.col.norm')), h('div.diff', { role: 'columnheader' }, T('sci.col.diff')));
        const rows = res.rows.map(row => {
          const e = effect(row), w = row.h == null ? 0 : Math.min(Math.abs(row.h) / 1.2, 1) * 50;
          return h('div.dc-dash-ind', { role: 'row' },
            h('div.lab', { role: 'cell' }, h('span', null, row.label),
              row.desc ? h('button.dc-dash-info', { type: 'button', 'aria-label': T('sci.info') + ': ' + row.label, onclick: () => DC.ui.modal({ title: row.label, icon: 'info', body: row.desc }) }, DC.icon('info', 15)) : null),
            h('div.you', { role: 'cell' }, h('span.k', null, T('sci.col.you')), h('b', null, fmtVal(row, row.you))),
            h('div.norm', { role: 'cell' }, h('span.k', null, T('sci.col.norm')), h('span', null, fmtVal(row, row.norm))),
            h('div.diff', { role: 'cell' },
              h('div.dc-dash-dbar', { 'aria-hidden': 'true' }, h('i.mid'), e.cls === 'na' ? null : h('i.fill.' + e.cls, { style: row.h >= 0 ? { left: '50%', width: w + '%' } : { right: '50%', width: w + '%' } })),
              h('span.w.' + e.cls, null, e.word)));
        });
        DC.append(area, [
          chooser,
          h('div.dc-card.glow.dc-dash-table', null,
            h('div.dc-card-title', null, DC.icon('bar-chart', 20), T('sci.table_title')),
            h('p.dc-dash-csub', null, TN('sci.table_sub', n, { norms: T('sci.norms_of.' + set) })),
            h('div.dc-dash-inds', { role: 'table', 'aria-label': T('sci.table_title') }, head, rows),
            h('p.dc-dash-help', null, T('sci.effect_help')),
            res.reliable && n < res.reliable ? h('p.dc-dash-src', null, T('sci.reliable', { n: DC.fmtNum(res.reliable) })) : null,
            h('p.dc-dash-src', null, T('sci.sources'))),
          res.summary.length ? h('div.dc-card.dc-dash-sum', null, h('div.dc-card-title', null, DC.icon('lightbulb', 20), T('sci.summary_title')), DC.ui.bullets(res.summary)) : null,
          h('div.dc-callout.dc-dash-honest', null, DC.icon('info', 18), h('span', null, T('sci.note')))
        ]);
      }
      function progressCard(n, min) {
        const u = ctx.m.unanalysed.length;
        return h('div.dc-card.glow.dc-dash-progress', null,
          h('div.dc-card-title', null, DC.icon('layers', 20), T('sci.progress_title')),
          h('div.big', null, T('sci.progress', { n: DC.fmtNum(n), min: DC.fmtNum(min) })),
          h('div.dc-progress', { role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(min), 'aria-valuenow': String(n) }, h('div', { style: { width: Math.round(Math.min(1, n / min) * 100) + '%' } })),
          h('p', null, T('sci.progress_text')),
          u ? h('p.dc-muted', null, TN('sci.unanalyzed', u)) : null,
          h('div.dc-dash-btns', null,
            h('a.dc-btn.small.auto', { href: '#/analyze' }, T('sci.analyze')),
            u ? h('a.dc-btn.secondary.small.auto', { href: '#/journal' }, T('sci.journal')) : null),
          h('div.dc-callout.dc-dash-honest', null, DC.icon('info', 18), h('span', null, T('sci.note'))));
      }

      // ---- live updates ----
      const later = DC.debounce(() => { if (alive) refresh(); }, 200);
      offs.push(DC.on('dreams', later));
      offs.push(DC.on('account', later));
      refresh();

      return () => {
        alive = false;
        offs.forEach(off => off());
        if (ro) ro.disconnect();
        charts = [];
      };
    }
  });
})();

</script>
<script>/* web/src/screens/home.js */
/* Home / landing (demo S1 and S12). Hero film, title, the book section, feature cards, plans, footer. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;

  // SPEC section 8, used when GET /plans cannot be reached.
  const FALLBACK = {
    currency: 'USD', proposed: false,
    plans: [
      { id: 'free', name: 'Free', monthly: 0, yearly: 0, analyses: 3, analyses_period: 'week', chats: 5 },
      { id: 'dreamer', name: 'Dreamer', monthly: 6.99, yearly: 55.99, analyses: 40, analyses_period: 'month', chats: 100 },
      { id: 'plus', name: 'Dream Code Plus', monthly: 9.99, yearly: 79.99, analyses: 150, analyses_period: 'month', chats: 500 }
    ]
  };

  const reduceMotion = () => document.documentElement.classList.contains('dc-reduce-motion') ||
    !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function money(n, cur) {
    const v = Number(n || 0);
    try {
      return new Intl.NumberFormat(DC.lang() === 'it' ? 'it-IT' : 'en-US', {
        style: 'currency', currency: cur || 'USD', currencyDisplay: 'narrowSymbol',
        minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2
      }).format(v);
    } catch (e) { return '$' + v.toFixed(v % 1 ? 2 : 0); }
  }
  const planName = p => (DC.hasT('home.plan.' + p.id + '.name') ? DC.t('home.plan.' + p.id + '.name') : p.name);

  // ---- hero card with the splash film ----
  function hero() {
    const card = h('div.dc-home-hero');
    const showLogo = () => {
      card.classList.add('is-logo');
      DC.clear(card);
      card.appendChild(h('img.dc-home-hero-logo', { src: 'logo.png', alt: DC.t('home.logo_alt') }));
    };
    const v = document.createElement('video');
    const canPlay = v.canPlayType && v.canPlayType('video/mp4; codecs="avc1.42E01E"');
    if (!canPlay) { showLogo(); return { el: card, stop() {} }; }

    v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.setAttribute('preload', 'auto');
    v.setAttribute('aria-label', DC.t('home.film_label'));
    v.className = 'dc-home-hero-video';

    const spin = h('div.dc-home-hero-wait', null, DC.ui.spinner());
    const playBtn = h('button.dc-home-hero-play.dc-hidden', { type: 'button', 'aria-label': DC.t('home.film_play') }, DC.icon('play', 26));
    const muteBtn = h('button.dc-home-hero-mute.dc-hidden', { type: 'button', 'aria-pressed': 'false', 'aria-label': DC.t('home.film_unmute') }, DC.icon('volume-off', 18));
    const setMuteIcon = () => {
      DC.clear(muteBtn);
      muteBtn.appendChild(DC.icon(v.muted ? 'volume-off' : 'volume', 18));
      muteBtn.setAttribute('aria-label', DC.t(v.muted ? 'home.film_unmute' : 'home.film_mute'));
      muteBtn.setAttribute('aria-pressed', String(!v.muted));
    };
    // The film's first frame is its poster, so the card shows that frame (never the browser's grey play placeholder)
    // until the film runs. Playback starts only once enough of the film has arrived to play to the end without
    // pausing (canplaythrough), so it does not stall and then race to catch up; the spinner appears only if that takes long.
    let started = false, waitTimer = 0, fallbackTimer = 0;
    const clearTimers = () => { clearTimeout(waitTimer); clearTimeout(fallbackTimer); };
    const start = () => {
      started = true; clearTimers();
      const p = v.play();
      if (p && p.catch) p.catch(() => { spin.classList.add('dc-hidden'); playBtn.classList.remove('dc-hidden'); });
    };
    v.addEventListener('playing', () => { clearTimers(); spin.classList.add('dc-hidden'); playBtn.classList.add('dc-hidden'); muteBtn.classList.remove('dc-hidden'); });
    v.addEventListener('canplaythrough', () => { if (!started && !reduceMotion()) start(); });
    v.addEventListener('error', () => { clearTimers(); showLogo(); });
    playBtn.addEventListener('click', start);
    muteBtn.addEventListener('click', () => { v.muted = !v.muted; setMuteIcon(); });

    v.poster = 'empyrean-film.jpg';
    v.src = 'empyrean-film.mp4';
    spin.classList.add('dc-hidden');
    DC.append(card, [v, spin, playBtn, muteBtn]);
    if (reduceMotion()) playBtn.classList.remove('dc-hidden');
    else {
      waitTimer = setTimeout(() => { if (!started) spin.classList.remove('dc-hidden'); }, 1500);
      // A slow connection that never reports canplaythrough: play what has arrived after a while.
      fallbackTimer = setTimeout(() => { if (!started) start(); }, 6000);
    }
    return { el: card, stop() { clearTimers(); try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) { /* ignore */ } } };
  }

  // ---- feature cards ----
  function features() {
    const items = [
      ['notebook', 'home.feat.foundations.title', 'home.feat.foundations.text'],
      ['book-open', 'home.feat.journal.title', 'home.feat.journal.text'],
      ['file-text', 'home.feat.research.title', 'home.feat.research.text']
    ];
    return h('div.dc-home-features', null, items.map(([icon, t, d]) =>
      h('div.dc-home-feature', null,
        h('h3', null, DC.icon(icon, 22), DC.t(t)),
        h('p', null, DC.t(d)))));
  }

  // ---- plans (prices only; allowance numbers live on the pricing screen) ----
  // While paid plans are not on sale (GET /plans, see DC.ui.onSale) the section shows the Free plan only, with no link to
  // pricing; when the owner configures billing, the next answer brings the paid plans back.
  function plansSection() {
    const head = h('div.dc-home-plans-head');
    const wrap = h('div.dc-home-plans');
    const more = h('div.dc-home-plans-more');
    const section = h('section.dc-home-plans-wrap', null, head, wrap, more);
    const draw = data => {
      DC.clear(wrap);
      const selling = !!(DC.ui.onSale && DC.ui.onSale(data));
      DC.clear(head);
      DC.append(head, [
        h('h2.dc-home-plans-title', null, DC.t(selling ? 'home.plans.title' : 'home.plans.free_title')),
        // On sale elsewhere (paid plans are sold only in the Android app, through Google Play): say where.
        h('p.dc-home-plans-sub', null, DC.t(selling ? 'home.plans.subtitle' : data.on_sale === true ? 'home.plans.app_subtitle' : 'home.plans.free_subtitle'))]);
      DC.clear(more);
      if (selling) more.appendChild(h('button.dc-btn.outline.dc-home-allplans', { type: 'button', onclick: () => DC.go('#/pricing') }, DC.t('home.plans.view_all')));
      wrap.classList.toggle('dc-home-plans-single', !selling);
      const cur = data.currency || 'USD';
      const acct = DC.state.account;
      const mine = acct ? (acct.plan || 'free') : null;
      const byId = {};
      (data.plans || []).forEach(p => { byId[p.id] = p; });
      const order = (selling ? ['free', 'dreamer', 'plus'] : ['free']).filter(id => byId[id]);
      order.forEach(id => {
        const p = byId[id];
        const yearly = id === 'plus';
        const price = yearly ? p.yearly : p.monthly;
        const save = yearly ? Math.round((p.monthly * 12 - p.yearly) * 100) / 100 : 0;
        const badge = id === 'dreamer' ? h('div.dc-home-plan-badge.popular', null, DC.icon('star', 14), DC.t('home.plans.popular'))
          : id === 'plus' ? h('div.dc-home-plan-badge.best', null, DC.icon('crown', 14), DC.t('home.plans.best')) : null;
        const feats = [1, 2, 3, 4].map(i => DC.t('home.plan.' + id + '.f' + i));
        let btn;
        if (mine === id) btn = h('button.dc-btn.outline.dc-home-plan-current', { type: 'button', disabled: true }, DC.icon('check', 18), DC.t('home.plans.current'));
        else if (id === 'free') {
          btn = mine ? null : h('button.dc-btn.outline', { type: 'button', onclick: () => DC.go('#/auth?mode=signup&next=' + encodeURIComponent('#/analyze')) }, DC.t('home.plan.free.button'));
        } else {
          btn = h('button.dc-btn', { type: 'button', onclick: () => DC.go('#/pricing?period=' + (yearly ? 'yearly' : 'monthly')) }, DC.t('home.plan.' + id + '.button'));
        }
        wrap.appendChild(h('div.dc-home-plan.' + id, null,
          badge,
          h('h3', null, planName(p)),
          h('div.dc-home-plan-price', null, money(price, cur)),
          h('div.dc-home-plan-period', null, DC.t(id === 'free' ? 'home.plans.forever' : yearly ? 'home.plans.per_year' : 'home.plans.per_month')),
          save > 0 ? h('div.dc-home-plan-save', null, DC.t('home.plans.save', { amount: money(save, cur) })) : null,
          yearly ? h('div.dc-home-plan-alt', null, DC.t('home.plans.or_monthly', { price: money(p.monthly, cur) })) : null,
          h('ul.dc-home-plan-feats', null, feats.map(f => h('li', null, DC.icon('check', 16), h('span', null, f)))),
          btn));
      });
    };
    draw(DC.ls.get('dc.plans', null) || FALLBACK);
    DC.api.get('/plans', { auth: false, timeout: 10000 })
      .then(r => { if (r && Array.isArray(r.plans) && r.plans.length) { DC.ls.set('dc.plans', r); if (wrap.isConnected) draw(r); } })
      .catch(() => { /* offline: the cached or SPEC plans stay */ });
    return section;
  }

  DC.screen('home', {
    route: '#/',
    title: 'home.doc_title',
    rerenderOnAccount: true,
    render(el) {
      const signedIn = DC.signedIn();
      const film = hero();
      const getStarted = () => DC.go(signedIn ? '#/analyze' : '#/auth?next=' + encodeURIComponent('#/analyze'));

      DC.append(el, [
        film.el,
        h('h1.dc-home-title', null, 'DREAM CODE'),
        h('p.dc-home-sub', null, DC.t('home.subtitle')),
        h('p.dc-home-body', null, DC.t('home.body')),
        h('div.dc-home-cta', null, h('button.dc-btn.green.auto', { type: 'button', onclick: getStarted }, DC.t('home.get_started'))),

          h('div.dc-home-book-actions', null, DC.ui.getBook(), h('a.dc-btn.outline.small.auto', { href: '#/book' }, DC.icon('book-open', 16), DC.t('home.book.more')))),

<script>/* web/src/screens/invite.js */
/* DREAM CODE: a private invitation card. Some accounts may receive one invitation from the server (GET /rv/invite);
   every word of it arrives from the server, only for an account that has one, so the public bundle holds no text of it.
   The card fills the 'home' slot (Dashboard, Journal) and the 'dream' slot (a dream's page). Accepting asks the server to
   open the gated area and goes there. "Not now" ends the card for good; the server then keeps the invitation until the
   end of the billing period, shown only as a quiet line in the profile ('profile' slot) that opens the same card. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  let pending = null, at = 0, gone = false;
  const MAX_AGE = 10 * 60 * 1000;

  function fetchInvite(fresh) {
    if (!DC.signedIn() || (DC.state.account && DC.state.account.rv_unlocked) || gone) return Promise.resolve(null);
    if (!pending || fresh || Date.now() - at > MAX_AGE) {
      at = Date.now();
      pending = DC.api.get('/rv/invite?lang=' + encodeURIComponent(DC.lang())).then(r => ({ invite: (r && r.invite) || null, kept: (r && r.kept) || null })).catch(() => ({ invite: null, kept: null }));
    }
    return pending;
  }
  DC.on('account', a => { pending = null; gone = !!(a && a.rv_unlocked); });
  DC.on('lang', () => { pending = null; });
  // a new analysis may be the one that completes the invitation
  DC.on('dreams', e => { if (e && e.kind === 'server') pending = null; });

  function card(s, quiet, onClose) {
    const box = h('section.dc-card.glow.dc-invite', { 'aria-labelledby': 'dc-invite-t' });
    const yes = h('button.dc-btn.dc-invite-yes', { type: 'button' }, DC.icon('sparkles', 18), s.accept);
    const no = h('button.dc-btn.outline.dc-invite-no', { type: 'button' }, quiet ? (s.close || s.decline) : s.decline);
    const busy = on => { yes.disabled = on; no.disabled = on; };
    yes.addEventListener('click', async () => {
      busy(true);
      try {
        const acct = await DC.api.post('/rv/invite', { accept: true });
        gone = true; pending = null;
        document.querySelectorAll('.dc-invite').forEach(x => x.remove());
        await DC.auth.refreshAccount();
        DC.go('#/practice');
      } catch (e) { busy(false); DC.ui.error(e); }
    });
    no.addEventListener('click', async () => {
      if (quiet) { if (onClose) onClose(); return; }
      busy(true);
      try {
        await DC.api.post('/rv/invite', { accept: false });
        pending = null;
        document.querySelectorAll('.dc-invite').forEach(x => x.remove());
        if (s.declined) DC.ui.toast(s.declined, { icon: 'moon' });
      } catch (e) { busy(false); DC.ui.error(e); }
    });
    DC.append(box, [
      h('div.dc-invite-orb', { 'aria-hidden': 'true' }, DC.icon('moon', 30)),
      h('h2.dc-invite-t#dc-invite-t', null, s.title),
      s.lead ? h('p.dc-invite-lead', null, s.lead) : null,
      s.question ? h('p.dc-invite-q', null, s.question) : null,
      s.note ? h('p.dc-invite-note', null, s.note) : null,
      h('div.dc-invite-actions', null, yes, no)
    ]);
    return box;
  }

  const fill = async () => { const r = await fetchInvite(false); const s = r && r.invite; return s && s.title && s.accept ? card(s) : null; };
  DC.slot('home', fill);
  DC.slot('dream', fill);
  // after "Not now": a quiet line in the profile until the end of the billing period
  DC.slot('profile', async () => {
    const r = await fetchInvite(true);
    const s = r && r.kept;
    if (!s || !s.view || !s.accept) return null;
    const box = h('div.dc-invite-kept');
    const line = h('button.dc-link.dc-invite-line', { type: 'button', 'aria-expanded': 'false' }, DC.icon('moon', 15), ' ', s.view);
    line.addEventListener('click', () => show(true));
    const show = open => {
      DC.clear(box);
      line.setAttribute('aria-expanded', String(open));
      box.appendChild(open ? card(s, true, () => show(false)) : line);
    };
    show(false);
    return box;
  });
})();

</script>
<script>/* web/src/screens/journal.js */
/* Dream Journal (S7) and its edit view.
   Every number and every card on this screen comes from one DC.store.allDreams() read, so the count line,
   the #N badges and the list always agree. Elements placed outside <main> (modals, toasts, the print view)
   use the dc-journal- class prefix. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('journal.' + k, v);
  const TN = (k, n, v) => DC.tn('journal.' + k, n, v);
  const PAGE = 30, DAY = 86400000, KEEP_DAYS = 30, DRAFT = 'dc.journal.draft.';
  const TONES = ['calm', 'anxious', 'sad', 'curious', 'joyful', 'mixed'];
  const ENDINGS = ['abrupt', 'peaceful', 'unresolved', 'woke_naturally'];
  const GROUPS = ['consciousness', 'emotional', 'narrative', 'significance'];
  // Used only when data/types.<lang>.json is empty or cannot load (names from journal.types.* in i18n).
  const FALLBACK_TYPES = [
    ['normal', 'consciousness', '#7A9CFF'], ['lucid', 'consciousness', '#3CF07A'], ['semi_lucid', 'consciousness', '#2ED3A0'], ['hypnagogic', 'consciousness', '#9ED8FF'],
    ['joyful', 'emotional', '#FFC21A'], ['anxiety', 'emotional', '#FF5A2A'], ['nightmare', 'emotional', '#FF1E5A'], ['sexual', 'emotional', '#FF3FC0'], ['grief', 'emotional', '#7E7BFF'], ['comfort', 'emotional', '#8FD3FF'],
    ['recurring', 'narrative', '#FFA020'], ['progressive', 'narrative', '#9BE01A'], ['fragmented', 'narrative', '#E6FF1A'], ['epic', 'narrative', '#FF8A1A'], ['mundane', 'narrative', '#C8CCD8'],
    ['prophetic', 'significance', '#FFF01A'], ['healing', 'significance', '#8CF0A0'], ['problem_solving', 'significance', '#FFE6C8'], ['visitation', 'significance', '#C77DFF'], ['archetypal', 'significance', '#FF9A5A'], ['spiritual', 'significance', '#FFFFFF']
  ];

  // Kept while the app is open, so filters, open entries and the scroll position survive a visit to the edit view.
  const view = { q: '', type: '', sort: 'new', range: 'all', limit: PAGE, open: new Set(), scrollY: 0, fromList: false, restoreScroll: false };
  const cache = { tax: null, sym: null };
  let menuModal = null, printEl = null;

  // ---------- helpers ----------
  const pad = n => String(n).padStart(2, '0');
  const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const dayOf = ms => isoDay(new Date(ms || 0));
  const created = d => d.created_at || d.updated_at || 0;
  const dreamDay = d => (typeof d.dreamt_on === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d.dreamt_on) ? d.dreamt_on : dayOf(created(d)));
  const chrono = d => dreamDay(d) + '|' + String(created(d)).padStart(15, '0') + '|' + d.id;
  const byChrono = (a, b) => { const x = chrono(a), y = chrono(b); return x < y ? -1 : x > y ? 1 : 0; };
  const analysisOf = d => (d && d.analysis && typeof d.analysis === 'object' ? d.analysis : null);
  const meaningsOf = a => ((a && Array.isArray(a.meanings)) ? a.meanings : []).filter(m => m && (m.heading || m.text));
  const symbolsOf = a => ((a && Array.isArray(a.symbols)) ? a.symbols : []).filter(s => s && s.name);
  const firstLine = t => String(t || '').trim().split(/\n/)[0].slice(0, 90);
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  const cardTitle = (icon, text) => h('div.dc-card-title', null, DC.icon(icon, 20), text);
  const signInHash = () => '#/auth?next=' + encodeURIComponent('#/journal');
  // "Oct 12" (or "Oct 12, 2026" when the year differs from the day dreamt): when a dream was written down.
  function shortDay(ms, dreamt) {
    const d = new Date(ms);
    if (String(d.getFullYear()) !== String(dreamt).slice(0, 4)) return DC.fmtDate(ms, 'short');
    return d.toLocaleDateString(DC.lang() === 'it' ? 'it-IT' : 'en-US', { day: 'numeric', month: 'short' });
  }

  function cleanDetails(o) {
    const r = {};
    Object.keys(o || {}).sort().forEach(k => {
      let v = o[k];
      if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
      if (Array.isArray(v)) v = v.slice().sort();
      r[k] = v;
    });
    return JSON.stringify(r);
  }
  const sameList = (a, b) => JSON.stringify((a || []).slice().sort()) === JSON.stringify((b || []).slice().sort());

  // "sitting with the elephants" -> "Sitting With The Elephants" (the demo's style); Italian keeps sentence case.
  function titleCase(s) {
    s = String(s || '').trim();
    if (!s) return s;
    if (DC.lang() === 'it') return s.charAt(0).toUpperCase() + s.slice(1);
    return s.replace(/(^|[\s(/-])(\S)/g, (m, a, b) => a + b.toUpperCase());
  }

  function rangeStart(r) {
    const now = new Date();
    if (r === 'week') {
      const first = DC.lang() === 'it' ? 1 : 0; // Monday in Italy, Sunday in the US
      const back = (now.getDay() - first + 7) % 7;
      return isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate() - back));
    }
    if (r === 'month') return isoDay(new Date(now.getFullYear(), now.getMonth(), 1));
    if (r === 'year') return now.getFullYear() + '-01-01';
    return '';
  }

  // Types of a dream: analysis types first (primary first), then the user's own categories.
  function typeIds(d) {
    const ids = [];
    const a = analysisOf(d);
    ((a && Array.isArray(a.types)) ? a.types : []).forEach(t => { const id = t && typeof t === 'object' ? t.id : t; if (typeof id === 'string' && ids.indexOf(id) < 0) ids.push(id); });
    (Array.isArray(d.categories) ? d.categories : []).forEach(id => { if (typeof id === 'string' && ids.indexOf(id) < 0) ids.push(id); });
    return ids;
  }

  // ---------- dictionaries ----------
  function buildTax(types, groups, rv) {
    types = (Array.isArray(types) ? types : []).filter(t => t && t.id && t.name && (!t.hidden || rv));
    if (!types.length) types = FALLBACK_TYPES.map(([id, group, color]) => ({ id, group, color, name: T('types.' + id) }));
    groups = (Array.isArray(groups) ? groups : []).filter(g => g && g.id && g.name);
    if (!groups.length) groups = GROUPS.map(id => ({ id, name: T('groups.' + id) }));
    const byId = new Map(types.map(t => [t.id, t]));
    FALLBACK_TYPES.forEach(([id, group, color]) => { if (!byId.has(id)) byId.set(id, { id, group, color, name: T('types.' + id) }); });
    return { lang: DC.lang(), rv, types, groups, byId };
  }
  async function taxonomy() {
    const lang = DC.lang(), rv = !!(DC.state.account && DC.state.account.rv_unlocked);
    if (cache.tax && cache.tax.lang === lang && cache.tax.rv === rv) return cache.tax;
    let types = [], groups = [];
    try { types = await DC.data.types(); groups = await DC.data.groups(); } catch (e) { types = []; groups = []; }
    return (cache.tax = buildTax(types, groups, rv));
  }
  async function symbolMap() {
    const lang = DC.lang();
    if (cache.sym && cache.sym.lang === lang) return cache.sym.map;
    let list = [];
    try { list = await DC.data.symbols(); } catch (e) { list = []; }
    const map = new Map((Array.isArray(list) ? list : []).filter(s => s && s.id).map(s => [s.id, s]));
    cache.sym = { lang, map };
    return map;
  }

  function detailRows(d) {
    const x = (d && d.details) || {}, rows = [];
    const outOf = n => T('details.out_of', { n });
    if (x.sleep_quality) rows.push([T('details.sleep_quality'), outOf(x.sleep_quality)]);
    if (x.intensity) rows.push([T('details.intensity'), outOf(x.intensity)]);
    if (Array.isArray(x.emotional_tone) && x.emotional_tone.length) rows.push([T('details.emotional_tone'), x.emotional_tone.map(t => (TONES.indexOf(t) >= 0 ? T('details.tone.' + t) : t)).join(', ')]);
    if (x.people) rows.push([T('details.people'), x.people]);
    if (x.dominant_emotion) rows.push([T('details.dominant_emotion'), x.dominant_emotion]);
    if (x.ending) rows.push([T('details.ending'), ENDINGS.indexOf(x.ending) >= 0 ? T('details.end.' + x.ending) : x.ending]);
    if (x.sensations) rows.push([T('details.sensations'), x.sensations]);
    return rows.map(([k, v]) => [k, String(v)]);
  }

  // ---------- entry card ----------
  function entryCard(d, num, ctx) {
    const open = view.open.has(d.id), a = analysisOf(d), c = created(d), day = dreamDay(d);
    const title = String(d.title || '').trim();
    const card = h('article.dc-card.dc-journal-entry' + (open ? '.open' : ''), { dataset: { id: d.id } },
      h('div.dc-journal-head', null,
        h('span.dc-badge-num', { title: T('entry.number', { n: num }) }, '#' + num),
        h('div.dc-journal-when', null, DC.icon('calendar', 16),
          h('div', null,
            h('div.d', null, DC.fmtDate(day, 'long')),
            h('div.t', null, day === dayOf(c) ? T('entry.at', { time: DC.fmtDate(c, 'time') }) : T('entry.recorded', { date: shortDay(c, day) })))),
        h('div.dc-journal-actions', null,
          h('button.dc-journal-act', { type: 'button', 'aria-expanded': String(open), onclick: () => ctx.toggle(d.id) }, DC.icon(open ? 'eye-off' : 'eye', 16), open ? T('entry.collapse') : T('entry.expand')),
          h('button.dc-journal-act', { type: 'button', onclick: () => ctx.edit(d.id) }, DC.icon('pencil', 15), T('entry.edit')))),
      h('div.dc-journal-tags', null,
        typeIds(d).map(id => ctx.tax.byId.get(id)).filter(Boolean).map(t => h('span.dc-pill.dc-journal-type', null, h('span.dc-journal-tdot', { style: { background: t.color || 'currentColor' } }), t.name)),
        DC.ui.syncBadge(d)),
      title ? h('h3.dc-journal-title', null, title) : null,
      h('div.dc-journal-label', null, DC.icon('sparkle', 17), T('entry.dream_entry')),
      h('blockquote.dc-quote.dc-journal-quote' + (open ? '' : '.dc-journal-clamp'), null, '"' + String(d.text || '').trim() + '"'),
      open ? detailsBlock(d) : null,
      open ? reflectionBlock(d, ctx) : null,
      a ? analysisBlock(d, a, open, ctx) : null,
      h('div.dc-divider'),
      h('div.dc-journal-foot', null,
        open ? h('button.dc-btn.danger.small.auto.dc-journal-del', { type: 'button', onclick: () => deleteFlow(d.id) }, DC.icon('trash', 15), T('entry.delete')) : null,
        h('button.dc-btn.outline.teal.small.auto.dc-journal-analyze', { type: 'button', onclick: () => analyzeDream(d.id, !!a) }, DC.icon(a ? 'refresh' : 'brain', 16), a ? T('entry.reanalyze') : T('entry.analyze'))));
    return card;
  }
  function detailsBlock(d) {
    const rows = detailRows(d);
    if (!rows.length) return null;
    return h('div', null, h('div.dc-journal-label', null, DC.icon('list', 17), T('entry.details')),
      h('dl.dc-journal-dl', null, rows.map(([k, v]) => [h('dt', null, k), h('dd', null, v)])));
  }
  function reflectionBlock(d, ctx) {
    const r = String(d.reflection || '').trim();
    return h('div', null, h('div.dc-journal-label', null, DC.icon('feather', 17), T('entry.reflections')),
      r ? h('div.dc-journal-sub.dc-journal-reflection', null, r)
        : h('button.dc-link.dc-journal-addref', { type: 'button', onclick: () => ctx.edit(d.id, 'reflection') }, DC.icon('plus', 15), T('entry.add_reflection')));
  }
  function analysisBlock(d, a, open, ctx) {
    const ms = meaningsOf(a), syms = symbolsOf(a);
    const shown = open ? syms : syms.slice(0, 3);
    return h('div.dc-journal-analysis', null,
      h('div.dc-journal-label', null, DC.icon('brain', 17), T('entry.dream_analysis')),
      ms.length ? h('div.dc-journal-sub', null, h('h4', null, T('entry.summary')),
        open ? ms.map(m => h('p', null, m.heading ? h('strong', null, m.heading + ' ') : null, m.text || ''))
          : h('p.dc-journal-clamp.l4', null, ms.map(m => [m.heading ? h('strong', null, m.heading + ' ') : null, (m.text || '') + ' ']))) : null,
      syms.length ? h('div.dc-journal-sub', null, h('h4', null, T('entry.symbols')),
        shown.map(s => symbolRow(s, open, ctx)),
        syms.length > shown.length ? h('p.dc-journal-moresym', null, TN('entry.more_symbols', syms.length - shown.length)) : null) : null,
      open ? h('a.dc-journal-open', { href: '#/dream/' + encodeURIComponent(d.id) }, T('entry.open_full'), DC.icon('arrow-right', 16)) : null);
  }
  function symbolRow(s, open, ctx) {
    const dict = s.id ? ctx.sym.get(s.id) : null;
    const name = titleCase(s.name);
    return h('div.dc-journal-sym', null,
      h('div.n', null, dict ? h('a', { href: '#/symbols/' + encodeURIComponent(s.id) }, name) : h('span', null, name),
        dict && dict.universal ? DC.ui.pill(T('entry.universal'), { cls: 'dc-journal-uni' }) : null),
      s.universal ? h('p.u' + (open ? '' : '.dc-journal-clamp.l2'), null, s.universal) : null,
      open && s.personal ? h('p.p', null, s.personal) : null);
  }

  // ---------- actions shared by the list and the edit view ----------
  function undoToast(msg, onUndo) {
    DC.ui.toast(msg, { icon: 'trash', ms: 6000 });
    // Core toasts have no action button: add Undo to the toast just shown.
    const wrap = document.querySelector('.dc-toast-wrap');
    const el = wrap && wrap.lastElementChild;
    if (!el) return;
    let used = false;
    el.appendChild(h('button.dc-journal-undo', { type: 'button', onclick: () => { if (used) return; used = true; el.remove(); onUndo(); } }, T('delete.undo')));
  }
  async function deleteFlow(id) {
    const ok = await DC.ui.confirm(T('delete.title'), T('delete.text'), T('delete.ok'), 'danger');
    if (!ok) return false;
    const d = await DC.store.deleteDream(id);
    if (!d) return false;
    view.open.delete(id);
    undoToast(T('delete.done'), async () => { await DC.store.restoreDream(id); DC.ui.toast(T('delete.restored')); });
    return true;
  }
  function signInModal() {
    DC.ui.modal({
      title: T('analyze.signin_title'), icon: 'brain', body: T('analyze.signin_text'),
      actions: [
        { label: T('analyze.signin_ok'), onClick: c => { c(); DC.go(signInHash()); } },
        { label: DC.t('core.cancel'), kind: 'outline' }
      ]
    });
  }
  const allowanceText = () => { const u = DC.state.account && DC.state.account.usage; return u && u.analyses_left != null ? ' ' + DC.tn('core.allowance', u.analyses_left) + '.' : ''; };

  // Analyze (or re-analyze with force) here, with the overlay, then open the result.
  async function analyzeDream(id, again, opts) {
    opts = opts || {};
    const d = await DC.store.getDream(id);
    if (!d || d.deleted_at) return;
    if (!DC.signedIn()) { signInModal(); return; }
    if (!String(d.text || '').trim()) { DC.ui.error(T('edit.need_text')); return; }
    if (again && !opts.confirmed) {
      const ok = await DC.ui.confirm(T('analyze.re_title'), T('analyze.re_text') + allowanceText(), T('analyze.re_ok'));
      if (!ok) return;
    }
    if (DC.state.online === false) { DC.ui.error(T('analyze.offline')); return; }
    const ov = DC.ui.analyzing();
    const timers = [setTimeout(() => ov.set('process'), 400), setTimeout(() => ov.set('symbols'), 1600), setTimeout(() => ov.set('final'), 4200)];
    try {
      // Send the dream as it is on this phone, so the analysis is made from the latest text (an idempotent upsert).
      const r = await DC.api.post('/dreams/' + encodeURIComponent(id) + '/analyze', { dream: DC.store.editable(d), lang: DC.lang(), force: !!again }, { timeout: 290000 });
      timers.forEach(clearTimeout);
      if (r && r.dream) await DC.store.applyServer(r.dream);
      ov.done();
      if (DC.auth && DC.auth.refreshAccount) DC.auth.refreshAccount();
      DC.go('#/dream/' + encodeURIComponent(id), { replace: !!opts.replace });
    } catch (e) {
      timers.forEach(clearTimeout);
      ov.fail();
      // The shared dialog (core 60-ui.js) says when the allowance renews and offers plans only while they are on sale.
      if (e && e.status === 402 && DC.ui.allowanceModal) DC.ui.allowanceModal('analysis', e.body && e.body.usage);
      else if (e && e.status === 402) {
        DC.ui.modal({
          title: T('analyze.limit_title'), icon: 'zap', body: DC.api.message(e),
          actions: [{ label: T('analyze.plans'), onClick: c => { c(); DC.go('#/pricing'); } }, { label: DC.t('core.close'), kind: 'outline' }]
        });
      } else DC.ui.error(e);
    }
  }

  // ---------- journal menu: export, import, recently deleted, sync ----------
  function closeMenu() { if (menuModal) { const m = menuModal; menuModal = null; m.close(); } }
  function openMenu() {
    closeMenu();
    const btn = (icon, label, fn) => h('button.dc-btn.outline', { type: 'button', onclick: fn }, DC.icon(icon, 18), label);
    const delLabel = h('span', null, T('menu.deleted'));
    const syncBox = h('div.dc-journal-syncline', { 'aria-live': 'polite' });
    const body = h('div.dc-journal-menu', null,
      h('h4', null, T('menu.export')),
      btn('download', T('menu.export_json'), () => { closeMenu(); exportJson(); }),
      btn('file-text', T('menu.export_text'), () => { closeMenu(); exportText(); }),
      btn('book-open', T('menu.export_print'), () => { closeMenu(); printView(); }),
      h('p.dc-journal-note', null, T('menu.export_note')),
      h('h4', null, T('menu.import')),
      btn('upload', T('menu.import_btn'), () => { closeMenu(); importFile(); }),
      h('p.dc-journal-note', null, T('menu.import_note')),

  function syncLine(box) {
    let busy = false;
    async function paint() {
      let n = 0;

      DC.clear(box);
      if (!DC.signedIn()) {

      const s = DC.sync.state();
      let icon = 'cloud', text = T('sync.idle');

      else if (s === 'offline' || DC.state.online === false) { icon = 'cloud-off'; text = n ? TN('sync.offline_n', n) : T('sync.offline'); }
      else if (s === 'error') { icon = 'alert-circle'; text = T('sync.error'); }

  // A plain structure of the whole journal, oldest first, numbered like the list. Used by text export and print.
  function journalDoc(dreams, tax) {
    return dreams.slice().sort(byChrono).map((d, i) => {
      const a = analysisOf(d), c = created(d);
      return {
        num: i + 1,
        date: DC.fmtDate(dreamDay(d), 'long'),
        recorded: DC.fmtDate(c, 'short') + ', ' + DC.fmtDate(c, 'time'),
        title: d.title || (a && a.title) || '',
        types: typeIds(d).map(id => tax.byId.get(id)).filter(Boolean).map(t => t.name),
        text: String(d.text || ''),
        details: detailRows(d),
        reflection: String(d.reflection || '').trim(),
        meanings: meaningsOf(a),
        symbols: symbolsOf(a).map(s => ({ name: titleCase(s.name), universal: s.universal || '' }))
      };
    });
  }

        L.push(T('text.recorded', { date: it.recorded }));

        if (it.types.length) L.push(T('text.types') + ': ' + it.types.join(', '));
        L.push('', T('entry.dream_entry') + ':', it.text);
        if (it.details.length) { L.push('', T('entry.details') + ':'); it.details.forEach(([k, v]) => L.push('  ' + k + ': ' + v)); }
        if (it.reflection) L.push('', T('entry.reflections') + ':', it.reflection);
        if (it.meanings.length) { L.push('', T('entry.summary') + ':'); it.meanings.forEach(m => L.push((m.heading ? m.heading + '. ' : '') + (m.text || ''))); }
        if (it.symbols.length) { L.push('', T('entry.symbols') + ':'); it.symbols.forEach(s => L.push('  * ' + s.name + (s.universal ? ': ' + s.universal : ''))); }

  // Drafts of unsaved edits (per-device convenience). Remove those whose dream is gone, or that are old.
  function sweepDrafts(all) {
    try {
      const ids = new Set(all.map(d => d.id));
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (!k || k.indexOf(DRAFT) !== 0) continue;
        const v = DC.ls.get(k, null);
        if (!ids.has(k.slice(DRAFT.length)) || !v || Date.now() - (v.at || 0) > KEEP_DAYS * DAY) localStorage.removeItem(k);
      }
    } catch (e) { /* storage blocked */ }
  }

  // ---------- the list ----------
  function renderList(el) {
    let alive = true, all = [], loaded = false, seq = 0, typeSig = '';
    const restore = view.restoreScroll ? view.scrollY : null;
    view.restoreScroll = false; view.fromList = false;
    const cards = new Map();
    const ctx = { tax: buildTax([], [], false), sym: new Map(), ver: 0, toggle, edit };

    const banner = h('div.dc-journal-banner');
    const q = h('input.dc-input', {
      type: 'search', placeholder: T('filter.search'), 'aria-label': T('filter.search'), value: view.q, autocomplete: 'off', enterkeyhint: 'search',
      oninput: DC.debounce(() => { view.q = q.value; view.limit = PAGE; paint(); }, 150)
    });
    const typeSel = h('select.dc-select', { 'aria-label': T('filter.type'), onchange: () => { view.type = typeSel.value; view.limit = PAGE; paint(); } },
      h('option', { value: '' }, T('filter.all_types')));
    const sortSel = h('select.dc-select', { 'aria-label': T('filter.sort'), onchange: () => { view.sort = sortSel.value; view.limit = PAGE; paint(); } },
      ['new', 'old'].map(v => h('option', { value: v, selected: view.sort === v }, T(v === 'new' ? 'filter.newest' : 'filter.oldest'))));
    const rangeSel = h('select.dc-select', { 'aria-label': T('filter.range'), onchange: () => { view.range = rangeSel.value; view.limit = PAGE; paint(); } },
      ['all', 'week', 'month', 'year'].map(v => h('option', { value: v, selected: view.range === v }, T('filter.' + v))));
    const count = h('p.dc-journal-count', { 'aria-live': 'polite' });
    const list = h('div.dc-journal-list');
    const empty = h('div.dc-journal-emptybox', null, h('div.dc-journal-loading', null, DC.ui.spinner()));
    const more = h('button.dc-btn.outline.dc-journal-more.dc-hidden', { type: 'button', onclick: () => { view.limit += PAGE; paint(); } }, DC.icon('chevron-down', 18), T('list.more'));

    DC.append(el, [
      DC.ui.pageTitle({ icon: 'notebook', title: T('title'), subtitle: T('subtitle'), italic: true, bar: true }),
      banner,
      DC.slotEl('home', {}),
      h('div.dc-card.dc-journal-filters', null,
        h('div.dc-journal-searchrow', null,
          h('div.dc-field-icon', null, DC.icon('search', 18), q),
          h('button.dc-journal-menubtn', { type: 'button', 'aria-label': T('filter.menu'), title: T('filter.menu'), 'aria-haspopup': 'dialog', onclick: openMenu }, DC.icon('more', 22))),
        h('div.dc-journal-selects', null,
          h('div.dc-field-icon', null, DC.icon('filter', 18), typeSel),
          h('div.dc-field-icon', null, DC.icon('calendar', 18), sortSel),
          h('div.dc-field-icon', null, DC.icon('history', 18), rangeSel)),
        count),
      list, empty, more
    ]);

    function paintBanner() {
      DC.clear(banner);
      if (DC.signedIn()) return;
      banner.appendChild(h('div.dc-banner.dc-journal-guest', { role: 'note' }, DC.icon('smartphone', 20),
        h('span', null, T('guest.text')),
        h('button.dc-btn.small.auto', { type: 'button', onclick: () => DC.go(signInHash()) }, T('guest.signin'))));
    }
    function fillTypes() {
      const tax = ctx.tax;
      const sig = tax.lang + '|' + ctx.ver + '|' + tax.types.length;
      if (sig === typeSig) return;
      typeSig = sig;
      const known = new Set();
      const groups = tax.groups.map(g => {
        const ts = Array.from(tax.byId.values()).filter(t => t.group === g.id && (!t.hidden || tax.rv));
        ts.forEach(t => known.add(t.id));
        return ts.length ? h('optgroup', { label: g.name }, ts.map(t => h('option', { value: t.id }, t.name))) : null;
      });
      const other = Array.from(tax.byId.values()).filter(t => !known.has(t.id) && (!t.hidden || tax.rv));
      DC.clear(typeSel);
      DC.append(typeSel, [h('option', { value: '' }, T('filter.all_types')), groups,
        other.length ? h('optgroup', { label: T('filter.other_types') }, other.map(t => h('option', { value: t.id }, t.name))) : null]);
      typeSel.value = view.type;
      if (typeSel.value !== view.type) { view.type = ''; typeSel.value = ''; }
    }
    // Search: title, text, reflection, symbol names (as written and as in the dictionary), themes.
    const hay = new Map();
    function haystack(d) {
      const k = d.updated_at + ':' + (d.analyzed_at || 0) + ':' + ctx.ver;
      const c = hay.get(d.id);
      if (c && c.k === k) return c.v;
      const a = analysisOf(d);
      const parts = [d.title, d.text, d.reflection, a && a.title];
      symbolsOf(a).forEach(s => { parts.push(s.name); const m = s.id && ctx.sym.get(s.id); if (m) parts.push(m.name); });
      ((a && Array.isArray(a.themes)) ? a.themes : []).forEach(t => parts.push(t));
      const v = DC.data.norm(parts.filter(x => typeof x === 'string').join(' '));
      hay.set(d.id, { k, v });
      return v;
    }

    function paint() {
      if (!alive || !loaded) return;
      const chron = all.slice().sort(byChrono);
      const nums = new Map(chron.map((d, i) => [d.id, i + 1]));
      const words = DC.data.norm(view.q).split(' ').filter(Boolean);
      const from = rangeStart(view.range);
      const found = chron.filter(d => (!view.type || typeIds(d).indexOf(view.type) >= 0) && (!from || dreamDay(d) >= from) && (!words.length || words.every(w => haystack(d).indexOf(w) >= 0)));
      if (view.sort !== 'old') found.reverse();
      count.textContent = TN('count.found', found.length) + ' • ' + TN('count.total', all.length);
      reconcile(found.slice(0, view.limit), nums);
      more.classList.toggle('dc-hidden', found.length <= view.limit);
      DC.clear(empty);
      if (!all.length) {
        empty.appendChild(DC.ui.empty({ icon: 'notebook', title: T('empty.title'), text: DC.signedIn() ? T('empty.text') : T('empty.text_guest'), action: { label: T('empty.action'), onClick: () => DC.go('#/analyze') } }));
      } else if (!found.length) {
        empty.appendChild(DC.ui.empty({ icon: 'search', title: T('nomatch.title'), text: T('nomatch.text'), action: { label: T('nomatch.clear'), onClick: clearFilters } }));
      }
    }
    // Keyed update: only cards whose dream changed are rebuilt, so scroll position and open entries stay put.
    function reconcile(visible, nums) {
      const keep = new Set(), signed = DC.signedIn() ? 1 : 0;
      let prev = null;
      visible.forEach(d => {
        const num = nums.get(d.id);
        const sig = [d.updated_at, d._sync, d._err, d.rev, d.analyzed_at, d.analysis_hash, num, view.open.has(d.id), ctx.ver, signed, DC.lang()].join('|');
        let c = cards.get(d.id);
        if (!c || c.sig !== sig) {
          const card = entryCard(d, num, ctx);
          if (c && c.el.parentNode === list) list.replaceChild(card, c.el);
          c = { el: card, sig };
          cards.set(d.id, c);
        }
        keep.add(d.id);
        const want = prev ? prev.nextSibling : list.firstChild;
        if (c.el !== want) list.insertBefore(c.el, want);
        prev = c.el;
      });
      cards.forEach((c, id) => { if (!keep.has(id)) { c.el.remove(); cards.delete(id); } });
    }
    function clearFilters() {
      view.q = ''; view.type = ''; view.range = 'all'; view.limit = PAGE;
      q.value = ''; typeSel.value = ''; rangeSel.value = 'all';
      paint();
    }
    function toggle(id) {
      const wasOpen = view.open.has(id);
      if (wasOpen) view.open.delete(id); else view.open.add(id);
      paint();
      const c = cards.get(id);
      if (c && wasOpen && c.el.getBoundingClientRect().top < 72) c.el.scrollIntoView({ block: 'start' });
    }
    function edit(id, focus) {
      view.scrollY = window.scrollY; view.fromList = true; view.restoreScroll = true;
      DC.go('#/journal?edit=' + encodeURIComponent(id) + (focus ? '&focus=' + focus : ''));
    }
    async function load() {
      const my = ++seq;
      let list;
      try { list = await DC.store.allDreams(); } catch (e) { list = []; }
      if (!alive || my !== seq) return false;
      all = list; loaded = true;
      return true;
    }
    async function refresh() { if (await load()) { paintBanner(); fillTypes(); paint(); } }
    const refreshSoon = DC.debounce(refresh, 80);

    paintBanner();
    // First paint waits for the type names (briefly), so the restored scroll position lands on the same cards.
    Promise.all([load(), withTimeout(taxonomy(), 1500)]).then(([ok, tax]) => {
      if (!alive) return;
      if (tax) { ctx.tax = tax; ctx.ver++; }
      fillTypes(); paint();
      if (restore != null) window.scrollTo(0, restore);
      sweepDrafts(all);
      if (!tax) taxonomy().then(t => { if (!alive) return; ctx.tax = t; ctx.ver++; fillTypes(); paint(); });
    });
    symbolMap().then(m => { if (!alive || !m.size) return; ctx.sym = m; ctx.ver++; paint(); });

    const offs = [
      DC.on('dreams', refreshSoon),
      DC.on('sync', refreshSoon),
      DC.on('account', () => {
        taxonomy().then(t => { if (!alive) return; ctx.tax = t; ctx.ver++; refreshSoon(); });
      })
    ];
    return () => { alive = false; offs.forEach(f => f()); closeMenu(); closePrint(); };
  }

        h('button.dc-chip', { type: 'button', 'aria-pressed': 'false', dataset: { tone: t }, onclick: () => { if (toneSel.has(t)) toneSel.delete(t); else toneSel.add(t); paintTones(); changed(); } }, T('details.tone.' + t))));
      const groupsEl = h('div.dc-journal-groups', null, tax.groups.map(g => {
        const ts = tax.types.filter(t => t.group === g.id);
        if (!ts.length) return null;
        return h('div.dc-journal-group', null, h('h4', null, g.name), ts.map(t => {
          const cb = h('input', { type: 'checkbox', value: t.id });
          catBoxes.set(t.id, cb);
          return h('label.dc-journal-cat', { style: { color: t.color || 'var(--text)' } }, cb, h('span', null, t.name));
        }));
      }));
      const errText = h('p.dc-error.dc-hidden', { role: 'alert' });
      const saveBtn = h('button.dc-btn', { type: 'button', onclick: save }, DC.icon('check', 18), T('edit.save'));
      const cancelBtn = h('button.dc-btn.outline', { type: 'button', onclick: leave }, T('edit.cancel'));
      f.err = errText;
      DC.append(el, [
        back,
        DC.ui.pageTitle({ icon: 'pencil', title: T('edit.title'), subtitle: DC.fmtDate(dreamDay(d), 'long') + ', ' + DC.fmtDate(c, 'time'), italic: true, bar: true }),
        notice,
        h('div.dc-journal-form', { oninput: changed, onchange: changed },
          h('div.dc-card.glow', null, cardTitle('sparkle', T('edit.entry')),
            field(T('edit.title_label'), f.title), field(T('edit.date'), f.date), field(T('edit.text'), f.text, a ? T('edit.text_hint') : null), DC.slotEl('writer', { input: f.text, changed: () => changed({ target: f.text }) }), errText),
          h('div.dc-card', null, cardTitle('list', T('edit.details')), h('p.dc-journal-hint.top', null, T('edit.details_sub')),
            h('div.dc-journal-grid', null,
              h('div', null, field(T('details.sleep_quality'), f.sleep)),
              h('div', null, field(T('details.ending'), f.ending))),
            h('div.dc-label', null, T('details.emotional_tone')), tonesEl,
            h('div.dc-journal-grid', null,
              h('div', null, field(T('details.people'), f.people)),
              h('div', null, field(T('details.dominant_emotion'), f.emotion))),
            field(T('details.sensations'), f.sens)),
          h('div.dc-card', null, cardTitle('layers', T('edit.categories')), groupsEl),
          h('div.dc-card.dc-journal-refcard', null, cardTitle('feather', T('edit.reflection')), h('p.dc-journal-hint.glow', null, T('edit.reflection_sub')), f.reflection),
          versionsCard(),
          h('div.dc-journal-bar', null, cancelBtn, saveBtn),
          h('div.dc-journal-danger', null, h('button.dc-btn.danger.small.auto', { type: 'button', onclick: del }, DC.icon('trash', 15), T('edit.delete'))))
      ]);
      fill(valuesOf(d));
      const dr = DC.ls.get(draftKey, null);
      if (dr && dr.v && typeof dr.v.text === 'string') {
        fill(dr.v);
        if (Object.keys(diff()).length) {
          notice.appendChild(h('div.dc-callout.dc-journal-callout', null, DC.icon('info', 18), h('span', null, T('edit.draft')),
            h('button.dc-link', { type: 'button', onclick: () => { clearDraft(); fill(valuesOf(base)); DC.clear(notice); } }, T('edit.draft_discard'))));
        } else clearDraft();
      }
      if (focus === 'reflection') setTimeout(() => { if (!alive || !f) return; f.reflection.focus({ preventScroll: true }); f.reflection.scrollIntoView({ block: 'center' }); }, 60);
    }
    // Long dreams: the text boxes grow with their content (up to most of the screen).
    function grow() {
      if (!f) return;
      [f.text, f.reflection].forEach(ta => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight + 2, Math.max(220, Math.round(window.innerHeight * 0.7))) + 'px'; });
    }
    function paintTones() {
      if (!tonesEl) return;
      tonesEl.querySelectorAll('button').forEach(b => { const on = toneSel.has(b.dataset.tone); b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
    }
    function fill(v) {
      const x = v.details || {};
      f.title.value = v.title || ''; f.date.value = v.dreamt_on || ''; f.text.value = v.text || ''; f.reflection.value = v.reflection || '';
      f.sleep.value = x.sleep_quality ? String(x.sleep_quality) : '';
      f.people.value = x.people || ''; f.emotion.value = x.dominant_emotion || '';
      f.ending.value = ENDINGS.indexOf(x.ending) >= 0 ? x.ending : ''; f.sens.value = x.sensations || '';
      toneSel = new Set((Array.isArray(x.emotional_tone) ? x.emotional_tone : []).filter(t => TONES.indexOf(t) >= 0));
      paintTones();
      const cats = new Set(v.categories || []);
      catBoxes.forEach((cb, tid) => { cb.checked = cats.has(tid); });
      requestAnimationFrame(grow);
    }
    function collect() {
      const bd = base.details || {};
      const det = Object.assign({}, bd);
      const put = (k, v) => { if (v === '' || v == null || (Array.isArray(v) && !v.length)) delete det[k]; else det[k] = v; };
      put('sleep_quality', f.sleep.value ? Number(f.sleep.value) : '');
      put('emotional_tone', (Array.isArray(bd.emotional_tone) ? bd.emotional_tone : []).filter(t => TONES.indexOf(t) < 0).concat(TONES.filter(t => toneSel.has(t))));
      put('people', f.people.value.trim()); put('dominant_emotion', f.emotion.value.trim());
      put('ending', f.ending.value); put('sensations', f.sens.value.trim());
      const prev = Array.isArray(base.categories) ? base.categories : [];
      const picked = []; catBoxes.forEach((cb, tid) => { if (cb.checked) picked.push(tid); });
      const cats = prev.filter(x => !catBoxes.has(x) || picked.indexOf(x) >= 0).concat(picked.filter(x => prev.indexOf(x) < 0));
      return {
        title: f.title.value.trim(),
        dreamt_on: /^\d{4}-\d{2}-\d{2}$/.test(f.date.value) ? f.date.value : dreamDay(base),
        text: f.text.value, categories: cats, details: det, reflection: f.reflection.value
      };
    }
    // Only the fields that differ from the dream as it was opened, so an edit made elsewhere to another field survives.
    function diff(cur) {
      cur = cur || collect();
      const p = {};
      if (cur.title !== String(base.title || '').trim()) p.title = cur.title;
      if (cur.dreamt_on !== dreamDay(base)) p.dreamt_on = cur.dreamt_on;
      if (cur.text !== String(base.text || '')) p.text = cur.text;
      if (cur.reflection !== String(base.reflection || '')) p.reflection = cur.reflection;
      if (cleanDetails(cur.details) !== cleanDetails(base.details)) p.details = cur.details;
      if (!sameList(cur.categories, base.categories)) p.categories = cur.categories;
      return p;
    }
    const dirtyNow = () => !!(base && f && Object.keys(diff()).length);
    function changed(ev) {
      if (!base || !f) return;
      if (ev && (ev.target === f.text || ev.target === f.reflection)) grow();
      if (f.err && !f.err.classList.contains('dc-hidden') && f.text.value.trim()) f.err.classList.add('dc-hidden');
      clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 400);
    }
    function saveDraft() {
      clearTimeout(draftTimer);
      if (!base || !f || discarded) return;
      if (Object.keys(diff()).length) DC.ls.set(draftKey, { at: Date.now(), base: base.updated_at, v: collect() });
      else DC.ls.del(draftKey);
    }
    function clearDraft() { clearTimeout(draftTimer); DC.ls.del(draftKey); }
    function exit() {
      if (view.fromList) { view.restoreScroll = true; history.back(); }
      else DC.go('#/journal', { replace: true });
    }
    async function leave() {
      if (dirtyNow()) {
        const ok = await DC.ui.confirm(T('edit.discard_title'), T('edit.discard_text'), T('edit.discard_ok'), 'danger');
        if (!ok) return;
      }
      clearDraft(); discarded = true; exit();
    }
    async function save() {
      if (!base || saving) return;
      const cur = collect();
      if (!cur.text.trim()) { f.err.textContent = T('edit.need_text'); f.err.classList.remove('dc-hidden'); f.text.focus(); return; }
      const p = diff(cur);
      if (!Object.keys(p).length) { clearDraft(); discarded = true; DC.ui.toast(T('edit.nochange')); exit(); return; }
      saving = true;
      try {
        const latest = await DC.store.getDream(id);
        if (!latest) { DC.ui.error(T('edit.missing_title')); return; }
        if (latest.deleted_at) {
          const ok = await DC.ui.confirm(T('edit.deleted_save_title'), T('edit.deleted_save_text'), T('edit.deleted_save_ok'));
          if (!ok) return;
          await DC.store.restoreDream(id);
        }
        base = await DC.store.saveDream(Object.assign({ id }, p));
        clearDraft(); discarded = true;
        DC.ui.toast(T('edit.saved'));
        if (p.text !== undefined && analysisOf(latest)) {
          let chose = false;
          DC.ui.modal({
            title: T('edit.refresh_title'), icon: 'refresh', body: T('edit.refresh_text') + (DC.signedIn() ? allowanceText() : ''), dismiss: false,
            actions: [
              { label: T('edit.refresh_ok'), icon: 'refresh', onClick: c => { chose = true; c(); analyzeDream(id, true, { confirmed: true, replace: true }); } },
              { label: T('edit.refresh_later'), kind: 'outline', onClick: c => { c(); } }
            ],
            onClose: () => { if (!chose && alive) exit(); }
          });
        } else exit();
      } catch (e) {
        DC.ui.error(e);
      } finally { saving = false; }
    }
    async function del() {
      saving = true;
      try { if (await deleteFlow(id)) { clearDraft(); discarded = true; exit(); } } finally { saving = false; }
    }

    // Version history (signed in): the server keeps earlier text and titles; restoring saves them as a new edit.
    function versionsCard() {
      if (!DC.signedIn()) return null;
      const box = h('div.dc-journal-versions');
      const btn = h('button.dc-btn.outline.small.auto', { type: 'button', onclick: loadVersions }, DC.icon('history', 16), T('versions.show'));
      async function loadVersions() {
        btn.classList.add('dc-hidden');
        DC.clear(box); box.appendChild(DC.ui.spinner(true));
        let revs;
        try { revs = ((await DC.api.get('/dreams/' + encodeURIComponent(id) + '/revisions')) || {}).revisions || []; }
        catch (e) {
          if (!alive) return;
          DC.clear(box);
          box.appendChild(h('p.dc-journal-note', null, e.status === 0 ? T('versions.offline') : e.status === 404 ? T('versions.none') : DC.api.message(e)));
          btn.classList.remove('dc-hidden');
          return;
        }
        if (!alive || !base) return;
        DC.clear(box);
        if (!revs.length) { box.appendChild(h('p.dc-journal-note', null, T('versions.none'))); return; }
        revs.forEach(r => {
          const same = String(r.text || '') === String(base.text || '') && String(r.title || '') === String(base.title || '');
          const txt = h('p.txt.dc-journal-clamp.l3', { title: T('versions.tap'), onclick: () => txt.classList.toggle('dc-journal-clamp') }, String(r.text || ''));
          box.appendChild(h('div.dc-journal-rev', null,
            h('div.meta', null, T('versions.item', { rev: r.rev != null ? r.rev : '?', date: r.saved_at ? DC.fmtDate(r.saved_at, 'short') + ', ' + DC.fmtDate(r.saved_at, 'time') : '' })),
            r.title ? h('div.ttl', null, r.title) : null,
            txt,
            h('button.dc-btn.outline.teal.small.auto', { type: 'button', disabled: same, onclick: () => restoreRev(r) }, DC.icon('history', 15), same ? T('versions.same') : T('versions.restore'))));
        });
      }
      return h('div.dc-card', null, cardTitle('history', T('versions.title')), h('p.dc-journal-hint.top', null, T('versions.hint')), btn, box);
    }
    async function restoreRev(r) {
      if (dirtyNow()) {
        const ok = await DC.ui.confirm(T('versions.replace_title'), T('versions.replace_text'), T('versions.replace_ok'));
        if (!ok) return;
      }
      saving = true;
      try {
        const cur = await DC.store.getDream(id);
        if (!cur || cur.deleted_at) return;
        const p = { id };
        if (typeof r.text === 'string' && r.text.trim() && r.text !== cur.text) p.text = r.text;
        if (typeof r.title === 'string' && r.title !== (cur.title || '')) p.title = r.title;
        if (Object.keys(p).length < 2) { DC.ui.toast(T('versions.same')); return; }
        const saved = await DC.store.saveDream(p);
        clearDraft();
        DC.ui.toast(T('versions.restored'));
        if (alive) build(saved);
      } catch (e) { DC.ui.error(e); } finally { saving = false; }
    }

    // Changes from sync or another screen while this view is open: never overwrite the form, offer the newer copy.
    const contentChanged = (x, y) => (x.title || '') !== (y.title || '') || (x.text || '') !== (y.text || '') || (x.reflection || '') !== (y.reflection || '') ||
      dreamDay(x) !== dreamDay(y) || cleanDetails(x.details) !== cleanDetails(y.details) || !sameList(x.categories, y.categories);
    const offs = [DC.on('dreams', async ev => {
      if (!alive || saving || (ev && ev.id && ev.id !== id)) return;
      const d = await DC.store.getDream(id);
      if (!alive || saving) return;
      if (!base) { if (d && !d.deleted_at && tax) build(d); return; }
      DC.clear(notice);
      if (!d || d.deleted_at) {
        notice.appendChild(h('div.dc-callout.blue.dc-journal-callout', null, DC.icon('alert-circle', 18), h('span', null, T('edit.deleted_here')),
          d ? h('button.dc-link', { type: 'button', onclick: async () => { saving = true; try { const r = await DC.store.restoreDream(id); base = Object.assign({}, base, { deleted_at: null, updated_at: r.updated_at }); DC.clear(notice); DC.ui.toast(T('delete.restored')); } finally { saving = false; } } }, T('edit.restore')) : null));
      } else if (contentChanged(d, base)) {
        notice.appendChild(h('div.dc-callout.blue.dc-journal-callout', null, DC.icon('info', 18), h('span', null, T('edit.changed')),
          h('button.dc-link', { type: 'button', onclick: () => { base = d; clearDraft(); fill(valuesOf(d)); DC.clear(notice); } }, T('edit.load_latest'))));
      }
    })];

    return () => {
      alive = false;
      offs.forEach(fn => fn());
      if (base && f && !discarded) saveDraft();
      const hsh = location.hash || '';
      const sameEdit = /[?&]edit=/.test(hsh) && hsh.indexOf(encodeURIComponent(id)) >= 0;
      const toList = hsh === '#/journal' || (hsh.indexOf('#/journal?') === 0 && !/[?&]edit=/.test(hsh));
      if (!sameEdit) view.fromList = false;
      if (!sameEdit && !toList) view.restoreScroll = false;
    };
  }

  DC.screen('journal', {
    route: '#/journal',
    title: 'journal.title',
    render(el, params, query) {
      if (query && query.edit) return renderEdit(el, query.edit, query.focus);
      return renderList(el);
    }
  });
})();
