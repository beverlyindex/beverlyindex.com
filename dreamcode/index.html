<script>/* web/src/screens/moderation.js */
/* Moderation queue (designed; moderators and admins only). Reported and automatically held community items,
   self-harm concerns first, with Keep, Remove, Remove and warn and the three suspensions. The server logs every action.
   Strings: i18n/<lang>/moderation.json (report reasons reuse community.reasons.*). Styles: styles/screens/moderation.css. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('moderation.' + k, v);
  const ACTIONS = [
    { id: 'keep', icon: 'check', kind: 'secondary' },
    { id: 'remove', icon: 'trash', kind: 'outline' },
    { id: 'remove_warn', icon: 'alert-triangle', kind: 'outline' },
    { id: 'suspend_7', icon: 'clock', kind: 'outline' },
    { id: 'suspend_30', icon: 'clock', kind: 'outline' },
    // The server's action is suspend_permanent; suspend_perm names its strings.
    { id: 'suspend_perm', action: 'suspend_permanent', icon: 'ban', kind: 'danger', confirm: true }
  ];
  const KINDS = ['post', 'comment', 'message', 'user'];
  const authorOf = x => (x && (x.user_id || x.author_id)) || null;
  const reasonLabel = k => {
    if (DC.hasT('community.reasons.' + k)) return DC.t('community.reasons.' + k);
    if (DC.hasT('moderation.reasons.' + k)) return T('reasons.' + k);
    return String(k || '');
  };

  // Accepts one item per report ({report, target}, as the mock sends) or one item per target with counted reasons,
  // and returns one entry per target: self-harm first, then held items, then the most reported, oldest first.
  function normalize(raw) {
    const groups = new Map();
    (raw || []).forEach(it => {
      if (!it) return;
      const r = it.report || null;
      const target = it.target || null;
      const kind = it.kind || (r && r.kind) || 'post';
      const tid = it.target_id || (r && r.target_id) || (target && target.id);
      if (!tid) return;
      const key = kind + ':' + tid;
      let g = groups.get(key);
      if (!g) {
        g = { key, kind: KINDS.indexOf(kind) >= 0 ? kind : 'post', target_id: tid, target, reasons: {}, notes: [], count: 0, held: false, auto: null, user_id: null, last_at: 0 };
        groups.set(key, g);
      }
      if (!g.target && target) g.target = target;
      g.user_id = g.user_id || it.user_id || authorOf(target) || (kind === 'user' ? tid : null);
      g.held = g.held || !!it.held || it.status === 'held' || !!(target && target.status === 'held');
      if (!r && it.reason && !it.reasons) g.auto = it.reason;
      if (it.auto_reason) g.auto = it.auto_reason;
      if (r) {
        const k = r.reason || 'other';
        g.reasons[k] = (g.reasons[k] || 0) + 1;
        g.count++;
        if (r.note) g.notes.push(String(r.note));
        g.last_at = Math.max(g.last_at, Number(r.created_at) || 0);
      }
      if (Array.isArray(it.reasons)) {
        it.reasons.forEach(x => { const k = typeof x === 'string' ? x : x && x.reason; if (k) g.reasons[k] = (g.reasons[k] || 0) + (typeof x === 'string' ? 1 : Number(x.count) || 1); });
      } else if (it.reasons && typeof it.reasons === 'object') {
        Object.keys(it.reasons).forEach(k => { g.reasons[k] = (g.reasons[k] || 0) + (Number(it.reasons[k]) || 0); });
      }
      const n = it.count != null ? it.count : it.reports;
      if (n != null) g.count = Math.max(g.count, Number(n) || 0);
      if (Array.isArray(it.notes)) it.notes.forEach(x => { if (x) g.notes.push(String(typeof x === 'string' ? x : x.note || '')); });
      if (it.last_at || it.created_at) g.last_at = Math.max(g.last_at, Number(it.last_at || it.created_at) || 0);
    });
    const list = Array.from(groups.values());
    list.forEach(g => {
      const sum = Object.keys(g.reasons).reduce((a, k) => a + g.reasons[k], 0);
      if (!g.count) g.count = sum;
      g.selfHarm = !!(g.reasons.self_harm || g.auto === 'self_harm');
    });
    list.sort((a, b) => (b.selfHarm - a.selfHarm) || (b.held - a.held) || (b.count - a.count) || (a.last_at - b.last_at));
    return list;
  }

  function itemCard(it, onDone) {
    const t = it.target;
    const kindKey = 'kinds.' + it.kind;
    const el = h('article.dc-card.dc-mod-item' + (it.selfHarm ? '.urgent' : ''));
    const pills = h('div.dc-pills.dc-mod-pills', null,
      DC.ui.pill(T(kindKey), { icon: it.kind === 'message' ? 'message-circle' : it.kind === 'comment' ? 'message-circle' : it.kind === 'user' ? 'user' : 'file-text' }),
      it.selfHarm ? h('span.dc-pill.dc-mod-urgent', null, DC.icon('alert-triangle', 13), reasonLabel('self_harm')) : null,
      it.held ? DC.ui.pill(T('held'), { cls: 'gold', icon: 'eye-off' }) : null);
    const meta = h('div.dc-mod-meta', null,
      it.count ? DC.tn('moderation.reports', it.count) : T('auto'),
      it.last_at ? h('span', null, ' · ' + DC.timeAgo(it.last_at)) : null);

    let content;
    if (t) {
      const text = String(t.text || '');
      const body = h('p.dc-mod-text', null, text);
      let more = null;
      if (text.length > 360) {
        body.classList.add('clamp');
        more = h('button.dc-link.dc-mod-more', { type: 'button', 'aria-expanded': 'false', onclick: () => {
          const open = !body.classList.toggle('clamp');
          more.textContent = open ? T('show_less') : T('show_all');
          more.setAttribute('aria-expanded', String(open));
        } }, T('show_all'));
      }
      content = h('div.dc-mod-content', null,
        h('div.dc-mod-author', null, DC.icon('user', 15), h('span.dc-mod-handle', null, t.handle || '?'), t.created_at ? h('span.dc-mod-time', null, DC.timeAgo(t.created_at)) : null),
        t.title ? h('div.dc-mod-title', null, t.title) : null,
        text ? body : null, more,
        Array.isArray(t.tags) && t.tags.length ? h('div.dc-pills.dc-mod-tags', null, t.tags.filter(x => x && (x.label || x.id)).map(x => h('span.dc-pill', null, (x.kind === 'type' ? '' : '#') + String(x.label || x.id)))) : null);
    } else {
      content = h('p.dc-mod-gone', null, DC.icon('eye-off', 15), T('gone'));
    }
    const reasonKeys = Object.keys(it.reasons).filter(k => it.reasons[k] > 0).sort((a, b) => (b === 'self_harm') - (a === 'self_harm') || it.reasons[b] - it.reasons[a]);
    const reasons = reasonKeys.length ? h('div.dc-mod-block', null,
      h('div.dc-mod-label', null, T('reasons_label')),
      h('div.dc-pills', null, reasonKeys.map(k => h('span.dc-pill' + (k === 'self_harm' ? '.dc-mod-urgent' : ''), null, reasonLabel(k) + (it.reasons[k] > 1 ? ' × ' + it.reasons[k] : ''))))) : null;
    const auto = it.auto ? h('div.dc-mod-auto', null, DC.icon('shield', 15), h('span', null, T('auto_reason', { reason: reasonLabel(it.auto) }))) : null;
    const notes = it.notes.length ? h('div.dc-mod-block', null,
      h('div.dc-mod-label', null, T('notes_label')),
      it.notes.slice(0, 6).map(n => h('p.dc-mod-note', null, n))) : null;
    const note = h('textarea.dc-textarea.dc-mod-note-in', { rows: '2', maxlength: '500', placeholder: T('note_ph'), 'aria-label': T('note_label') });
    const btns = ACTIONS.map(a => h('button.dc-btn.small' + (a.kind ? '.' + a.kind : ''), { type: 'button', onclick: () => act(a) }, DC.icon(a.icon, 16), T('actions.' + a.id)));

    async function act(a) {
      if (a.confirm) {
        const ok = await DC.ui.confirm(T('confirm_perm.title'), T('confirm_perm.text'), T('actions.' + a.id), 'danger');
        if (!ok) return;
      }
      btns.forEach(b => { b.disabled = true; });
      try {
        await DC.api.post('/mod/action', { kind: it.kind, target_id: it.target_id, action: a.action || a.id, note: note.value.trim() });
        DC.ui.toast(T('done.' + a.id));
        onDone();
      } catch (e) {
        btns.forEach(b => { b.disabled = false; });
        DC.ui.error(e);
      }
    }

    DC.append(el, [
      h('div.dc-mod-head', null, pills, meta),
      content, auto, reasons, notes,
      h('label.dc-label', null, T('note_label')), note,
      h('div.dc-mod-actions', null, btns)
    ]);
    return el;
  }

  // ---------- AI content: reports on AI-written analyses and Dream AI replies (Google Play AI-Generated Content policy) ----------
  // GET /mod/ai-reports?status=open|resolved and POST /mod/ai-reports/:id/resolve {resolution:'reviewed'|'dismissed', note}.
  // Only the reported AI text is shown, never the dream or who reported it. Returns {el, load}.
  function aiReportsView() {
    let status = 'open', loading = false, loaded = false;
    const listEl = h('div.dc-mod-list');
    const countEl = h('div.dc-mod-count', { 'aria-live': 'polite' });
    const refreshBtn = h('button.dc-btn.outline.small.auto', { type: 'button', onclick: () => load() }, DC.icon('refresh', 16), T('refresh'));
    const chips = h('div.dc-chips.dc-mod-ai-status', { role: 'group' });
    const drawChips = () => {
      DC.clear(chips);
      ['open', 'resolved'].forEach(s => chips.appendChild(h('button.dc-chip' + (s === status ? '.active' : ''), { type: 'button', 'aria-pressed': String(s === status), onclick: () => { if (s !== status) { status = s; drawChips(); load(); } } }, T('ai.' + s))));
    };
    const partLabel = it => (it.part === 'section' ? T('ai.section', { name: it.section || '' }) : T('ai.part.' + it.part));
    function card(it, onDone) {
      const text = String(it.text || '');
      const body = h('p.dc-mod-text', null, text);
      let more = null;
      if (text.length > 360) {
        body.classList.add('clamp');
        more = h('button.dc-link.dc-mod-more', { type: 'button', 'aria-expanded': 'false', onclick: () => {
          const opened = !body.classList.toggle('clamp');
          more.textContent = opened ? T('show_less') : T('show_all');
          more.setAttribute('aria-expanded', String(opened));
        } }, T('show_all'));
      }
      const el = h('article.dc-card.dc-mod-item' + (it.reason === 'harmful' && it.status === 'open' ? '.urgent' : ''));
      const pills = h('div.dc-pills.dc-mod-pills', null,
        DC.ui.pill(partLabel(it), { icon: it.part === 'chat' ? 'message-circle' : 'brain' }),
        h('span.dc-pill' + (it.reason === 'harmful' ? '.dc-mod-urgent' : ''), null, DC.icon('flag', 13), T('ai.reasons.' + it.reason)),
        it.status === 'resolved' && it.resolution ? DC.ui.pill(T('ai.resolution.' + it.resolution), { cls: 'gold', icon: 'check' }) : null);
      const meta = h('div.dc-mod-meta', null, DC.timeAgo(it.created_at), it.lang ? h('span', null, ' · ' + String(it.lang).toUpperCase()) : null,
        it.resolved_at ? h('span', null, ' · ' + T('ai.resolved_at', { when: DC.timeAgo(it.resolved_at) })) : null);
      const parts = [h('div.dc-mod-head', null, pills, meta),
        h('div.dc-mod-block', null, h('div.dc-mod-label', null, T('ai.text_label')), body, more),
        it.note ? h('div.dc-mod-block', null, h('div.dc-mod-label', null, T('ai.note_label')), h('p.dc-mod-note', null, it.note)) : null];
      if (it.status === 'open') {
        const note = h('textarea.dc-textarea.dc-mod-note-in', { rows: '2', maxlength: '500', placeholder: T('note_ph'), 'aria-label': T('note_label') });
        const btns = [['reviewed', 'check', 'secondary'], ['dismissed', 'x', 'outline']].map(([id, icon, kind]) =>
          h('button.dc-btn.small.' + kind, { type: 'button', onclick: () => act(id) }, DC.icon(icon, 16), T('ai.actions.' + id)));
        const act = async id => {
          btns.forEach(b => { b.disabled = true; });
          try {
            await DC.api.post('/mod/ai-reports/' + encodeURIComponent(it.id) + '/resolve', { resolution: id, note: note.value.trim() });
            DC.ui.toast(T('ai.done.' + id));
            onDone();
          } catch (e) { btns.forEach(b => { b.disabled = false; }); DC.ui.error(e); }
        };
        parts.push(h('label.dc-label', null, T('note_label')), note, h('div.dc-mod-actions', null, btns));
      }
      DC.append(el, parts);
      return el;
    }
    let items = [];
    function draw(open) {
      DC.clear(listEl);
      countEl.textContent = open ? DC.tn('moderation.ai.waiting', open) : '';
      if (!items.length) {
        const k = status === 'open' ? 'ai.empty' : 'ai.empty_resolved';
        listEl.appendChild(DC.ui.empty({ icon: 'brain', title: T(k + '.title'), text: T(k + '.text') }));
        return;
      }
      items.forEach(it => {
        const c = card(it, () => { items = items.filter(x => x.id !== it.id); c.remove(); open = Math.max(0, (open || 1) - 1); if (!items.length) draw(open); else countEl.textContent = open ? DC.tn('moderation.ai.waiting', open) : ''; });
        listEl.appendChild(c);
      });
    }
    async function load() {
      if (loading) return;
      loading = true; loaded = true;
      refreshBtn.disabled = true;
      DC.clear(listEl);
      listEl.appendChild(h('div.dc-mod-loading', null, DC.ui.spinner()));
      try {
        const r = await DC.api.get('/mod/ai-reports?status=' + status);
        if (!el.isConnected) return;
        items = Array.isArray(r && r.items) ? r.items : [];
        draw(Number(r && r.open) || 0);
      } catch (e) {
        DC.clear(listEl);
        countEl.textContent = '';
        listEl.appendChild(DC.ui.status('warn', e.status === 403 ? T('forbidden') : T('error'), e.status === 403 ? '' : DC.api.message(e), 'alert-triangle'));
      } finally { loading = false; refreshBtn.disabled = false; }
    }
    drawChips();
    const el = h('div.dc-mod-ai', null,
      h('div.dc-mod-bar', null, countEl, refreshBtn),
      chips,
      h('p.dc-mod-order', null, DC.icon('info', 14), h('span', null, T('ai.order_note'))),
      listEl);
    return { el, load: () => { if (!loaded) load(); } };
  }

  DC.screen('moderation', {
    route: '#/moderation',
    title: 'moderation.title',
    auth: 'mod',
    render(el) {
      let alive = true, items = [], loading = false;
      const listEl = h('div.dc-mod-list');
      const countEl = h('div.dc-mod-count', { 'aria-live': 'polite' });
      const refreshBtn = h('button.dc-btn.outline.small.auto', { type: 'button', onclick: () => load() }, DC.icon('refresh', 16), T('refresh'));
      // Two tabs: the community queue and the AI content reports (aiReportsView, loaded when first opened).
      const community = h('div.dc-mod-community', null,
        h('div.dc-mod-bar', null, countEl, refreshBtn),
        h('p.dc-mod-order', null, DC.icon('info', 14), h('span', null, T('order_note'))),
        listEl);
      const ai = aiReportsView();
      ai.el.classList.add('dc-hidden');
      const tabs = DC.ui.tabs([{ id: 'community', label: T('tabs.community'), icon: 'users' }, { id: 'ai', label: T('tabs.ai'), icon: 'brain' }], 'community', id => {
        community.classList.toggle('dc-hidden', id !== 'community');
        ai.el.classList.toggle('dc-hidden', id !== 'ai');
        if (id === 'ai') ai.load();
      });
      tabs.classList.add('dc-mod-tabs');
      DC.append(el, [
        DC.ui.pageTitle({ icon: 'shield', title: T('title'), subtitle: T('subtitle') }),
        tabs,
        community,
        ai.el
      ]);

      function draw() {
        DC.clear(listEl);
        countEl.textContent = items.length ? DC.tn('moderation.waiting', items.length) : '';
        if (!items.length) { listEl.appendChild(DC.ui.empty({ icon: 'shield', title: T('empty.title'), text: T('empty.text') })); return; }
        items.forEach(it => {
          const card = itemCard(it, () => { items = items.filter(x => x.key !== it.key); card.remove(); if (!items.length) draw(); else countEl.textContent = DC.tn('moderation.waiting', items.length); });
          listEl.appendChild(card);
        });
      }
      async function load() {
        if (loading) return;
        loading = true;
        refreshBtn.disabled = true;
        DC.clear(listEl);
        listEl.appendChild(h('div.dc-mod-loading', null, DC.ui.spinner()));
        try {
          const r = await DC.api.get('/mod/queue');
          if (!alive) return;
          items = normalize(r.items || r.queue || []);
          draw();
        } catch (e) {
          if (!alive) return;
          DC.clear(listEl);
          countEl.textContent = '';
          listEl.appendChild(DC.ui.status('warn', e.status === 403 ? T('forbidden') : T('error'), e.status === 403 ? '' : DC.api.message(e), 'alert-triangle'));
        } finally {
          loading = false;
          refreshBtn.disabled = false;
        }
      }
      load();
      return () => { alive = false; };
    }
  });
})();

</script>
<script>/* web/src/screens/practice-night.js */
/* DREAM CODE: the hidden practice module's night tools.
   Dream Incubation Night (a sealed practice target held overnight, then a blind comparison of the morning's dream with
   the real target and a decoy), the Edge of Sleep card, the dream nights chart, and the small cards the module adds to
   the dream writer and the dream page through DC.slot. practice.js calls DC.rvNight(api) once.
   Every string comes from the server's ui strings (T); nothing about the module is written here in words.
   Nights are kept in /rv/state under the key 'nights'. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;

  DC.rvNight = function (api) {
    const { T, has, getState, setState, paraEls, rand, coordinate } = api;
    const MAX_NIGHTS = 40, NIGHTS_BYTES = 19000;
    const WORD_CATS = ['color', 'texture', 'temperature', 'sound', 'smell', 'movement', 'size'];
    const HOUR = 3600 * 1000;
    const mem = { compare: null };   // { night id, dream id, scores } while a comparison is open (memory only)

    const raw = st => (st && st.raw) || {};
    const nightsOf = st => { const v = raw(st).nights; return Array.isArray(v) ? v.filter(n => n && typeof n === 'object' && n.id) : []; };
    const pendingOf = st => { const l = nightsOf(st); const n = l[l.length - 1]; return n && !n.done ? n : null; };
    const doneOf = st => nightsOf(st).filter(n => n.done && n.dream && typeof n.real === 'number' && typeof n.fake === 'number');
    const dreamTime = d => Number(d && (d.created_at || d.updated_at)) || 0;
    const dreamLabel = d => (d.title || String(d.text || '').slice(0, 40) || T('tools.dream.untitled')) + ' · ' + DC.fmtDate(d.created_at || Date.now(), 'short');
    // a dream counts for a night when it was written after the night began (and within two days of it)
    const fitsNight = (d, n) => { const t = dreamTime(d); return !!d && !d.deleted_at && t >= n.t && t <= n.t + 48 * HOUR; };

    const bytes = v => new TextEncoder().encode(JSON.stringify(v)).length;
    // the newest MAX_NIGHTS nights; the oldest completed nights go first if the value would pass the server's limit
    async function saveNights(list) {
      let out = list.slice(-MAX_NIGHTS);
      while (out.length > 1 && bytes(out) > NIGHTS_BYTES) out = out.slice(1);
      await setState('nights', out);
    }

    // ------------------------------------------------------------------ a 0 to 5 rating for one picture
    function rater(target, sc, label) {
      const slider = h('input.pr-range', { type: 'range', min: '0', max: '5', step: '1', value: String(sc.rating), 'aria-label': label });
      const val = h('div.pr-rate-v'), scale = h('div.pr-rate-scale');
      const show = () => { val.textContent = T('session.match', { n: sc.rating }, sc.rating + ' / 5'); scale.textContent = T('session.rate_scale.' + sc.rating); slider.value = String(sc.rating); };
      slider.addEventListener('input', () => { sc.rating = Number(slider.value); show(); });
      const d = target.descriptors || [];
      const chips = d.map((w, i) => {
        const b = h('button.dc-chip.pr-desc' + (sc.ticked.indexOf(i) >= 0 ? '.active' : ''), { type: 'button', 'aria-pressed': String(sc.ticked.indexOf(i) >= 0) }, DC.icon(sc.ticked.indexOf(i) >= 0 ? 'check' : 'plus', 14), w);
        b.addEventListener('click', () => {
          const k = sc.ticked.indexOf(i);
          if (k >= 0) sc.ticked.splice(k, 1); else sc.ticked.push(i);
          const on = sc.ticked.indexOf(i) >= 0;
          b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on));
          b.replaceChild(DC.icon(on ? 'check' : 'plus', 14), b.firstChild);
          sc.rating = Math.round(5 * sc.ticked.length / d.length);
          show();
        });
        return b;
      });
      show();
      return [d.length ? h('div.dc-chips.pr-descs', null, chips) : null, val, slider,
        h('div.pr-range-scale', { 'aria-hidden': 'true' }, [0, 1, 2, 3, 4, 5].map(n => h('span', null, String(n)))), scale];
    }

    // ------------------------------------------------------------------ the Dream Nights view (Exercises tab)
    function nightView(c, st, redraw, query) {
      const out = [];
      const pending = pendingOf(st);
      if (mem.compare && (!pending || mem.compare.night !== pending.id)) mem.compare = null;
      if (query && query.dream && pending && !mem.compare) {
        // a link from the journal or the dream page: open the comparison only for a dream that fits this night
        const id = String(query.dream);
        DC.store.getDream(id).then(d => { if (fitsNight(d, pending) && !mem.compare) { mem.compare = { night: pending.id, dream: id, scores: null }; redraw(); } }).catch(() => { /* stay on the night card */ });
      }

      if (!pending) out.push(startCard(c, st, redraw));
      else if (mem.compare && mem.compare.dream) out.push(compareCard(c, st, pending, redraw));
      else out.push(pendingCard(c, st, pending, redraw));

      const last = doneOf(st).slice(-1)[0];
      if (!pending && last && last.done > Date.now() - 6 * HOUR) out.unshift(resultCard(c, last));
      out.push(edgeCard());
      return out;
    }

    function startCard(c, st, redraw) {
      const btn = h('button.dc-btn', { type: 'button' }, DC.icon('moon', 18), T('night.begin', null, DC.t('core.continue')));
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const recent = nightsOf(st).slice(-5).map(n => n.target);
          let pool = c.targets.filter(t => recent.indexOf(t.id) < 0);
          if (pool.length < 2) pool = c.targets;
          if (pool.length < 2) throw new Error(T('session.unavailable'));
          const target = pool[rand(pool.length)].id;
          const others = c.targets.filter(t => t.id !== target);
          const fresh = pool.filter(t => t.id !== target);
          const dpool = fresh.length ? fresh : others;
          const decoy = dpool[rand(dpool.length)].id;
          const night = { id: DC.uuid(), t: Date.now(), ref: coordinate().join(' '), target, decoy, order: rand(2) ? 'td' : 'dt' };
          const now = await getState();
          await saveNights(nightsOf(now).filter(n => n.done).concat([night]));
          redraw();
          window.scrollTo(0, 0);
        } catch (e) { btn.disabled = false; DC.ui.error(e); }
      });
      const done = doneOf(st).length;
      return h('div.dc-card.glow.pr-night', null,
        h('div.pr-tool-head', null, DC.icon('moon', 20), h('h3.pr-title-teal', null, T('night.title'))),
        h('div.pr-prose', null, paraEls(String(T('night.intro')).split(/\n\s*\n/).filter(Boolean))),
        has('night.how_title') ? h('h4.pr-bh4', null, T('night.how_title')) : null,
        h('ol.pr-steps-ol', null, String(T('night.how')).split(/\n+/).filter(Boolean).map((t, i) => h('li', null, h('span.pr-stepn', null, String(i + 1)), h('span', null, t)))),
        btn,
        h('p.pr-note', null, T('night.count', { n: done }, String(done))));
    }

    function pendingCard(c, st, n, redraw) {
      const ref = String(n.ref || '').split(/\s+/);
      const sel = h('select.dc-select', { id: 'pr-night-dream', 'aria-label': T('night.choose') }, h('option', { value: '' }, T('night.choose_none')));
      const go = h('button.dc-btn', { type: 'button', disabled: true }, DC.icon('layers', 18), T('night.compare', null, DC.t('core.continue')));
      sel.addEventListener('change', () => { go.disabled = !sel.value; });
      go.addEventListener('click', () => { if (!sel.value) return; mem.compare = { night: n.id, dream: sel.value, scores: null }; redraw(); window.scrollTo(0, 0); });
      const empty = h('p.pr-note.left.dc-hidden', null, T('night.no_dream'));
      DC.store.allDreams().then(list => {
        const fit = list.filter(d => !d.deleted_at && fitsNight(d, n)).slice(0, 20);
        fit.forEach(d => sel.appendChild(h('option', { value: d.id }, dreamLabel(d))));
        if (fit.length === 1) { sel.value = fit[0].id; go.disabled = false; }
        if (!fit.length) { sel.disabled = true; empty.classList.remove('dc-hidden'); }
      }).catch(() => { sel.disabled = true; });
      const cancel = h('button.dc-link.pr-night-cancel', { type: 'button' }, T('night.cancel'));
      cancel.addEventListener('click', async () => {
        const ok = await DC.ui.confirm(T('night.cancel_title', null, T('night.cancel')), T('night.cancel_text'), T('night.cancel_ok', null, DC.t('core.ok')), 'danger');
        if (!ok) return;
        try { const now = await getState(); await saveNights(nightsOf(now).filter(x => x.id !== n.id)); mem.compare = null; redraw(); } catch (e) { DC.ui.error(e); }
      });
      return [
        h('div.dc-card.glow.pr-coord.pr-night-ref', null,
          h('div.pr-coord-l', null, T('night.ref')),
          h('div.pr-coord-v', { 'aria-label': ref.join(' ') }, ref.map(g => h('span', null, g))),
          h('p.pr-note', null, T('night.ref_note', { date: DC.fmtDate(n.t, 'long') }, ''))),
        h('div.dc-card.pr-night', null,
          h('h3.pr-card-h', null, T('night.tonight_title')),
          h('ol.pr-steps-ol', null, String(T('night.tonight')).split(/\n+/).filter(Boolean).map((t, i) => h('li', null, h('span.pr-stepn', null, String(i + 1)), h('span', null, t))))),
        h('div.dc-card.pr-night', null,
          h('h3.pr-card-h', null, T('night.morning_title')),
          h('p.pr-muted', null, T('night.morning')),
          h('button.dc-btn.outline.teal', { type: 'button', onclick: () => DC.go('#/analyze') }, DC.icon('pencil', 18), T('night.record')),
          h('label.dc-label', { for: 'pr-night-dream' }, T('night.choose')),
          sel, empty, go,
          h('div.pr-night-foot', null, cancel))
      ];
    }

    function compareCard(c, st, n, redraw) {
      const cmp = mem.compare;
      const t = c.targets.find(x => x.id === n.target), dco = c.targets.find(x => x.id === n.decoy);
      if (!t || !dco) { mem.compare = null; return pendingCard(c, st, n, redraw); }
      const pics = n.order === 'dt' ? [dco, t] : [t, dco];
      if (!cmp.scores) cmp.scores = [{ ticked: [], rating: 0 }, { ticked: [], rating: 0 }];
      const dreamBox = h('div.dc-card.pr-yours', null, h('h3.pr-card-h', null, T('night.your_dream')), DC.ui.spinner());
      DC.store.getDream(cmp.dream).then(d => {
        DC.clear(dreamBox);
        DC.append(dreamBox, [h('h3.pr-card-h', null, T('night.your_dream')),
          d ? [d.title ? h('div.pr-hnote-t', null, d.title) : null, h('p.pr-night-dtext', null, String(d.text || ''))] : h('p.pr-note.left', null, T('night.dream_missing', null, T('night.no_dream')))]);
      }).catch(() => { /* the comparison still works without the text */ });
      const reveal = h('button.dc-btn', { type: 'button' }, DC.icon('eye', 18), T('night.reveal', null, DC.t('core.continue')));
      reveal.addEventListener('click', async () => {
        reveal.disabled = true;
        try {
          const d = await DC.store.getDream(cmp.dream);
          if (!fitsNight(d, n)) { reveal.disabled = false; DC.ui.error(T('night.dream_missing', null, T('night.no_dream'))); return; }
          const realIdx = n.order === 'dt' ? 1 : 0;
          const now = await getState();
          const list = nightsOf(now).map(x => x.id !== n.id ? x : Object.assign({}, x, {
            done: Date.now(),
            dream: { id: String(cmp.dream), title: String((d && (d.title || String(d.text || '').slice(0, 60))) || '').slice(0, 80) },
            real: Number(cmp.scores[realIdx].rating) || 0, fake: Number(cmp.scores[1 - realIdx].rating) || 0
          }));
          await saveNights(list);
          mem.compare = null;
          if (has('night.saved_toast')) DC.ui.toast(T('night.saved_toast'));
          redraw(); window.scrollTo(0, 0);
        } catch (e) { reveal.disabled = false; DC.ui.error(e); }
      });
      const back = h('button.dc-btn.outline', { type: 'button', onclick: () => { mem.compare = null; redraw(); } }, DC.icon('arrow-left', 18), T('night.back', null, DC.t('core.back')));
      return [
        h('div.dc-card.glow.pr-night', null,
          h('div.pr-tool-head', null, DC.icon('layers', 20), h('h3.pr-title-teal', null, T('night.compare_title'))),
          h('p.pr-muted', null, T('night.compare_text'))),
        dreamBox,
        pics.map((p, i) => h('div.dc-card.pr-rate.pr-night-pic', null,
          h('div.pr-coord-l', null, T('night.picture', { x: i ? 'B' : 'A' }, i ? 'B' : 'A')),
          h('h3.pr-decoy-title', null, p.title),
          h('div.pr-prose', null, paraEls(p.description)),
          rater(p, cmp.scores[i], T('night.picture', { x: i ? 'B' : 'A' }, '')))),
        h('div.pr-nav', null, back, reveal)
      ];
    }

    function resultCard(c, n) {
      const t = c.targets.find(x => x.id === n.target), dco = c.targets.find(x => x.id === n.decoy);
      const verdict = n.real > n.fake ? 'above' : n.real < n.fake ? 'below' : 'same';
      return h('div.dc-card.glow.pr-night.pr-night-result', null,
        h('div.pr-tool-head', null, DC.icon('check-circle', 20), h('h3.pr-title-teal', null, T('night.result_title'))),
        h('ul.pr-rec-list', null,
          h('li.pr-rec-row.ok', null, DC.icon('target', 18), h('span', null, T('night.real', { title: t ? t.title : '' }, '')), h('span.pr-rec-v', null, n.real + ' / 5')),
          h('li.pr-rec-row', null, DC.icon('layers', 18), h('span', null, T('night.decoy', { title: dco ? dco.title : '' }, '')), h('span.pr-rec-v', null, n.fake + ' / 5'))),
        h('p.pr-muted', null, T('night.verdict.' + verdict)),
        n.dream && n.dream.id ? h('button.dc-link.pr-hdream', { type: 'button', onclick: () => DC.go('#/dream/' + encodeURIComponent(n.dream.id)) }, DC.icon('moon', 14), T('tools.dream.linked', { title: n.dream.title || '' }, n.dream.title || '')) : null);
    }

    function edgeCard() {
      return h('div.dc-card.pr-night.pr-edge-card', null,
        h('div.pr-tool-head', null, DC.icon('sunrise', 20), h('h3.pr-title-teal', null, T('edge.title'))),
        h('div.pr-prose', null, paraEls(String(T('edge.text')).split(/\n\s*\n/).filter(Boolean))),
        h('button.dc-btn.outline.teal', { type: 'button', onclick: () => api.beginEdge() }, DC.icon('moon', 18), T('edge.begin', null, DC.t('core.continue'))));
    }

    // ------------------------------------------------------------------ the dream nights chart (Progress tab)
    function nightsChart(st) {
      const list = doneOf(st).sort((a, b) => a.done - b.done);
      const card = h('div.dc-card.pr-calib.pr-calib-night');
      DC.append(card, [h('h3.pr-card-h', null, T('night.chart.title')), h('p.pr-muted', null, T('night.chart.text'))]);
      if (!list.length) { card.appendChild(DC.ui.empty({ icon: 'moon', title: T('night.chart.empty.title'), text: T('night.chart.empty.text') })); return card; }
      return api.chart(card, list.map(n => ({ real: n.real, decoy: n.fake, t: n.done })), 'night.chart');
    }

    // ------------------------------------------------------------------ slots: the dream writer and the dream page
    function writerCard(st, ctx) {
      const w = (raw(st).words && typeof raw(st).words === 'object') ? raw(st).words : {};
      const cats = WORD_CATS.filter(k => Array.isArray(w[k]) && w[k].length);
      const insert = word => {
        const el = ctx.input; if (!el) return;
        const v = el.value, a = el.selectionStart != null ? el.selectionStart : v.length, b = el.selectionEnd != null ? el.selectionEnd : v.length;
        const before = v.slice(0, a), after = v.slice(b);
        const pre = before && !/[\s(]$/.test(before) ? (/[.!?:;,]$/.test(before) ? ' ' : ', ') : '';
        const ins = pre + word;
        el.value = before + ins + after;
        const p = a + ins.length;
        try { el.setSelectionRange(p, p); } catch (e) { /* ignore */ }
        el.dispatchEvent(new Event('input', { bubbles: true }));
        if (ctx.changed) ctx.changed();
      };
      const det = h('details.pr-fig-ref.pr-mine.pr-writer-words', null,
        h('summary', null, DC.icon('book-open', 16), h('span', null, T('slot.words.title'))),
        h('p.pr-note.left', null, T(cats.length ? 'slot.words.text' : 'slot.words.empty')),
        (cats.length ? cats : WORD_CATS).map(k => h('div.pr-wcat.small', null,
          h('div.pr-wcat-h', null, T('tools.words.cat.' + k)),
          cats.length ? h('div.pr-chips-wrap', null, w[k].map(v => h('button.pr-wchip.pr-wchip-add', { type: 'button', onclick: () => insert(v) }, DC.icon('plus', 12), v))) : null)));
      return h('div.pr-slot', null, det);
    }

    function dreamCard(c, st, d) {
      if (!d || !d.id) return null;
      const sessions = (st.sessions || []).filter(s => s.dream && s.dream.id === d.id);
      const nights = nightsOf(st).filter(n => n.done && n.dream && n.dream.id === d.id);
      const pending = pendingOf(st);
      const offer = pending && fitsNight(d, pending) && !nights.length;
      if (!sessions.length && !nights.length && !offer) return null;
      const rows = [];
      nights.forEach(n => {
        const t = c.targets.find(x => x.id === n.target);
        rows.push(h('li.pr-rec-row.ok', null, DC.icon('moon', 18),
          h('button.dc-link', { type: 'button', onclick: () => DC.go('#/practice?tab=progress') }, T('slot.dream.night', { date: DC.fmtDate(n.t, 'short'), title: t ? t.title : '' }, '')),
          h('span.pr-rec-v', null, n.real + ' · ' + n.fake)));
      });
      sessions.forEach(s => {
        const t = c.targets.find(x => x.id === s.target);
        rows.push(h('li.pr-rec-row.ok', null, DC.icon('target', 18),
          h('button.dc-link', { type: 'button', onclick: () => DC.go('#/practice?tab=progress') }, T('slot.dream.session', { date: DC.fmtDate(s.t || Date.now(), 'short'), title: t ? t.title : '' }, '')),
          typeof s.match === 'number' ? h('span.pr-rec-v', null, s.match + ' / 5') : null));
      });
      return h('div.dc-card.glow.pr-slot.pr-slot-dream', null,
        h('div.pr-tool-head', null, DC.icon('link', 20), h('h3.pr-title-teal', null, T('slot.dream.title'))),
        rows.length ? [h('p.pr-muted', null, T('slot.dream.text')), h('ul.pr-rec-list', null, rows)] : null,
        offer ? h('div.pr-slot-offer', null,
          h('p', null, T('slot.dream.offer', { ref: pending.ref }, '')),
          h('button.dc-btn.auto', { type: 'button', onclick: () => DC.go('#/practice?tab=exercises&chip=night&dream=' + encodeURIComponent(d.id)) }, DC.icon('layers', 18), T('night.compare'))) : null);
    }

    return { nightView, nightsChart, writerCard, dreamCard, doneOf, pendingOf, fitsNight, reset: () => { mem.compare = null; } };
  };
})();

</script>
<script>/* web/src/screens/practice-tools.js */
/* DREAM CODE: the hidden practice module's personal tools and the course record.
   My Ideogram, My Word Bank, My Practice Rules, the calibration chart, the dream link, exercise tick-off, the module
   knowledge checks and the course completion record. practice.js calls DC.rvTools(api) once and uses what it returns.
   Every string comes from the server's ui strings (T); nothing about the module is written here in words.
   Personal tools are kept in /rv/state under their own keys: ideo1..ideo7, words, rules, exercises. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;

  DC.rvTools = function (api) {
    const { T, has, getState, setState, paraEls } = api;
    const N = 7;                                   // the seven categories of the ideogram key
    const WORD_CATS = ['color', 'texture', 'temperature', 'sound', 'smell', 'movement', 'size'];
    const WORD_MAX = 60, WORD_LEN = 30, RULES_MAX = 1500;

    const raw = st => (st && st.raw) || {};
    const fmtDate = t => DC.fmtDate(t, 'long');

    // ------------------------------------------------------------------ drawing pad (My Ideogram)
    function pad(n, current, onSaved) {
      const S = 320;
      const cv = h('canvas.pr-pad', { width: String(S), height: String(S), role: 'img', 'aria-label': T('tools.ideo.pad_label', { n, name: T('figure.categories.' + n) }, '') });
      const ctx = cv.getContext('2d');
      const bg = () => { ctx.fillStyle = '#0A0E16'; ctx.fillRect(0, 0, S, S); };
      const pen = () => { ctx.strokeStyle = '#E4FCFC'; ctx.fillStyle = '#E4FCFC'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; };
      bg(); pen();
      let drawn = false;
      if (current) { const img = new Image(); img.onload = () => { ctx.drawImage(img, 0, 0, S, S); pen(); drawn = true; }; img.src = current; }
      let down = false, last = null;
      const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * S / r.width, y: (e.clientY - r.top) * S / r.height }; };
      cv.addEventListener('pointerdown', e => { e.preventDefault(); down = true; drawn = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } ctx.beginPath(); ctx.arc(last.x, last.y, 3, 0, Math.PI * 2); ctx.fill(); });
      cv.addEventListener('pointermove', e => { if (!down) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
      const end = () => { down = false; };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
      const err = h('div.dc-error.dc-hidden', { role: 'alert' });
      const m = DC.ui.modal({
        title: T('tools.ideo.pad_title', { n, name: T('figure.categories.' + n) }, String(n)),
        body: h('div.pr-padwrap', null, h('p.pr-muted', null, T('tools.ideo.pad_hint')), cv, err),
        actions: [
          { label: T('tools.ideo.save', null, DC.t('core.save')), icon: 'check', onClick: async close => {
            if (!drawn) { close(); return; }
            const sm = document.createElement('canvas'); sm.width = 160; sm.height = 160;
            sm.getContext('2d').drawImage(cv, 0, 0, 160, 160);
            let url = '';
            try { url = sm.toDataURL('image/png'); } catch (e) { url = ''; }
            if (!url) { close(); return; }
            try { await setState('ideo' + n, { img: url, t: Date.now() }); close(); onSaved(); if (has('tools.ideo.saved')) DC.ui.toast(T('tools.ideo.saved')); }
            catch (e) { err.textContent = DC.api.message(e); err.classList.remove('dc-hidden'); }
          } },
          { label: T('tools.ideo.clear', null, DC.t('core.delete')), kind: 'outline', onClick: () => { bg(); pen(); drawn = false; } },
          { label: DC.t('core.cancel'), kind: 'outline' }
        ]
      });
      m.el.classList.add('pr-padmodal');
    }
    const marks = st => { const r = raw(st), out = {}; for (let n = 1; n <= N; n++) { const v = r['ideo' + n]; if (v && v.img) out[n] = v.img; } return out; };

    function ideogramCard(st, redraw) {
      const mk = marks(st);
      const count = Object.keys(mk).length;
      return h('div.dc-card.glow.pr-tool', null,
        h('div.pr-tool-head', null, DC.icon('pencil', 20), h('h3.pr-title-teal', null, T('tools.ideo.title'))),
        h('p.pr-muted', null, T('tools.ideo.text')),
        h('div.pr-ideo-grid', null, Array.from({ length: N }, (x, i) => {
          const n = i + 1;
          return h('button.pr-ideo-tile' + (mk[n] ? '.has' : ''), { type: 'button', onclick: () => pad(n, mk[n], redraw), 'aria-label': T('tools.ideo.tile_label', { n, name: T('figure.categories.' + n) }, String(n)) },
            mk[n] ? h('img', { src: mk[n], alt: '' }) : h('span.pr-ideo-empty', null, DC.icon('plus', 20)),
            h('span.pr-ideo-cap', null, h('b', null, String(n)), ' ', T('figure.categories.' + n)));
        })),
        h('p.pr-note.left', null, T('tools.ideo.count', { n: count, total: N }, count + ' / ' + N)));
    }
    // Shown, folded, at Stage 1 of a session.
    function ideogramFolded(st) {
      const mk = marks(st);
      if (!Object.keys(mk).length) return null;
      return h('details.pr-fig-ref.pr-mine', null,
        h('summary', null, DC.icon('pencil', 16), h('span', null, T('tools.ideo.folded'))),
        h('div.pr-ideo-grid.small', null, Object.keys(mk).map(n => h('div.pr-ideo-tile.has.static', null, h('img', { src: mk[n], alt: '' }), h('span.pr-ideo-cap', null, h('b', null, n), ' ', T('figure.categories.' + n))))));
    }

    // ------------------------------------------------------------------ My Word Bank
    const words = st => { const w = raw(st).words; return w && typeof w === 'object' ? w : {}; };
    function wordsCard(st, redraw) {
      const w = words(st);
      const total = WORD_CATS.reduce((a, k) => a + (Array.isArray(w[k]) ? w[k].length : 0), 0);
      const save = async next => { try { await setState('words', next); redraw(); } catch (e) { DC.ui.error(e); } };
      return h('div.dc-card.glow.pr-tool', null,
        h('div.pr-tool-head', null, DC.icon('book-open', 20), h('h3.pr-title-teal', null, T('tools.words.title'))),
        h('p.pr-muted', null, T('tools.words.text')),
        WORD_CATS.map(k => {
          const list = Array.isArray(w[k]) ? w[k] : [];
          const id = 'pr-word-' + k;
          const input = h('input.dc-input.pr-word-in', { id, type: 'text', maxlength: String(WORD_LEN), autocomplete: 'off', placeholder: T('tools.words.placeholder'), enterkeyhint: 'done' });
          const add = () => {
            const v = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
            if (!v || list.indexOf(v) >= 0 || list.length >= WORD_MAX) { input.value = ''; return; }
            save(Object.assign({}, w, { [k]: list.concat([v]) }));
          };
          input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
          return h('div.pr-wcat', null,
            h('label.pr-wcat-h', { for: id }, T('tools.words.cat.' + k)),
            h('div.pr-chips-wrap', null, list.map(v => h('span.pr-wchip', null, v,
              h('button.pr-wchip-x', { type: 'button', 'aria-label': T('tools.words.remove', { word: v }, v), onclick: () => save(Object.assign({}, w, { [k]: list.filter(x => x !== v) })) }, DC.icon('x', 12))))),
            h('div.pr-word-add', null, input, h('button.dc-btn.small.outline.auto', { type: 'button', onclick: add }, DC.icon('plus', 15), T('tools.words.add', null, '+'))));
        }),
        h('p.pr-note.left', null, T('tools.words.count', { n: total }, String(total))));
    }
    // Shown, folded, at Stages 2 and 4.
    function wordsFolded(st) {
      const w = words(st);
      const cats = WORD_CATS.filter(k => Array.isArray(w[k]) && w[k].length);
      if (!cats.length) return null;
      return h('details.pr-fig-ref.pr-mine', null,
        h('summary', null, DC.icon('book-open', 16), h('span', null, T('tools.words.folded'))),
        cats.map(k => h('div.pr-wcat.small', null, h('div.pr-wcat-h', null, T('tools.words.cat.' + k)), h('div.pr-chips-wrap', null, w[k].map(v => h('span.pr-wchip.static', null, v))))));
    }

    // ------------------------------------------------------------------ My Practice Rules
    const rules = st => { const r = raw(st).rules; return r && typeof r === 'object' && r.text ? r : null; };
    function rulesCard(st, redraw) {
      const r = rules(st);
      const ta = h('textarea.dc-textarea.pr-rules-ta', { id: 'pr-rules', maxlength: String(RULES_MAX), rows: '8', placeholder: T('tools.rules.placeholder'), value: r ? r.text : '' });
      const btn = h('button.dc-btn.auto', { type: 'button' }, DC.icon('check', 18), T('tools.rules.sign', null, DC.t('core.save')));
      btn.addEventListener('click', async () => {
        const text = ta.value.trim();
        if (!text) { ta.focus(); return; }
        btn.disabled = true;
        try { await setState('rules', { text, signed_at: Date.now() }); if (has('tools.rules.saved')) DC.ui.toast(T('tools.rules.saved')); redraw(); }
        catch (e) { btn.disabled = false; DC.ui.error(e); }
      });
      return h('div.dc-card.glow.pr-tool', null,
        h('div.pr-tool-head', null, DC.icon('shield', 20), h('h3.pr-title-teal', null, T('tools.rules.title'))),
        h('p.pr-muted', null, T('tools.rules.text')),
        has('tools.rules.cover') ? DC.ui.bullets(api.items(T('tools.rules.cover'))) : null,
        h('label.dc-label', { for: 'pr-rules' }, T('tools.rules.label')), ta,
        h('div.pr-rules-foot', null,
          r ? h('span.dc-pill', null, DC.icon('check', 12), T('tools.rules.signed', { date: fmtDate(r.signed_at) }, fmtDate(r.signed_at))) : h('span'),
          btn));
    }
    // Shown, folded, at the start of each session.
    function rulesFolded(st) {
      const r = rules(st);
      if (!r) return null;
      return h('details.pr-fig-ref.pr-mine', { open: true }, h('summary', null, DC.icon('shield', 16), h('span', null, T('tools.rules.folded'))),
        h('div.pr-rules-read', null, r.text.split(/\n+/).map(x => x.trim()).filter(Boolean).map(x => h('p', null, x))),
        h('p.pr-note.left', null, T('tools.rules.signed', { date: fmtDate(r.signed_at) }, '')));
    }

    // ------------------------------------------------------------------ calibration chart (real vs decoy)
    // Running averages over the sessions that have a decoy score, in the order they were done. One axis (0 to 5),
    // two series told apart by line style and direct labels as well as colour; a crosshair tooltip on hover or touch.
    function calibration(st) {
      const list = (st.sessions || []).filter(s => s && typeof s.match === 'number' && s.decoy && typeof s.decoy.match === 'number').sort((a, b) => (a.t || 0) - (b.t || 0));
      const card = h('div.dc-card.pr-calib');
      DC.append(card, [h('h3.pr-card-h', null, T('tools.calib.title')), h('p.pr-muted', null, T('tools.calib.text'))]);
      if (!list.length) { card.appendChild(DC.ui.empty({ icon: 'trending-up', title: T('tools.calib.empty.title'), text: T('tools.calib.empty.text') })); return card; }
      return chart(card, list.map(s => ({ real: s.match, decoy: s.decoy.match, t: s.t })), 'tools.calib');
    }
    // Running averages of real and decoy scores on one 0 to 5 axis, with direct labels, a tooltip and a table.
    // K is the string prefix (tools.calib for sessions, night.chart for dream nights); shared labels fall back to tools.calib.
    function chart(card, rows, K) {
      const TK = (k, v) => (has(K + '.' + k) ? T(K + '.' + k, v, '') : T('tools.calib.' + k, v, ''));
      const list = rows.map(r => ({ match: r.real, decoy: { match: r.decoy }, t: r.t }));
      let sr = 0, sd = 0;
      const pts = list.map((s, i) => { sr += s.match; sd += s.decoy.match; return { i, real: sr / (i + 1), decoy: sd / (i + 1), r1: s.match, d1: s.decoy.match, t: s.t }; });
      const lastP = pts[pts.length - 1];
      const W = 600, H = 340, L = 40, R = 132, TOP = 18, B = 42;
      const x = i => L + (pts.length === 1 ? (W - L - R) / 2 : i * (W - L - R) / (pts.length - 1));
      const y = v => TOP + (5 - v) * (H - TOP - B) / 5;
      const path = k => pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[k]).toFixed(1)).join(' ');
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('class', 'pr-calib-svg'); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', TK('aria', { real: lastP.real.toFixed(1), decoy: lastP.decoy.toFixed(1), n: pts.length }));
      let s = '';
      for (let v = 0; v <= 5; v++) s += '<line class="g" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/><text class="ax" x="' + (L - 10) + '" y="' + (y(v) + 7) + '" text-anchor="end">' + v + '</text>';
      const step = Math.max(1, Math.ceil(pts.length / 6));
      pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) s += '<text class="ax" x="' + x(i) + '" y="' + (H - 12) + '" text-anchor="middle">' + (i + 1) + '</text>'; });
      s += '<path class="ln decoy" d="' + path('decoy') + '"/><path class="ln real" d="' + path('real') + '"/>';
      s += '<circle class="dot real" cx="' + x(lastP.i) + '" cy="' + y(lastP.real) + '" r="8"/><circle class="dot decoy" cx="' + x(lastP.i) + '" cy="' + y(lastP.decoy) + '" r="8"/>';
      let ly1 = y(lastP.real), ly2 = y(lastP.decoy);
      if (Math.abs(ly1 - ly2) < 26) { const mid = (ly1 + ly2) / 2; if (ly1 <= ly2) { ly1 = mid - 13; ly2 = mid + 13; } else { ly1 = mid + 13; ly2 = mid - 13; } }
      s += '<text class="lab" x="' + (x(lastP.i) + 14) + '" y="' + (ly1 + 7) + '">' + DC.esc(TK('real_short')) + ' ' + lastP.real.toFixed(1) + '</text>';
      s += '<text class="lab" x="' + (x(lastP.i) + 14) + '" y="' + (ly2 + 7) + '">' + DC.esc(TK('decoy_short')) + ' ' + lastP.decoy.toFixed(1) + '</text>';
      s += '<line class="cross" x1="0" x2="0" y1="' + TOP + '" y2="' + (H - B) + '" visibility="hidden"/>';
      svg.innerHTML = s;
      const tip = h('div.pr-calib-tip.dc-hidden', { role: 'status' });
      const wrap = h('div.pr-calib-wrap', null, svg, tip);
      const cross = svg.querySelector('.cross');
      const show = e => {
        const r = svg.getBoundingClientRect();
        const px = (e.clientX - r.left) * W / r.width;
        let best = 0; pts.forEach((p, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
        const p = pts[best];
        cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.setAttribute('visibility', 'visible');
        tip.textContent = TK('tip', { n: best + 1, real: p.real.toFixed(1), decoy: p.decoy.toFixed(1), r1: p.r1, d1: p.d1 });
        tip.classList.remove('dc-hidden');
        tip.style.left = Math.min(Math.max(0, (x(best) / W) * r.width - 80), r.width - 170) + 'px';
      };
      svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
      svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tip.classList.add('dc-hidden'); });
      const diff = lastP.real - lastP.decoy;
      const verdict = pts.length < 5 ? 'few' : Math.abs(diff) < 0.5 ? 'close' : diff > 0 ? 'above' : 'below';
      DC.append(card, [
        h('div.pr-calib-legend', null,
          h('span.pr-leg', null, h('i.real'), TK('real')),
          h('span.pr-leg', null, h('i.decoy'), TK('decoy'))),
        wrap,
        h('div.pr-calib-x', null, TK('x')),
        h('p.pr-calib-sum', null, TK('summary', { n: pts.length, real: lastP.real.toFixed(1), decoy: lastP.decoy.toFixed(1) })),
        h('p.pr-note.left', null, TK('verdict.' + verdict)),
        h('details.pr-calib-table', null, h('summary', null, TK('table')),
          h('div.pr-table-scroll', null, h('table', null,
            h('thead', null, h('tr', null, h('th', null, '#'), h('th', null, TK('col_date')), h('th', null, TK('real')), h('th', null, TK('decoy')))),
            h('tbody', null, pts.map(p => h('tr', null, h('td', null, String(p.i + 1)), h('td', null, DC.fmtDate(p.t || Date.now(), 'short')), h('td', null, String(p.r1)), h('td', null, String(p.d1))))))))
      ]);
      return card;
    }

    // ------------------------------------------------------------------ dream link (at the reveal)
    function dreamLink(s) {
      const box = h('div.dc-card.pr-rate');
      DC.append(box, [h('h3.pr-card-h', null, T('tools.dream.title')), h('p.pr-muted', null, T('tools.dream.text'))]);
      const sel = h('select.dc-select', { id: 'pr-dream', 'aria-label': T('tools.dream.title') }, h('option', { value: '' }, T('tools.dream.none')));
      sel.addEventListener('change', () => {
        const o = sel.options[sel.selectedIndex];
        s.dream = sel.value ? { id: sel.value, title: o ? o.textContent : '' } : null;
      });
      box.appendChild(sel);
      DC.store.allDreams().then(list => {
        list.slice(0, 40).forEach(d => {
          const label = (d.title || String(d.text || '').slice(0, 40) || T('tools.dream.untitled')) + ' · ' + DC.fmtDate(d.created_at || Date.now(), 'short');
          sel.appendChild(h('option', { value: d.id, selected: !!(s.dream && s.dream.id === d.id) }, label));
        });
        if (!list.length) { sel.disabled = true; box.appendChild(h('p.pr-note.left', null, T('tools.dream.empty'))); }
      }).catch(() => { sel.disabled = true; });
      return box;
    }
    function dreamRow(rec) {
      if (!rec || !rec.dream || !rec.dream.id) return null;
      return h('button.dc-link.pr-hdream', { type: 'button', onclick: () => DC.go('#/dream/' + encodeURIComponent(rec.dream.id)) }, DC.icon('moon', 14), T('tools.dream.linked', { title: rec.dream.title || '' }, rec.dream.title || ''));
    }

    // ------------------------------------------------------------------ exercise tick-off
    const exDone = st => { const v = raw(st).exercises; return Array.isArray(v) ? v.map(String) : []; };
    function exerciseToggle(st, id, redraw) {
      if (!id) return null;
      const done = exDone(st).indexOf(id) >= 0;
      const b = h('button.dc-btn.small.auto' + (done ? '.secondary' : '.outline.teal'), { type: 'button', 'aria-pressed': String(done) }, DC.icon(done ? 'check-circle' : 'check', 16), T(done ? 'tools.ex.done' : 'tools.ex.mark', null, ''));
      b.addEventListener('click', async () => {
        b.disabled = true;
        const now = exDone(await getState());
        const next = done ? now.filter(x => x !== id) : now.concat([id]);
        try { await setState('exercises', next); redraw(); } catch (e) { b.disabled = false; DC.ui.error(e); }
      });
      return b;
    }

    // ------------------------------------------------------------------ knowledge check
    function quizView(c, m, onDone) {
      const q = (c.quizzes || []).find(x => x.module === m.id);
      const box = h('div.pr-quiz');
      if (!q || !q.questions.length) return box;
      const picked = q.questions.map(() => -1);
      const err = h('div.dc-error.dc-hidden', { role: 'alert' });
      const items = q.questions.map((x, i) => {
        const name = 'pr-q-' + m.id + '-' + i;
        const opts = x.options.map((o, j) => h('label.pr-qopt', null,
          h('input', { type: 'radio', name, value: String(j), onchange: () => { picked[i] = j; } }), h('span', null, o)));
        return h('fieldset.dc-card.pr-qcard', null, h('legend.pr-qh', null, h('span.pr-sq', null, String(i + 1)), h('span', null, x.q)), opts, h('div.pr-qres'));
      });
      const submit = h('button.dc-btn', { type: 'button' }, DC.icon('check', 18), T('tools.quiz.submit', null, DC.t('core.continue')));
      const result = h('div.pr-qsum', { role: 'status', 'aria-live': 'polite' });
      submit.addEventListener('click', async () => {
        if (picked.some(p => p < 0)) { err.textContent = T('tools.quiz.all'); err.classList.remove('dc-hidden'); return; }
        err.classList.add('dc-hidden'); submit.disabled = true;
        try {
          const r = await DC.api.post('/rv/quiz', { module: m.id, answers: picked, lang: DC.lang() });
          r.results.forEach((res, i) => {
            const card = items[i];
            card.classList.toggle('ok', res.ok); card.classList.toggle('miss', !res.ok);
            card.querySelectorAll('.pr-qopt').forEach((lab, j) => { lab.classList.toggle('right', j === res.correct); lab.classList.toggle('wrong', !res.ok && j === picked[i]); lab.querySelector('input').disabled = true; });
            const out = card.querySelector('.pr-qres'); DC.clear(out);
            DC.append(out, [h('strong', null, T(res.ok ? 'tools.quiz.right' : 'tools.quiz.wrong')), res.explain ? h('p', null, res.explain) : null]);
          });
          DC.clear(result);
          DC.append(result, [
            h('h3.pr-card-h', null, T('tools.quiz.score', { score: r.score, total: r.total }, r.score + ' / ' + r.total)),
            h('p.pr-muted', null, T(r.passed ? 'tools.quiz.passed' : 'tools.quiz.not_passed', { pass: r.pass, best: r.best, total: r.total }, '')),
            h('button.dc-btn.outline.auto', { type: 'button', onclick: () => onDone && onDone(r) }, DC.icon(r.passed ? 'arrow-right' : 'refresh', 16), T(r.passed ? 'tools.quiz.continue' : 'tools.quiz.retry'))
          ]);
          result.scrollIntoView({ block: 'center', behavior: 'smooth' });
        } catch (e) { submit.disabled = false; DC.ui.error(e); }
      });
      DC.append(box, [
        h('div.dc-card.glow', null, h('h3.pr-title-teal', null, T('tools.quiz.title')), h('p.pr-muted', null, T('tools.quiz.text', { pass: Math.ceil(q.questions.length * (Number(q.pass) || 0.8)), total: q.questions.length }, ''))),
        items, err, submit, result
      ]);
      return box;
    }

    // ------------------------------------------------------------------ course completion record
    function recordCard(c, onOpen) {
      const card = h('div.dc-card.glow.pr-record', { 'aria-busy': 'true' }, DC.ui.spinner());
      DC.api.get('/rv/record').then(r => {
        DC.clear(card); card.removeAttribute('aria-busy');
        const row = (ok, label, value, href) => h('li.pr-rec-row' + (ok ? '.ok' : ''), null, DC.icon(ok ? 'check-circle' : 'circle', 18),
          href ? h('button.dc-link', { type: 'button', onclick: () => DC.go(href) }, label) : h('span', null, label), h('span.pr-rec-v', null, value));
        const mods = r.modules.map(mr => {
          const m = c.modules.find(x => x.id === mr.id) || { title: mr.id, n: '' };
          const path = '#/practice/module/' + encodeURIComponent(mr.id);
          return h('div.pr-rec-mod', null,
            h('div.pr-rec-mh', null, T('module_badge', { n: m.n }, String(m.n)), ' · ', m.title),
            h('ul.pr-rec-list', null,
              row(mr.lessons.done === mr.lessons.total, T('tools.record.lessons'), mr.lessons.done + ' / ' + mr.lessons.total, path + '?tab=lessons'),
              row(mr.exercises.done === mr.exercises.total, T('tools.record.exercises'), mr.exercises.done + ' / ' + mr.exercises.total, path + '?tab=exercises'),
              row(!!(mr.quiz && mr.quiz.passed), T('tools.record.quiz'), mr.quiz ? mr.quiz.best + ' / ' + mr.quiz.total : T('tools.record.not_taken'), path + '?tab=check')));
        });
        const sess = row(r.sessions.full >= r.sessions.needed, T('tools.record.sessions', { n: r.sessions.needed }, ''), Math.min(r.sessions.full, r.sessions.needed) + ' / ' + r.sessions.needed);
        const nightsRow = r.nights && has('tools.record.nights') ? row(r.nights.done >= r.nights.needed, T('tools.record.nights', { n: r.nights.needed }, ''), Math.min(r.nights.done, r.nights.needed) + ' / ' + r.nights.needed, '#/practice?tab=exercises&chip=night') : null;
        const head = r.completed_at
          ? h('div.pr-rec-done', null,
            onOpen && api.emblemEl ? api.emblemEl() : null,
            h('div.pr-rec-done-t', null, T(r.distinction ? 'tools.record.done_distinction' : 'tools.record.done')),
            h('div.pr-rec-done-n', null, (DC.state.account && (DC.state.account.display_name || '')) || ''),
            h('div.pr-rec-done-d', null, T('tools.record.done_date', { date: fmtDate(r.completed_at), pct: r.recorded_pct }, '')))
          : h('p.pr-muted', null, T('tools.record.text', { n: r.sessions.needed, pct: r.distinction_pct }, ''));
        DC.append(card, [
          h('div.pr-tool-head', null, DC.icon('award', 20), h('h3.pr-title-teal', null, T('tools.record.title'))),
          head,
          mods,
          h('div.pr-rec-mod', null, h('div.pr-rec-mh', null, T('tools.record.practice')), h('ul.pr-rec-list', null, sess, nightsRow)),
          r.quiz_pct != null ? h('p.pr-note.left', null, T('tools.record.avg', { pct: r.quiz_pct }, r.quiz_pct + '%')) : null,
          r.offer && has('tools.record.offer') ? h('div.pr-rec-offer' + (r.offer.earned ? '.earned' : ''), null, DC.icon(r.offer.earned ? 'award' : 'star', 18),
            h('span', null, T(r.offer.earned ? 'tools.record.offer_earned' : 'tools.record.offer', { pct: r.offer.pct }, ''))) : null
        ]);
      }).catch(e => { DC.clear(card); card.appendChild(h('p.pr-note', null, DC.api.message(e))); });
      return card;
    }

    function toolsTab(st, redraw) {
      return [
        has('tools.intro') ? h('p.pr-muted.pr-tools-intro', null, T('tools.intro')) : null,
        ideogramCard(st, redraw),
        wordsCard(st, redraw),
        rulesCard(st, redraw)
      ];
    }

    return { chart, toolsTab, ideogramFolded, wordsFolded, rulesFolded, calibration, dreamLink, dreamRow, exerciseToggle, exDone, quizView, recordCard };
  };
})();

<script>/* web/src/screens/practice.js */
/* DREAM CODE: the hidden practice module (training page, modules, lessons and guided sessions).
   Gated by auth 'rv' in the router. Every visible string and all content arrive from GET /rv/content after unlock,
   so the public bundle carries no text of this module. Progress lives in /rv/state (keys 'lessons' and 'sessions'). */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const LANGS = ['en', 'it'];
  const STATE_MAX = 19500;          // bytes; the server keeps each state value under 20 KB
  const MAX_SESSIONS = 100;

  // ---------------------------------------------------------------- memory (never localStorage)
  const contentCache = {};          // lang -> Promise<content>
  let stateCache = null;            // Promise<{lessons:[], sessions:[], intro_seen}>
  const mediaCache = {};            // name -> Promise<object URL> (the signature figure, the introduction film), memory only
  let ownerId = null;
  const mem = { trainTab: 'overview', chip: 'protocol', session: null, sketches: {}, doneAck: true };
  let UI = {};                      // flattened ui strings for the current language
  let lastContent = null;           // the content last drawn (for the media flags)
  let gen = 0;                      // render generation, so a slow load never draws over a newer screen

  // A different account (or signing out) forgets everything held in memory.
  DC.on('account', a => {
    const id = a && a.rv_unlocked ? a.id : null;
    if (ownerId !== null && id !== ownerId) {
      stateCache = null; if (NIGHT) NIGHT.reset(); mem.session = null; mem.sketches = {}; mem.doneAck = true; mem.trainTab = 'overview'; mem.chip = 'protocol';
      Object.keys(contentCache).forEach(k => delete contentCache[k]);
      forgetMedia();
    }
    ownerId = id;
  });

  // ---------------------------------------------------------------- content shapes
  // Any object with en/it keys becomes its language's fields merged over the shared ones, at every depth.
  function localize(v, lang) {
    if (Array.isArray(v)) return v.map(x => localize(x, lang));
    if (!v || typeof v !== 'object') return v;
    if (('en' in v) || ('it' in v)) {
      const sel = v[lang] != null ? v[lang] : (v.en != null ? v.en : v.it);
      const rest = {}; let hasRest = false;
      Object.keys(v).forEach(k => { if (LANGS.indexOf(k) < 0) { rest[k] = v[k]; hasRest = true; } });
      if (sel && typeof sel === 'object' && !Array.isArray(sel)) return localize(Object.assign(rest, sel), lang);
      if (!hasRest) return localize(sel, lang);
      return localize(Object.assign(rest, { text: sel }), lang);
    }
    const out = {};
    Object.keys(v).forEach(k => { out[k] = localize(v[k], lang); });
    return out;
  }
  function flat(obj, prefix, out) {
    Object.keys(obj || {}).forEach(k => {
      const v = obj[k], key = prefix ? prefix + '.' + k : k;
      if (v && typeof v === 'object' && !Array.isArray(v)) flat(v, key, out); else out[key] = v;
    });
    return out;
  }
  function arr(x, key) {
    if (Array.isArray(x)) return x;
    if (x && typeof x === 'object') {
      if (Array.isArray(x[key])) return x[key];
      const k = Object.keys(x).find(kk => Array.isArray(x[kk]));
      if (k) return x[k];
      // an id-keyed map of records
      const vals = Object.keys(x).map(kk => (x[kk] && typeof x[kk] === 'object' ? Object.assign({ id: kk }, x[kk]) : null)).filter(Boolean);
      if (vals.length && vals.every(r => r.title || r.name || r.label)) return vals;
    }
    return [];
  }
  function first(o, keys) {
    if (!o || typeof o !== 'object') return null;
    for (const k of keys) { const v = o[k]; if (v != null && v !== '' && !(Array.isArray(v) && !v.length)) return v; }
    return null;
  }
  const str = v => (v == null ? '' : Array.isArray(v) ? v.map(str).filter(Boolean).join('\n\n') : typeof v === 'object' ? str(first(v, ['text', 'label', 'title', 'name', 'value'])) : String(v));
  const paras = v => (Array.isArray(v) ? v.map(str) : str(v).split(/\n\s*\n/)).map(s => s.trim()).filter(Boolean);
  const items = v => (Array.isArray(v) ? v.map(x => (typeof x === 'object' && x ? x : str(x))).filter(Boolean) : str(v) ? str(v).split(/\n+/).map(s => s.trim()).filter(Boolean) : []);
  const num = (v, d) => { const n = Number(v); return isFinite(n) && n > 0 ? n : d; };

  function normBlocks(b) {
    if (!b) return [];
    if (typeof b === 'string') return paras(b).map(t => ({ type: 'p', text: t }));
    if (!Array.isArray(b)) {
      if (Array.isArray(b.blocks)) return normBlocks(b.blocks);
      return [normBlock(b)].filter(Boolean);
    }
    const out = [];
    b.forEach(x => {
      // a section {title, blocks|body|items}
      if (x && typeof x === 'object' && !x.type && !x.t && !x.kind && (Array.isArray(x.blocks) || Array.isArray(x.body))) {
        const t = first(x, ['title', 'heading', 'h']);
        if (t) out.push({ type: 'h', text: str(t) });
        out.push.apply(out, normBlocks(x.blocks || x.body));
        return;
      }
      const n = normBlock(x); if (n) out.push(n);
    });
    return out;
  }
  function normBlock(x) {
    if (x == null) return null;
    if (typeof x === 'string') return { type: 'p', text: x };
    let type = String(x.type || x.t || x.kind || '').toLowerCase();
    // a quotation from a source document, and the lesson's list of sources (each linked to the official copy)
    if (type === 'doc' || type === 'docquote') return { type: 'doc', text: str(x.text), cite: str(x.cite), claim: x.claim === true, page: str(x.page) };
    if (type === 'sources') return { type: 'sources', title: str(x.title), items: (Array.isArray(x.items) ? x.items : []).map(i => ({ title: str(i.title), origin: str(i.origin), date: str(i.date), id: str(i.id), note: str(i.note) })).filter(i => i.title) };
    if (!type) type = x.h != null || x.heading != null ? 'h' : x.steps || x.ol ? 'steps' : x.list || x.ul || x.items || x.bullets ? 'list' : x.note || x.callout ? 'note' : 'p';
    if (/^h\d?$|head|title|subhead/.test(type)) type = 'h';
    else if (/step|ol|number|order/.test(type)) type = 'steps';
    else if (/list|ul|bullet/.test(type)) type = 'list';
    else if (/note|callout|tip|warn|quote/.test(type)) type = 'note';
    else if (/figure|media|image/.test(type)) return { type: 'figure', media: String(x.media || x.src || '') };
    else type = 'p';
    const text = str(first(x, ['text', 'p', 'h', 'heading', 'content', 'value', 'note', 'callout', 'body']));
    const title = str(first(x, ['title', 'label', 'lead', 'intro']));
    const list = items(first(x, ['items', 'steps', 'list', 'ul', 'ol', 'bullets']));
    if (type === 'h') return { type, text: text || title };
    if (type === 'list' || type === 'steps') return { type, title: title || (list.length ? text : ''), items: list.map(str) };
    return { type, title, text: text || title };
  }

  function normalize(raw, lang) {
    const L = localize(raw || {}, lang);
    let uiSrc = L.ui && typeof L.ui === 'object' ? L.ui : {};
    if (uiSrc.ui && typeof uiSrc.ui === 'object' && Object.keys(uiSrc).length === 1) uiSrc = uiSrc.ui;
    const ui = flat(uiSrc, '', {});

    // lessons may live inside each module, in a lessons collection, or both
    const looseLessons = arr(L.lessons, 'lessons').concat(L.modules && !Array.isArray(L.modules) && Array.isArray(L.modules.lessons) ? L.modules.lessons : []);
    const lessonById = {};
    looseLessons.forEach(l => { if (l && l.id != null) lessonById[String(l.id)] = l; });

    const lessonIndex = {};
    const modules = arr(L.modules, 'modules').map((m, i) => {
      const id = String(first(m, ['id', 'slug', 'key']) || ('m' + (i + 1)));
      let ls = arr(first(m, ['lessons', 'items']), 'lessons').map(x => (typeof x === 'string' || typeof x === 'number' ? lessonById[String(x)] : x)).filter(Boolean);
      if (!ls.length) ls = looseLessons.filter(l => String(first(l, ['module', 'module_id', 'moduleId'])) === id);
      const lessons = ls.map((l, j) => {
        let lid = String(first(l, ['id', 'slug', 'key']) || (id + '-' + (j + 1)));
        if (lessonIndex[lid]) lid = id + '-' + lid;
        const les = {
          id: lid, moduleId: id, n: num(first(l, ['n', 'number', 'order']), j + 1),
          title: str(first(l, ['title', 'name'])),
          summary: str(first(l, ['summary', 'subtitle', 'description', 'intro', 'short'])),
          minutes: num(first(l, ['minutes', 'duration', 'min', 'mins', 'time']), 0),
          blocks: normBlocks(first(l, ['body', 'blocks', 'content', 'sections', 'text']))
        };
        lessonIndex[lid] = les;
        return les;
      });
      const minutes = num(first(m, ['minutes', 'duration', 'total_minutes']), lessons.reduce((s, l) => s + (l.minutes || 0), 0));
      return {
        id, n: num(first(m, ['n', 'number', 'order', 'index']), i + 1),
        title: str(first(m, ['title', 'name'])),
        subtitle: str(first(m, ['subtitle', 'tagline', 'focus', 'short'])),
        overview: paras(first(m, ['overview', 'description', 'summary', 'intro', 'about'])),
        objectives: items(first(m, ['objectives', 'learning_objectives', 'goals', 'outcomes'])).map(str),
        difficulty: str(first(m, ['difficulty', 'level'])),
        level: str(first(m, ['level', 'difficulty'])).toLowerCase(),
        exercises: arr(first(m, ['exercises', 'practice']), 'exercises').map(e => {
          const steps = first(e, ['instructions', 'steps']);
          return {
            id: str(first(e, ['id', 'key', 'slug'])),
            title: str(first(e, ['title', 'name'])),
            text: str(first(e, ['summary', 'text', 'description'])),
            steps: Array.isArray(steps) ? steps.map(str).filter(Boolean) : paras(steps),
            minutes: num(first(e, ['minutes', 'duration']), 0)
          };
        }).filter(e => e.title || e.text),
        minutes, lessons
      };
    });

    const stages = arr(L.stages, 'stages').map((s, i) => {
      const n = num(first(s, ['n', 'number', 'stage', 'order']), i + 1);
      const instr = first(s, ['instructions', 'instruction', 'steps', 'how', 'text', 'body', 'description']);
      const secs = num(first(s, ['seconds', 'secs']), 0) || num(first(s, ['minutes', 'suggested_minutes', 'duration', 'time']), 0) * 60;
      return {
        n, id: String(first(s, ['id', 'key', 'slug']) || ('s' + n)),
        name: str(first(s, ['name', 'title', 'label'])),
        short: str(first(s, ['short', 'summary', 'purpose', 'subtitle', 'goal'])),
        instructions: Array.isArray(instr) ? instr.map(str).filter(Boolean) : paras(instr),
        list: Array.isArray(instr),
        prompts: items(first(s, ['prompts', 'cues', 'questions', 'tips'])).map(str),
        seconds: secs,
        sketch: s.sketch === true || s.canvas === true || /sketch|draw/i.test(String(first(s, ['id', 'key', 'kind', 'input']) || '')),
        figure: s.figure === true
      };
    }).sort((a, b) => a.n - b.n);
    if (stages.length >= 3 && !stages.some(s => s.sketch)) stages[2].sketch = true;

    const targets = arr(L.targets, 'targets').map((t, i) => ({
      id: String(first(t, ['id', 'key', 'slug']) || ('t' + (i + 1))),
      title: str(first(t, ['title', 'name', 'label'])),
      description: paras(first(t, ['description', 'text', 'summary', 'feedback', 'about'])),
      descriptors: items(first(t, ['descriptors', 'keywords', 'tags', 'features', 'elements', 'cues'])).map(str).filter(Boolean),
      category: str(first(t, ['category', 'kind', 'group']))
    })).filter(t => t.title);

    const quizzes = arr(L.quizzes, 'quizzes').map(q => ({
      module: str(q.module), pass: Number(q.pass) || 0.8,
      questions: arr(q.questions, 'questions').map(x => ({ id: str(x.id), q: str(first(x, ['q', 'question', 'text'])), options: (Array.isArray(x.options) ? x.options : []).map(str) })).filter(x => x.q && x.options.length)
    })).filter(q => q.module && q.questions.length);
    const media = {};
    Object.keys(L.media && typeof L.media === 'object' ? L.media : {}).forEach(k => { media[k] = L.media[k] === true; });
    return { ui, modules, stages, targets, lessonIndex, media, quizzes };
  }

  function loadContent() {
    const lang = DC.lang();
    if (!contentCache[lang]) {
      contentCache[lang] = DC.api.get('/rv/content?lang=' + encodeURIComponent(lang))
        .then(r => normalize(r, lang))
        .catch(e => { delete contentCache[lang]; throw e; });
    }
    return contentCache[lang];
  }

  // ---------------------------------------------------------------- strings
  function T(key, vars, fallback) {
    let s = UI[key];
    if (s == null) return fallback != null ? fallback : '';
    s = Array.isArray(s) ? s.map(str).join('\n\n') : str(s);
    if (vars) s = s.replace(/\{\{?\s*(\w+)\s*\}?\}/g, (m, k) => (vars[k] != null ? vars[k] : m));
    return s;
  }
  const TP = key => paras(UI[key]);
  const has = key => UI[key] != null && UI[key] !== '';
  const fmtMin = n => T('lesson.minutes', { n }, n + "'");
  const clock = ms => { const s = Math.max(0, Math.round(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  // ---------------------------------------------------------------- state
  function normLessons(v) {
    if (Array.isArray(v)) return v.map(x => (typeof x === 'object' && x ? String(x.id) : String(x)));
    if (v && typeof v === 'object') return Object.keys(v).filter(k => v[k]);
    return [];
  }
  function getState() {
    if (!stateCache) {
      stateCache = DC.api.get('/rv/state').then(r => {
        const s = (r && r.state && typeof r.state === 'object') ? r.state : (r || {});
        return { lessons: normLessons(s.lessons), sessions: Array.isArray(s.sessions) ? s.sessions.filter(x => x && typeof x === 'object') : [], intro_seen: s.intro_seen || null, raw: s };
      }).catch(e => { stateCache = null; throw e; });
    }
    return stateCache;
  }
  async function setState(key, value) {
    await DC.api.post('/rv/state', { key, value });
    const st = await getState();
    st[key] = value;
    st.raw = Object.assign({}, st.raw || {}, { [key]: value });
  }
  // The personal tools, the knowledge checks and the course record (screens/practice-tools.js).
  let TOOLS = null;
  const tools = () => TOOLS || (TOOLS = DC.rvTools({ T, has, getState, setState, paraEls, items: v => paras(v).length > 1 ? paras(v) : String(v || '').split(/\n+/).map(x => x.trim()).filter(Boolean), emblemEl: () => badge() }));
  // Dream Incubation Night, Edge of Sleep, and the module's cards in the dream writer and on the dream page (practice-night.js).
  let NIGHT = null;

  const bytes = v => new TextEncoder().encode(JSON.stringify(v)).length;
  function cutNotes(notes, max) {
    if (!notes || max <= 0) return undefined;
    const o = {};
    Object.keys(notes).forEach(k => { const t = String(notes[k] || ''); if (t) o[k] = t.length > max ? t.slice(0, max) + '...' : t; });
    return Object.keys(o).length ? o : undefined;
  }
  function cutRec(r, max) {
    const o = Object.assign({}, r, { notes: cutNotes(r.notes, max) });
    if (o.notes === undefined) delete o.notes;
    if (o.reflection) { if (max <= 0) delete o.reflection; else if (o.reflection.length > max) o.reflection = o.reflection.slice(0, max) + '...'; }
    return o;
  }
  // Last MAX_SESSIONS sessions; older notes are shortened first, then the newest, then the oldest sessions go,
  // until the value fits the server limit.
  function fitSessions(list) {
    let out = list.slice(-MAX_SESSIONS);
    const newest = () => out[out.length - 1];
    for (const max of [1500, 800, 400, 200, 100, 50, 0]) {
      if (bytes(out) < STATE_MAX) return out;
      out = out.slice(0, -1).map(r => cutRec(r, max)).concat([newest()]);
    }
    for (const max of [3000, 1000, 300, 0]) {
      if (bytes(out) < STATE_MAX) return out;
      out = out.slice(0, -1).concat([cutRec(newest(), max)]);
    }
    while (bytes(out) >= STATE_MAX && out.length > 1) out = out.slice(1);
    return out;
  }

      showVal();
      return {
        chips: descriptors.length ? h('div.dc-chips.pr-descs', null, chips) : null,
        rating: [val, slider, h('div.pr-range-scale', { 'aria-hidden': 'true' }, [0, 1, 2, 3, 4, 5].map(n => h('span', null, String(n)))), scale]
      };
    }

    function revealView() {
      const t = c.targets.find(x => x.id === s.target) || c.targets[0];
      const main = rater(t.descriptors, s, T('session.rate', null, ''));
      const noteKeys = s.stages.map(i => c.stages[i]).filter(sg => s.notes[sg.n]);
      const reflection = h('textarea.dc-textarea.pr-reflect', { id: 'pr-reflect', placeholder: T('session.reflection_placeholder'), maxlength: '2000', value: s.reflection || '', oninput: e => { s.reflection = e.target.value; } });

      // optional decoy: a different practice target scored the same way
      const decoyBox = h('div');
      const drawDecoy = () => {
        DC.clear(decoyBox);
        const d = s.decoy && c.targets.find(x => x.id === s.decoy.target);
        if (!d) {
          DC.append(decoyBox, h('button.dc-btn.outline.teal', { type: 'button', onclick: () => {
            const pool = c.targets.filter(x => x.id !== t.id);
            if (!pool.length) return;
            s.decoy = { target: pool[rand(pool.length)].id, ticked: [], rating: 0 };
            drawDecoy();
          } }, DC.icon('layers', 18), T('session.decoy.button', null, DC.t('core.continue'))));
          return;
        }
        const r = rater(d.descriptors, s.decoy, T('session.decoy.score', null, ''));
        DC.append(decoyBox, h('div.pr-decoy', null,
          h('div.pr-coord-l', null, T('session.decoy.score')),
          h('h3.pr-decoy-title', null, d.title),
          r.chips, r.rating));
      };
      drawDecoy();

      const save = h('button.dc-btn', { type: 'button' }, DC.icon('check', 18), T('session.save', null, DC.t('core.save')));
      save.addEventListener('click', async () => {
        save.disabled = true;
        try { await saveSession(); s.phase = 'saved'; if (has('session.saved_toast')) DC.ui.toast(T('session.saved_toast')); draw(); window.scrollTo(0, 0); }
        catch (e) { save.disabled = false; DC.ui.error(e && e.status && has('session.save_error') ? T('session.save_error') : e); }
      });
      return [
        h('div.dc-card.glow.pr-target', null,
          h('div.pr-coord-l', null, T('session.target')),
          h('h2.pr-target-title', null, t.title),
          h('div.pr-prose', null, paraEls(t.description))),
        noteKeys.length || s.sketch ? h('div.dc-card.pr-yours', null,
          h('h3.pr-card-h', null, T('session.your_notes')),
          noteKeys.map(sg => h('div.pr-hnote', null, h('div.pr-hnote-t', null, T('stage_label', { n: sg.n }, String(sg.n)) + (sg.name ? ' · ' + sg.name : '')), h('p', null, s.notes[sg.n]))),
          s.sketch ? h('img.pr-hsketch', { src: s.sketch, alt: T('session.sketch', null, '') }) : null) : null,
        main.chips ? h('div.dc-card.pr-rate', null,
          h('h3.pr-card-h', null, T('session.descriptors')),
