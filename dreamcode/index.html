.dc-screen-practice .pr-rec-v,.dc-slot .pr-rec-v{font-variant-numeric:tabular-nums;color:inherit}
.dc-screen-practice .pr-rec-done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 8px 18px;margin:6px 0 4px;border-radius:var(--radius);border:1px solid rgba(230,222,166,.45);background:radial-gradient(120% 90% at 50% 0%,#13214A 0%,#0A1628 60%,#06060C 100%);box-shadow:0 0 26px rgba(230,222,166,.12)}
.dc-screen-practice .pr-rec-done .pr-badge{width:96px;height:96px}
.dc-screen-practice .pr-rec-done-t{font-family:var(--serif);font-size:22px;color:var(--gold);text-shadow:0 0 12px rgba(230,222,166,.45)}
.dc-screen-practice .pr-rec-done-n{font-family:var(--serif);font-size:18px;color:var(--text)}
.dc-screen-practice .pr-rec-done-d{font-size:13.5px;color:var(--muted)}
.dc-screen-practice .pr-rec-offer{display:flex;gap:10px;align-items:flex-start;margin:14px 0 2px;padding:12px 14px;border-radius:var(--radius-sm);border:1px dashed rgba(230,222,166,.4);color:var(--text);font-size:14.5px;line-height:1.5}
.dc-screen-practice .pr-rec-offer svg{flex:none;color:var(--gold);margin-top:2px}
.dc-screen-practice .pr-rec-offer.earned{border-style:solid;border-color:rgba(230,222,166,.6);background:linear-gradient(180deg,rgba(230,222,166,.10),rgba(230,222,166,.03));box-shadow:0 0 18px rgba(230,222,166,.12)}

/* ---------- quotations from the original documents, and each lesson's sources ---------- */
.dc-screen-practice .pr-doc{position:relative;margin:16px 0;padding:14px 16px 12px;border-radius:var(--radius-sm);background:linear-gradient(180deg,#151B2C 0%,#10141F 100%);border:1px solid rgba(230,222,166,.28);border-left:3px solid var(--gold);box-shadow:0 0 18px rgba(230,222,166,.06)}
.dc-screen-practice .pr-doc.claim{border-left-color:var(--warn);border-color:rgba(242,193,78,.35)}
.dc-screen-practice .pr-doc-flag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:6px}
.dc-screen-practice .pr-doc-q{margin:0}
.dc-screen-practice .pr-doc-q p{margin:0;font-family:'Courier New',Courier,monospace;font-size:14.5px;line-height:1.6;color:#E8E3C4;letter-spacing:.01em}
.dc-screen-practice .pr-doc-q p::before{content:"\201C"}
.dc-screen-practice .pr-doc-q p::after{content:"\201D"}
.dc-screen-practice .pr-doc-cite{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.dc-screen-practice .pr-doc-cite svg{flex:none;margin-top:2px;color:var(--gold)}
.dc-screen-practice .pr-sources{margin-top:22px;padding-top:14px;border-top:1px solid rgba(230,222,166,.25)}
.dc-screen-practice .pr-sources-h{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:var(--serif);font-size:16px;color:var(--gold)}
.dc-screen-practice .pr-sources-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;color:var(--muted);font-size:13.5px;line-height:1.45}
.dc-screen-practice .pr-sources-list li::marker{color:var(--gold)}
.dc-screen-practice .pr-src-t{display:block;color:var(--mint);font-style:italic}
.dc-screen-practice .pr-src-m,.dc-screen-practice .pr-src-n{display:block}
.dc-screen-practice .pr-src-a{display:inline-flex;align-items:center;gap:4px;color:var(--teal);font-family:'Courier New',Courier,monospace;font-size:12.5px;word-break:break-all;text-decoration:none}
.dc-screen-practice .pr-src-a:hover,.dc-screen-practice .pr-src-a:focus-visible{text-decoration:underline}

/* ---------- the module's cards inside the dream screens (DC.slot) ---------- */
.dc-slot:empty{display:none}
.dc-slot .pr-slot{margin:14px 0}
.dc-slot .pr-writer-words{margin:10px 0 2px}
.dc-slot .pr-wchip-add{cursor:pointer;padding:4px 10px 4px 8px;font:inherit;font-size:13.5px}
.dc-slot .pr-wchip-add:hover,.dc-slot .pr-wchip-add:focus-visible{background:rgba(46,230,200,.22);border-color:rgba(46,230,200,.7);outline:none}
.dc-slot .pr-slot-dream .pr-rec-row .dc-link{flex:1;text-align:left}
.dc-slot .pr-slot-offer{margin-top:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px dashed rgba(230,222,166,.45);background:rgba(230,222,166,.05)}
.dc-slot .pr-slot-offer p{margin:0 0 10px;color:var(--text);line-height:1.5}

/* ---------- Dream Nights and Edge of Sleep ---------- */
.dc-screen-practice .pr-night{margin-top:14px}
.dc-screen-practice .pr-night .pr-steps-ol{margin:8px 0 16px}
.dc-screen-practice .pr-night .dc-btn{margin-top:6px}
.dc-screen-practice .pr-night-ref{background:radial-gradient(120% 90% at 50% 0%,#13214A 0%,#0A1628 60%,#06060C 100%)}
.dc-screen-practice .pr-night-foot{margin-top:14px;text-align:center}
.dc-screen-practice .pr-night-cancel{color:var(--muted);font-size:14px}
.dc-screen-practice .pr-night-dtext{white-space:pre-wrap;max-height:16em;overflow:auto;line-height:1.55;margin:6px 0 0}
.dc-screen-practice .pr-night-pic .pr-prose{margin:6px 0 12px}
.dc-screen-practice .pr-night-result .pr-rec-list{margin:6px 0 8px}
.dc-screen-practice .pr-edge-card{border-color:rgba(201,160,255,.35)}
.dc-screen-practice .pr-edge-card .pr-tool-head svg{color:#C9A0FF}
.dc-screen-practice .pr-hedge{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:#C9A0FF;margin:4px 0}
/* the Edge of Sleep session: a dimmer, warmer screen */
.dc-screen-practice .pr-edge{filter:brightness(.62) sepia(.22);transition:filter .6s}
.dc-screen-practice .pr-calib-night .pr-calib-svg .ln.real{stroke:#2EE6C8}

/* pricing.css */
/* Pricing Plans (S15) */
.dc-screen-pricing .dc-page-title .dc-sub{font-family:var(--sans)}
.dc-screen-pricing .dc-pricing-info{margin:0 0 20px;padding:14px 14px 12px}
.dc-screen-pricing .dc-pricing-info-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dc-screen-pricing .dc-pricing-info-head svg{color:#8FB0F5;flex:none}
.dc-screen-pricing .dc-pricing-info-head strong{font-size:16px;color:#fff}
.dc-screen-pricing .dc-pricing-info-x{margin-left:auto;color:#B7C6E8;padding:4px}
.dc-screen-pricing .dc-pricing-info p{margin:0 0 6px;font-size:14.5px;line-height:1.5}
.dc-screen-pricing .dc-pricing-info p.small{font-size:13px;color:#A9B8D9;margin:0}

.dc-screen-pricing .dc-pricing-toggle{display:flex;gap:4px;width:max-content;max-width:100%;margin:0 auto 26px;background:#0E1119;border:1px solid var(--card-border);border-radius:999px;padding:4px}
.dc-screen-pricing .dc-pricing-toggle-btn{border:0;background:none;color:var(--muted);padding:8px 22px;border-radius:999px;cursor:pointer;font-size:15px;font-weight:600}
.dc-screen-pricing .dc-pricing-toggle-btn:hover{color:var(--text)}
.dc-screen-pricing .dc-pricing-toggle-btn.active{background:var(--cyan);color:var(--on-cyan)}
.dc-screen-pricing .dc-pricing-soon{display:flex;gap:10px;align-items:flex-start;margin:-8px 0 22px}
.dc-screen-pricing .dc-pricing-soon svg{flex:none;margin-top:2px}

.dc-screen-pricing .dc-pricing-cards{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:24px}
.dc-screen-pricing .dc-pricing-plan{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:26px 18px 18px}
.dc-screen-pricing .dc-pricing-plan.dreamer{border-color:var(--cyan);box-shadow:0 0 22px rgba(42,252,228,.16)}
.dc-screen-pricing .dc-pricing-plan.plus{border-color:#3BE37A;box-shadow:0 0 22px rgba(59,227,122,.14)}
.dc-screen-pricing .dc-pricing-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.dc-screen-pricing .dc-pricing-badge.popular{background:var(--cyan);color:var(--on-cyan)}
.dc-screen-pricing .dc-pricing-badge.best{background:#3BE37A;color:#05240F}
.dc-screen-pricing .dc-pricing-plan h3{font-size:22px;color:var(--text);text-shadow:var(--glow-title);margin-bottom:10px}
.dc-screen-pricing .dc-pricing-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px}
.dc-screen-pricing .dc-pricing-price .amount{font-weight:700;font-size:34px;line-height:1.1;color:var(--cyan)}
.dc-screen-pricing .dc-pricing-price .per{font-size:15px;color:var(--muted)}
.dc-screen-pricing .dc-pricing-was{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:6px;font-size:14px}
.dc-screen-pricing .dc-pricing-was s{color:var(--dim)}
.dc-screen-pricing .dc-pricing-was .save{color:#3BE37A;font-weight:600}
.dc-screen-pricing .dc-pricing-feats{list-style:none;padding:0;margin:16px 0 18px}
.dc-screen-pricing .dc-pricing-feats li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#D5DAE3;margin:9px 0;line-height:1.45}
.dc-screen-pricing .dc-pricing-feats li svg{color:#3BE37A;flex:none;margin-top:2px}
.dc-screen-pricing .dc-pricing-plan>.dc-btn{margin-top:auto}
.dc-screen-pricing .dc-pricing-btn-green{background:var(--green-2);color:var(--on-cyan)}
.dc-screen-pricing .dc-pricing-btn-green:hover{background:#4CF2C8}
.dc-screen-pricing .dc-pricing-btn-green:active{background:#22A889}
.dc-screen-pricing .dc-btn[disabled] .dc-spinner.small{border-color:rgba(4,33,31,.25);border-top-color:var(--on-cyan)}
.dc-screen-pricing .dc-btn[disabled]:not(.dc-pricing-current){background:var(--cyan);opacity:.75;color:var(--on-cyan)}
.dc-screen-pricing .dc-pricing-current[disabled]{background:rgba(0,0,0,.25);border-color:#3A4152;color:var(--muted);cursor:default}
.dc-screen-pricing .dc-pricing-plan.is-current .dc-pricing-current[disabled]{border-color:rgba(46,230,200,.45);color:var(--teal)}

.dc-screen-pricing .dc-pricing-free{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.dc-screen-pricing .dc-pricing-free svg{flex:none;margin-top:2px}
.dc-screen-pricing .dc-pricing-proposed{display:flex;gap:8px;align-items:flex-start;justify-content:center;font-size:13.5px;color:var(--muted);text-align:center;margin:14px 0 18px}
.dc-screen-pricing .dc-pricing-proposed svg{flex:none;margin-top:3px}
.dc-screen-pricing .dc-pricing-extras{display:flex;flex-direction:column;align-items:center;gap:10px}
.dc-screen-pricing .dc-pricing-extras .dc-btn{max-width:360px}

@media (min-width:700px){
  .dc-screen-pricing .dc-pricing-cards{grid-template-columns:repeat(3,1fr);gap:14px}
  .dc-screen-pricing .dc-pricing-plan{padding:28px 14px 16px}
  .dc-screen-pricing .dc-pricing-plan h3{font-size:20px}
  .dc-screen-pricing .dc-pricing-price .amount{font-size:30px}
  .dc-screen-pricing .dc-pricing-feats li{font-size:14px}
  .dc-screen-pricing .dc-pricing-plan>.dc-btn{font-size:15px;padding:10px 8px}
}
.dc-screen-pricing .dc-pricing-badge svg{flex:none;width:14px;height:14px;max-width:none}

/* profile.css */
/* Profile */
.dc-screen-profile .dc-card{margin-bottom:14px}
.dc-screen-profile .dc-card+.dc-card{margin-top:0}
.dc-screen-profile .dc-profile-id{display:flex;align-items:center;gap:16px;padding:18px 16px}
.dc-screen-profile .dc-profile-avatar{width:68px;height:68px;border-radius:50%;flex:none;overflow:hidden;background:#262C3E;border:3px solid var(--blue);color:#fff;
  font-family:var(--serif);font-weight:700;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(78,120,216,.35)}
.dc-screen-profile .dc-profile-namebox{flex:1;min-width:0}
.dc-screen-profile .dc-profile-name{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:700;font-size:22px;color:var(--text);text-shadow:var(--glow-title);line-height:1.25}
.dc-screen-profile .dc-profile-name>span{overflow-wrap:anywhere}
.dc-screen-profile .dc-profile-edit{color:var(--teal);flex:none}
.dc-screen-profile .dc-profile-email{color:var(--muted);font-size:14.5px;margin-top:2px;overflow-wrap:anywhere}
.dc-screen-profile .dc-profile-nameform .dc-label{margin-top:0}
.dc-screen-profile .dc-profile-nameactions{margin-top:10px}
.dc-screen-profile .dc-profile-row{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 0;border-top:1px solid var(--card-border)}
.dc-screen-profile .dc-profile-details .dc-card-title+.dc-profile-row{border-top:0;padding-top:4px}
.dc-screen-profile .dc-profile-row-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dc-screen-profile .dc-profile-row-value{color:var(--text);font-size:15.5px}
.dc-screen-profile .dc-profile-handle{color:var(--teal);font-weight:600}
.dc-screen-profile .dc-profile-muted{color:var(--muted);font-size:14.5px}
.dc-screen-profile .dc-profile-small{color:var(--muted);font-size:13.5px;margin-top:4px}
.dc-screen-profile .dc-profile-inline-link{padding:4px 0;margin-top:2px;text-align:left}
.dc-screen-profile .dc-profile-lang{max-width:220px;margin-top:2px}
.dc-screen-profile .dc-profile-count{font-family:var(--serif);font-size:17px;color:var(--mint);text-shadow:var(--glow-text);margin:0 0 6px}
.dc-screen-profile .dc-profile-btns{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0 4px}
.dc-screen-profile .dc-profile-actions{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:20px}
.dc-screen-profile .dc-profile-actions .dc-link{display:inline-flex;align-items:center;gap:6px;margin-top:4px;color:var(--muted)}
@media (min-width:560px){
  .dc-screen-profile .dc-profile-row{grid-template-columns:170px 1fr;gap:12px;align-items:baseline}
  .dc-screen-profile .dc-profile-btns{grid-template-columns:1fr 1fr}
  .dc-screen-profile .dc-profile-actions{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .dc-screen-profile .dc-profile-actions .dc-btn{width:auto;min-width:200px}
  .dc-screen-profile .dc-profile-actions .dc-link{flex-basis:100%;justify-content:center}
}
/* the delete dialog lives outside <main>, so it gets its own prefix */
.dc-profile-del p{margin:0 0 10px}
.dc-profile-del .dc-bullets li{color:var(--text);text-shadow:none;font-size:14.5px}
.dc-profile-del .dc-bullets li::before{background:var(--danger);box-shadow:none}
.dc-profile-del-tip{color:var(--muted);font-size:14px}
.dc-screen-profile .dc-profile-codeform .dc-label{margin-top:4px}
.dc-screen-profile .dc-profile-coderow{gap:10px;align-items:stretch;flex-wrap:wrap}
.dc-screen-profile .dc-profile-code{flex:1 1 200px;min-width:0;text-transform:uppercase;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.dc-screen-profile .dc-profile-code::placeholder{letter-spacing:0}

/* profile photo: the circle is a button with a small camera badge */
.dc-screen-profile .dc-profile-photo{position:relative;flex:none;padding:0;border:0;background:none;border-radius:50%;cursor:pointer}
.dc-screen-profile .dc-profile-photo:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.dc-screen-profile .dc-profile-photo:hover .dc-profile-avatar{box-shadow:0 0 22px rgba(78,120,216,.6)}
.dc-screen-profile .dc-profile-photo-badge{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--teal);color:var(--on-cyan);border:2px solid var(--card);box-shadow:0 0 10px rgba(46,230,200,.5)}
.dc-profile-photo-note{color:var(--muted);margin:0}

/* result.css */
/* ---------- Analysis result (S6) ---------- */
.dc-res-wait{display:flex;justify-content:center;padding:60px 0}
.dc-screen-result>*+*{margin-top:14px}
.dc-screen-result>.dc-section{margin:30px 0}
.dc-screen-result .dc-section>.dc-section-head h2{font-size:23px}
.dc-screen-result .dc-section>.dc-section-head .dc-sub{line-height:1.5}
.dc-res-h2{font-size:23px;color:var(--text);text-shadow:var(--glow-title)}

.dc-res-crisis .dc-res-safety-note{margin:0 0 8px;color:#FFE3E8;font-size:15px}
.dc-res-status .dc-status{align-items:center}
.dc-res-status .dc-status .d{margin-top:2px;line-height:1.45}
.dc-res-status .dc-status.ok>svg{color:var(--ok)}
.dc-res-status .dc-status.warn>svg{color:var(--warn)}
.dc-res-status .dc-status:not(.ok):not(.warn)>svg{color:#7FA6FF}
.dc-res-status .dc-status a{color:var(--teal);font-weight:600}
.dc-res-changed>svg{color:var(--warn)}
.dc-res-changed .dc-res-reanalyze{margin-top:10px}

/* Dream Type */
.dc-res-type{padding:6px 0 4px}
.dc-res-type-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dc-res-learn{gap:6px;flex:none}
.dc-res-type-main{display:flex;align-items:center;gap:12px}
.dc-res-dot{width:15px;height:15px;border-radius:50%;flex:none}
.dc-res-type-name{font-size:19px;font-weight:600;line-height:1.3}
.dc-res-type-more{margin-top:12px}
.dc-res-type-more .dc-pill{text-decoration:none}
.dc-res-type-more .dc-pill:hover{text-decoration:none;filter:brightness(1.15)}
.dc-res-type-desc{margin:14px 0 0;color:#C9D0DD;font-size:15px;line-height:1.6}

/* Dream Analysis card */
.dc-res-dream{padding:18px 16px}
.dc-res-dream-head{display:flex;align-items:center;gap:10px}
.dc-res-dream-head svg{color:var(--teal);flex:none}
.dc-res-dream-head h2{font-size:26px;color:var(--text);text-shadow:var(--glow-title)}
.dc-res-dream-sub{color:var(--muted);font-size:15px;line-height:1.5;margin:8px 0 16px}
.dc-res-your{border:1px solid var(--card-border);background:rgba(255,255,255,.02);border-radius:12px;padding:16px}
.dc-res-your-t{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--text);margin-bottom:10px}
.dc-res-quote{margin:0;font-weight:600;font-size:16.5px;line-height:1.6;color:var(--text);white-space:pre-line;overflow-wrap:anywhere}
.dc-res-quote.long{font-weight:500;font-size:16px}
.dc-res-quote.clamp{display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden}
.dc-res-more{padding:6px 0 0;font-size:14px}
.dc-res-meta{margin-top:10px;font-size:13px;color:var(--dim)}
.dc-res-pending{margin-top:16px}
.dc-res-pending p{color:var(--mint);text-shadow:var(--glow-text);margin-bottom:12px}

/* Dream Symbols */
.dc-res-symbols{display:grid;gap:12px}
.dc-res-sym{display:block;background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:12px;padding:14px 15px;color:inherit;text-decoration:none}
a.dc-res-sym:hover{text-decoration:none;border-color:rgba(46,230,200,.45);background:rgba(46,230,200,.04)}
.dc-res-sym-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.dc-res-sym-name{font-size:19px;color:var(--text);text-shadow:var(--glow-title);line-height:1.3;overflow-wrap:anywhere}
.dc-res-uni{display:inline-flex;align-items:center;gap:5px;color:var(--teal);font-size:13px;font-weight:500;flex:none;margin-top:3px}
.dc-res-sym-uni{margin:0 0 8px;color:var(--text);font-size:15.5px;line-height:1.6}
.dc-res-sym-pers{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.dc-res-sym-open{display:inline-flex;align-items:center;gap:3px;margin-top:10px;font-size:13px;color:var(--teal)}

/* Possible Meanings */
.dc-res-meanings{padding:18px 16px}
.dc-res-meanings p{color:var(--mint);text-shadow:var(--glow-text);line-height:1.75;font-size:16px;margin:0}
.dc-res-meanings p+p{margin-top:14px}
.dc-res-mh{font-family:var(--serif);font-weight:700;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.45)}
/* Each level's heading on its own line above its paragraph; the opening part (no heading) reads as the lead */
h4.dc-res-mh{font-size:17px;line-height:1.35;margin:22px 0 6px}
h4.dc-res-mh:first-child{margin-top:0}
.dc-res-meanings h4.dc-res-mh+p{margin-top:0}

/* Theoretical Interpretations */
.dc-res-lenses{display:grid;gap:14px}
.dc-res-lens{background:rgba(255,255,255,.03);border:1px solid var(--card-border);border-radius:12px;padding:16px}
.dc-res-lens-t{font-family:var(--sans);font-weight:600;font-size:18px;color:var(--text);text-shadow:var(--glow-title);display:flex;align-items:center;gap:10px;margin:0 0 10px;line-height:1.3}
.dc-res-lens-t svg{color:var(--teal);flex:none}
.dc-res-lens-p{color:var(--mint);text-shadow:var(--glow-text);line-height:1.75;font-size:15.5px;margin:0}
.dc-res-lens-p+.dc-res-lens-p{margin-top:12px}
.dc-res-lens-note{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--card-border);font-size:13px;line-height:1.55;color:var(--muted)}
/* Inline step headings ("Manifest Content", "The Wish of the Soul"...), each above its paragraph */
.dc-res-step{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.35;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.4);margin:18px 0 5px}
.dc-res-lens .dc-res-step+.dc-res-lens-p{margin-top:0}
/* The grey subtitle under the Hall and Van de Castle title, as under the demo's first card */
.dc-res-lens-sub{margin:-6px 0 12px 30px;font-size:13.5px;color:var(--muted);font-style:italic;line-height:1.4}
/* "See how this dream was coded": closed by default */
.dc-res-fold{margin-top:16px;border-top:1px solid var(--card-border);padding-top:10px}
.dc-res-fold>summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--teal);font-size:14.5px;font-weight:500;padding:4px 0;min-height:36px}
.dc-res-fold>summary::-webkit-details-marker{display:none}
.dc-res-fold>summary svg{flex:none}
.dc-res-fold-chev{margin-left:auto;display:inline-flex;transition:transform .15s}
.dc-res-fold[open] .dc-res-fold-chev{transform:rotate(180deg)}
.dc-res-fold>summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}
.dc-res-fold .dc-res-hvdc{margin-top:8px}
.dc-res-hvdc{margin-top:14px;border:1px solid #26324A;background:#0F1422;border-radius:10px;padding:10px 12px}
.dc-res-hvdc-cap{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-style:italic;margin-bottom:6px}
.dc-res-hvdc-cap svg{color:var(--teal)}
.dc-res-hvdc table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.45}
.dc-res-hvdc th,.dc-res-hvdc td{text-align:left;vertical-align:top;padding:7px 0;border-top:1px solid #1E2738}
.dc-res-hvdc tr:first-child th,.dc-res-hvdc tr:first-child td{border-top:0}
.dc-res-hvdc th{font-weight:600;color:var(--teal);width:34%;padding-right:10px;font-size:13.5px}
.dc-res-hvdc td{color:var(--text);overflow-wrap:anywhere}
.dc-res-hvdc td div+div{margin-top:3px}
.dc-res-hvdc-none{margin:4px 0;color:var(--muted);font-size:14px}

/* Recommended Activities */
.dc-res-glow-p{color:var(--mint);text-shadow:var(--glow-text);line-height:1.65;margin:0 0 12px}
.dc-res-callout{margin-bottom:8px;line-height:1.55}
.dc-res-help{color:var(--muted);flex:none}
.dc-res-act{line-height:1.6}
.dc-res-act p{margin:6px 0}
.dc-res-act-note{display:flex;gap:8px;align-items:flex-start;color:var(--mint);text-shadow:var(--glow-text);font-weight:500}
.dc-res-act-note svg{color:var(--teal);flex:none;margin-top:4px}
.dc-res-act ol{margin:8px 0;padding-left:22px}
.dc-res-act li{margin:5px 0;padding-left:2px}
.dc-res-act li::marker{color:var(--teal);font-weight:600}
.dc-res-act-why{color:var(--muted);font-size:14px}
.dc-res-act-min{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px}
.dc-screen-result .dc-acc-head{line-height:1.4}

/* What Next? */
.dc-res-next{padding:18px 16px;margin-top:30px}
.dc-res-next-sub{color:var(--mint);text-shadow:var(--glow-text);margin:8px 0 16px}
.dc-res-next-grid{display:grid;gap:10px}
.dc-res-opt{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--card-border);border-radius:12px;color:inherit;text-decoration:none;background:rgba(255,255,255,.015)}
.dc-res-opt:hover{text-decoration:none;background:rgba(255,255,255,.04);border-color:#3A4458}
.dc-res-opt-ic{width:36px;height:36px;border-radius:50%;background:#2A3040;color:#D9DEE8;display:flex;align-items:center;justify-content:center;flex:none}
.dc-res-opt-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
.dc-res-opt-t{font-family:var(--serif);font-weight:700;font-size:16.5px;color:var(--text);text-shadow:var(--glow-title);line-height:1.3}
.dc-res-opt-d{font-size:14px;color:var(--muted);line-height:1.45}
.dc-res-opt.hi{border-color:var(--teal);background:rgba(46,230,200,.09)}
.dc-res-opt.hi:hover{background:rgba(46,230,200,.14)}
.dc-res-opt.hi .dc-res-opt-ic{background:rgba(46,230,200,.18);color:var(--teal)}
.dc-res-opt.hi .dc-res-opt-t{color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.45)}

@media (min-width:640px){
  .dc-res-dream,.dc-res-meanings,.dc-res-next{padding:22px}
  .dc-res-lens{padding:18px 20px}
  .dc-res-next-grid{grid-template-columns:1fr 1fr}
  .dc-res-opt.hi{grid-column:1 / -1}
}

/* settings.css */
/* Settings */
.dc-screen-settings .dc-section{margin:22px 0}
.dc-screen-settings .dc-set-card{padding:6px 14px}
.dc-screen-settings .dc-set-card>.dc-set-row-title:first-child{padding-top:10px}
.dc-screen-settings .dc-set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--card-border)}
.dc-screen-settings .dc-set-row:first-child{border-top:0}
.dc-screen-settings .dc-set-row-text{flex:1;min-width:0}
.dc-screen-settings .dc-set-row-title{font-size:15.5px;color:var(--text);font-weight:500}
.dc-screen-settings .dc-set-row-desc{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.dc-screen-settings .dc-set-text{font-size:14.5px;color:var(--muted);margin:6px 0 12px;line-height:1.55}

.dc-screen-settings .dc-set-switch{position:relative;flex:none;width:48px;height:28px;border-radius:999px;border:1px solid #3A4152;background:#232A3A;cursor:pointer;padding:0;transition:background .15s,border-color .15s}
.dc-screen-settings .dc-set-switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#AEB6C6;transition:transform .15s,background .15s}
.dc-screen-settings .dc-set-switch.on{background:var(--teal-dark);border-color:var(--teal)}
.dc-screen-settings .dc-set-switch.on .knob{transform:translateX(20px);background:var(--cyan);box-shadow:0 0 8px rgba(42,252,228,.6)}

.dc-screen-settings .dc-set-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0E1119;border:1px solid var(--card-border);border-radius:12px;padding:5px}
.dc-screen-settings .dc-set-seg-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid transparent;background:none;color:var(--muted);padding:10px;border-radius:9px;cursor:pointer;font-size:15px;font-weight:600}
.dc-screen-settings .dc-set-seg-btn svg{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.15);flex:none}
.dc-screen-settings .dc-set-seg-btn.active{background:var(--teal-fill);border-color:var(--teal);color:var(--teal)}

.dc-screen-settings .dc-set-timerow{padding:0 0 12px}
.dc-screen-settings .dc-set-timerow .dc-label{margin-top:0}
.dc-screen-settings .dc-set-time{max-width:180px;color-scheme:dark}
.dc-screen-settings .dc-set-note{margin:0 0 12px}
.dc-screen-settings .dc-set-note p{margin:0 0 8px;font-family:var(--sans)}

.dc-screen-settings .dc-set-blocks{padding:4px 0 8px}
.dc-screen-settings .dc-set-loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:8px 0}
.dc-screen-settings .dc-set-block{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--card-border)}
.dc-screen-settings .dc-set-block:first-child{border-top:0}
.dc-screen-settings .dc-set-block-avatar{width:34px;height:34px;border-radius:50%;background:#262C3E;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.dc-screen-settings .dc-set-block-text{flex:1;min-width:0}
.dc-screen-settings .dc-set-block-name{font-weight:500;overflow-wrap:anywhere}

.dc-screen-settings .dc-set-privacy{padding:14px}
.dc-screen-settings .dc-set-privacy p{font-size:14.5px;color:#D5DAE3;line-height:1.6;margin:0 0 10px}
.dc-screen-settings .dc-set-links{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 10px}
.dc-screen-settings .dc-set-privacy .dc-set-links{margin-bottom:0}
.dc-screen-settings .dc-set-kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--card-border);font-size:15px}
.dc-screen-settings .dc-set-kv:first-child{border-top:0}
.dc-screen-settings .dc-set-kv .v{color:var(--muted);display:inline-flex;align-items:center;gap:6px;text-align:right;font-size:14px;overflow-wrap:anywhere}
.dc-screen-settings .dc-set-kv .v.good{color:var(--ok)}
.dc-screen-settings .dc-set-kv .v.bad{color:var(--warn)}
.dc-screen-settings .dc-set-made{font-family:var(--serif);font-size:13.5px;color:var(--muted);margin:4px 0 10px}

/* symbols.css */
/* Dream Symbols dictionary and the symbol page. Scoped to .dc-screen-symbols. */
.dc-screen-symbols .dc-sym-title{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.dc-screen-symbols .dc-sym-title>svg{color:var(--teal);flex:none}
.dc-screen-symbols .dc-sym-title h1{font-size:clamp(32px,9.4vw,42px);line-height:1.12;color:var(--text);text-shadow:var(--glow-title);hyphens:auto;-webkit-hyphens:auto}
.dc-screen-symbols .dc-sym-intro{color:var(--mint);text-shadow:var(--glow-text);font-size:16px;line-height:1.5;margin:0 0 16px}

/* Search, chips, toggles */
.dc-screen-symbols .dc-sym-search{position:relative;margin:6px 0 14px}
.dc-screen-symbols .dc-sym-search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(46,230,200,.45);pointer-events:none}
.dc-screen-symbols .dc-sym-search .dc-input{background:#132A2B;border-color:#1E4544;padding-left:44px}
.dc-screen-symbols .dc-sym-search .dc-input::placeholder{color:#A7B4BC}
.dc-screen-symbols .dc-sym-search .dc-input:focus{border-color:var(--teal)}
.dc-screen-symbols .dc-sym-chips{display:flex;flex-wrap:wrap;gap:8px}
.dc-screen-symbols .dc-sym-toggles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.dc-screen-symbols .dc-sym-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid #3A4152;border-radius:999px;padding:6px 13px;background:rgba(0,0,0,.25);color:var(--muted);font-size:14px;cursor:pointer}
.dc-screen-symbols .dc-sym-toggle svg{color:var(--muted)}
.dc-screen-symbols .dc-sym-toggle[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-fill);color:var(--teal)}
.dc-screen-symbols .dc-sym-toggle[aria-pressed="true"] svg{color:var(--teal)}

/* A to Z index (sticky under the header, scrolls sideways on small phones) */
.dc-screen-symbols .dc-sym-az{position:sticky;top:var(--header-h);z-index:5;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gutter)) 14px;padding:8px var(--gutter);background:rgba(8,9,15,.92);border-bottom:1px solid #1B2230;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dc-screen-symbols .dc-sym-az::-webkit-scrollbar{display:none}
.dc-screen-symbols .dc-sym-az-btn{flex:1 0 26px;min-width:26px;height:30px;border:0;border-radius:7px;background:none;color:var(--teal);font-family:var(--serif);font-weight:700;font-size:15px;cursor:pointer;text-shadow:0 0 6px rgba(46,230,200,.45);padding:0}
.dc-screen-symbols .dc-sym-az-btn:hover:not([disabled]){background:var(--teal-fill)}
.dc-screen-symbols .dc-sym-az-btn[disabled]{color:#3A4152;text-shadow:none;cursor:default}
.dc-screen-symbols .dc-sym-az-btn.current{background:var(--teal-fill);box-shadow:inset 0 0 0 1px var(--teal-bar);color:var(--text)}
.dc-screen-symbols .dc-sym-az.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.dc-screen-symbols .dc-sym-az.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px);mask-image:linear-gradient(90deg,transparent,#000 36px)}
.dc-screen-symbols .dc-sym-az.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}

/* Letter cards and rows */
.dc-screen-symbols .dc-sym-letter{background:linear-gradient(180deg,#171B27 0%,#11141D 100%);border:1px solid #242A39;border-radius:var(--radius);padding:12px 12px 4px;margin:0 0 16px;box-shadow:0 0 22px rgba(46,230,200,.10);scroll-margin-top:calc(var(--header-h) + 56px)}
.dc-screen-symbols .dc-sym-letter-title{font-size:22px;color:var(--text);text-shadow:var(--glow-title);padding:2px 4px 6px;margin:0}
.dc-screen-symbols .dc-sym-row{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid #2A3040;color:var(--text);text-decoration:none;min-height:48px}
.dc-screen-symbols .dc-sym-rows .dc-sym-row:last-child{border-bottom-color:transparent}
.dc-screen-symbols .dc-sym-row:hover{background:rgba(255,255,255,.025);text-decoration:none}
.dc-screen-symbols .dc-sym-row-main{flex:1;min-width:0}
.dc-screen-symbols .dc-sym-row-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-screen-symbols .dc-sym-name{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.3;color:var(--text)}
.dc-screen-symbols .dc-sym-sum{color:var(--muted);font-size:14px;line-height:1.45;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-screen-symbols .dc-sym-row .chev{color:var(--text);opacity:.7;flex:none}
.dc-screen-symbols .dc-sym-uni{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;border:1px solid rgba(46,230,200,.55);background:var(--teal-fill);color:var(--teal);font-size:12px;line-height:1.5;white-space:nowrap}
.dc-screen-symbols .dc-sym-mark{display:inline-flex;color:var(--gold);filter:drop-shadow(0 0 4px rgba(230,222,166,.45))}
.dc-screen-symbols .dc-sym-msg{margin:6px 0 18px}

/* Symbol page */
.dc-screen-symbols .dc-sym-back{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-size:14.5px;padding:4px 0;margin:0 0 6px}
.dc-screen-symbols .dc-sym-head{margin:6px 0 18px}
.dc-screen-symbols .dc-sym-name-big{font-size:clamp(34px,10vw,46px);line-height:1.12;color:var(--text);text-shadow:var(--glow-title);margin:6px 0 12px;overflow-wrap:anywhere}
.dc-screen-symbols .dc-sym-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.dc-screen-symbols .dc-sym-meta .dc-pill{text-decoration:none}
.dc-screen-symbols .dc-sym-meta .dc-sym-uni{font-size:13px;padding:3px 10px}
.dc-screen-symbols .dc-sym-feels{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px}
.dc-screen-symbols .dc-sym-affect{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:1px 9px;font-size:12.5px;line-height:1.5;background:rgba(0,0,0,.25);white-space:nowrap}
.dc-screen-symbols .dc-sym-affect .dot{width:7px;height:7px;border-radius:50%}
.dc-screen-symbols .dc-sym-summary{color:var(--mint);text-shadow:var(--glow-text);font-size:18px;line-height:1.5;margin:16px 0 0}
.dc-screen-symbols .dc-sym-page .dc-card.glow p:last-child{margin-bottom:0}
.dc-screen-symbols .dc-sym-contexts{display:grid;gap:10px}
.dc-screen-symbols .dc-sym-contexts .dc-card+.dc-card{margin-top:0}
.dc-screen-symbols .dc-sym-context h3{font-size:16.5px;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.45);margin:0 0 6px}
.dc-screen-symbols .dc-sym-context p{margin:0;color:var(--text);font-size:15px}
.dc-screen-symbols .dc-sym-lenses{display:grid;gap:10px}
.dc-screen-symbols .dc-sym-lens{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px}
.dc-screen-symbols .dc-sym-lens-title{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--text);text-shadow:var(--glow-title);margin-bottom:6px}
.dc-screen-symbols .dc-sym-lens-title svg{color:var(--teal);flex:none}
.dc-screen-symbols .dc-sym-lens p{margin:0;color:var(--mint);text-shadow:var(--glow-text);font-size:14.5px;line-height:1.5}
.dc-screen-symbols .dc-sym-reflect p{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.45;color:var(--mint);text-shadow:var(--glow-text)}
.dc-screen-symbols .dc-sym-reflect p:last-child{margin-bottom:0}
.dc-screen-symbols .dc-sym-reflect p svg{color:var(--teal);flex:none;margin-top:5px}
.dc-screen-symbols .dc-sym-related .dc-chip{text-decoration:none;color:var(--text)}
.dc-screen-symbols .dc-sym-related .dc-chip:hover{background:#353B48;text-decoration:none}

/* Your history with this symbol */
.dc-screen-symbols .dc-sym-tl-card{padding:14px 16px 12px}
.dc-screen-symbols .dc-sym-tl{position:relative;height:28px}
.dc-screen-symbols .dc-sym-tl-line{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:linear-gradient(90deg,rgba(46,230,200,.15),rgba(46,230,200,.55),rgba(46,230,200,.15));border-radius:2px}
.dc-screen-symbols .dc-sym-tl-dot{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #0B0E16}
.dc-screen-symbols .dc-sym-tl-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:4px}
.dc-screen-symbols .dc-sym-tl-legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--card-border);color:var(--muted);font-size:12.5px}
.dc-screen-symbols .dc-sym-tl-legend span{display:inline-flex;align-items:center;gap:5px}
.dc-screen-symbols .dc-sym-tl-legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.dc-screen-symbols .dc-sym-hist-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.dc-screen-symbols .dc-sym-hist{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;color:var(--text);text-decoration:none}
.dc-screen-symbols .dc-sym-hist:hover{border-color:var(--teal);text-decoration:none}
.dc-screen-symbols .dc-sym-hist-main{flex:1;min-width:0}
.dc-screen-symbols .dc-sym-hist-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dc-screen-symbols .dc-sym-hist-date{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-size:14px}
.dc-screen-symbols .dc-sym-hist-as{font-family:var(--serif);font-weight:700;font-size:15.5px;margin-top:6px}
.dc-screen-symbols .dc-sym-hist-personal{color:var(--muted);font-size:14px;line-height:1.45;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dc-screen-symbols .dc-sym-hist-tone{color:var(--dim);font-size:13px;margin-top:6px}
.dc-screen-symbols .dc-sym-hist .chev{color:var(--muted);flex:none}

@media (min-width:640px){
  .dc-screen-symbols .dc-sym-contexts,.dc-screen-symbols .dc-sym-lenses{grid-template-columns:1fr 1fr}
  .dc-screen-symbols .dc-sym-az{margin-left:0;margin-right:0;padding-left:8px;padding-right:8px;border-radius:12px;border:1px solid #1B2230;gap:0}
  .dc-screen-symbols .dc-sym-az-btn{flex:1 1 22px;min-width:22px}
}

/* types.css */
/* Dream Types Dictionary (S8) and the type page. Scoped to .dc-screen-types; dialogs use .dc-types-modal. */
.dc-screen-types .dc-types-title{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.dc-screen-types .dc-types-title>svg{color:var(--teal);flex:none}
.dc-screen-types .dc-types-title h1{font-size:clamp(32px,9.4vw,42px);line-height:1.12;color:var(--text);text-shadow:var(--glow-title);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.dc-screen-types .dc-types-intro{color:var(--mint);text-shadow:var(--glow-text);font-size:16px;line-height:1.5;margin:0 0 18px}

/* About Dream Types */
.dc-screen-types .dc-types-about{display:flex;align-items:center;gap:10px;background:none;border:0;padding:8px 0;cursor:pointer;color:var(--text);font-size:15px;text-align:left}
.dc-screen-types .dc-types-about .nb{color:var(--teal);flex:none;margin-right:6px}
.dc-screen-types .dc-types-about .i{color:var(--text);opacity:.9;flex:none;margin-left:-4px}
.dc-screen-types .dc-types-about.open .i{color:var(--teal)}
.dc-screen-types .dc-types-about-body{background:var(--card);border:1px solid rgba(46,230,200,.35);box-shadow:var(--glow-box);border-radius:var(--radius);padding:16px;margin:6px 0 14px;color:var(--mint);text-shadow:var(--glow-text);font-size:15px}
.dc-screen-types .dc-types-about-body p{margin:0 0 .8em}
.dc-screen-types .dc-types-about-h{font-size:17px;color:var(--text);text-shadow:var(--glow-title);margin:6px 0 8px}
.dc-screen-types .dc-types-about-groups{margin:0}
.dc-screen-types .dc-types-about-groups dt{font-family:var(--serif);font-weight:700;color:var(--teal);margin-top:10px}
.dc-screen-types .dc-types-about-groups dd{margin:2px 0 0;color:var(--text);text-shadow:none;font-size:14.5px}

/* Search and filter */
.dc-screen-types .dc-types-search{position:relative;margin:12px 0 14px}
.dc-screen-types .dc-types-search>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:rgba(46,230,200,.45);pointer-events:none}
.dc-screen-types .dc-types-search .dc-input{background:#132A2B;border-color:#1E4544;padding-left:44px;color:var(--text)}
.dc-screen-types .dc-types-search .dc-input::placeholder{color:#A7B4BC}
.dc-screen-types .dc-types-search .dc-input:focus{border-color:var(--teal)}
.dc-screen-types .dc-types-filter{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.dc-screen-types .dc-types-filter-label{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;line-height:1.35;flex:0 0 76px}
.dc-screen-types .dc-types-filter-label svg{flex:none;opacity:.7}
.dc-screen-types .dc-types-chips{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.dc-screen-types .dc-types-chips .dc-chip{padding:9px 14px;font-size:14.5px;text-align:left}
@media (min-width:600px){
  .dc-screen-types .dc-types-filter{align-items:flex-start}
  .dc-screen-types .dc-types-filter-label{flex:none;padding-top:8px}
  .dc-screen-types .dc-types-chips{flex-direction:row;flex-wrap:wrap}
}

/* Category cards */
.dc-screen-types .dc-types-card{background:linear-gradient(180deg,#171B27 0%,#11141D 100%);border:1px solid #242A39;border-radius:var(--radius);padding:14px 12px 6px;margin:0 0 18px;box-shadow:0 0 22px rgba(46,230,200,.10)}
.dc-screen-types .dc-types-card-title{font-size:20px;color:var(--text);text-shadow:var(--glow-title);padding:4px 4px 10px;margin:0}
.dc-screen-types .dc-types-tap{-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.dc-screen-types .dc-types-item{border-bottom:1px solid #2A3040}
.dc-screen-types .dc-types-row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:13px 6px;cursor:pointer;text-align:left;min-height:48px}
.dc-screen-types .dc-types-row:hover{background:rgba(255,255,255,.025)}
.dc-screen-types .dc-types-dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.dc-screen-types .dc-types-dot.big{width:16px;height:16px}
.dc-screen-types .dc-types-dot.small{width:8px;height:8px}
.dc-screen-types .dc-types-label{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.3;flex:1;min-width:0}
.dc-screen-types .dc-types-row .chev{color:var(--text);opacity:.85;flex:none;transition:transform .1s}
.dc-screen-types .dc-types-item.open .chev{transform:rotate(180deg)}
.dc-screen-types .dc-types-detail{display:none;padding:0 6px 14px 29px;color:var(--muted);font-size:14.5px;line-height:1.5}
.dc-screen-types .dc-types-detail p{margin:0 0 8px}
.dc-screen-types .dc-types-item.open .dc-types-detail{display:block}
.dc-screen-types .dc-types-more{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-weight:600;font-size:14.5px;padding:4px 0}
.dc-screen-types .dc-types-empty{color:var(--dim);font-size:14px;margin:4px 6px 12px}
.dc-screen-types .dc-types-note{color:var(--muted);font-size:14px;margin:0 0 12px}

/* Type page */
.dc-screen-types .dc-types-back{display:inline-flex;align-items:center;gap:6px;color:var(--teal);font-size:14.5px;padding:4px 0;margin:0 0 6px}
.dc-screen-types .dc-types-head{margin:6px 0 18px}
.dc-screen-types .dc-types-name{display:flex;align-items:center;gap:12px;font-size:clamp(30px,8.6vw,40px);line-height:1.15;color:var(--text);text-shadow:var(--glow-title);margin:6px 0 12px;overflow-wrap:anywhere}
.dc-screen-types .dc-types-group{text-decoration:none}
.dc-screen-types .dc-types-short{color:var(--mint);text-shadow:var(--glow-text);font-size:17px;line-height:1.5;margin:14px 0 0}
.dc-screen-types .dc-types-desc{margin:0 0 6px}
.dc-screen-types .dc-types-desc p:last-child,.dc-screen-types .dc-types-science p:last-child,.dc-screen-types .dc-types-lens p:last-child{margin-bottom:0}
.dc-screen-types .dc-types-steps{margin:0;padding:0;list-style:none;counter-reset:dcstep}
.dc-screen-types .dc-types-steps li{counter-increment:dcstep;position:relative;padding:10px 12px 10px 46px;margin:0 0 8px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;color:var(--text);font-size:15px}
.dc-screen-types .dc-types-steps li::before{content:counter(dcstep);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--teal-fill);border:1px solid var(--teal-bar);color:var(--teal);font-family:var(--serif);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.dc-screen-types .dc-types-science{font-size:15px;color:var(--text)}
.dc-screen-types .dc-types-lenses{display:grid;gap:12px}
.dc-screen-types .dc-types-lenses .dc-card+.dc-card{margin-top:0}
.dc-screen-types .dc-types-lens-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;color:var(--text);text-shadow:var(--glow-title);margin-bottom:8px}
.dc-screen-types .dc-types-lens-title svg{color:var(--teal);flex:none}
.dc-screen-types .dc-types-lens-note{color:var(--muted);font-size:12.5px;line-height:1.45;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--card-border)}
.dc-screen-types .dc-types-caution{display:flex;gap:12px;align-items:flex-start;border:1px solid #3E5A92;background:#141C30;border-radius:12px;padding:14px 16px;margin:26px 0;color:#D6E2FF;font-size:15px}
.dc-screen-types .dc-types-caution>svg{color:#9DB8F2;flex:none;margin-top:2px}
.dc-screen-types .dc-types-caution-title{font-family:var(--serif);font-weight:700;color:#fff;margin-bottom:4px}
.dc-screen-types .dc-types-caution p{margin:0 0 6px}
.dc-screen-types .dc-types-caution p:last-child{margin:0}
.dc-screen-types .dc-types-rel+.dc-types-rel{margin-top:14px}
.dc-screen-types .dc-types-rel h3{font-family:var(--sans);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.dc-screen-types .dc-types-rel-type{background:rgba(0,0,0,.25);font-family:var(--serif);font-weight:700;font-size:14px;padding:5px 12px;text-decoration:none}
.dc-screen-types .dc-types-rel-sym{text-decoration:none;color:var(--text)}
.dc-screen-types .dc-types-rel-sym:hover{background:#353B48;text-decoration:none}
.dc-screen-types .dc-types-mine{display:flex;flex-direction:column;gap:10px}
.dc-screen-types .dc-types-mine-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;color:var(--text);text-decoration:none}
.dc-screen-types .dc-types-mine-row:hover{border-color:var(--teal);text-decoration:none}
.dc-screen-types .dc-types-mine-main{flex:1;min-width:0}
.dc-screen-types .dc-types-mine-date{display:flex;align-items:center;gap:6px;color:var(--teal);font-size:13.5px}
.dc-screen-types .dc-types-mine-title{font-family:var(--serif);font-weight:700;font-size:16px;margin:4px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-screen-types .dc-types-mine-row .chev{color:var(--muted);flex:none}
@media (min-width:720px){
  .dc-screen-types .dc-types-lenses{grid-template-columns:1fr 1fr}
}

/* Dialogs (appended to body) */
.dc-types-modal .dc-modal{border-radius:0;max-width:520px}
.dc-types-modal .dc-types-code .dc-input{margin-top:2px}
.dc-types-granted .dc-modal h3 svg{color:var(--ok)}
.dc-types-granted .dc-types-welcome-text{text-align:center;color:var(--muted);font-size:15px;margin:2px 0 16px}
.dc-types-granted .dc-types-welcome-box{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.dc-types-granted .dc-types-welcome-box svg{flex:none;color:var(--ok);margin-top:1px}

/* Access Granted: the module's emblem above the message */
.dc-types-emblem{display:flex;justify-content:center;margin:2px 0 14px;opacity:0;transition:opacity .5s ease}
.dc-types-emblem.on{opacity:1}
.dc-types-emblem img{width:112px;height:112px;filter:drop-shadow(0 0 12px rgba(46,230,200,.4)) drop-shadow(0 0 26px rgba(59,227,122,.2))}

shboard.pat.emo.ascent.text":"The feeling rises: climbing, flying, lifting off or reaching a high place. It often comes with relief, hope or a sense of growing strength.","dashboard.pat.emo.descent.name":"Descent","dashboard.pat.emo.descent.text":"The feeling sinks: falling, going down stairs, slipping into water or darkness. It may go with tiredness or letting go, or with turning inward to look at what lies beneath.","dashboard.pat.emo.expansion.name":"Expansion","dashboard.pat.emo.expansion.text":"The dream opens out: new rooms, wide views, more space than you expected. It often comes with curiosity and a sense of new possibilities.","dashboard.pat.emo_none.one":"{{n}} dream showed none of the four patterns.","dashboard.pat.emo_none.other":"{{n}} dreams showed none of the four patterns.","dashboard.pat.change_title":"How Your Symbols Changed","dashboard.pat.change_sub":"The Dream Code holds that meaning lives in the feeling around a symbol. When a symbol that once felt distressing begins to feel calming, that shift may be a sign that something in you is changing.","dashboard.pat.change.same":"Felt {{affect}} each time","dashboard.pat.change.better":"Moving toward calm","dashboard.pat.change.worse":"Moving toward distress","dashboard.pat.change.varied":"The feeling has shifted from dream to dream","dashboard.pat.change_none":"When a symbol returns in another analyzed dream, you will see here how it felt each time.","dashboard.sci.title":"The Hall and Van de Castle System","dashboard.sci.p1":"In \"The Content Analysis of Dreams\" (1966), Calvin Hall and Robert Van de Castle set out a way to count what actually happens in a dream: who appears, how the characters treat one another, what they feel, where the dream takes place, and the successes, failures and misfortunes along the way. Because every dream is coded the same way, dreams can be compared across people and over time.","dashboard.sci.p2":"Their norms, drawn from dream reports written by American college students, are still a standard point of comparison in dream research. Later work, notably by G. William Domhoff (1996), relies on a set of simple percentages and ratios built from the codes: the content indicators below. DREAM CODE codes each analyzed dream automatically and compares your dreams, taken together, with those norms.","dashboard.sci.compare":"Compare with:","dashboard.sci.norms.women":"Women","dashboard.sci.norms.men":"Men","dashboard.sci.norms.both":"Both","dashboard.sci.norms_of.women":"women's","dashboard.sci.norms_of.men":"men's","dashboard.sci.norms_of.both":"combined women's and men's","dashboard.sci.progress_title":"Building Your Profile","dashboard.sci.progress":"{{n}} of {{min}} coded dreams: the profile appears when you have {{min}}","dashboard.sci.progress_text":"Every analyzed dream is coded automatically. Keep analyzing your dreams and your profile will appear here.","dashboard.sci.unanalyzed.one":"You have {{n}} dream in your journal that is not analyzed yet.","dashboard.sci.unanalyzed.other":"You have {{n}} dreams in your journal that are not analyzed yet.","dashboard.sci.analyze":"Analyze a Dream","dashboard.sci.journal":"Open Dream Journal","dashboard.sci.table_title":"Your Content Indicators","dashboard.sci.table_sub.one":"From {{n}} coded dream, compared with the {{norms}} norms.","dashboard.sci.table_sub.other":"From {{n}} coded dreams, compared with the {{norms}} norms.","dashboard.sci.col.indicator":"Indicator","dashboard.sci.col.you":"You","dashboard.sci.col.norm":"Norm","dashboard.sci.col.diff":"Difference","dashboard.sci.effect.similar":"similar","dashboard.sci.effect.more1":"somewhat more","dashboard.sci.effect.more2":"noticeably more","dashboard.sci.effect.more3":"much more","dashboard.sci.effect.less1":"somewhat less","dashboard.sci.effect.less2":"noticeably less","dashboard.sci.effect.less3":"much less","dashboard.sci.effect_help":"Differences are described with Cohen's h, the effect size used in research with this system: below 0.2 reads as similar, from 0.2 somewhat, from 0.5 noticeably and from 0.8 much more or less.","dashboard.sci.info":"About this indicator","dashboard.sci.na":"n/a","dashboard.sci.reliable":"Research suggests it takes about {{n}} dream reports for a profile to come close to the norms (Domhoff, 1996), so read this as a first sketch.","dashboard.sci.sources":"Norms: Hall and Van de Castle (1966), as summarized by Schneider and Domhoff on dreamresearch.net and by Domhoff (1996, 2005).","dashboard.sci.summary_title":"What Stands Out","dashboard.sci.note":"Automatic coding is an estimate. Patterns are meaningful only across many dreams. This is not a psychological assessment.","dashboard.sci.load_error":"The Dream Science Profile could not load. Please try again.","dashboard.sci.retry":"Try again","dashboard.sci.p0":"The Dream Code reads a dream by the feeling it carries; the Hall and Van de Castle system counts what it contains. Your readings give you the first; this profile adds the second, so you can see both how your dreams feel and what they hold.","home.doc_title":"Home","home.film_label":"Empyrean Scientifica opening film","home.film_play":"Play the opening film","home.film_mute":"Mute the film","home.film_unmute":"Turn the film sound on","home.logo_alt":"Empyrean Scientifica","home.subtitle":"Illuminate the depths of your subconscious mind","home.body":"Unlock the hidden meaning of your dreams with an interpretation tool built on the method of The Dream Code, bringing together the great schools of dream psychology, a living dream tradition and modern dream science.","home.get_started":"Get Started","home.book.title":"The Dream Code","home.book.p1_before":"DREAM CODE is the companion to ","home.book.book_title":"The Dream Code: Understanding Your Mind Through the Science of Dreams","home.book.p1_by":" by ","home.book.p1_after":". The book begins with a simple observation: a dream speaks in emotion first and image second. The feeling arrives before the picture, and the picture is the way the mind gives that feeling a shape.","home.book.p2":"That is why meaning is not looked up in a fixed dictionary. The same ocean, house or stranger can say very different things depending on the feeling around it and the part you play in the scene. Keep a journal, and you begin to see how your own symbols shift over the months; those changes are a quiet record of how you are changing.","home.book.more":"About the Book","home.feat.foundations.title":"Built on The Dream Code","home.feat.foundations.text":"Every reading follows the book's method: the feeling first, then the image. It then draws on Freud, Jung, Hall and Van de Castle, the Haudenosaunee dream tradition and modern dream science, each explained in plain words.","home.feat.journal.title":"A Journal That Keeps Your Dreams","home.feat.journal.text":"Your dreams are saved on your phone and to your account, searchable and exportable at any time. Your journal is yours, on every plan.","home.feat.research.title":"Research-Based Analysis","home.feat.research.text":"Grounded in The Dream Code and in published dream research, from the content analysis of dreams to modern work on sleep, memory and emotion.","home.plans.title":"Choose Your Plan","home.plans.subtitle":"Unlock the full potential of dream analysis","home.plans.popular":"Most Popular","home.plans.best":"Best Value","home.plans.per_month":"per month","home.plans.per_year":"per year","home.plans.forever":"free forever","home.plans.save":"Save {{amount}} a year","home.plans.or_monthly":"or {{price}} per month","home.plans.current":"Current Plan","home.plans.view_all":"View All Pricing Options","home.plans.free_title":"Free to Use","home.plans.free_subtitle":"Every account includes the Free plan. Paid plans are not on sale yet.","home.plans.app_subtitle":"Every account includes the Free plan. Paid plans are available in the DREAM CODE Android app, through Google Play.","home.plan.free.name":"Free","home.plan.free.f1":"Dream journal witho .idea.emotion.title":"Prima l'Emozione","book.idea.emotion.text":"Un sogno parla prima con l'emozione e poi con l'immagine. La sensazione arriva prima della scena, e la scena è il modo in cui la mente dà forma a quella sensazione.","book.idea.emotion.where":"In ogni lettura","book.idea.feeling.title":"Il Significato Vive nella Sensazione","book.idea.feeling.text":"Lo stesso oceano, la stessa casa o lo stesso sconosciuto possono dire cose molto diverse a seconda della sensazione che li circonda e del ruolo che hai nella scena. Per questo il significato non si cerca in un dizionario fisso.","book.idea.feeling.where":"In ogni pagina dei simboli","book.idea.patterns.title":"Gli Schemi Emotivi","book.idea.patterns.text":"Inseguimento, ascesa, discesa ed espansione: i modi in cui l'emozione di un sogno può muoversi. Ogni lettura mostra lo schema del tuo sogno, e la Dashboard mostra quando compare ciascuno.","book.idea.patterns.where":"Nelle tue letture e nella Dashboard","book.idea.journal.title":"Una Traccia di Come Cambi","book.idea.journal.text":"Tieni un diario e comincerai a vedere come i tuoi simboli cambiano nel corso dei mesi; quei cambiamenti sono una traccia discreta di come stai cambiando tu.","book.idea.journal.where":"Nel Diario dei Sogni e nella Dashboard","book.open":"Apri","book.start_title":"Comincia dal Tuo Sogno","book.start_text":"Registra un sogno e guarda il metodo del libro all'opera nella tua lettura.","book.start":"Analizza un Sogno","book.get":"Acquista il Libro","book.card.title":"Approfondisci con The Dream Code","book.card.text":"Questa lettura segue il metodo di The Dream Code di Randolph R Beverly Jr: prima la sensazione, poi l'immagine. Il libro mostra come leggere i tuoi sogni, e come i tuoi simboli cambiano insieme a te.","book.card.more":"Scopri il Libro","book.symbol_card.title":"Da The Dream Code","book.symbol_card.text":"The Dream Code insegna che il significato di un simbolo vive nella sensazione che lo circonda. Quando questo simbolo compare nei tuoi sogni, nota prima come ti ha fatto sentire; il libro di Randolph R Beverly Jr mostra come leggerlo da lì.","chat.title":"Parla con Dream AI","chat.back":"Torna all'analisi","chat.about":"Stai parlando di:","chat.intro":"Chiedi di un simbolo, di una sensazione o di cosa provare adesso. Le risposte sono spunti per il tuo benessere, non consigli professionali.","chat.welcome":"Ho letto il tuo sogno e la sua analisi. Cosa ti piacerebbe esplorare?","chat.try":"Potresti chiedere:","chat.starter1":"Cosa potrebbe dirmi l'immagine principale di questo sogno?","chat.starter2":"Quale piccolo passo potrei fare dopo questo sogno?","chat.placeholder":"Chiedi del tuo sogno...","chat.send":"Invia","chat.thinking":"Sto pensando...","chat.you":"Tu","chat.ai":"Dream AI","chat.left.one":"{{n}} messaggio di chat rimasto","chat.left.other":"{{n}} messaggi di chat rimasti","chat.no_analysis":"Questo sogno non è ancora stato analizzato. Le risposte sono più ricche dopo un'analisi.","chat.analyze":"Analizza il Sogno","chat.offline":"Sei offline. Il messaggio non è stato inviato; riprova quando tornerai online.","chat.timeout":"La risposta sta richiedendo troppo tempo. Riprova.","chat.error":"Non è stato possibile caricare la risposta. Riprova.","chat.too_long":"Il messaggio deve restare sotto i 2000 caratteri.","community.title":"Comunità dei Sognatori","community.subtitle":"Entra in contatto con altri sognatori ed esplora gli schemi dei sogni condivisi","community.tabs.feed":"Bacheca","community.tabs.share":"Condividi","community.tabs.chat":"Chat","community.tabs.trends":"Tendenze","community.tabs.map":"Mappa","community.you":"Tu","community.preview_name":"Il tuo nome nella comunità","community.shared":"Sogno condiviso con successo","community.load_more":"Carica altri","community.retry":"Riprova","community.load_error":"Impossibile caricare","community.compose.title":"Condividi il tuo sogno","community.compose.label":"Il tuo sogno","community.compose.ph":"Descrivi il tuo  lo vedrai qui.","dashboard.pat.affect.calming":"Rassicurante","dashboard.pat.affect.distressing":"Angosciante","dashboard.pat.affect.mixed":"Misto","dashboard.pat.affect.neutral":"Neutro","dashboard.pat.types_title":"Distribuzione dei Tipi di Sogno","dashboard.pat.types_sub":"Quanti dei tuoi sogni analizzati mostrano ciascun tipo. Un sogno può avere più di un tipo.","dashboard.pat.tone_title":"Tono Emotivo per Settimana","dashboard.pat.tone_sub":"Il tono generale di ogni sogno analizzato, raggruppato per la settimana in cui lo hai sognato.","dashboard.pat.tone.positive":"Positivo","dashboard.pat.tone.neutral":"Neutro","dashboard.pat.tone.mixed":"Misto","dashboard.pat.tone.negative":"Negativo","dashboard.pat.week_of":"Settimana del {{date}}","dashboard.pat.emo_title":"Schemi Emotivi","dashboard.pat.emo_sub":"The Dream Code descrive quattro modi in cui l'emozione di un sogno può muoversi. Ecco quando ciascuno è comparso nei tuoi sogni.","dashboard.pat.emo.pursuit.name":"Inseguimento","dashboard.pat.emo.pursuit.text":"Il sogno si muove come una corsa: fuggire da qualcosa, o affrettarsi dietro qualcosa che resta appena fuori portata. Un modo di leggerlo è che una preoccupazione o un desiderio chiede la tua attenzione.","dashboard.pat.emo.ascent.name":"Ascesa","dashboard.pat.emo.ascent.text":"L'emozione sale: arrampicarsi, volare, sollevarsi o raggiungere un luogo alto. Spesso arriva con sollievo, speranza o la sensazione di una forza che cresce.","dashboard.pat.emo.descent.name":"Discesa","dashboard.pat.emo.descent.text":"L'emozione scende: cadere, scendere le scale, scivolare nell'acqua o nel buio. Può accompagnare stanchezza o il bisogno di lasciar andare, oppure il desiderio di guardare dentro di sé, sotto la superficie.","dashboard.pat.emo.expansion.name":"Espansione","dashboard.pat.emo.expansion.text":"Il sogno si apre: stanze nuove, panorami ampi, più spazio di quanto ti aspettassi. Spesso arriva con curiosità e con la sensazione di nuove possibilità.","dashboard.pat.emo_none.one":"{{n}} sogno non ha mostrato nessuno dei quattro schemi.","dashboard.pat.emo_none.other":"{{n}} sogni non hanno mostrato nessuno dei quattro schemi.","dashboard.pat.change_title":"Come Sono Cambiati i Tuoi Simboli","dashboard.pat.change_sub":"The Dream Code sostiene che il significato vive nella sensazione intorno a un simbolo. Quando un simbolo che un tempo era angosciante comincia a essere rassicurante, quel cambiamento può essere il segno che qualcosa in te sta cambiando.","dashboard.pat.change.same":"Sempre {{affect}}","dashboard.pat.change.better":"Verso la calma","dashboard.pat.change.worse":"Verso l'angoscia","dashboard.pat.change.varied":"La sensazione è cambiata da un sogno all'altro","dashboard.pat.change_none":"Quando un simbolo tornerà in un altro sogno analizzato, qui vedrai come ti sei sentito ogni volta.","dashboard.sci.title":"Il Sistema di Hall e Van de Castle","dashboard.sci.p1":"In \"The Content Analysis of Dreams\" (1966), Calvin Hall e Robert Van de Castle hanno proposto un modo per contare ciò che accade davvero in un sogno: chi compare, come i personaggi si comportano tra loro, cosa provano, dove si svolge il sogno, e i successi, i fallimenti e le disavventure lungo il percorso. Poiché ogni sogno viene codificato allo stesso modo, i sogni si possono confrontare tra persone diverse e nel tempo.","dashboard.sci.p2":"Le loro norme, ricavate dai resoconti di sogni scritti da studenti universitari americani, sono ancora un punto di riferimento nella ricerca sui sogni. Studi successivi, in particolare quelli di G. William Domhoff (1996), usano un insieme di semplici percentuali e rapporti costruiti dai codici: gli indicatori di contenuto qui sotto. DREAM CODE codifica automaticamente ogni sogno analizzato e confronta i tuoi sogni, nel loro insieme, con quelle norme.","dashboard.sci.compare":"Confronta con:","dashboard.sci.norms.women":"Donne","dashboard.sci.norms.men":"Uomini","dashboard.sci.norms.both":"Entrambi","dashboard.sci.norms_of.women":"delle donne","dashboard.sci.norms_of.men":"degli uomini","dashboard.sci.norms_of.both":"di donne e uomini insieme","dashboard.sci.progress_title":"Il Tuo Profilo Sta Prendendo Forma","dashboard.sci.progress":"Sogni codificati: {{n}} su {{min}}. Il profilo compare quando ne avrai {{min}}","dashboard.sci.progress_text":"Ogni sogno analizzato viene codificato automaticamente. Continua ad analizzare i tuoi sogni e il tuo profilo comparirà qui.","dashboard.sci.unanalyzed.one":"Hai {{n}} sogno nel diario non ancora analizzato.","dashboard.sci.unanalyzed.other":"Hai {{n}} sogni nel diario non ancora analizzati.","dashboard.sci.analyze":"Analizza un Sogno","dashboard.sci.journal":"Apri il Diario dei Sogni","dashboard.sci.table_title":"I Tuoi Indicatori di Contenuto","dashboard.sci.table_sub.one":"Da {{n}} sogno codificato, confrontato con le norme {{norms}}.","dashboard.sci.table_sub.other":"Da {{n}} sogni codificati, confrontati con le norme {{norms}}.","dashboard.sci.col.indicator":"Indicatore","dashboard.sci.col.you":"Tu","dashboard.sci.col.norm":"Norma","dashboard.sci.col.diff":"Differenza","dashboard.sci.effect.similar":"simile","dashboard.sci.effect.more1":"un po' di più","dashboard.sci.effect.more2":"decisamente di più","dashboard.sci.effect.more3":"molto di più","dashboard.sci.effect.less1":"un po' di meno","dashboard.sci.effect.less2":"decisamente di meno","dashboard.sci.effect.less3":"molto di meno","dashboard.sci.effect_help":"Le differenze sono descritte con la h di Cohen, la misura dell'effetto usata nella ricerca con questo sistema: sotto 0,2 si legge come simile, da 0,2 un po', da 0,5 decisamente e da 0,8 molto di più o di meno.","dashboard.sci.info":"Informazioni su questo indicatore","dashboard.sci.na":"n.d.","dashboard.sci.reliable":"Secondo la ricerca servono circa {{n}} resoconti di sogni perché un profilo si avvicini alle norme (Domhoff, 1996): leggilo come un primo abbozzo.","dashboard.sci.sources":"Norme: Hall e Van de Castle (1966), nella sintesi di Schneider e Domhoff su dreamresearch.net e di Domhoff (1996, 2005).","dashboard.sci.summary_title":"Cosa Emerge","dashboard.sci.note":"La codifica automatica è una stima. Gli schemi hanno senso solo su molti sogni. Non è una valutazione psicologica.","dashboard.sci.load_error":"Non è stato possibile caricare il Profilo Scientifico dei Sogni. Riprova.","dashboard.sci.retry":"Riprova","dashboard.sci.p0":"The Dream Code legge un sogno attraverso la sensazione che porta; il sistema di Hall e Van de Castle conta ciò che contiene. Le tue letture ti danno la prima; questo profilo aggiunge il secondo, così puoi vedere sia come si sentono i tuoi sogni sia che cosa contengono.","home.doc_title":"Home","home.film_label":"Filmato di apertura di Empyrean Scientifica","home.film_play":"Riproduci il filmato di apertura","home.film_mute":"Disattiva l'audio del filmato","home.film_unmute":"Attiva l'audio del filmato","home.logo_alt":"Empyrean Scientifica","home.subtitle":"Illumina le profondità della tua mente inconscia","home.body":"Scopri il significato nascosto dei tuoi sogni con uno strumento di interpretazione costruito sul metodo di The Dream Code, che riunisce le grandi scuole della psicologia del sogno, una tradizione onirica viva e la scienza moderna del sogno.","home.get_started":"Inizia","home.book.title":"The Dream Code","home.book.p1_before":"DREAM CODE accompagna il libro ","home.book.book_title":"The Dream Code: Understanding Your Mind Through the Science of Dreams","home.book.p1_by":" di ","home.book.p1_after":". Il libro parte da un'osservazione semplice: un sogno parla prima con l'emozione e poi con l'immagine. La sensazione arriva prima della scena, e la scena è il modo in cui la mente dà forma a quella sensazione.","home.book.p2":"Per questo il significato non si cerca in un dizionario fisso. Lo stesso oceano, la stessa casa o lo stesso sconosciuto possono dire cose molto diverse a seconda della sensazione che li circonda e del ruolo che hai nella scena. Tieni un diario e comincerai a vedere come i tuoi simboli cambiano nel corso dei mesi; quei cambiamenti sono una traccia discreta di come stai cambiando tu.","home.book.more":"Scopri il Libro","home.feat.foundations.title":"Costruito su The Dream Code","home.feat.foundations.text":"Ogni lettura segue il metodo del libro: prima la sensazione, poi l'immagine. Poi attinge a Freud, Jung, Hall e Van de Castle, alla tradizione onirica haudenosaunee e alla scienza moderna del sogno, il tutto spiegato con parole semplici.","home.feat.journal.title":"Un Diario che Custodisce i Tuoi Sogni","home.feat.journal.text":"I tuoi sogni vengono salvati sul telefono e nel tuo account, si possono cercare ed esportare in qualsiasi momento. Il diario è tuo, con ogni piano.","home.feat.research.title":"Analisi Basata sulla Ricerca","home.feat.research.text":"Fondata su The Dream Code e sulla ricerca pubblicata sul sogno, dall'analisi del contenuto dei sogni agli studi moderni su sonno, memoria ed emozioni.","home.plans.title":"Scegli il Tuo Piano","home.plans.subtitle":"Sfrutta appieno l'analisi dei sogni","home.plans.popular":"Il Più Scelto","home.plans.best":"Miglior Valore","home.plans.per_month":"al mese","home.plans.per_year":"all'anno","home.plans.forever":"gratis per sempre","home.plans.save":"Risparmi {{amount}} all'anno","home.plans.or_monthly":"oppure {{price}} al mese","home.plans.current":"Piano Attuale","home.plans.view_all":"Vedi Tutte le Opzioni di Prezzo","home.plans.free_title":"Gratuito","home.plans.free_subtitle":"Ogni account include il piano Gratuito. I piani a pagamento non sono ancora in vendita.","home.plans.app_subtitle":"Ogni account include il piano Gratuito. I piani a pagamento sono disponibili nell'app Android di DREAM CODE, tramite Google Play.","home.plan.free.name":"Gratuito","home.plan.free.f1":"Diario dei sogni senza limiti","home.plan.free.f2":"Esporta i tuoi sogni quando vuoi","home.plan.free.f3":"Dizionari dei sogni e comunità","home.plan.free.f (function () {
  'use strict';
  const DC = window.DC = window.DC || {};
  const BUILD = window.__DC_BUILD || { version: 'dev', api: 'https://dreamcode-ecru.vercel.app', mock: true };

  DC.version = BUILD.version;

  DC.ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },

    if (q.has('mock')) DC.ls.set('dc.mock', q.get('mock') === '1');

    api: String(DC.ls.get('dc.api', BUILD.api) || BUILD.api).replace(/\/+$/, ''),
    mock: !!(BUILD.mock && DC.ls.get('dc.mock', false)),
    // Where to buy The Dream Code (set at build time); without it the "Get the Book" buttons are not shown.
    book: /^https:\/\//.test(String(BUILD.book || '')) ? String(BUILD.book) : ''

  const handlers = {};

  // A screen leaves a named slot (DC.slotEl); another part of the app may fill it (DC.slot). A filler returns a node,

  const slotFns = {};

  DC.slotEl = function (name, ctx) {

      const parts = t.split(/(?=[.#])/);
      t = parts[0] && parts[0][0] !== '.' && parts[0][0] !== '#' ? parts.shift() : 'div';
      parts.forEach(p => { if (p[0] === '.') cls.push(p.slice(1)); else if (p[0] === '#') attrs = Object.assign({ id: p.slice(1) }, attrs || {}); });
    }
    const svgTags = { svg: 1, path: 1, circle: 1, line: 1, rect: 1, g: 1, polyline: 1, polygon: 1, text: 1, ellipse: 1, defs: 1, lineargradient: 1, stop: 1 };
    const el = svgTags[t.toLowerCase()] ? document.createElementNS('http://www.w3.org/2000/svg', t) : document.createElement(t);
    if (cls.length) el.setAttribute('class', cls.join(' '));
    const a = attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs) ? attrs : null;
    let start = a ? 2 : 1;
    if (a) {
      for (const k in a) {
        const v = a[k];
        if (v == null || v === false) continue;
        if (k === 'on') { for (const e in v) el.addEventListener(e, v[e]); }
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'class' || k === 'className') el.setAttribute('class', (cls.concat(String(v).split(' '))).filter(Boolean).join(' '));
        else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
        else if (k === 'dataset') Object.assign(el.dataset, v);
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'value' && 'value' in el) el.value = v;
        else if (k === 'checked' || k === 'disabled' || k === 'selected' || k === 'autofocus') { el[k] = !!v; if (v) el.setAttribute(k, ''); }
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (let i = start; i < arguments.length; i++) append(el, arguments[i]);
    return el;
  };
  function append(el, c) {
    if (c == null || c === false || c === true) return;
    if (Array.isArray(c)) { c.forEach(x => append(el, x)); return; }

  }

  DC.clear = el => { while (el && el.firstChild) el.removeChild(el.firstChild); return el; };
  DC.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---- helpers ----
  DC.uuid = function () {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    const b = new Uint8Array(16); (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach((_, i) => { b[i] = Math.random() * 256 | 0; });

  };
  DC.sleep = ms => new Promise(r => setTimeout(r, ms));
  DC.debounce = function (fn, ms) { let t; return function () { const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; };
  DC.today = function () { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  DC.sha256 = async function (s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
  };
  DC.initials = function (name) {
    const p = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '?';
    return (p[0][0] + (p.length > 1 ? p[p.length - 1][0] : (p[0][1] || ''))).toUpperCase();
  };
  DC.signedIn = () => !!DC.state.account;
  DC.isNative = () => !!DC.native;

  window.addEventListener('online', () => { DC.state.online = true; DC.emit('online', true); });
  window.addEventListener('offline', () => { DC.state.online = false; DC.emit('online', false); });
})();

    if (opts.auth !== false && t && t.access) headers['Authorization'] = 'Bearer ' + t.access;

    del: (p, o) => request('DELETE', p, undefined, o),

/* Sends the outbox to the server in order, then pulls every change since the last cursor.

      await DC.store.wipe();

      await DC.store.setMeta('cursor', 0);

(function () {

  const DC = window.DC;
  const cache = {};

  function load(name) {
    const key = name + '.' + DC.state.lang;
    if (!cache[key]) {
      cache[key] = fetch('data/' + key + '.json', { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .catch(e => { delete cache[key]; throw e; });
    }

  }

    const list = await load('symbols');
    const k = DC.state.lang;
    if (!aliasIndex[k]) {
      const idx = new Map();
      list.forEach(s => { idx.set(norm(s.name), s); (s.aliases || []).forEach(a => { if (!idx.has(norm(a))) idx.set(norm(a), s); }); idx.set(norm(s.id.replace(/-/g, ' ')), s); });

    symbols,
    async symbol(id) { return (await symbols()).find(s => s.id === id) || null; },

    async symbolByName(name) {

      const n = norm(name);

/* Hash router. Screens register with DC.screen(name, {route, title, auth, render(el, params, query)}). */
(function () {
  'use strict';
  const DC = window.DC;
  const screens = [];
  let current = null, cleanup = null;

  DC.screen = function (name, def) { def.name = name; screens.push(def); };
  DC.screens = screens;
  DC.go = function (hash, opts) {
    if (!hash.startsWith('#')) hash = '#' + hash;
    if (opts && opts.replace) { history.replaceState(null, '', hash); render(); }
    else if (location.hash === hash) render();
    else location.hash = hash;
  };
  DC.back = function (fallback) { if (history.length > 1) history.back(); else DC.go(fallback || '#/'); };

  function parse() {
    const full = location.hash || '#/';
    const qi = full.indexOf('?');
    const path = qi >= 0 ? full.slice(0, qi) : full;
    const query = {};
    if (qi >= 0) new URLSearchParams(full.slice(qi + 1)).forEach((v, k) => { query[k] = v; });
    return { path: path === '#' ? '#/' : path, query };
  }
  function match(path) {
    for (const s of screens) {
      const routes = Array.isArray(s.route) ? s.route : [s.route];
      for (const r of routes) {
        if (typeof r === 'string' && r === path) return { s, params: [] };
        if (r instanceof RegExp) { const m = path.match(r); if (m) return { s, params: m.slice(1).map(decodeURIComponent) }; }
      }
    }
    return null;
  }

  function render() {
    const { path, query } = parse();
    let m = match(path);
    if (!m) m = match('#/');
    if (!m) return;
    const s = m.s, a = DC.state.account;
    if (s.auth === 'user' && !a) return DC.go('#/auth?next=' + encodeURIComponent(path), { replace: true });
    if (s.auth === 'mod' && !(a && (a.role === 'moderator' || a.role === 'admin'))) return DC.go('#/', { replace: true });
    if (s.auth === 'rv' && !(a && a.rv_unlocked)) return DC.go('#/types', { replace: true });
    if (typeof cleanup === 'function') { try { cleanup(); } catch (e) { /* ignore */ } }
    cleanup = null;
    const main = document.getElementById('dc-main');
    DC.clear(main);
    main.className = 'dc-screen-' + s.name;
    current = { s, params: m.params, query, path };
    DC.state.route = path;
    document.title = (s.title ? DC.t(s.title) + ' · ' : '') + 'DREAM CODE';
    window.scrollTo(0, 0);
    try { cleanup = s.render(main, m.params, query); }
    catch (e) { console.error('[render ' + s.name + ']', e); DC.append(main, DC.ui.empty({ icon: 'alert-triangle', title: DC.t('core.err.screen'), text: String(e.message || e) })); }
    DC.emit('route', { name: s.name, path });
  }
  DC.rerender = render;
  DC.currentScreen = () => current;

  DC.startRouter = function () {
    window.addEventListener('hashchange', render);
    DC.on('lang', render);
    // Re-render screens that depend on the account when it changes.
    DC.on('account', () => { if (current && (current.s.auth || current.s.rerenderOnAccount)) render(); });
    render();
  };
})();

(function () {

  DC.native = (window.DreamNative && typeof window.DreamNative.version === 'function') ? window.DreamNative : null;

  DC.settings = {

  async function boot() {
    DC.initLang();

    if (DC.api.tokens.get()) { const cached = DC.ls.get('dc.account', null); if (cached) DC.state.account = cached; }

      navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
