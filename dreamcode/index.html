          has('session.descriptors_hint') ? h('p.pr-muted', null, T('session.descriptors_hint')) : null,
          main.chips) : null,
        h('div.dc-card.pr-rate', null,
          h('h3.pr-card-h', null, T('session.rate')),
          has('session.rate_hint') ? h('p.pr-muted', null, T('session.rate_hint')) : null,
          main.rating),
        c.targets.length > 1 && has('session.decoy.title') ? h('div.dc-card.pr-rate', null,
          h('h3.pr-card-h', null, T('session.decoy.title')),
          has('session.decoy.text') ? h('p.pr-muted', null, T('session.decoy.text')) : null,
          decoyBox) : null,
        tools().dreamLink(s),
        has('session.reflection') ? h('div.dc-card.pr-rate', null,
          h('label.pr-card-h.pr-label-h', { for: 'pr-reflect' }, T('session.reflection')),
          reflection) : null,
        save
      ];
    }

    async function saveSession() {
      const now = await getState();
      const notes = {};
      s.stages.forEach(i => { const n = c.stages[i].n; const v = String(s.notes[n] || '').trim(); if (v) notes[n] = v; });
      const t = c.targets.find(x => x.id === s.target);
      const rec = {
        id: s.id, t: s.started, end: Date.now(), coord: s.coord.join(' '), target: s.target,
        stages: s.stages.map(i => c.stages[i].n), match: Number(s.rating) || 0,
        ticked: s.ticked.length, of: t ? t.descriptors.length : 0,
        secs: Math.round(Object.keys(s.times).reduce((a, k) => a + s.times[k], 0) / 1000)
      };
      if (Object.keys(notes).length) rec.notes = notes;
      const refl = String(s.reflection || '').trim();
      if (refl) rec.reflection = refl;
      if (s.edge) rec.edge = 1;
      if (s.decoy && s.decoy.target) rec.decoy = { target: s.decoy.target, match: Number(s.decoy.rating) || 0 };
      if (s.dream && s.dream.id) rec.dream = { id: String(s.dream.id), title: String(s.dream.title || '').slice(0, 80) };
      const list = fitSessions(now.sessions.filter(x => x.id !== rec.id).concat([rec]));
      await setState('sessions', list);
      if (s.sketch) mem.sketches[s.id] = s.sketch;
    }

    function savedView() {
      return [
        stateCard('done', () => { mem.doneAck = true; mem.session = null; DC.go('#/practice?tab=exercises'); }, 'card.session_done.title'),
        coordCard(),
        h('div.pr-nav', null,
          h('button.dc-btn.outline', { type: 'button', onclick: () => { mem.doneAck = true; DC.go('#/practice?tab=progress'); } }, DC.icon('trending-up', 18), T('tabs.progress', null, DC.t('core.view_all'))),
          h('button.dc-btn', { type: 'button', onclick: () => { mem.session = null; beginSession(); } }, DC.icon('refresh', 18), T('session.new', null, T('protocol.begin', null, DC.t('core.continue')))))
      ];
    }
  }

  // ---------------------------------------------------------------- slots in the dream screens (unlocked accounts only)
  const unlocked = () => !!(DC.state.account && DC.state.account.rv_unlocked);
  async function slotData() {
    const [c, st] = await Promise.all([loadContent(), getState()]);
    UI = c.ui; lastContent = c;
    return [c, st];
  }
  DC.slot('writer', async ctx => {
    if (!unlocked()) return null;
    const [, st] = await slotData();
    return has('slot.words.title') ? night().writerCard(st, ctx) : null;
  });
  // A dream saved while a Dream Incubation Night is open: offer the comparison once (the dream page shows the same offer).
  const offered = {};
  DC.on('dreams', async e => {
    if (!e || e.kind !== 'new' || !e.id || !unlocked()) return;
    try {
      const [, st] = await slotData();
      const n = night().pendingOf(st);
      if (!n || offered[n.id] || !has('slot.dream.offer')) return;
      const d = await DC.store.getDream(e.id);
      if (!d || !night().fitsNight(d, n)) return;
      setTimeout(() => {
        if (offered[n.id] || !/^#\/journal/.test(location.hash || '')) return;
        offered[n.id] = true;
        DC.ui.modal({
          title: T('night.title'), icon: 'moon', body: T('slot.dream.offer', { ref: n.ref }, ''),
          actions: [
            { label: T('night.compare'), icon: 'layers', onClick: close => { close(); DC.go('#/practice?tab=exercises&chip=night&dream=' + encodeURIComponent(d.id)); } },
            { label: T('night.later', null, DC.t('core.cancel')), kind: 'outline' }
          ]
        });
      }, 700);
    } catch (err) { /* the Dream Nights view offers the same comparison */ }
  });
  DC.slot('dream', async ctx => {
    if (!unlocked()) return null;
    const [c, st] = await slotData();
    return has('slot.dream.title') ? night().dreamCard(c, st, ctx.dream) : null;
  });

  // ---------------------------------------------------------------- screen
  DC.screen('practice', {
    route: ['#/practice', '#/practice/session', /^#\/practice\/module\/([^/]+)$/, /^#\/practice\/lesson\/([^/]+)$/],
    auth: 'rv',
    render(el, params, query) {
      const my = ++gen;
      const path = (location.hash || '').split('?')[0];
      if (ownerId === null && DC.state.account) ownerId = DC.state.account.id;
      let cleanup = null, gone = false;
      const wrap = h('div.pr-wrap');
      DC.append(el, wrap);
      const load = () => {
        DC.clear(wrap);
        DC.append(wrap, loadingCard());
        Promise.all([loadContent(), getState()]).then(([c, st]) => {
          if (gone || my !== gen) return;
          UI = c.ui; lastContent = c;
          DC.clear(wrap);
          if (has('title')) document.title = T('title') + ' · DREAM CODE';
          let m;
          if (path === '#/practice/session') cleanup = renderSession(wrap, c, st);
          else if ((m = path.match(/^#\/practice\/module\/([^/]+)$/))) renderModule(wrap, c, st, decodeURIComponent(m[1]), query || {});
          else if ((m = path.match(/^#\/practice\/lesson\/([^/]+)$/))) renderLesson(wrap, c, st, decodeURIComponent(m[1]));
          else {
            renderTraining(wrap, c, st, query || {});
            if (c.media.intro && !st.intro_seen) playIntro(true);
          }
        }).catch(e => {
          if (gone || my !== gen) return;
          DC.clear(wrap);
          DC.append(wrap, errorCard(e, load));
        });
      };
      load();
      return () => { gone = true; closeIntro(); if (typeof cleanup === 'function') cleanup(); };
    }
  });
})();

</script>
<script>/* web/src/screens/pricing.js */
/* Pricing Plans (demo S15, SPEC section 8). Web: Stripe Checkout and portal. Android app: Google Play Billing through the bridge.
   Plan allowances (the only numbers allowed besides prices) come from GET /plans and appear only on this screen. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const FALLBACK = {
    currency: 'USD', proposed: false,
    plans: [
      { id: 'free', name: 'Free', monthly: 0, yearly: 0, analyses: 3, analyses_period: 'week', chats: 5 },
      { id: 'dreamer', name: 'Dreamer', monthly: 6.99, yearly: 55.99, analyses: 40, analyses_period: 'month', chats: 100 },
      { id: 'plus', name: 'Dream Code Plus', monthly: 9.99, yearly: 79.99, analyses: 150, analyses_period: 'month', chats: 500 }
    ]
  };
  const PLAY_SUBS = 'https://play.google.com/store/account/subscriptions';
  let lastPeriod = 'monthly';

  function money(n, cur) {
    const v = Number(n || 0);
    try {
      return new Intl.NumberFormat(DC.lang() === 'it' ? 'it-IT' : 'en-US', {
        style: 'currency', currency: cur || 'USD', currencyDisplay: 'narrowSymbol',
        minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2
      }).format(v);
    } catch (e) { return '$' + v.toFixed(v % 1 ? 2 : 0); }
  }
  const round2 = n => Math.round(n * 100) / 100;
  const planName = p => (DC.hasT('pricing.plan.' + p.id) ? DC.t('pricing.plan.' + p.id) : p.name);
  const isBillingOff = e => e && (e.status === 503 || e.error === 'billing_off');

  function features(p) {
    const per = p.analyses_period === 'week' ? 'week' : 'month';
    const an = DC.tn('pricing.f.analyses_' + per, p.analyses);
    const ch = DC.tn('pricing.f.chats_' + per, p.chats);
    if (p.id === 'free') return [DC.t('pricing.f.journal'), DC.t('pricing.f.export'), DC.t('pricing.f.dictionaries'), DC.t('pricing.f.community'), an, ch, DC.t('pricing.f.cards')];
    // Paid plans differ from Free by their allowances only (every card, the dashboard and voice input are on every plan), so
    // only that is promised (Google Play: subscription benefits must be described accurately).
    if (p.id === 'dreamer') return [DC.t('pricing.f.everything_free'), an, ch];
    return [DC.t('pricing.f.everything_dreamer'), an + ' ' + DC.t('pricing.f.fair_use'), ch];
  }

  DC.screen('pricing', {
    route: '#/pricing',
    title: 'pricing.doc_title',
    rerenderOnAccount: true,
    render(el, params, query) {
      const offs = [];
      const native = !!(DC.native && DC.native.billingBuy);
      const acct = DC.state.account;
      const mine = acct ? (acct.plan || 'free') : null;
      let period = query.period === 'yearly' || query.period === 'monthly' ? query.period : lastPeriod;
      let data = DC.ls.get('dc.plans', null) || FALLBACK;
      // Free plan only while paid plans are not on sale here (GET /plans; web: sale.web, the app: sale.play). Then the page
      // shows the Free plan with a calm note, and no checkout, period switch or price of a paid plan.
      const selling = !!(DC.ui.onSale && DC.ui.onSale(data));
      const paidSource = !!(acct && mine !== 'free' && (acct.plan_source === 'stripe' || acct.plan_source === 'play'));

      // Coming back from Stripe Checkout.
      if (query.checkout) {
        try { history.replaceState(null, '', '#/pricing'); } catch (e) { /* ignore */ }
        if (query.checkout === 'done') { DC.ui.toast(DC.t('pricing.thanks')); setTimeout(() => DC.auth.refreshAccount(), 0); }
        else DC.ui.toast(DC.t('pricing.checkout_cancelled'), { icon: 'info' });
      }

      const soon = h('div.dc-callout.gold.dc-pricing-soon.dc-hidden', { role: 'status' }, DC.icon('clock', 18), h('span', null, DC.t('pricing.soon')));
      const showSoon = () => { soon.classList.remove('dc-hidden'); DC.ui.toast(DC.t('pricing.soon_short'), { icon: 'clock' }); };

      // ---- info card (dismissible) ----
      let info = null;
      if (selling && !DC.ls.get('dc.pricing.info_closed', false)) {
        info = h('div.dc-callout.blue.dc-pricing-info', { role: 'note' },
          h('div.dc-pricing-info-head', null, DC.icon('info', 20), h('strong', null, DC.t('pricing.info.title')),
            h('button.dc-iconbtn.dc-pricing-info-x', { type: 'button', 'aria-label': DC.t('pricing.info.close'), onclick: () => { DC.ls.set('dc.pricing.info_closed', true); info.remove(); } }, DC.icon('x', 18))),
          h('p', null, DC.t(native ? 'pricing.info.text_play' : 'pricing.info.text_web')),
          h('p.small', null, DC.t(native ? 'pricing.info.small_play' : 'pricing.info.small_web')));
      }

      // ---- monthly / yearly ----
      const toggle = h('div.dc-pricing-toggle', { role: 'tablist', 'aria-label': DC.t('pricing.period_label') });
      const drawToggle = () => {
        DC.clear(toggle);
        ['monthly', 'yearly'].forEach(p => toggle.appendChild(h('button.dc-pricing-toggle-btn' + (period === p ? '.active' : ''), {
          type: 'button', role: 'tab', 'aria-selected': String(period === p),
          onclick: () => { if (period !== p) { period = lastPeriod = p; drawToggle(); drawCards(); } }
        }, DC.t('pricing.' + p))));
      };

      // ---- buying ----
      async function buy(id, btn) {
        if (!DC.signedIn()) { DC.go('#/auth?next=' + encodeURIComponent('#/pricing?period=' + period)); return; }
        if (native) {
          try { DC.native.billingBuy('dreamcode_' + id, period, DC.state.account.id); }
          catch (e) { DC.ui.error(DC.t('pricing.err.play')); }
          return;
        }
        const label = btn.textContent;
        btn.disabled = true; DC.clear(btn); DC.append(btn, [DC.ui.spinner(true), h('span', null, DC.t('pricing.opening_checkout'))]);
        try {
          const r = await DC.api.post('/billing/checkout', { plan: id, period });
          if (!r || !r.url) throw new Error('no_url');
          location.href = r.url;
        } catch (e) {
          if (isBillingOff(e)) showSoon(); else DC.ui.error(e && e.status != null ? e : DC.t('pricing.err.checkout'));
        } finally {
          if (btn.isConnected) { btn.disabled = false; DC.clear(btn); btn.appendChild(document.createTextNode(label)); }
        }
      }
      async function manage() {
        if (native || DC.native) { location.href = PLAY_SUBS; return; }
        try {
          const r = await DC.api.post('/billing/portal');
          if (r && r.url) location.href = r.url; else throw new Error('no_url');
        } catch (e) { if (isBillingOff(e)) showSoon(); else DC.ui.error(e && e.status != null ? e : DC.t('pricing.err.portal')); }
      }

      // ---- plan cards ----
      const cards = h('div.dc-pricing-cards');
      function drawCards() {
        DC.clear(cards);
        const cur = data.currency || 'USD';
        const byId = {};
        (data.plans || []).forEach(p => { byId[p.id] = p; });
        (selling ? ['free', 'dreamer', 'plus'] : ['free']).filter(id => byId[id]).forEach(id => {
          const p = byId[id];
          const yearly = period === 'yearly';
          const price = id === 'free' ? 0 : (yearly ? p.yearly : p.monthly);
          const full = round2(p.monthly * 12);
          const save = id !== 'free' && yearly ? round2(full - p.yearly) : 0;
          const badge = id === 'dreamer' ? h('div.dc-pricing-badge.popular', null, DC.icon('star', 14), DC.t('pricing.popular'))
            : (id === 'plus' && yearly) ? h('div.dc-pricing-badge.best', null, DC.icon('crown', 14), DC.t('pricing.best')) : null;
          let btn;
          if (mine === id) btn = h('button.dc-btn.dc-pricing-current', { type: 'button', disabled: true }, DC.icon('check', 18), DC.t('pricing.current'));
          else if (id === 'free') {
            btn = mine ? h('button.dc-btn.dc-pricing-current', { type: 'button', disabled: true }, DC.t('pricing.included'))
              : h('button.dc-btn.outline', { type: 'button', onclick: () => DC.go('#/auth?mode=signup&next=' + encodeURIComponent('#/analyze')) }, DC.t('pricing.start_free'));
          } else if (mine && mine !== 'free') {
            btn = h('button.dc-btn.outline.teal', { type: 'button', onclick: manage }, DC.t('pricing.switch_to', { plan: planName(p) }));
          } else {
            btn = h('button.dc-btn' + (id === 'dreamer' ? '.dc-pricing-btn-green' : ''), { type: 'button' }, DC.t('pricing.choose', { plan: planName(p) }));
            btn.addEventListener('click', () => buy(id, btn));
          }
          cards.appendChild(h('div.dc-pricing-plan.' + id + (mine === id ? '.is-current' : ''), null,
            badge,
            h('h3', null, planName(p)),
            h('div.dc-pricing-price', null,
              h('span.amount', null, money(price, cur)),
              h('span.per', null, id === 'free' ? ' ' + DC.t('pricing.per_free') : DC.t(yearly ? 'pricing.per_year' : 'pricing.per_month'))),
            save > 0 ? h('div.dc-pricing-was', null, h('s', null, money(full, cur) + DC.t('pricing.per_year')), h('span.save', null, DC.t('pricing.save', { amount: money(save, cur) }))) : null,
            h('ul.dc-pricing-feats', null, features(p).map(f => h('li', null, DC.icon('check', 16), h('span', null, f)))),
            btn));
        });
      }

      // ---- notes under the cards ----
      const proposed = h('p.dc-pricing-proposed', null, DC.icon('info', 15), h('span', null, DC.t('pricing.proposed')));
      const drawProposed = () => proposed.classList.toggle('dc-hidden', !selling || data.proposed === false);
      const extras = h('div.dc-pricing-extras');
      // A subscription bought earlier can always be managed, even while nothing is on sale.
      if (mine && mine !== 'free' && (selling || paidSource)) extras.appendChild(h('button.dc-btn.outline', { type: 'button', onclick: manage }, DC.icon('credit-card', 18), DC.t('pricing.manage')));
      if (selling && native && DC.signedIn() && DC.native.billingRestore) {
        extras.appendChild(h('button.dc-link.dc-pricing-restore', { type: 'button', onclick: () => { try { DC.native.billingRestore(); DC.ui.toast(DC.t('pricing.restoring'), { icon: 'refresh' }); } catch (e) { DC.ui.error(DC.t('pricing.err.play')); } } }, DC.t('pricing.restore')));
      }

      DC.append(el, [
        selling ? DC.ui.pageTitle({ title: DC.t('pricing.title'), subtitle: DC.t('pricing.subtitle') })
          : DC.ui.pageTitle({ title: DC.t('pricing.free_only.title'), subtitle: DC.t(data.on_sale === true ? 'pricing.free_only.subtitle_app' : 'pricing.free_only.subtitle') }),
        info,
        selling ? toggle : null,
        soon,
        cards,
        selling ? h('div.dc-callout.green.dc-pricing-free', null, DC.icon('shield', 18), h('span', null, DC.t('pricing.free_forever')))
          : h('div.dc-callout.green.dc-pricing-free', null, DC.icon('shield', 18), h('span', null, DC.t('pricing.free_only.note'))),
        proposed,
        extras
      ]);
      drawToggle(); drawCards(); drawProposed();

      DC.api.get('/plans', { auth: false, timeout: 10000 }).then(r => {
        if (!(r && Array.isArray(r.plans) && r.plans.length)) return;
        data = r; DC.ls.set('dc.plans', r);
        if (!cards.isConnected) return;
        // Paid plans went on sale (or off sale) since the last visit: draw the page again in the other mode.
        if (DC.ui.onSale && DC.ui.onSale(r) !== selling) { DC.rerender(); return; }
        drawCards(); drawProposed();
      }).catch(() => { /* offline: cached or SPEC prices stay */ });

      // ---- Google Play results ----
      if (DC.native) {
        const verify = async (items, doneKey) => {
          DC.ui.loading(true, DC.t('pricing.confirming'));
          try {
            for (const it of items) await DC.api.post('/billing/play/verify', { token: it.token, product: it.product });
            await DC.auth.refreshAccount();
            DC.ui.toast(DC.t(doneKey));
          } catch (e) { DC.ui.error(e); }
          finally { DC.ui.loading(false); }
        };
        offs.push(DC.on('native:purchase', e => {
          if (!e) return;
          if (e.state === 'pending') { DC.ui.toast(DC.t('pricing.play_pending'), { icon: 'clock' }); return; }
          if (e.state === 'cancelled' || e.state === 'canceled') { DC.ui.toast(DC.t('pricing.checkout_cancelled'), { icon: 'info' }); return; }
          if (!e.token || e.state === 'error') { DC.ui.error(DC.t('pricing.err.play')); return; }
          verify([e], 'pricing.thanks');
        }));
        offs.push(DC.on('native:owned', e => {
          const items = (e && Array.isArray(e.items) ? e.items : []).filter(x => x && x.token);
          if (!items.length) { DC.ui.toast(DC.t('pricing.nothing_to_restore'), { icon: 'info' }); return; }
          verify(items, 'pricing.restored');
        }));
      }
      return () => offs.forEach(off => off());
    }
  });
})();

</script>
<script>/* web/src/screens/profile.js */
/* Profile (designed in the demo's style): name, handle, email, plan, member since, language, export, sign out, delete account. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const t = (k, v) => DC.t('profile.' + k, v);

  const planName = id => (DC.hasT('profile.plan.' + id) ? t('plan.' + id) : id);

  // Plain text journal for people who want to read or print it anywhere.
  function plainText(exp) {
    const line = '==============================';
    const out = ['DREAM CODE', t('txt.heading', { date: DC.fmtDate(Date.now(), 'long') }), ''];
    (exp.dreams || []).forEach((d, i) => {
      out.push(line, '#' + (i + 1) + '  ' + (d.title || (d.analysis && d.analysis.title) || t('txt.untitled')));
      if (d.dreamt_on) out.push(t('txt.dreamt', { date: DC.fmtDate(d.dreamt_on, 'long') }));
      if (d.created_at) out.push(t('txt.saved', { date: DC.fmtDate(d.created_at, 'datetime') }));
      out.push('', String(d.text || '').trim(), '');
      const themes = d.analysis && Array.isArray(d.analysis.themes) ? d.analysis.themes : [];
      if (themes.length) out.push(t('txt.themes') + ' ' + themes.join(', '), '');
      if (d.reflection) out.push(t('txt.reflection'), String(d.reflection).trim(), '');
    });
    if (!(exp.dreams || []).length) out.push(t('txt.empty'));
    return out.join('\n') + '\n';
  }
  const stamp = () => DC.today();

  async function exportJson() {
    const exp = await DC.store.exportAll();
    DC.ui.download('dreamcode-journal-' + stamp() + '.json', 'application/json', JSON.stringify(exp, null, 2));
    DC.ui.toast(t('export.done'), { icon: 'download' });
  }
  async function exportText() {
    const exp = await DC.store.exportAll();
    DC.ui.download('dreamcode-journal-' + stamp() + '.txt', 'text/plain;charset=utf-8', plainText(exp));
    DC.ui.toast(t('export.done'), { icon: 'download' });
  }

  // Sign out; unsynced dreams make us ask first.
  async function signOut() {
    const finish = () => { DC.ui.toast(t('signout.done'), { icon: 'log-out' }); DC.go('#/'); };
    try { await DC.auth.logout(); finish(); }
    catch (e) {
      if (!e || e.error !== 'pending') { DC.ui.error(e); return; }
      DC.ui.modal({
        title: t('signout.pending_title'), icon: 'cloud-off',
        body: h('p', null, t('signout.pending_text')),
        actions: [
          { label: t('signout.sync_first'), icon: 'refresh', kind: 'primary', onClick: async close => {
            close();
            DC.ui.loading(true, t('signout.syncing'));
            try { await DC.sync.now(); } catch (x) { /* still pending is handled below */ }
            DC.ui.loading(false);
            if (await DC.store.pendingCount()) DC.ui.toast(t('signout.still_pending'), { error: true, ms: 5000 });
            else signOut();
          } },
          { label: t('signout.anyway'), kind: 'danger', onClick: async close => {
            close();
            try { await DC.auth.logout({ force: true, keepLocal: true }); finish(); } catch (x) { DC.ui.error(x); }
          } },
          { label: DC.t('core.cancel'), kind: 'outline' }
        ]
      });
    }
  }

  function deleteAccount() {
    const pw = h('input.dc-input', { type: 'password', id: 'dc-profile-delpw', autocomplete: 'current-password', placeholder: t('delete.password_ph') });
    const err = h('div.dc-error.dc-hidden', { role: 'alert' });
    const body = h('div.dc-profile-del', null,
      h('p', null, t('delete.lead')),
      h('ul.dc-bullets', null, ['r1', 'r2', 'r3', 'r4'].map(k => h('li', null, t('delete.' + k)))),
      h('p.dc-profile-del-tip', null, t('delete.export_tip')),
      h('label.dc-label', { for: 'dc-profile-delpw' }, t('delete.password')), pw, err);
    let working = false;
    const m = DC.ui.modal({
      title: t('delete.title'), icon: 'alert-triangle', body,
      actions: [
        { label: t('delete.confirm'), icon: 'trash', kind: 'danger', onClick: async close => {
          if (working) return;
          err.classList.add('dc-hidden');
          if (!pw.value) { err.textContent = t('delete.need_password'); err.classList.remove('dc-hidden'); pw.focus(); return; }
          working = true;
          try {
            await DC.auth.deleteAccount(pw.value);
            close();
            DC.ui.toast(t('delete.done'));
            DC.go('#/');
          } catch (e) { working = false; err.textContent = DC.api.message(e); err.classList.remove('dc-hidden'); }
        } },
        { label: DC.t('core.cancel'), kind: 'outline' }
      ]
    });
    setTimeout(() => pw.focus(), 40);
    return m;
  }

  // A granted plan (a tester code) ends at a set Pacific time, so its end is shown in Pacific time wherever the reader is.
  function pacific(ms) {
    try {
      return new Date(Number(ms)).toLocaleString(DC.lang() === 'it' ? 'it-IT' : 'en-US', { timeZone: 'America/Los_Angeles', weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return DC.fmtDate(ms, 'long'); }
  }

  function row(label, value, extra) {
    return h('div.dc-profile-row', null, h('div.dc-profile-row-label', null, label), h('div.dc-profile-row-value', null, value, extra || null));
  }

  DC.screen('profile', {
    route: '#/profile',
    title: 'profile.doc_title',
    auth: 'user',
    render(el) {
      const a = DC.state.account;
      if (!a) return;
      const name = a.display_name || (a.email || '').split('@')[0];

      // ---- identity card with editable display name ----
      const nameBox = h('div.dc-profile-namebox');
      function showName() {
        DC.clear(nameBox);
        DC.append(nameBox, [
          h('div.dc-profile-name', null, h('span', null, name),
            h('button.dc-iconbtn.dc-profile-edit', { type: 'button', 'aria-label': t('name.edit'), title: t('name.edit'), onclick: editName }, DC.icon('pencil', 17))),
          h('div.dc-profile-email', null, a.email || '')
        ]);
      }
      function editName() {
        DC.clear(nameBox);
        const input = h('input.dc-input', { type: 'text', value: name, maxlength: 60, autocomplete: 'nickname', 'aria-label': t('name.label') });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const save = h('button.dc-btn.small.auto', { type: 'submit' }, DC.t('core.save'));
        const form = h('form.dc-profile-nameform', { novalidate: true },
          h('label.dc-label', null, t('name.label')), input,
          h('div.dc-row.dc-profile-nameactions', null, save, h('button.dc-btn.small.outline.auto', { type: 'button', onclick: showName }, DC.t('core.cancel'))), err);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const v = input.value.trim();
          if (!v) { err.textContent = t('name.empty'); err.classList.remove('dc-hidden'); return; }
          if (v === name) { showName(); return; }
          save.disabled = true;
          try { await DC.auth.update({ display_name: v }); DC.ui.toast(t('name.saved')); }
          catch (ex) { save.disabled = false; err.textContent = DC.api.message(ex); err.classList.remove('dc-hidden'); }
        });
        nameBox.appendChild(form);
        setTimeout(() => { input.focus(); input.select(); }, 20);
      }
      showName();

      // ---- profile photo: tap the circle ----
      function photoButton(acct) {
        const circle = h('span.dc-profile-avatar');
        DC.avatar.fill(circle, acct);
        const btn = h('button.dc-profile-photo', { type: 'button', 'aria-label': acct.avatar ? t('photo.change') : t('photo.add'), title: acct.avatar ? t('photo.change') : t('photo.add'), onclick: () => photoMenu(acct) },
          circle, h('span.dc-profile-photo-badge', { 'aria-hidden': 'true' }, DC.icon('camera', 14)));
        return btn;
      }
      async function choose() {
        const f = await DC.avatar.pick();
        if (!f) return;
        DC.ui.loading(true);
        try { await DC.avatar.upload(f); DC.ui.toast(t('photo.saved')); }
        catch (ex) { DC.ui.error(ex && ex.status ? DC.api.message(ex) : (ex && ex.message) || t('photo.failed')); }
        finally { DC.ui.loading(false); }
      }
      function photoMenu(acct) {
        if (!acct.avatar) { choose(); return; }
        const m = DC.ui.modal({
          title: t('photo.title'), body: h('p.dc-profile-photo-note', null, t('photo.text')),
          actions: [
            { label: t('photo.choose'), icon: 'camera', onClick: c => { c(); choose(); } },
            { label: t('photo.remove'), kind: 'outline', onClick: async c => {
              c(); DC.ui.loading(true);
              try { await DC.avatar.remove(); DC.ui.toast(t('photo.removed')); } catch (ex) { DC.ui.error(ex); } finally { DC.ui.loading(false); }
            } },
            { label: DC.t('core.cancel'), kind: 'outline' }
          ]
        });
        m.el.classList.add('dc-profile-photo-modal');
      }
      const identity = h('div.dc-card.glow.dc-profile-id', null, photoButton(a), nameBox);

      // ---- account details ----
      const plan = a.plan || 'free';
      const usage = a.usage || null;
      const planValue = h('div', null,
        h('div.dc-profile-plan', null, DC.ui.pill(planName(plan), { cls: plan === 'free' ? '' : 'gold', icon: plan === 'free' ? null : 'crown' })),
        a.plan_until ? h('div.dc-profile-small', null, a.plan_source === 'grant' ? t('plan_until_grant', { date: pacific(a.plan_until) }) : t('plan_until', { date: DC.fmtDate(a.plan_until, 'long') })) : null,
        usage && usage.analyses_left != null ? h('div.dc-profile-small', null, DC.tn('profile.usage_' + (usage.period === 'week' ? 'week' : 'month'), usage.analyses_left)) : null,
        // See plans and Change plan only while paid plans are on sale; a subscription bought earlier can always be managed.
        DC.ui.onSale() || (plan !== 'free' && (a.plan_source === 'stripe' || a.plan_source === 'play'))
          ? h('button.dc-link.dc-profile-inline-link', { type: 'button', onclick: () => DC.go('#/pricing') }, plan === 'free' ? t('see_plans') : t('change_plan')) : null);

      const handleValue = a.handle ? h('span.dc-profile-handle', null, '@' + a.handle)
        : h('div', null, h('div.dc-profile-muted', null, t('handle_none')),
          h('button.dc-link.dc-profile-inline-link', { type: 'button', onclick: () => DC.go('#/community') }, t('handle_where')));

      const langSel = h('select.dc-select.dc-profile-lang', { 'aria-label': t('language') },
        DC.langs.map(l => h('option', { value: l, selected: DC.lang() === l }, DC.t('core.lang.' + l))));
      langSel.addEventListener('change', () => {
        const l = langSel.value;
        DC.setLang(l);
        DC.auth.update({ lang: l }).catch(() => { /* the device keeps the choice either way */ });
      });

      const details = h('div.dc-card.dc-profile-details', null,
        h('div.dc-card-title', null, DC.icon('user', 20), t('details')),
        row(t('handle'), handleValue),
        row(t('plan_label'), planValue),
        row(t('member_since'), a.created_at ? DC.fmtDate(a.created_at, 'long') : ''),
        row(t('language'), langSel));

      // ---- tester code (internal testing): shown on the free plan and while a granted plan runs ----
      let tester = null;
      if (plan === 'free' || a.plan_source === 'grant') {
        const input = h('input.dc-input.dc-profile-code', { type: 'text', maxlength: 40, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'DC-XXXX-XXXX-XXXX', 'aria-label': t('tester.label') });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const use = h('button.dc-btn.small.auto', { type: 'submit' }, DC.icon('sparkle', 16), t('tester.button'));
        const form = h('form.dc-profile-codeform', { novalidate: true },
          h('label.dc-label', null, t('tester.label')), h('div.dc-row.dc-profile-coderow', null, input, use), err);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          const v = input.value.trim();
          err.classList.add('dc-hidden');
          if (!v) { err.textContent = t('tester.empty'); err.classList.remove('dc-hidden'); return; }
          use.disabled = true;
          try {
            const r = await DC.api.post('/account/tester-code', { code: v, lang: DC.lang() });
            const until = (r && r.until_label) || (r && r.until ? pacific(r.until) : '');
            await DC.auth.refreshAccount();
            DC.ui.toast(t('tester.done', { date: until }));
          } catch (ex) { use.disabled = false; err.textContent = DC.api.message(ex); err.classList.remove('dc-hidden'); }
        });
        tester = h('div.dc-card.dc-profile-tester', null,
          h('div.dc-card-title', null, DC.icon('sparkle', 20), t('tester.title')),
          h('p.dc-profile-muted', null, t('tester.lead')), form);
      }

      // ---- your dreams ----
      const count = h('p.dc-profile-count', null, ' ');
      DC.store.allDreams().then(list => { count.textContent = DC.tn('profile.dream_count', list.length); }).catch(() => { count.textContent = ''; });
      const dreams = h('div.dc-card.dc-profile-data', null,
        h('div.dc-card-title', null, DC.icon('notebook', 20), t('data_title')),
        count,
        h('p.dc-profile-muted', null, t('export.lead')),
        h('div.dc-profile-btns', null,
          h('button.dc-btn.secondary', { type: 'button', onclick: () => exportJson().catch(e => DC.ui.error(e)) }, DC.icon('download', 18), t('export.json')),
          h('button.dc-btn.secondary', { type: 'button', onclick: () => exportText().catch(e => DC.ui.error(e)) }, DC.icon('file-text', 18), t('export.text'))),
        h('p.dc-profile-small', null, t('export.json_note')));

      DC.append(el, [
        DC.ui.pageTitle({ icon: 'user', title: t('title'), subtitle: t('subtitle') }),
        identity,
        details,
        tester,
        dreams,
        DC.slotEl('profile', {}),
        h('div.dc-profile-actions', null,
          h('button.dc-btn.outline', { type: 'button', onclick: signOut }, DC.icon('log-out', 18), t('signout.button')),
          h('button.dc-btn.danger', { type: 'button', onclick: deleteAccount }, DC.icon('trash', 18), t('delete.button')),
          h('a.dc-link.dc-profile-delinfo', { href: 'delete-account.html', target: '_blank', rel: 'noopener' }, DC.icon('info', 15), ' ', t('delete.info_link')),
          h('button.dc-link', { type: 'button', onclick: () => DC.go('#/settings') }, DC.icon('settings', 15), ' ', t('settings_link')))
      ]);
      // When what is on sale changes (GET /plans answered), draw the plan links again.
      const offPlans = DC.on('plans', () => DC.rerender());
      if (DC.ui.plans) DC.ui.plans();
      return () => offPlans();
    }
  });
})();

</script>
<script>/* web/src/screens/result.js */
/* DREAM CODE: Analysis Result (S6, demo report section 3, in that order). Renders the analysis JSON of SPEC 6.2 from the local journal. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('result.' + k, v);
  // The cards in the demo's order, Hall and Van de Castle first in the old Gibson slot (book icon, as there).
  const LENSES = [['hvdc', 'book'], ['freud', 'brain'], ['jung', 'notebook'], ['haudenosaunee', 'feather'], ['modern', 'brain']];
  const arr = x => (Array.isArray(x) ? x : []);
  const str = x => (x == null ? '' : String(x));
  // Older readings may name "ondinnonk", a Wendat (Huron) word, as if it were Haudenosaunee; such mentions are left out on
  // display (the server now removes them from new readings).
  const WENDAT = /ondinnonk/i;
  const fixText = s => {
    let t = str(s);
    if (!WENDAT.test(t)) return t;
    t = t.replace(/\s*\(\s*(?:the |il |l')?ondinnonk\s*\)/gi, '').replace(/,\s*(?:its |their |il suo |i loro )?ondinnonk\s*,/gi, ',');
    return t.split('\n').map(p => p.split(/(?<=[.!?])\s+/).filter(x => !WENDAT.test(x)).join(' ')).join('\n');
  };
  const paras = s => fixText(s).split(/\n+/).map(x => x.trim()).filter(Boolean);
  const humanize = id => (DC.dreamFlow ? DC.dreamFlow.humanize(id) : str(id).replace(/[-_]+/g, ' '));
  // Inline headings (VOICE.md, "Layout convention"): in a card, a block is a short heading line followed by its paragraph, and
  // shows as a heading above the paragraph; any other block is a paragraph. Readings written before this layout, in plain
  // paragraphs, render as they always did.
  const NOT_HEADING = /^(in summary|in sintesi|in conclusion|in conclusione|in short|for example|for instance|per esempio|ad esempio|note|nota)$/i;
  function headingLike(line) {
    const t = str(line).trim();
    if (!t || t.length > 64 || !/\p{L}/u.test(t) || /^\p{Ll}/u.test(t) || /[.!?;,:"“”«»]$/.test(t)) return false;
    return t.split(/\s+/).length <= 8 && !NOT_HEADING.test(t);
  }
  function blocks(s, pCls, hCls) {
    const list = fixText(s).split(/\n[ \t]*\n/).map(b => b.split('\n').map(x => x.trim()).filter(Boolean)).filter(b => b.length);
    const out = [];
    let pending = null;
    list.forEach((lines, i) => {
      let head = pending;
      pending = null;
      if (!head && lines.length > 1 && headingLike(lines[0])) head = lines.shift();
      else if (!head && lines.length === 1 && i > 0 && i < list.length - 1 && headingLike(lines[0])) { pending = lines[0]; return; }
      if (head) out.push(h('h4.' + hCls, null, head));
      lines.forEach(p => out.push(h('p.' + pCls, null, p)));
    });
    return out;
  }

  // Interpretation cards the user chose in Settings (all five by default). Accepts a list of enabled ids or a {id: bool} map.
  function lensOn(k) {
    const v = DC.settings.get('lenses', null);
    if (Array.isArray(v)) return v.indexOf(k) >= 0;
    if (v && typeof v === 'object') return v[k] !== false;
    return true;
  }
  function tint(hex, a) {
    const m = /^#?([0-9a-f]{6})$/i.exec(str(hex));
    if (!m) return 'rgba(46,230,200,' + a + ')';
    const n = parseInt(m[1], 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  async function loadData(d) {
    const A = d && d.analysis;
    const out = { types: [], symbols: [], acts: [], actLib: 0, changed: false };
    if (!A) return out;
    const F = DC.dreamFlow;
    const safe = p => Promise.resolve().then(() => p()).catch(() => null);
    await Promise.all([
      safe(async () => { out.types = await Promise.all(arr(A.types).filter(t => t && t.id).map(t => (F ? F.typeInfo(t.id) : { id: t.id, name: humanize(t.id), color: '#2EE6C8' }))); }),
      safe(async () => { out.symbols = await Promise.all(arr(A.symbols).map(s => (s && s.id ? DC.data.symbol(s.id).catch(() => null) : null))); }),
      safe(async () => { out.actLib = arr(await DC.data.activities()).length; out.acts = await Promise.all(arr(A.activities).map(id => DC.data.activity(id).catch(() => null))); }),
      // analysis_sha is the plain fingerprint of the text the server analysed (null once the text there has changed). A record saved
      // before the server sent it has no such field, and is not flagged.
      safe(async () => { if (d.analysis && d.analysis_sha !== undefined) out.changed = !d.analysis_sha || (await DC.sha256(str(d.text))) !== d.analysis_sha; })
    ]);
    return out;
  }

  // ---------- The Dream Code: the book card, with this dream's emotional pattern as the book names it ----------
  const PATTERNS = ['pursuit', 'ascent', 'descent', 'expansion'];
  function bookCard(A) {
    const p = A && PATTERNS.indexOf(A.emotion_pattern) >= 0 ? A.emotion_pattern : null;
    const extra = p ? h('div.dc-bookcard-pattern', null,
      h('div.dc-bookcard-pattern-label', null, T('book.pattern')),
      h('div.dc-bookcard-pattern-name', null, DC.t('dashboard.pat.emo.' + p + '.name')),
      h('p', null, DC.t('dashboard.pat.emo.' + p + '.text'))) : null;
    return DC.ui.bookCard({ extra });
  }

  // ---------- Report this analysis (Google Play AI-Generated Content policy): a quiet link at the end of the reading ----------
  function reportRow(id) {
    if (!DC.ui.reportAi) return null;
    return h('div.dc-report-row', null,
      h('button.dc-link.dc-report-link', { type: 'button', onclick: () => DC.ui.reportAi({ dreamId: id, part: 'reading' }) }, DC.icon('flag', 14), h('span', null, DC.t('report.analysis'))));
  }

  // ---------- Hall and Van de Castle coding table ----------
  function hvdcTable(c) {
    if (!c || typeof c !== 'object') return null;
    const tr = (group, v) => (v != null && DC.hasT('result.hvdc.' + group + '.' + v) ? T('hvdc.' + group + '.' + v) : str(v));
    const who = w => (!w || w === 'dreamer' ? T('hvdc.dreamer') : str(w));
    const rows = [];
    const chars = arr(c.characters).filter(Boolean).map(ch => {
      const bits = [];
      if (ch.kind) bits.push(tr('kind', ch.kind));
      if (ch.number) bits.push(tr('number', ch.number));
      if (!ch.kind || ch.kind === 'human') {
        if (ch.sex && ch.sex !== 'I') bits.push(tr('sex', ch.sex));
        if (ch.age && ch.age !== 'A') bits.push(tr('age', ch.age));
        if (ch.identity && ch.identity !== 'uncertain') bits.push(tr('identity', ch.identity));
      }
      if (ch.dead_or_imaginary) bits.push(T('hvdc.dead'));
      return str(ch.label || T('hvdc.someone')) + (bits.length ? ' (' + bits.join(', ') + ')' : '');
    });
    const ints = arr(c.interactions).filter(Boolean).map(x => {
      const bits = [];
      if (x.level) bits.push(T('hvdc.level', { n: x.level }));
      if (x.physical) bits.push(T('hvdc.physical'));
      if (x.reciprocal) bits.push(T('hvdc.reciprocal'));
      return tr('int', x.type) + (bits.length ? ' (' + bits.join(', ') + ')' : '') + ': ' + who(x.initiator) + ' → ' + who(x.recipient);
    });
    const emos = arr(c.emotions).filter(Boolean).map(x => tr('emo', x.class) + ' (' + who(x.who) + ')');
    const sets = arr(c.settings).filter(Boolean).map(x => [x.place ? tr('place', x.place) : '', x.familiarity && x.place !== 'none' ? tr('fam', x.familiarity) : ''].filter(Boolean).join(', '));
    const objs = arr(c.objects).filter(Boolean).map(x => str(x.name) + (x.class ? ' (' + tr('obj', x.class) + ')' : ''));
    const outs = [].concat(
      arr(c.successes).filter(Boolean).map(x => T('hvdc.out.success', { who: who(x.by) })),
      arr(c.failures).filter(Boolean).map(x => T('hvdc.out.failure', { who: who(x.by) })),
      arr(c.misfortunes).filter(Boolean).map(x => T('hvdc.out.misfortune', { who: who(x.to) }) + (x.bodily ? ' (' + T('hvdc.out.bodily') + ')' : '')),
      arr(c.good_fortunes).filter(Boolean).map(x => T('hvdc.out.good_fortune', { who: who(x.to) })));
    [['characters', chars], ['interactions', ints], ['emotions', emos], ['settings', sets], ['objects', objs], ['outcomes', outs]].forEach(([k, list]) => {
      list = list.filter(Boolean);
      if (list.length) rows.push(h('tr', null, h('th', { scope: 'row' }, T('hvdc.row.' + k)), h('td', null, list.map(v => h('div', null, v)))));
    });
    return h('div.dc-res-hvdc', null,
      h('div.dc-res-hvdc-cap', null, DC.icon('bar-chart', 14), T('hvdc.caption')),
      rows.length ? h('table', null, h('tbody', null, rows)) : h('p.dc-res-hvdc-none', null, T('hvdc.none')));
  }
  // The coding sits under the Hall and Van de Castle card in a small fold, closed by default, so the card looks like the others.
  function codingFold(c) {
    const table = hvdcTable(c);
    if (!table) return null;
    return h('details.dc-res-fold', null,
      h('summary', null, DC.icon('bar-chart', 15), h('span', null, T('hvdc.fold')), h('span.dc-res-fold-chev', null, DC.icon('chevron-down', 15))),
      table);
  }

  DC.screen('result', {
    route: /^#\/dream\/([^/]+)$/,
    title: 'result.title',
    render(el, params, query) {
      const id = params[0];
      let alive = true, sig = null, dream = null, statusSlot = null, allowSlot = null, running = false, again = false, autoDone = false;
      const offs = [];
      const flow = () => DC.dreamFlow;
      const runAnalyze = () => { if (flow()) flow().analyze(id); else DC.go('#/analyze?id=' + encodeURIComponent(id)); };

      if (query.new === '1') {
        DC.ui.toast(T('toast_done'));
        history.replaceState(null, '', '#/dream/' + encodeURIComponent(id));
      }
      el.appendChild(h('div.dc-res-wait', null, DC.ui.spinner()));

      const signature = d => (d ? [d.id, d.deleted_at || 0, d.text, d.analyzed_at || 0, d.analysis_hash || '', d.dreamt_on, d.title, JSON.stringify(d.analysis || null)].join('|') : 'none');

      async function refresh() {
        if (running) { again = true; return; }
        running = true;
        try {
          const d = await DC.store.getDream(id);
          if (!alive) return;
          const s = signature(d);
          dream = d;
          if (s !== sig) {
            sig = s;
            const data = await loadData(d);
            if (!alive) return;
            build(d, data);
            maybeAuto(d, data);
          } else { updateStatus(); }
        } catch (e) {
          console.error('[result]', e);
        } finally {
          running = false;
          if (again && alive) { again = false; refresh(); }
        }
      }

      function maybeAuto(d, data) {
        if (autoDone || query.analyze !== '1') return;
        autoDone = true;
        history.replaceState(null, '', '#/dream/' + encodeURIComponent(id));
        if (!d || d.deleted_at || !DC.signedIn()) return;
        if (!d.analysis || data.changed) setTimeout(() => { if (alive) runAnalyze(); }, 50);
      }

      // ----- top cards -----
      function renderAllow() {
        if (!allowSlot) return;
        DC.clear(allowSlot);
        const a = DC.signedIn() ? DC.ui.allowance() : null;
        if (a) allowSlot.appendChild(a);
        allowSlot.classList.toggle('dc-hidden', !a);
      }
      function updateStatus() {
        if (!statusSlot || !dream) return;
        const d = dream, hasA = !!d.analysis;
        const offline = !DC.state.online || (DC.sync && DC.sync.state() === 'offline');
        let node;
        if (!DC.signedIn()) {
          node = DC.ui.status('warn', T('status.phone'), null, 'smartphone');
          node.lastChild.appendChild(h('div.d', null, T('status.phone_guest'), ' ', h('a', { href: '#/auth?next=' + encodeURIComponent('#/dream/' + id) }, T('status.create'))));
        } else if (d._sync === 'saved') node = DC.ui.status('ok', T('status.saved'), T(hasA ? 'status.saved_text' : 'status.saved_text_plain'), 'check-circle');
        else if (d._sync === 'error') node = DC.ui.status('warn', T('status.error'), T('status.error_text') + (d._err ? ' ' + d._err : ''), 'alert-circle');
        else if (offline) node = DC.ui.status('warn', T('status.phone'), T('status.phone_offline'), 'smartphone');
        else node = DC.ui.status('', T('status.saving'), T(hasA ? 'status.saving_text' : 'status.saving_text_plain'), 'spinner');
        DC.clear(statusSlot);
        statusSlot.appendChild(node);
      }

      // ----- blocks -----
      function typeBlock(A, data) {
        const list = data.types;
        if (!list || !list.length) return null;
        const p = list[0];
        const why = (arr(A.types)[0] && arr(A.types)[0].why) || '';
        return h('div.dc-res-type', null,
          h('div.dc-res-type-head', null,
            h('h2.dc-res-h2', null, T('type.title')),
            h('button.dc-btn.outline.small.auto.dc-res-learn', { type: 'button', onclick: () => DC.go('#/types/' + encodeURIComponent(p.id)) }, T('type.learn'), DC.icon('external-link', 15))),
          h('div.dc-res-type-main', null,
            h('span.dc-res-dot', { style: { background: p.color, boxShadow: '0 0 10px ' + tint(p.color, 0.7) } }),
            h('span.dc-res-type-name', { style: { color: p.color } }, p.name)),
          list.length > 1 ? h('div.dc-pills.dc-res-type-more', null, list.slice(1).map(t => h('a.dc-pill.dot', { href: '#/types/' + encodeURIComponent(t.id), style: { color: t.color, borderColor: tint(t.color, 0.6), background: tint(t.color, 0.1) } }, t.name))) : null,
          (p.short || why) ? h('p.dc-res-type-desc', null, p.short || why) : null);
      }

      function dreamCard(d, A) {
        const txt = str(d.text);
        const long = txt.length > 700;
        const quote = h('p.dc-res-quote' + (long ? '.clamp' : '') + (txt.length > 240 ? '.long' : ''), null, '“' + txt + '”');
        let more = null;
        if (long) {
          more = h('button.dc-link.dc-res-more', { type: 'button', onclick: () => { const c = quote.classList.toggle('clamp'); more.textContent = T(c ? 'card.more' : 'card.less'); } }, T('card.more'));
        }
        const meta = [d.title ? d.title : null, d.dreamt_on ? T('card.dreamt', { date: DC.fmtDate(d.dreamt_on, 'long') }) : null].filter(Boolean).join(' · ');
        return h('div.dc-card.dc-res-dream', null,
          h('div.dc-res-dream-head', null, DC.icon('brain', 26), h('h2', null, T('card.title'))),
          h('p.dc-res-dream-sub', null, T('card.sub')),
          h('div.dc-res-your', null,
            h('div.dc-res-your-t', null, T('card.your')),
            quote, more,
            meta ? h('div.dc-res-meta', null, meta) : null),
          A ? null : h('div.dc-res-pending', null,
            h('p', null, T('not_analyzed')),
            h('button.dc-btn.dc-res-analyze', { type: 'button', onclick: runAnalyze }, DC.icon('brain', 20), T('analyze'))));
      }

      function symbolCard(s, dict) {
        // Every symbol in a reading carries the Universal tag, as in the demo (VOICE.md, "each with the Universal tag").
        const universal = true;
        const name = str(s.name || (dict && dict.name)).toLowerCase();
        const inner = [
          h('div.dc-res-sym-head', null, h('h3.dc-res-sym-name', null, name), universal ? h('span.dc-res-uni', null, DC.icon('sparkle', 14), T('symbols.universal')) : null),
          s.universal ? h('p.dc-res-sym-uni', null, s.universal) : null,
          s.personal ? h('p.dc-res-sym-pers', null, s.personal) : null
        ];
        if (s.id) return h('a.dc-res-sym.link', { href: '#/symbols/' + encodeURIComponent(s.id) }, inner, h('span.dc-res-sym-open', null, T('symbols.open'), DC.icon('chevron-right', 14)));
        return h('div.dc-res-sym', null, inner);
      }

      function lensCard(k, icon, A) {
        const text = A.lenses ? A.lenses[k] : '';
        const fold = k === 'hvdc' ? codingFold(A.hvdc) : null;
        if (!str(text).trim() && !fold) return null;
        return h('div.dc-res-lens.dc-res-lens-' + k, null,
          h('h3.dc-res-lens-t', null, DC.icon(icon, 20), T('lenses.' + k)),
          k === 'hvdc' ? h('p.dc-res-lens-sub', null, T('lenses.hvdc_sub')) : null,
          blocks(text, 'dc-res-lens-p', 'dc-res-step'),
          fold,
          k === 'haudenosaunee' ? h('p.dc-res-lens-note', null, T('lenses.note')) : null);
      }
      // Possible Meanings: the opening part (no heading) is a lead paragraph; each level shows its heading above its paragraph.
      function meaningsCard(meanings) {
        return h('div.dc-card.glow.dc-res-meanings', null, meanings.map(m => [
          str(m.heading).trim() ? h('h4.dc-res-mh', null, str(m.heading).trim()) : null,
          paras(m.text).map(p => h('p', null, p))
        ]));
      }

      function activities(A, data) {
        const ids = arr(A.activities);
        if (!ids.length) return null;
        const notes = A.activity_notes && typeof A.activity_notes === 'object' ? A.activity_notes : {};
        const items = ids.map((aid, i) => {
          const a = data.acts[i];
          const note = str(notes[aid]).trim();
          if (!a && !note && data.actLib) return null;   // not in the library and nothing written for this dream
          const steps = a && arr(a.steps).filter(Boolean);
          return {
            label: (a && a.title) || humanize(aid),
            body: h('div.dc-res-act', null,
              note ? h('p.dc-res-act-note', null, DC.icon('sparkle', 14), h('span', null, note)) : null,
              a && a.summary ? h('p', null, a.summary) : null,
              steps && steps.length ? h('ol', null, steps.map(s => h('li', null, s))) : null,
              a && a.why ? h('p.dc-res-act-why', null, a.why) : null,
              a && a.minutes ? h('p.dc-res-act-min', null, DC.icon('clock', 14), T('acts.minutes', { n: a.minutes })) : null,
              !a && !note ? h('p.dc-muted', null, T('acts.missing')) : null)
          };
        }).filter(Boolean);
        if (!items.length) return null;
        const help = h('button.dc-iconbtn.dc-res-help', { type: 'button', 'aria-label': T('acts.help_title'), title: T('acts.help_title'),
          onclick: () => DC.ui.modal({ title: T('acts.help_title'), icon: 'activity', body: h('div', null, h('p', null, T('acts.help')), h('p.dc-muted', { style: { fontSize: '14px' } }, T('acts.help2'))), actions: [{ label: DC.t('core.ok') }] }) }, DC.icon('help-circle', 20));
        return DC.ui.section({ icon: 'activity', title: T('acts.title'), right: help,
          body: [h('p.dc-res-glow-p', null, T('acts.intro')), h('div.dc-callout.dc-res-callout', null, T('acts.callout')), DC.ui.accordion(items)] });
      }

      function nextCard() {
        const enc = encodeURIComponent(id);
        const opts = [
          ['journal', 'book-open', '#/journal?edit=' + enc + '&focus=reflection'],
          ['past', 'history', '#/journal'],
          ['chat', 'message-circle', '#/dream/' + enc + '/chat'],
          ['share', 'users', '#/community?share=' + enc],
          ['new', 'calendar', '#/analyze', true]
        ];
        return h('div.dc-card.dc-res-next', null,
          h('h2.dc-res-h2', null, T('next.title')),
          h('p.dc-res-next-sub', null, T('next.sub')),
          h('div.dc-res-next-grid', null, opts.map(([k, icon, href, hi]) => h('a.dc-res-opt' + (hi ? '.hi' : ''), { href },
            h('span.dc-res-opt-ic', null, DC.icon(icon, 18)),
            h('span.dc-res-opt-tx', null, h('span.dc-res-opt-t', null, T('next.' + k)), h('span.dc-res-opt-d', null, T('next.' + k + '_d')))))));
      }

      function build(d, data) {
        DC.clear(el);
        statusSlot = null; allowSlot = null;
        if (!d) {
          el.appendChild(DC.ui.empty({ icon: 'moon', title: T('missing.title'), text: T('missing.text'), action: { label: T('missing.action'), onClick: () => DC.go('#/journal') } }));
          return;
        }
        if (d.deleted_at) {
          el.appendChild(DC.ui.empty({ icon: 'trash', title: T('deleted.title'), text: T('deleted.text'),
            action: { label: T('deleted.restore'), onClick: async () => { await DC.store.restoreDream(id); DC.ui.toast(T('deleted.restored')); } } }));
          return;
        }
        const A = d.analysis && typeof d.analysis === 'object' ? d.analysis : null;
        const parts = [];
        const level = A && A.safety && A.safety.level;
        if (level === 'crisis' || level === 'concern') {
          parts.push(h('div.dc-res-crisis', null, A.safety.note ? h('p.dc-res-safety-note', null, A.safety.note) : null, DC.ui.crisisCard()));
        }
        allowSlot = h('div.dc-res-allow');
        statusSlot = h('div.dc-res-status');
        parts.push(allowSlot, statusSlot);
        if (A && data.changed) {
          parts.push(h('div.dc-status.warn.dc-res-changed', null, DC.icon('alert-triangle', 20),
            h('div', null, h('div.t', null, T('changed')), h('div.d', null, T('changed_text')),
              h('button.dc-btn.small.auto.dc-res-reanalyze', { type: 'button', onclick: runAnalyze }, DC.icon('refresh', 16), T('reanalyze')))));
        }
        if (!A) {
          parts.push(dreamCard(d, null), DC.slotEl('dream', { dream: d }), nextCard());
        } else {
          const themes = arr(A.themes).filter(Boolean), scenes = arr(A.scenes).filter(Boolean), symbols = arr(A.symbols).filter(Boolean), meanings = arr(A.meanings).filter(m => m && (m.text || m.heading));
          const lensCards = LENSES.filter(([k]) => lensOn(k)).map(([k, icon]) => lensCard(k, icon, A)).filter(Boolean);
          parts.push(
            typeBlock(A, data),
            dreamCard(d, A),
            DC.slotEl('dream', { dream: d }),
            themes.length ? DC.ui.section({ icon: 'lightbulb', title: T('themes.title'), subtitle: T('themes.sub'), body: DC.ui.bullets(themes) }) : null,
            scenes.length ? DC.ui.section({ icon: 'sparkles', title: T('scenes.title'), subtitle: T('scenes.sub'), body: DC.ui.bullets(scenes) }) : null,
            symbols.length ? DC.ui.section({ icon: 'book-open', title: T('symbols.title'), subtitle: T('symbols.sub'),
              body: h('div.dc-res-symbols', null, symbols.map(s => symbolCard(s, data.symbols[arr(A.symbols).indexOf(s)]))) }) : null,
            meanings.length ? DC.ui.section({ title: T('meanings.title'), body: meaningsCard(meanings) }) : null,
            lensCards.length ? DC.ui.section({ title: T('lenses.title'), body: h('div.dc-res-lenses', null, lensCards) }) : null,
            activities(A, data),
            reportRow(id),
            bookCard(A),
            nextCard());
        }
        DC.append(el, parts.filter(Boolean));
        renderAllow();
        updateStatus();
      }

      offs.push(DC.on('dreams', e => { if (!e || !e.id || e.id === id) refresh(); }));
      offs.push(DC.on('sync', () => refresh()));
      offs.push(DC.on('online', () => updateStatus()));
      offs.push(DC.on('account', () => { renderAllow(); updateStatus(); }));
      offs.push(DC.on('settings', e => { if (e && e.k === 'lenses') { sig = null; refresh(); } }));
      refresh();

      return () => { alive = false; offs.forEach(f => f()); };
    }
  });
})();

</script>
<script>/* web/src/screens/settings.js */
/* Settings (designed): language, reduce motion, morning reminder (Android), voice input language, interpretation cards,
   blocked users, privacy, account, version and storage. Per-device choices live in DC.settings. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const t = (k, v) => DC.t('settings.' + k, v);
  const LENSES = ['hvdc', 'freud', 'jung', 'haudenosaunee', 'modern'];          // the order the result page shows them
  let uid = 0;

  // Read the saved lens choice in either shape ({id: bool} map or list of enabled ids); default all on.
  function lensState() {
    const v = DC.settings.get('lenses', null);
    const out = {};
    LENSES.forEach(k => { out[k] = Array.isArray(v) ? v.indexOf(k) >= 0 : (v && typeof v === 'object' ? v[k] !== false : true); });
    return out;
  }

  function sw(on, labelId, onChange) {
    const b = h('button.dc-set-switch' + (on ? '.on' : ''), { type: 'button', role: 'switch', 'aria-checked': String(!!on), 'aria-labelledby': labelId },
      h('span.knob'));
    b.addEventListener('click', () => {
      const v = b.getAttribute('aria-checked') !== 'true';
      if (onChange(v) === false) return;
      b.setAttribute('aria-checked', String(v));
      b.classList.toggle('on', v);
    });
    return b;
  }
  function switchRow(title, desc, on, onChange) {
    const id = 'dc-set-l' + (++uid);
    return h('div.dc-set-row', null,
      h('div.dc-set-row-text', null, h('div.dc-set-row-title', { id }, title), desc ? h('div.dc-set-row-desc', null, desc) : null),
      sw(on, id, onChange));
  }

  async function signOut() {
    const finish = () => { DC.ui.toast(DC.t('settings.signout_done'), { icon: 'log-out' }); DC.go('#/'); };
    try { await DC.auth.logout(); finish(); }
    catch (e) {
      if (!e || e.error !== 'pending') { DC.ui.error(e); return; }
      DC.ui.modal({
        title: t('pending_title'), icon: 'cloud-off',
        body: h('p', null, t('pending_text')),
        actions: [
          { label: t('pending_sync'), icon: 'refresh', kind: 'primary', onClick: async close => {
            close();
            DC.ui.loading(true, t('pending_syncing'));
            try { await DC.sync.now(); } catch (x) { /* handled below */ }
            DC.ui.loading(false);
            if (await DC.store.pendingCount()) DC.ui.toast(t('pending_still'), { error: true, ms: 5000 }); else signOut();
          } },
          { label: t('pending_anyway'), kind: 'danger', onClick: async close => {
            close();
            try { await DC.auth.logout({ force: true, keepLocal: true }); finish(); } catch (x) { DC.ui.error(x); }
          } },
          { label: DC.t('core.cancel'), kind: 'outline' }
        ]
      });
    }
  }

  function nativeStatus() {
    try { const s = DC.native && DC.native.status ? DC.native.status() : null; return typeof s === 'string' ? JSON.parse(s) : (s || {}); } catch (e) { return {}; }
  }

  DC.screen('settings', {
    route: '#/settings',
    title: 'settings.doc_title',
    rerenderOnAccount: true,
    render(el) {
      const acct = DC.state.account;
      const sections = [];

      // ---- language ----
      sections.push(DC.ui.section({
        icon: 'globe', title: t('lang.title'), subtitle: t('lang.sub'),
        body: h('div.dc-set-seg', { role: 'radiogroup', 'aria-label': t('lang.title') }, DC.langs.map(l =>
          h('button.dc-set-seg-btn' + (DC.lang() === l ? '.active' : ''), {
            type: 'button', role: 'radio', 'aria-checked': String(DC.lang() === l),
            onclick: () => {
              if (DC.lang() === l) return;
              DC.setLang(l);
              if (DC.signedIn()) DC.auth.update({ lang: l }).catch(() => { /* kept on this device anyway */ });
            }
          }, DC.flag(l), h('span', null, DC.t('core.lang.' + l)))))
      }));

      // ---- motion ----
      sections.push(DC.ui.section({
        icon: 'eye', title: t('motion.title'),
        body: h('div.dc-card.dc-set-card', null, switchRow(t('motion.label'), t('motion.desc'), !!DC.settings.get('reduceMotion', false), v => {
          DC.settings.set('reduceMotion', v);
          document.documentElement.classList.toggle('dc-reduce-motion', v);
        }))
      }));

      // ---- morning reminder (Android notification) ----
      let reminderBody;
      if (DC.native && DC.native.remind) {
        const saved = Object.assign({ on: false, time: '07:00' }, DC.settings.get('reminder', null) || {});
        const time = h('input.dc-input.dc-set-time', { type: 'time', value: saved.time, step: 60, 'aria-label': t('reminder.time') });
        const apply = (on, tm) => {
          const m = /^(\d{1,2}):(\d{2})/.exec(tm || '07:00') || [0, '7', '00'];
          const hh = Math.min(23, Number(m[1])), mm = Math.min(59, Number(m[2]));
          try { DC.native.remind(hh, mm, !!on); } catch (e) { DC.ui.error(t('reminder.error')); return false; }
          DC.settings.set('reminder', { on: !!on, time: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') });
          return true;
        };
        const timeRow = h('div.dc-set-timerow' + (saved.on ? '' : '.dc-hidden'), null, h('label.dc-label', null, t('reminder.time')), time);
        const st = nativeStatus();
        const denied = st.notifications === 'denied';
        reminderBody = h('div.dc-card.dc-set-card', null,
          switchRow(t('reminder.label'), t('reminder.desc'), saved.on, v => {
            if (!apply(v, time.value)) return false;
            timeRow.classList.toggle('dc-hidden', !v);
            DC.ui.toast(v ? t('reminder.on', { time: time.value }) : t('reminder.off'), { icon: 'clock' });
          }),
          timeRow,
          denied ? h('div.dc-callout.gold.dc-set-note', null, h('p', null, t('reminder.denied')),
            DC.native.openSettings ? h('button.dc-btn.small.outline.auto', { type: 'button', onclick: () => { try { DC.native.openSettings(); } catch (e) { /* ignore */ } } }, t('reminder.open_settings')) : null) : null);
        time.addEventListener('change', () => {
          const cur = DC.settings.get('reminder', null) || {};
          if (cur.on && apply(true, time.value)) DC.ui.toast(t('reminder.on', { time: time.value }), { icon: 'clock' });
        });
      } else {
        reminderBody = h('div.dc-card.dc-set-card', null,
          h('div.dc-set-row-title', null, t('reminder.label')),
          h('p.dc-set-text', null, t('reminder.web')));
      }
      sections.push(DC.ui.section({ icon: 'clock', title: t('reminder.title'), body: reminderBody }));

      // ---- voice input language ----
      const voice = h('select.dc-select', { id: 'dc-set-voice' },
        [['', t('voice.auto')], ['en-US', t('voice.en')], ['it-IT', t('voice.it')]].map(([v, label]) =>
          h('option', { value: v, selected: String(DC.settings.get('voiceLang', '') || '') === v }, label)));
      voice.addEventListener('change', () => { DC.settings.set('voiceLang', voice.value); DC.ui.toast(DC.t('core.saved')); });
      sections.push(DC.ui.section({
        icon: 'mic', title: t('voice.title'), subtitle: t('voice.sub'),
        body: h('div', null, h('label.dc-label.dc-sr', { for: 'dc-set-voice' }, t('voice.title')), voice)
      }));

      // ---- interpretation cards ----
      const lenses = lensState();
      sections.push(DC.ui.section({
        icon: 'layers', title: t('lenses.title'), subtitle: t('lenses.sub'),
        body: h('div.dc-card.dc-set-card', null, LENSES.map(k => switchRow(t('lenses.' + k), null, lenses[k], v => {
          const next = Object.assign(lensState(), { [k]: v });
          if (!LENSES.some(x => next[x])) { DC.ui.toast(t('lenses.keep_one'), { icon: 'info' }); return false; }
          DC.settings.set('lenses', next);
        })))
      }));

      // ---- community: blocked users ----
      let blockedBody;
      if (acct) {
        const list = h('div.dc-set-blocks', null, h('div.dc-set-loading', null, DC.ui.spinner(true), h('span', null, t('blocked.loading'))));
        const empty = () => { DC.clear(list); list.appendChild(h('p.dc-set-text', null, t('blocked.none'))); };
        DC.api.get('/community/blocks').then(r => {
          const items = (r && Array.isArray(r.blocks)) ? r.blocks : [];
          if (!list.isConnected && !list.parentNode) return;
          if (!items.length) { empty(); return; }
          DC.clear(list);
          items.forEach(b => {
            const btn = h('button.dc-btn.small.outline.auto', { type: 'button' }, t('blocked.unblock'));
            const rowEl = h('div.dc-set-block', null,
              h('div.dc-set-block-avatar', { 'aria-hidden': 'true' }, DC.initials(b.handle || '?')),
              h('div.dc-set-block-text', null,
                h('div.dc-set-block-name', null, b.handle ? '@' + b.handle : t('blocked.unknown')),
                b.created_at ? h('div.dc-set-row-desc', null, t('blocked.since', { date: DC.fmtDate(b.created_at, 'short') })) : null),
              btn);
            btn.addEventListener('click', async () => {
              btn.disabled = true;
              try {
                await DC.api.del('/community/block/' + encodeURIComponent(b.user_id));
                rowEl.remove();
                DC.ui.toast(t('blocked.unblocked', { name: b.handle ? '@' + b.handle : t('blocked.unknown') }));
                if (!list.querySelector('.dc-set-block')) empty();
              } catch (e) { btn.disabled = false; DC.ui.error(e); }
            });
            list.appendChild(rowEl);
          });
        }).catch(e => { DC.clear(list); list.appendChild(h('p.dc-error', null, DC.api.message(e))); });
        blockedBody = h('div.dc-card.dc-set-card', null, h('div.dc-set-row-title', null, t('blocked.title')), list);
      } else {
        blockedBody = h('div.dc-card.dc-set-card', null,
          h('div.dc-set-row-title', null, t('blocked.title')),
          h('p.dc-set-text', null, t('blocked.signed_out')),
          h('button.dc-btn.small.outline.teal.auto', { type: 'button', onclick: () => DC.go('#/auth?next=' + encodeURIComponent('#/settings')) }, DC.t('core.signin')));
      }
      sections.push(DC.ui.section({ icon: 'users', title: t('community.title'), subtitle: t('community.sub'), body: blockedBody }));

      // ---- privacy ----
      sections.push(DC.ui.section({
        icon: 'shield', title: t('privacy.title'),
        body: h('div.dc-card.dc-set-card.dc-set-privacy', null,
          ['p1', 'p2', 'p3', 'p4', 'p5'].map(k => h('p', null, t('privacy.' + k))),
          h('div.dc-set-links', null,
            h('a.dc-btn.small.outline.auto', { href: 'privacy.html', target: '_blank', rel: 'noopener' }, DC.icon('shield', 16), DC.t('core.footer.privacy')),
            h('a.dc-btn.small.outline.auto', { href: 'terms.html', target: '_blank', rel: 'noopener' }, DC.icon('file-text', 16), DC.t('core.footer.terms'))))
      }));

      // ---- account ----
      sections.push(DC.ui.section({
        icon: 'user', title: t('account.title'),
        body: acct
          ? h('div.dc-card.dc-set-card', null,
            h('p.dc-set-text', null, t('account.signed_in', { email: acct.email || acct.display_name || '' })),
            h('div.dc-set-links', null,
              h('button.dc-btn.small.outline.auto', { type: 'button', onclick: () => DC.go('#/profile') }, DC.icon('user', 16), t('account.profile')),
              h('button.dc-btn.small.outline.auto', { type: 'button', onclick: signOut }, DC.icon('log-out', 16), t('account.signout'))))
          : h('div.dc-card.dc-set-card', null,
            h('p.dc-set-text', null, t('account.guest')),
            h('button.dc-btn.small.auto', { type: 'button', onclick: () => DC.go('#/auth?next=' + encodeURIComponent('#/settings')) }, DC.t('core.signin')))
      }));

      // ---- about ----
      const memory = DC.store.usingMemory();
      sections.push(DC.ui.section({
        icon: 'info', title: t('about.title'),
        body: h('div.dc-card.dc-set-card', null,
          h('div.dc-set-kv', null, h('span', null, t('about.version')), h('span.v', null, DC.version + (DC.native && DC.native.version ? ' · ' + t('about.app', { v: (() => { try { return DC.native.version(); } catch (e) { return ''; } })() }) : ''))),
          h('div.dc-set-kv', null, h('span', null, t('about.storage')),
            h('span.v' + (memory ? '.bad' : '.good'), null, DC.icon(memory ? 'alert-triangle' : 'check-circle', 15), memory ? t('about.storage_off') : t('about.storage_on'))),
          memory ? h('p.dc-set-row-desc', null, t('about.storage_off_desc')) : null,
          h('p.dc-set-made', null, t('about.made')))
      }));

      DC.append(el, [DC.ui.pageTitle({ icon: 'settings', title: t('title'), subtitle: t('subtitle') }), sections]);
    }
  });
})();

</script>
<script>/* web/src/screens/symbols.js */
/* Dream Symbols dictionary (designed in the demo's style, SPEC 3): search, group chips, Universal and
   In my dreams filters, an A to Z index, and the symbol page with the book's personal symbol vocabulary
   ("Your history with this symbol"). The list can hold several hundred entries per language, so rows are
   built once, in small chunks, and filtering only toggles them. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const t = (k, v) => DC.t('symbols.' + k, v);
  const GROUPS = ['animals', 'people', 'actions', 'places', 'nature', 'objects'];
  const AFFECT = { calming: '#3BE37A', distressing: '#FF5A6E', mixed: '#F2C14E', neutral: '#9AA3B5' };
  const TONES = ['positive', 'negative', 'mixed', 'neutral'];
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const norm = s => DC.data.norm(s);
  const list = v => (Array.isArray(v) ? v.filter(x => x != null && String(x).trim()) : []);
  const prettyId = id => String(id || '').replace(/[-_]+/g, ' ').replace(/^\w/, c => c.toUpperCase());
  const groupLabel = g => (DC.hasT('symbols.groups.' + g) ? t('groups.' + g) : prettyId(g));
  // Remembered only while moving between the list and a symbol page, so Back returns to the same place.
  const memo = { restore: false, y: 0, q: '', group: 'all', uni: false, mine: false };

  async function loadSymbols() {
    try { const l = await DC.data.symbols(); return Array.isArray(l) ? l.filter(s => s && s.id && s.name) : []; } catch (e) { return []; }
  }

  // Map of dictionary id -> [{d, x}] for every analyzed journal dream that contains the symbol.
  async function journalIndex(symbols) {
    const byName = new Map();
    symbols.forEach(s => {
      [s.name].concat(list(s.aliases)).forEach(a => { const k = norm(a); if (k && !byName.has(k)) byName.set(k, s.id); });
      const k = norm(String(s.id).replace(/-/g, ' ')); if (!byName.has(k)) byName.set(k, s.id);
    });
    const known = new Set(symbols.map(s => s.id));
    const out = new Map();
    let dreams = [];
    try { dreams = await DC.store.allDreams(); } catch (e) { dreams = []; }
    dreams.forEach(d => {
      const syms = d && d.analysis && Array.isArray(d.analysis.symbols) ? d.analysis.symbols : [];
      const seen = new Set();
      syms.forEach(x => {
        if (!x) return;
        const id = (x.id && known.has(x.id)) ? x.id : (byName.get(norm(x.name)) || x.id || null);
        if (!id || seen.has(id)) return;
        seen.add(id);
        if (!out.has(id)) out.set(id, []);
        out.get(id).push({ d, x });
      });
    });
    return out;
  }

  function titleBlock(icon, text) {
    return h('div.dc-sym-title', null, DC.icon(icon, 30), h('h1', null, text));
  }
  function uniPill() {
    return h('span.dc-sym-uni', null, DC.icon('sparkle', 12), t('universal'));
  }

  // ---------- list (#/symbols) ----------
  function renderList(el, query) {
    let alive = true;
    const restore = memo.restore;
    memo.restore = false;
    query = query || {};
    const st = restore ? { q: memo.q, group: memo.group, uni: memo.uni, mine: memo.mine }
      : { q: query.q || '', group: GROUPS.indexOf(query.group) >= 0 ? query.group : 'all', uni: query.filter === 'universal', mine: query.filter === 'mine' };

    const root = h('div.dc-sym');
    DC.append(el, root);
    const search = h('input.dc-input', { type: 'search', placeholder: t('search'), 'aria-label': t('search_label'), autocomplete: 'off', enterkeyhint: 'search', value: st.q });
    const chipEls = {};
    const chips = h('div.dc-sym-chips', { role: 'group', 'aria-label': t('filter_label') }, ['all'].concat(GROUPS).map(g => {
      chipEls[g] = h('button.dc-chip' + (st.group === g ? '.active' : ''), { type: 'button', 'aria-pressed': String(st.group === g), onclick: () => { st.group = g; syncChips(); apply(); } }, groupLabel(g));
      return chipEls[g];
    }));
    const uniBtn = h('button.dc-sym-toggle', { type: 'button', 'aria-pressed': String(st.uni), onclick: () => { st.uni = !st.uni; syncChips(); apply(); } }, DC.icon('sparkle', 14), t('universal'));
    const mineBtn = h('button.dc-sym-toggle', { type: 'button', 'aria-pressed': String(st.mine), onclick: () => { st.mine = !st.mine; syncChips(); apply(); } }, DC.icon('moon', 14), t('mine'));
    const azBtns = {};
    const az = h('nav.dc-sym-az', { 'aria-label': t('index') });
    const listEl = h('div.dc-sym-list', { 'aria-busy': 'true' }, DC.ui.spinner());
    const msg = h('div.dc-sym-msg.dc-hidden');

    DC.append(root, [
      titleBlock('book-open', t('title')),
      h('p.dc-sym-intro', null, t('intro')),
      h('div.dc-sym-search', null, DC.icon('search', 18), search),
      chips,
      h('div.dc-sym-toggles', null, uniBtn, mineBtn),
      az, listEl, msg
    ]);

    function syncChips() {
      Object.keys(chipEls).forEach(g => { chipEls[g].classList.toggle('active', st.group === g); chipEls[g].setAttribute('aria-pressed', String(st.group === g)); });
      uniBtn.setAttribute('aria-pressed', String(st.uni));
      mineBtn.setAttribute('aria-pressed', String(st.mine));
    }

    let items = [], letters = {}, letterOrder = [], mine = new Map(), built = 0, ready = false;
    const letterOf = name => { const c = norm(name).charAt(0).toUpperCase(); return /[A-Z]/.test(c) ? c : '#'; };

    function matches(it, nq) {
      if (st.group !== 'all' && it.s.group !== st.group) return false;
      if (st.uni && !it.s.universal) return false;
      if (st.mine && !mine.has(it.s.id)) return false;
      if (nq && it.hay.indexOf(nq) < 0) return false;
      return true;
    }
    function setMineMark(it) {
      const on = mine.has(it.s.id);
      if (!it.el) return;
      const has = it.el.querySelector('.dc-sym-mark');
      if (on && !has) it.el.querySelector('.dc-sym-row-top').appendChild(mark());
      if (!on && has) has.remove();
    }
    const mark = () => h('span.dc-sym-mark', { title: t('in_journal') }, DC.icon('moon', 13), h('span.dc-sr', null, t('in_journal')));

    function apply() {
      if (!ready) return;
      const nq = norm(st.q);
      const counts = {};
      let any = false;
      for (const it of items) {
        it.on = matches(it, nq);
        if (it.el) it.el.classList.toggle('dc-hidden', !it.on);
        if (it.on) { counts[it.letter] = (counts[it.letter] || 0) + 1; any = true; }
      }
      letterOrder.forEach(L => letters[L].card.classList.toggle('dc-hidden', !counts[L]));
      Object.keys(azBtns).forEach(L => { azBtns[L].disabled = !counts[L]; });
      az.classList.toggle('dc-hidden', !any);
      DC.clear(msg);
      if (!items.length) {
        msg.appendChild(DC.ui.empty({ icon: 'book-open', title: t('empty_title'), text: t('empty_text') }));
      } else if (!any) {
        const onlyMine = st.mine && mine.size === 0;
        msg.appendChild(onlyMine
          ? DC.ui.empty({ icon: 'moon', title: t('mine_empty'), text: t('mine_empty_text'), action: { label: t('clear'), onClick: clearAll } })
          : DC.ui.empty({ icon: 'search', title: t('none_found'), action: { label: t('clear'), onClick: clearAll } }));
      }
      msg.classList.toggle('dc-hidden', !!any);
    }
    function clearAll() { st.q = ''; search.value = ''; st.group = 'all'; st.uni = false; st.mine = false; syncChips(); apply(); }

    let raf = 0;
    search.addEventListener('input', () => { st.q = search.value; if (!raf) raf = requestAnimationFrame(() => { raf = 0; apply(); }); });

    function rowEl(it) {
      const s = it.s;
      return h('a.dc-sym-row', { href: '#/symbols/' + encodeURIComponent(s.id), onclick: remember },
        h('div.dc-sym-row-main', null,
          h('div.dc-sym-row-top', null, h('span.dc-sym-name', null, s.name), s.universal ? uniPill() : null, mine.has(s.id) ? mark() : null),
          s.summary ? h('div.dc-sym-sum', null, s.summary) : null),
        DC.icon('chevron-right', 18, 'chev'));
    }
    function remember() { Object.assign(memo, { restore: true, y: window.scrollY, q: st.q, group: st.group, uni: st.uni, mine: st.mine }); }

    function buildMore() {
      if (!alive) return;
      const end = Math.min(items.length, built + (built ? 160 : 60));
      for (; built < end; built++) {
        const it = items[built];
        it.el = rowEl(it);
        if (!it.on) it.el.classList.add('dc-hidden');
        letters[it.letter].body.appendChild(it.el);
      }
      if (built < items.length) setTimeout(buildMore, 0);
      else {
        listEl.removeAttribute('aria-busy');
        if (restore && memo.y) requestAnimationFrame(() => window.scrollTo(0, memo.y));
      }
    }

    const headerH = () => (document.getElementById('dc-header') || {}).offsetHeight || 64;
    function centerAz(L) {
      const b = azBtns[L];
      if (b && az.scrollWidth > az.clientWidth) az.scrollLeft = b.offsetLeft - az.clientWidth / 2 + b.offsetWidth / 2;
    }
    function goLetter(L) {
      const card = letters[L] && letters[L].card;
      if (!card) return;
      const y = card.getBoundingClientRect().top + window.scrollY - headerH() - az.offsetHeight - 10;
      window.scrollTo({ top: Math.max(0, y), behavior: 'auto' });
      centerAz(L);
    }
    // Edge fades on the index when it scrolls sideways, and the letter in view highlighted as the list scrolls.
    function azEdges() {
      az.classList.toggle('fade-l', az.scrollLeft > 4);
      az.classList.toggle('fade-r', az.scrollLeft + az.clientWidth < az.scrollWidth - 4);
    }
    let current = null, sraf = 0;
    function onScroll() {
      if (sraf) return;
      sraf = requestAnimationFrame(() => {
        sraf = 0;
        if (!ready) return;
        const line = headerH() + az.offsetHeight + 24;
        let L = null;
        for (const k of letterOrder) { const c = letters[k].card; if (c.classList.contains('dc-hidden')) continue; if (c.getBoundingClientRect().top <= line) L = k; else break; }
        if (L === current) return;
        if (current && azBtns[current]) azBtns[current].classList.remove('current');
        current = L;
        if (L && azBtns[L]) { azBtns[L].classList.add('current'); centerAz(L); }
      });
    }
    az.addEventListener('scroll', azEdges, { passive: true });
    window.addEventListener('scroll', onScroll, { passive: true });
