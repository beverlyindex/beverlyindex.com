<script>/* web/src/screens/analyze.js */
/* DREAM CODE: Dream Analysis input (S4) and the Analyzing overlay flow (S5).
   Also defines DC.dreamFlow, shared by result.js and chat.js (and usable by the journal):
     DC.dreamFlow.analyze(id, {force, onDone})  saves nothing itself; analyses a dream already in the store, then opens #/dream/:id?new=1
     DC.dreamFlow.taxonomy()                    {groups, types} from the types dictionary, or the fixed taxonomy when content is not loaded
     DC.dreamFlow.typeInfo(id)                  {id, name, color, short} for one type id
     DC.dreamFlow.allowanceModal('analysis'|'chat'), DC.dreamFlow.actionToast(msg, label, fn) */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('analyze.' + k, v);
  const DRAFT_KEY = 'dc.analyze.draft';
  const TONES = ['calm', 'anxious', 'sad', 'curious', 'joyful', 'mixed'];
  const ENDINGS = ['abrupt', 'peaceful', 'unresolved', 'woke_naturally'];

  // The fixed taxonomy (ids, groups and colours from the owner's category sheets). Names come from i18n.
  const FALLBACK = [
    ['consciousness', [['normal', '#7A9CFF'], ['lucid', '#3CF07A'], ['semi_lucid', '#2ED3A0'], ['hypnagogic', '#9ED8FF']]],
    ['emotional', [['joyful', '#FFC21A'], ['anxiety', '#FF5A2A'], ['nightmare', '#FF1E5A'], ['sexual', '#FF3FC0'], ['grief', '#7E7BFF'], ['comfort', '#8FD3FF']]],
    ['narrative', [['recurring', '#FFA020'], ['progressive', '#9BE01A'], ['fragmented', '#E6FF1A'], ['epic', '#FF8A1A'], ['mundane', '#C8CCD8']]],
    ['significance', [['prophetic', '#FFF01A'], ['healing', '#8CF0A0'], ['problem_solving', '#FFE6C8'], ['visitation', '#C77DFF'], ['archetypal', '#FF9A5A'], ['spiritual', '#FFFFFF']]]
  ];
  const fallbackTypes = () => {
    const out = [];
    FALLBACK.forEach(([g, list]) => list.forEach(([id, color]) => out.push({ id, group: g, color, name: T('types.' + id), short: '' })));
    return out;
  };
  const humanize = id => { const s = String(id || '').replace(/[-_]+/g, ' ').trim(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
  const groupName = id => (DC.hasT('analyze.groups.' + id) ? T('groups.' + id) : humanize(id));

  async function taxonomy() {
    let groups = [], types = [];
    try { const r = await Promise.all([DC.data.groups(), DC.data.types()]); groups = r[0]; types = r[1]; } catch (e) { /* offline or content not built yet */ }
    groups = Array.isArray(groups) ? groups.filter(g => g && g.id) : [];
    types = Array.isArray(types) ? types.filter(t => t && t.id) : [];
    const unlocked = !!(DC.state.account && DC.state.account.rv_unlocked);
    types = types.filter(t => !t.hidden || unlocked);
    if (!types.length) return { groups: FALLBACK.map(([id]) => ({ id, name: groupName(id) })), types: fallbackTypes(), fallback: true };
    const fb = fallbackTypes();
    types = types.map(t => Object.assign({}, t, { name: t.name || (fb.find(x => x.id === t.id) || {}).name || humanize(t.id), color: t.color || (fb.find(x => x.id === t.id) || {}).color || '#2EE6C8' }));
    const ids = [];
    groups.forEach(g => ids.push(g.id));
    types.forEach(t => { if (t.group && ids.indexOf(t.group) < 0) ids.push(t.group); });
    groups = ids.map(id => { const g = groups.find(x => x.id === id); return { id, name: (g && g.name) || groupName(id) }; });
    return { groups, types };
  }
  async function typeInfo(id) {
    const tx = await taxonomy();
    const t = tx.types.find(x => x.id === id) || fallbackTypes().find(x => x.id === id);
    return t || { id, name: humanize(id), color: '#2EE6C8', short: '' };
  }

  // ---------- toasts with an action, the allowance modal ----------
  // Built on DC.ui.toast (so there is one toast stack), with an action button and a close button added.
  const openToasts = new Set();
  function actionToast(msg, label, fn, opts) {
    opts = opts || {};
    DC.ui.toast(msg, { error: opts.error !== false, icon: opts.icon, ms: opts.ms || 9000 });
    const wraps = document.querySelectorAll('.dc-toast-wrap');
    const el = wraps.length ? wraps[wraps.length - 1].lastElementChild : null;
    if (!el) return () => {};
    const close = () => { openToasts.delete(close); el.remove(); };
    el.classList.add('dc-flow-toast');
    if (label) el.appendChild(h('button.dc-flow-toast-btn', { type: 'button', onclick: () => { close(); fn(); } }, label));
    el.appendChild(h('button.dc-flow-toast-x', { type: 'button', 'aria-label': DC.t('core.close'), onclick: close }, DC.icon('x', 16)));
    openToasts.add(close);
    setTimeout(() => openToasts.delete(close), (opts.ms || 9000) + 400);
    return close;
  }
  const closeToasts = () => Array.from(openToasts).forEach(c => c());

  // The shared dialog (core 60-ui.js) says when the allowance renews and offers plans only while they are on sale.
  function allowanceModal(kind, usage) {
    if (DC.ui.allowanceModal) return DC.ui.allowanceModal(kind, usage);
    const a = DC.state.account;
    const month = !!(a && a.usage && a.usage.period === 'month');
    const chat = kind === 'chat';
    DC.ui.modal({
      title: T(chat ? 'flow.chat_title' : 'flow.allow_title'),
      icon: 'zap',
      body: h('div', null, h('p', null, T((chat ? 'flow.chat_' : 'flow.allow_') + (month ? 'month' : 'week'))), chat ? null : h('p.dc-muted', { style: { fontSize: '14px' } }, T('flow.allow_saved'))),
      actions: [
        { label: T('flow.see_plans'), icon: 'crown', onClick: c => { c(); DC.go('#/pricing'); } },
        { label: T('flow.later'), kind: 'outline' }
      ]
    });
  }

  // ---------- the analysis flow ----------
  let busy = false;
  async function analyze(id, opts) {
    opts = opts || {};
    if (busy) return false;
    closeToasts();
    const dream = await DC.store.getDream(id);
    if (!dream || dream.deleted_at || !String(dream.text || '').trim()) { DC.ui.toast(T('flow.empty'), { error: true }); return false; }
    if (!DC.signedIn()) {
      DC.ui.toast(T('flow.signin'), { icon: 'smartphone', ms: 4000 });
      DC.go('#/auth?next=' + encodeURIComponent('#/dream/' + id + '?analyze=1'));
      return false;
    }
    const retry = () => analyze(id, opts);
    if (!DC.state.online || navigator.onLine === false) { actionToast(T('flow.offline'), DC.t('core.retry'), retry); return false; }
    busy = true;
    const ov = DC.ui.analyzing();
    const timers = [];
    try {
      ov.set('process');
      timers.push(setTimeout(() => ov.set('symbols'), 1400));
      timers.push(setTimeout(() => ov.set('final'), 4200));
      const body = { dream: DC.store.editable(dream), lang: DC.lang() };
      if (opts.force) body.force = true;
      const r = await DC.api.post('/dreams/' + encodeURIComponent(id) + '/analyze', body, { timeout: 290000 });
      timers.forEach(clearTimeout);
      ov.set('final', 92);
      if (r && r.dream) await DC.store.applyServer(r.dream);
      if (r && r.usage && DC.state.account) DC.state.account.usage = Object.assign({}, DC.state.account.usage, r.usage);
      DC.auth.refreshAccount();
      ov.done();
      if (opts.onDone) { try { opts.onDone(r); } catch (e) { /* ignore */ } }
      DC.go('#/dream/' + encodeURIComponent(id) + '?new=1');
      return true;
    } catch (e) {
      timers.forEach(clearTimeout);
      ov.fail();
      if (e.status === 402) allowanceModal('analysis', e.body && e.body.usage);
      else if (e.status === 401) { DC.ui.toast(T('flow.signin'), { icon: 'smartphone' }); DC.go('#/auth?next=' + encodeURIComponent('#/dream/' + id + '?analyze=1')); }
      else if (e.status === 0) actionToast(e.error === 'timeout' ? T('flow.timeout') : T('flow.offline'), DC.t('core.retry'), retry);
      else actionToast((e.body && e.message ? e.message : T('flow.error')) + (e.status ? ' (' + (e.error || 'error') + ', ' + e.status + ')' : ''), DC.t('core.retry'), retry);
      return false;
    } finally { busy = false; }
  }

  DC.dreamFlow = { analyze, taxonomy, typeInfo, allowanceModal, actionToast, humanize };

  // ---------- voice input (Web Speech API, or the Android bridge) ----------
  function voiceMode() {
    if (DC.native && typeof DC.native.speechStart === 'function') {
      try { const s = JSON.parse(DC.native.status()); if (s && s.speech === false) return null; } catch (e) { /* assume available */ }
      return 'native';
    }
    if (window.SpeechRecognition || window.webkitSpeechRecognition) return 'web';
    return null;
  }
  function makeVoice(textarea, onText, onState) {
    const mode = voiceMode();
    if (!mode) return null;
    let on = false, rec = null, committed = '', off = null, restarts = 0;
    const lang = () => { const v = String(DC.settings.get('voiceLang', '') || DC.lang()); return /^it/i.test(v) ? 'it-IT' : 'en-US'; };
    const sep = s => (s && !/\s$/.test(s) ? s + ' ' : s);
    const show = interim => { textarea.value = committed + (interim || ''); onText(); };
    function fail(key) { stop(); DC.ui.toast(T(key), { error: true }); }
    function start() {
      committed = sep(textarea.value);
      on = true; restarts = 0; onState(true);
      if (mode === 'native') {
        off = DC.on('native:speech', ev => {
          if (!on || !ev) return;
          if (ev.error) { fail('voice.error'); return; }
          if (ev.final) { committed = sep(committed + String(ev.final).trim()); show(''); try { DC.native.speechStart(lang()); } catch (e) { stop(); } }
          else if (ev.partial) show(String(ev.partial));
        });
        try { DC.native.speechStart(lang()); } catch (e) { fail('voice.error'); }
        return;
      }
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      try { rec = new R(); } catch (e) { fail('voice.unavailable'); return; }
      rec.continuous = true; rec.interimResults = true; rec.lang = lang();
      rec.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const tr = e.results[i][0] ? e.results[i][0].transcript : '';
          if (e.results[i].isFinal) committed = sep(committed + tr.trim()); else interim += tr;
        }
        show(on ? interim : '');
      };
      rec.onerror = e => {
        const err = e && e.error;
        if (err === 'no-speech' || err === 'aborted') return;
        fail(err === 'not-allowed' || err === 'service-not-allowed' ? 'voice.denied' : (err === 'network' || err === 'language-not-supported' ? 'voice.unavailable' : 'voice.error'));
      };
      rec.onend = () => {
        if (on && restarts++ < 30) { try { rec.start(); return; } catch (e) { /* fall through */ } }
        if (on) stop();
        rec = null;
      };
      try { rec.start(); } catch (e) { fail('voice.unavailable'); }
    }
    function stop() {
      if (!on) return;
      on = false; onState(false);
      if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } }
      if (mode === 'native') { try { DC.native.speechStop(); } catch (e) { /* ignore */ } }
      if (off) { off(); off = null; }
      textarea.value = committed.replace(/\s+$/, '');
      onText();
    }
    return { start, stop, toggle: () => (on ? stop() : start()), isOn: () => on, typed: () => { if (on) committed = sep(textarea.value); } };
  }

  // ---------- the input screen ----------
  DC.screen('analyze', {
    route: '#/analyze',
    title: 'analyze.title',
    render(el, params, query) {
      let alive = true, draftTimer = null, cleared = false, voice = null;
      const offs = [];
      const form = { id: null, text: '', title: '', dreamt_on: DC.today(), details: {}, categories: [], open: false };
      const refs = {};

      function readDraft() {
        const d = DC.ls.get(DRAFT_KEY, null);
        if (!d || typeof d !== 'object') return;
        ['id', 'text', 'title', 'dreamt_on', 'open'].forEach(k => { if (d[k] != null) form[k] = d[k]; });
        if (d.details && typeof d.details === 'object') form.details = Object.assign({}, d.details);
        if (Array.isArray(d.categories)) form.categories = d.categories.slice();
      }
      function writeDraft() {
        clearTimeout(draftTimer); draftTimer = null;
        if (cleared) return;
        const empty = !form.text.trim() && !form.title.trim() && !Object.keys(cleanDetails()).length && !form.categories.length;
        if (empty && !form.id) { DC.ls.del(DRAFT_KEY); return; }
        DC.ls.set(DRAFT_KEY, { id: form.id, text: form.text, title: form.title, dreamt_on: form.dreamt_on, details: form.details, categories: form.categories, open: form.open, t: Date.now() });
        if (refs.status && form.text.trim()) setStatus(T('draft_saved'), 'smartphone');
      }
      function queueDraft() { cleared = false; clearTimeout(draftTimer); draftTimer = setTimeout(writeDraft, 400); }
      function clearDraft() { cleared = true; clearTimeout(draftTimer); draftTimer = null; DC.ls.del(DRAFT_KEY); }
      function setStatus(text, icon) { if (!refs.status) return; DC.clear(refs.status); if (text) DC.append(refs.status, [DC.icon(icon || 'check', 13), h('span', null, text)]); }

      function cleanDetails() {
        const d = form.details || {}, o = {};
        if (Number(d.sleep_quality) >= 1 && Number(d.sleep_quality) <= 10) o.sleep_quality = Number(d.sleep_quality);
        if (Array.isArray(d.emotional_tone) && d.emotional_tone.length) o.emotional_tone = d.emotional_tone.filter(x => TONES.indexOf(x) >= 0);
        ['people', 'dominant_emotion', 'sensations'].forEach(k => { if (typeof d[k] === 'string' && d[k].trim()) o[k] = d[k].trim().slice(0, 2000); });
        if (ENDINGS.indexOf(d.ending) >= 0) o.ending = d.ending;
        return o;
      }

      async function persist() {
        let id = form.id, prev = null;
        if (id) { prev = await DC.store.getDream(id); if (!prev || prev.deleted_at) { id = null; prev = null; } }
        // Keep detail fields this form does not edit (for example intensity), drop the ones the user cleared.
        const details = Object.assign({}, prev && prev.details ? prev.details : {});
        ['sleep_quality', 'emotional_tone', 'people', 'dominant_emotion', 'ending', 'sensations'].forEach(k => { delete details[k]; });
        Object.assign(details, cleanDetails());
        const patch = { text: form.text.trim().slice(0, 20000), title: form.title.trim().slice(0, 120), dreamt_on: form.dreamt_on || DC.today(), details, categories: form.categories.slice() };
        if (id) patch.id = id;
        const d = await DC.store.saveDream(patch);
        form.id = d.id;
        writeDraft();
        return d;
      }

      function syncButtons() {
        const has = !!(refs.text && refs.text.value.trim());
        if (refs.go) refs.go.disabled = !has;
        if (refs.save) refs.save.disabled = !has;
        if (refs.clear) refs.clear.classList.toggle('dc-hidden', !has && !form.title && !form.id);
      }

      async function onAnalyze() {
        if (!refs.text.value.trim() || refs.go.dataset.busy) return;
        if (voice) voice.stop();
        form.text = refs.text.value;
        refs.go.dataset.busy = '1';
        try {
          const d = await persist();
          if (!DC.signedIn()) { clearDraft(); }
          else setStatus(T('saved_journal'), 'book-open');
          await analyze(d.id, { onDone: clearDraft });
        } catch (e) { DC.ui.error(e); }
        finally { if (refs.go) delete refs.go.dataset.busy; }
      }
      async function onSave() {
        if (!refs.text.value.trim()) return;
        if (voice) voice.stop();
        form.text = refs.text.value;
        try {
          await persist();
          clearDraft();
          DC.ui.toast(T('saved'));
          DC.go('#/journal');
        } catch (e) { DC.ui.error(e); }
      }
      async function onClear() {
        const ok = !refs.text.value.trim() || await DC.ui.confirm(T('clear_title'), T('clear_text'), T('clear'), 'primary');
        if (!ok || !alive) return;
        if (voice) voice.stop();
        clearDraft();
        Object.assign(form, { id: null, text: '', title: '', dreamt_on: DC.today(), details: {}, categories: [], open: false });
        if (query.id) { DC.go('#/analyze', { replace: true }); return; }
        build();
      }

      // ----- pieces -----
      function chipGroup(values, prefix, isOn, onTap) {
        const wrap = h('div.dc-chips.dc-an-chips', { role: 'group' });
        const paint = () => Array.from(wrap.children).forEach((b, i) => { const on = isOn(values[i]); b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
        values.forEach(v => wrap.appendChild(h('button.dc-chip', { type: 'button', onclick: () => { onTap(v); paint(); } }, T(prefix + '.' + v))));
        paint();
        return wrap;
      }
      function scale() {
        const wrap = h('div.dc-an-scale', { role: 'group', 'aria-label': T('details.sleep') });
        const paint = () => Array.from(wrap.children).forEach((b, i) => { const on = Number(form.details.sleep_quality) === i + 1; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
        for (let n = 1; n <= 10; n++) wrap.appendChild(h('button', { type: 'button', onclick: () => { form.details.sleep_quality = Number(form.details.sleep_quality) === n ? null : n; paint(); queueDraft(); } }, String(n)));
        paint();
        return wrap;
      }
      function field(label, input, hint) { return h('div.dc-an-field', null, h('label.dc-label', null, label), input, hint ? h('div.dc-an-hint', null, hint) : null); }
      function textInput(key, ph, isDetail) {
        const src = isDetail ? form.details : form;
        return h('input.dc-input', { type: 'text', value: src[key] || '', placeholder: ph || '', maxlength: key === 'title' ? 120 : 400, oninput: e => { src[key] = e.target.value; queueDraft(); syncButtons(); } });
      }

      function categories() {
        const grid = h('div.dc-an-cats-grid', null, h('div.dc-an-cats-wait', null, DC.ui.spinner(true)));
        taxonomy().then(tx => {
          if (!alive) return;
          DC.clear(grid);
          tx.groups.forEach(g => {
            const items = tx.types.filter(t => t.group === g.id);
            if (!items.length) return;
            grid.appendChild(h('div.dc-an-group', null, h('h4', null, g.name), items.map(t => {
              const on = form.categories.indexOf(t.id) >= 0;
              return h('label.dc-an-cat', { style: { '--c': t.color } },
                h('input', { type: 'checkbox', checked: on, value: t.id, onchange: e => {
                  const i = form.categories.indexOf(t.id);
                  if (e.target.checked && i < 0) form.categories.push(t.id);
                  if (!e.target.checked && i >= 0) form.categories.splice(i, 1);
                  queueDraft();
                } }),
                h('span', { style: { color: t.color } }, t.name));
            })));
          });
        });
        return h('div.dc-an-cats', null, h('h3', null, T('details.categories')), grid);
      }

      function drawer() {
        const body = h('div.dc-an-drawer-body' + (form.open ? '' : '.dc-hidden'),
          h('div.dc-an-row2', null,
            field(T('details.date'), h('input.dc-input', { type: 'date', value: form.dreamt_on || DC.today(), max: DC.today(), onchange: e => { form.dreamt_on = e.target.value || DC.today(); queueDraft(); } })),
            field(T('details.title'), textInput('title', T('details.title_ph')))),
          field(T('details.sleep'), scale(), T('details.sleep_hint')),
          field(T('details.tone'), chipGroup(TONES, 'tone', v => (form.details.emotional_tone || []).indexOf(v) >= 0, v => {
            const a = (form.details.emotional_tone || []).slice(), i = a.indexOf(v);
            if (i >= 0) a.splice(i, 1); else a.push(v);
            form.details.emotional_tone = a; queueDraft();
          })),
          h('div.dc-an-row2', null,
            field(T('details.people'), textInput('people', T('details.people_ph'), true)),
            field(T('details.emotion'), textInput('dominant_emotion', T('details.emotion_ph'), true))),
          field(T('details.ending'), chipGroup(ENDINGS, 'ending', v => form.details.ending === v, v => { form.details.ending = form.details.ending === v ? null : v; queueDraft(); })),
          field(T('details.sensations'), h('textarea.dc-textarea.dc-an-small', { rows: 3, maxlength: 2000, placeholder: T('details.sensations_ph'), value: form.details.sensations || '', oninput: e => { form.details.sensations = e.target.value; queueDraft(); } })),
          categories());
        const wrap = h('div.dc-an-drawer' + (form.open ? '.open' : ''));
        const btn = h('button.dc-an-drawer-btn', { type: 'button', 'aria-expanded': String(!!form.open), onclick: () => {
          form.open = !form.open;
          wrap.classList.toggle('open', form.open); body.classList.toggle('dc-hidden', !form.open);
          btn.setAttribute('aria-expanded', String(form.open)); queueDraft();
        } }, DC.icon('plus', 18), h('span', null, T('details.toggle')), h('span.opt', null, T('details.optional')), DC.icon('chevron-down', 18, 'chev'));
        DC.append(wrap, [btn, body]);
        return wrap;
      }

      function topLine() {
        const slot = refs.top;
        if (!slot) return;
        DC.clear(slot);
        if (DC.signedIn()) { const a = DC.ui.allowance(); if (a) slot.appendChild(a); }
        else slot.appendChild(h('div.dc-an-guest', null, DC.icon('info', 18), h('div', null, T('signed_out'), ' ', h('a', { href: '#/auth?next=' + encodeURIComponent('#/analyze') }, T('sign_in')))));
      }

      function build() {
        if (voice) { voice.stop(); voice = null; }
        DC.clear(el);
        refs.top = h('div.dc-an-top');
        refs.text = h('textarea.dc-textarea.dc-an-text', { id: 'dc-an-text', placeholder: T('placeholder'), maxlength: 20000, rows: 7, value: form.text,
          oninput: () => { form.text = refs.text.value; if (voice) voice.typed(); queueDraft(); syncButtons(); } });
        refs.status = h('span.dc-an-status', { 'aria-live': 'polite' });
        refs.go = h('button.dc-btn.dc-an-go', { type: 'button', onclick: onAnalyze }, DC.icon('brain', 20), T('analyze'));
        refs.save = h('button.dc-btn.secondary.dc-an-save', { type: 'button', onclick: onSave }, DC.icon('book-open', 18), T('save'));
        refs.clear = h('button.dc-link.dc-an-clear', { type: 'button', onclick: onClear }, T('clear'));
        let mic = null;
        voice = makeVoice(refs.text, () => { form.text = refs.text.value; queueDraft(); syncButtons(); }, on => {
          if (!mic) return;
          mic.classList.toggle('on', on); mic.setAttribute('aria-pressed', String(on));
          DC.clear(mic); DC.append(mic, on ? [h('span.rec'), T('voice.stop')] : [DC.icon('mic', 16), T('voice.start')]);
          setStatus(on ? T('voice.listening') : '', 'mic');
        });
        if (voice) mic = h('button.dc-an-mic', { type: 'button', 'aria-pressed': 'false', title: T('voice.title'), onclick: () => voice.toggle() }, DC.icon('mic', 16), T('voice.start'));

        DC.append(el, [
          refs.top,
          DC.ui.pageTitle({ title: T('title'), subtitle: T('intro') }),
          query.id && form.id ? h('div.dc-callout.dc-an-editing', null, DC.icon('pencil', 16), ' ', T('editing')) : null,
          h('div.dc-card.glow.dc-an-card', null,
            h('div.dc-an-head', null, DC.icon('brain', 34), h('h2', null, h('label', { for: 'dc-an-text' }, T('card_title')))),
            refs.text,
            h('div.dc-an-tools', null, refs.status, h('div.dc-an-tools-r', null, refs.clear, mic)),
            DC.slotEl('writer', { input: refs.text, changed: () => { form.text = refs.text.value; queueDraft(); syncButtons(); } }),
            drawer(),
            h('div.dc-an-actions', null, refs.go, refs.save))
        ]);
        topLine();
        syncButtons();
      }

      offs.push(DC.on('account', () => { if (alive) topLine(); }));
      // Keep the draft if the app is closed or sent to the background before the debounce fires.
      const flush = () => { if (draftTimer) writeDraft(); };
      const onVis = () => { if (document.visibilityState === 'hidden') flush(); };
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', onVis);
      offs.push(() => { window.removeEventListener('pagehide', flush); document.removeEventListener('visibilitychange', onVis); });

      if (query.id) {
        DC.store.getDream(query.id).then(d => {
          if (!alive) return;
          if (d && !d.deleted_at) {
            Object.assign(form, { id: d.id, text: d.text || '', title: d.title || '', dreamt_on: d.dreamt_on || DC.today(), details: Object.assign({}, d.details || {}), categories: (d.categories || []).slice() });
            form.open = !!(form.title || form.categories.length || Object.keys(cleanDetails()).length);
          } else readDraft();
          build();
        });
      } else { readDraft(); build(); }

      return () => {
        alive = false;
        if (voice) voice.stop();
        if (draftTimer) writeDraft();
        offs.forEach(f => f());
      };
    }
  });
})();

</script>
<script>/* web/src/screens/auth.js */
/* Sign In / Sign Up (demo S2), forgot password, and #/reset (new password from the emailed token).
   The developer key code button of the demo is removed (SPEC section 3). */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Only internal routes, never back to the auth screens themselves.
  function safeNext(n) {
    if (!n || typeof n !== 'string' || !/^#\//.test(n) || /^#\/(auth|reset)\b/.test(n)) return '#/analyze';
    return n;
  }

  function field(o) {
    const input = h('input.dc-input', {
      type: o.type || 'text', id: o.id, name: o.id, placeholder: o.placeholder || '', autocomplete: o.autocomplete || 'off',
      value: o.value || '', required: true, maxlength: o.max || 254, inputmode: o.inputmode || null, spellcheck: 'false', autocapitalize: o.type === 'email' ? 'off' : null
    });
    let wrap = input;
    if (o.type === 'password') {
      const eye = h('button.dc-auth-eye', { type: 'button', 'aria-label': DC.t('auth.show_password'), 'aria-pressed': 'false' }, DC.icon('eye', 18));
      eye.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        DC.clear(eye); eye.appendChild(DC.icon(show ? 'eye-off' : 'eye', 18));
        eye.setAttribute('aria-label', DC.t(show ? 'auth.hide_password' : 'auth.show_password'));
        eye.setAttribute('aria-pressed', String(show));
      });
      wrap = h('div.dc-auth-pass', null, input, eye);
    }
    return { input, el: h('div.dc-auth-field', null, h('label.dc-label', { for: o.id }, o.label), wrap, o.hint ? h('div.dc-auth-hint', null, o.hint) : null) };
  }

  function busy(btn, on, label) {
    btn.disabled = !!on;
    DC.clear(btn);
    if (on) DC.append(btn, [DC.ui.spinner(true), h('span', null, DC.t('auth.working'))]);
    else btn.appendChild(document.createTextNode(label));
  }

  DC.screen('auth', {
    route: ['#/auth', '#/reset'],
    title: 'auth.doc_title',
    render(el, params, query) {
      const isReset = DC.state.route === '#/reset';
      const next = safeNext(query.next);
      let mode = isReset ? (query.token ? 'newpass' : 'forgot') : (query.mode === 'signup' ? 'signup' : 'signin');
      let email = query.email || '';

      const title = h('h1');
      const sub = h('p.dc-sub');
      const head = h('div.dc-page-title.dc-auth-title', null, title, sub);
      const panel = h('div.dc-auth-panel');
      const below = h('div.dc-auth-below');
      DC.append(el, [head, panel, below]);

      // Already signed in: say so instead of showing the form.
      if (DC.signedIn() && !isReset) {
        const a = DC.state.account;
        title.textContent = DC.t('auth.signed_in.title');
        sub.textContent = DC.t('auth.signed_in.text', { email: a.email || '' });
        DC.append(panel, h('div.dc-card.dc-auth-card', null,
          h('div.dc-auth-signedin', null, DC.icon('check-circle', 22), h('span', null, a.display_name || a.email)),
          h('button.dc-btn', { type: 'button', onclick: () => DC.go(next) }, DC.t('auth.signed_in.continue')),
          h('button.dc-btn.outline', { type: 'button', style: { marginTop: '10px' }, onclick: () => DC.go('#/profile') }, DC.t('auth.signed_in.profile'))));
        return;
      }

      function setHead() {
        const k = { signin: 'signin', signup: 'signup', forgot: 'forgot', newpass: 'newpass' }[mode];
        title.textContent = DC.t('auth.head.' + k + '.title');
        sub.textContent = DC.t('auth.head.' + k + '.text');
        document.title = DC.t('auth.head.' + k + '.title') + ' · DREAM CODE';
      }

      function draw() {
        setHead();
        DC.clear(panel); DC.clear(below);
        const card = h('div.dc-card.dc-auth-card');
        panel.appendChild(card);
        if (mode === 'signin' || mode === 'signup') {
          const seg = h('div.dc-auth-seg', { role: 'tablist', 'aria-label': DC.t('auth.seg_label') },
            ['signin', 'signup'].map(m => h('button.dc-auth-seg-btn' + (mode === m ? '.active' : ''), {
              type: 'button', role: 'tab', 'aria-selected': String(mode === m),
              onclick: () => { if (mode !== m) { mode = m; draw(); } }
            }, DC.t(m === 'signin' ? 'auth.tab_signin' : 'auth.tab_signup'))));
          card.appendChild(seg);
          card.appendChild(mode === 'signin' ? signInForm() : signUpForm());
          DC.append(below, [
            h('div.dc-auth-or', null, h('span', null, DC.t('auth.or'))),
            h('button.dc-btn.secondary', { type: 'button', onclick: () => { DC.ui.toast(DC.t('auth.guest_toast'), { icon: 'smartphone' }); DC.go('#/analyze'); } },
              DC.icon('smartphone', 18), DC.t('auth.guest_button')),
            h('p.dc-auth-guest-note', null, DC.t('auth.guest_note'))
          ]);
        } else if (mode === 'forgot') card.appendChild(forgotForm());
        else card.appendChild(newPassForm());
      }

      function signInForm() {
        const fe = field({ id: 'dc-auth-email', type: 'email', label: DC.t('auth.email'), placeholder: DC.t('auth.email_ph'), autocomplete: 'email', value: email, inputmode: 'email' });
        const fp = field({ id: 'dc-auth-pass', type: 'password', label: DC.t('auth.password'), placeholder: DC.t('auth.password_ph'), autocomplete: 'current-password', max: 200 });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const btn = h('button.dc-btn.dc-auth-submit', { type: 'submit' }, DC.t('auth.signin_button'));
        const showErr = m => { err.textContent = m; err.classList.remove('dc-hidden'); };
        fe.input.addEventListener('input', () => { email = fe.input.value.trim(); });
        const form = h('form.dc-auth-form', { novalidate: true }, fe.el, fp.el, err, btn,
          h('div.dc-auth-links', null, h('button.dc-link', { type: 'button', onclick: () => { email = fe.input.value.trim(); mode = 'forgot'; draw(); } }, DC.t('auth.forgot_link'))));
        form.addEventListener('submit', async e => {
          e.preventDefault();
          err.classList.add('dc-hidden');
          const em = fe.input.value.trim(), pw = fp.input.value;
          if (!EMAIL_RE.test(em)) { showErr(DC.t('auth.err.email')); fe.input.focus(); return; }
          if (!pw) { showErr(DC.t('auth.err.password_empty')); fp.input.focus(); return; }
          busy(btn, true);
          try {
            const a = await DC.auth.login({ email: em, password: pw });
            DC.ui.toast(DC.t('auth.welcome_back', { name: a.display_name || em.split('@')[0] }));
            DC.go(next);
          } catch (ex) { busy(btn, false, DC.t('auth.signin_button')); showErr(DC.api.message(ex)); }
        });
        return form;
      }

      function signUpForm() {
        const fn = field({ id: 'dc-auth-name', label: DC.t('auth.name'), placeholder: DC.t('auth.name_ph'), autocomplete: 'nickname', max: 60 });
        const fe = field({ id: 'dc-auth-email', type: 'email', label: DC.t('auth.email'), placeholder: DC.t('auth.email_ph'), autocomplete: 'email', value: email, inputmode: 'email' });
        const fp = field({ id: 'dc-auth-pass', type: 'password', label: DC.t('auth.password'), placeholder: DC.t('auth.password_new_ph'), autocomplete: 'new-password', max: 200, hint: DC.t('auth.password_rules') });
        const adult = h('input', { type: 'checkbox', id: 'dc-auth-adult' });
        const terms = h('input', { type: 'checkbox', id: 'dc-auth-terms' });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const btn = h('button.dc-btn.dc-auth-submit', { type: 'submit' }, DC.t('auth.create_button'));
        const showErr = m => { err.textContent = m; err.classList.remove('dc-hidden'); };
        fe.input.addEventListener('input', () => { email = fe.input.value.trim(); });
        const form = h('form.dc-auth-form', { novalidate: true }, fn.el, fe.el, fp.el,
          h('label.dc-check.dc-auth-check', { for: 'dc-auth-adult' }, adult, h('span', null, DC.t('auth.adult'))),
          h('label.dc-check.dc-auth-check', { for: 'dc-auth-terms' }, terms, h('span', null,
            DC.t('auth.terms_before'), h('a', { href: 'terms.html', target: '_blank', rel: 'noopener' }, DC.t('auth.terms_link')),
            DC.t('auth.terms_and'), h('a', { href: 'privacy.html', target: '_blank', rel: 'noopener' }, DC.t('auth.privacy_link')), DC.t('auth.terms_after'))),
          err, btn);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          err.classList.add('dc-hidden');
          const name = fn.input.value.trim(), em = fe.input.value.trim(), pw = fp.input.value;
          if (!name) { showErr(DC.t('auth.err.name')); fn.input.focus(); return; }
          if (!EMAIL_RE.test(em)) { showErr(DC.t('auth.err.email')); fe.input.focus(); return; }
          if (pw.length < 8) { showErr(DC.t('auth.err.password_short')); fp.input.focus(); return; }
          if (!adult.checked) { showErr(DC.t('auth.err.adult')); adult.focus(); return; }
          if (!terms.checked) { showErr(DC.t('auth.err.terms')); terms.focus(); return; }
          busy(btn, true);
          try {
            const a = await DC.auth.register({ email: em, password: pw, display_name: name, adult_ok: true, terms: true });
            DC.ui.toast(DC.t('auth.welcome_new', { name: a.display_name || name }));
            DC.go(next);
          } catch (ex) { busy(btn, false, DC.t('auth.create_button')); showErr(DC.api.message(ex)); }
        });
        return form;
      }

      function forgotForm() {
        const fe = field({ id: 'dc-auth-email', type: 'email', label: DC.t('auth.email'), placeholder: DC.t('auth.email_ph'), autocomplete: 'email', value: email, inputmode: 'email' });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const btn = h('button.dc-btn.dc-auth-submit', { type: 'submit' }, DC.t('auth.forgot.button'));
        const box = h('div');
        const form = h('form.dc-auth-form', { novalidate: true }, h('p.dc-auth-lead', null, DC.t('auth.forgot.lead')), fe.el, err, btn);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          err.classList.add('dc-hidden');
          const em = fe.input.value.trim();
          if (!EMAIL_RE.test(em)) { err.textContent = DC.t('auth.err.email'); err.classList.remove('dc-hidden'); fe.input.focus(); return; }
          email = em;
          busy(btn, true);
          try {
            await DC.auth.requestReset(em);
          } catch (ex) {
            // Only a network problem is worth showing; any other answer gets the same neutral line.
            if (ex && ex.status === 0) { busy(btn, false, DC.t('auth.forgot.button')); err.textContent = DC.api.message(ex); err.classList.remove('dc-hidden'); return; }
          }
          DC.clear(box);
          DC.append(box, [DC.ui.status('ok', DC.t('auth.forgot.sent_title'), DC.t('auth.forgot.sent'), 'mail'), back()]);
        });
        DC.append(box, [form, back()]);
        return box;
      }

      function back() {
        return h('div.dc-auth-links.center', null, h('button.dc-link', { type: 'button', onclick: () => { mode = 'signin'; if (isReset) DC.go('#/auth'); else draw(); } }, DC.t('auth.back_to_login')));
      }

      function newPassForm() {
        const f1 = field({ id: 'dc-auth-new1', type: 'password', label: DC.t('auth.newpass.label1'), placeholder: DC.t('auth.password_new_ph'), autocomplete: 'new-password', max: 200, hint: DC.t('auth.password_rules') });
        const f2 = field({ id: 'dc-auth-new2', type: 'password', label: DC.t('auth.newpass.label2'), placeholder: DC.t('auth.newpass.ph2'), autocomplete: 'new-password', max: 200 });
        const err = h('div.dc-error.dc-hidden', { role: 'alert' });
        const btn = h('button.dc-btn.dc-auth-submit', { type: 'submit' }, DC.t('auth.newpass.button'));
        const showErr = m => { err.textContent = m; err.classList.remove('dc-hidden'); };
        const form = h('form.dc-auth-form', { novalidate: true }, f1.el, f2.el, err, btn);
        form.addEventListener('submit', async e => {
          e.preventDefault();
          err.classList.add('dc-hidden');
          const p1 = f1.input.value, p2 = f2.input.value;
          if (p1.length < 8) { showErr(DC.t('auth.err.password_short')); f1.input.focus(); return; }
          if (p1 !== p2) { showErr(DC.t('auth.err.mismatch')); f2.input.focus(); return; }
          busy(btn, true);
          try {
            await DC.auth.confirmReset(query.token, p1);
            DC.ui.toast(DC.t('auth.newpass.done'));
            DC.go('#/auth', { replace: true });
          } catch (ex) { busy(btn, false, DC.t('auth.newpass.button')); showErr(DC.api.message(ex)); }
        });
        return h('div', null, form, h('div.dc-auth-links.center', null,
          h('button.dc-link', { type: 'button', onclick: () => DC.go('#/reset') }, DC.t('auth.newpass.request_again'))));
      }

  });
})();

<script>/* web/src/screens/chat.js */
/* DREAM CODE: Chat With Dream AI, about one dream. The conversation is kept with the dream (dream.chat) by the server. */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('chat.' + k, v);
  const MAX = 2000;
  const str = x => (x == null ? '' : String(x));

  function firstWords(d) {
    const t = str(d.title).trim() || str(d.analysis && d.analysis.title).trim();
    if (t) return t;
    const w = str(d.text).trim().split(/\s+/);
    return w.slice(0, 12).join(' ') + (w.length > 12 ? '...' : '');
  }

  DC.screen('chat', {
    route: /^#\/dream\/([^/]+)\/chat$/,
    title: 'chat.title',
    auth: 'user',
    render(el, params) {
      const id = params[0];
      let alive = true, dream = null, sending = false, crisis = false, extra = [];
      const offs = [];
      const refs = {};

      el.appendChild(h('div.dc-chat-wait', null, DC.ui.spinner()));

      // ix: the reply's place in the stored chat, so a Dream AI reply can be reported (Google Play AI-Generated Content policy).
      function reportBtn(m, ix) {
        if (m.role !== 'assistant' || ix == null || !m.t || !DC.ui.reportAi) return null;
        return h('button.dc-report-icon', { type: 'button', 'aria-label': DC.t('report.reply'), title: DC.t('report.reply'),
          onclick: () => DC.ui.reportAi({ dreamId: id, part: 'chat', index: ix, t: m.t }) }, DC.icon('flag', 13));
      }
      function bubble(m, pending, ix) {
        const me = m.role === 'user';
        return h('div.dc-chat-msg.' + (me ? 'me' : 'ai') + (pending ? '.pending' : ''), null,
          me ? null : h('span.dc-chat-av', { 'aria-hidden': 'true' }, DC.icon('brain', 16)),
          h('div.dc-chat-bubble', null,
            h('div.dc-chat-who', null, me ? T('you') : T('ai'), m.t ? h('span.dc-chat-time', null, DC.fmtDate(m.t, 'time')) : null, reportBtn(m, ix)),
            h('div.dc-chat-text', null, str(m.text))));
      }
      const typing = () => h('div.dc-chat-msg.ai.typing', { 'aria-label': T('thinking') }, h('span.dc-chat-av', null, DC.icon('brain', 16)),
        h('div.dc-chat-bubble', null, h('span.dc-chat-dots', null, h('i'), h('i'), h('i'))));

      function messages() { return (Array.isArray(dream.chat) ? dream.chat : []).concat(extra); }

      function renderThread() {
        if (!refs.thread) return;
        DC.clear(refs.thread);
        const list = messages();
        if (!list.length) refs.thread.appendChild(bubble({ role: 'assistant', text: T('welcome') }));
        const stored = Array.isArray(dream.chat) ? dream.chat.length : 0;
        list.forEach((m, i) => refs.thread.appendChild(bubble(m, false, i < stored ? i : null)));
        refs.crisis.classList.toggle('dc-hidden', !crisis);
        renderStarters();
      }
      function renderStarters() {
        if (!refs.starters) return;
        DC.clear(refs.starters);
        if (messages().length || sending) { refs.starters.classList.add('dc-hidden'); return; }
        let qs = (dream.analysis && Array.isArray(dream.analysis.followups) ? dream.analysis.followups : []).filter(Boolean).slice(0, 3);
        if (!qs.length) qs = [T('starter1'), T('starter2')];
        refs.starters.classList.remove('dc-hidden');
        DC.append(refs.starters, [h('div.dc-chat-try', null, T('try')), h('div.dc-chat-chips', null, qs.map(q => h('button.dc-chat-chip', { type: 'button', onclick: () => send(q) }, q)))]);
      }
      function renderLeft() {
        if (!refs.left) return;
        const a = DC.state.account, n = a && a.usage ? a.usage.chats_left : null;
        DC.clear(refs.left);
        if (n != null) DC.append(refs.left, [DC.icon('message-circle', 15), DC.tn('chat.left', n)]);
        refs.left.classList.toggle('dc-hidden', n == null);
      }
      function autosize() { const t = refs.input; if (!t) return; t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight + 2) + 'px'; syncSend(); }
      function syncSend() { if (refs.send) refs.send.disabled = sending || !refs.input.value.trim(); }
      function scrollEnd() { requestAnimationFrame(() => window.scrollTo(0, document.documentElement.scrollHeight)); }

      async function post(text) {
        try {
          return await DC.api.post('/dreams/' + encodeURIComponent(id) + '/chat', { text, lang: DC.lang() }, { timeout: 60000 });
        } catch (e) {
          // A dream saved before signing in may not have reached the server yet: send it, then ask again once.
          if (e.status === 404 && dream && dream.text) {
            await DC.api.put('/dreams/' + encodeURIComponent(id), DC.store.editable(dream));
            return DC.api.post('/dreams/' + encodeURIComponent(id) + '/chat', { text, lang: DC.lang() }, { timeout: 60000 });
          }
          throw e;
        }
      }

      async function send(raw) {
        const text = str(raw).trim();
        if (!text || sending) return;
        if (text.length > MAX) { DC.ui.toast(T('too_long'), { error: true }); return; }
        if (!DC.state.online || navigator.onLine === false) { DC.ui.toast(T('offline'), { error: true, ms: 4500 }); return; }
        sending = true;
        refs.input.value = ''; autosize();
        const mine = bubble({ role: 'user', text, t: Date.now() }, true), dots = typing();
        if (!messages().length) DC.clear(refs.thread);
        refs.thread.appendChild(mine); refs.thread.appendChild(dots);
        renderStarters(); scrollEnd();
        try {
          const r = await post(text);
          if (!alive) return;
          if (r && r.dream) { dream = (await DC.store.applyServer(r.dream)) || dream; extra = []; }
          else if (r && r.reply) extra = extra.concat([{ role: 'user', text, t: Date.now() }, { role: 'assistant', text: r.reply, t: Date.now() }]);
          if (r && r.usage && DC.state.account) DC.state.account.usage = Object.assign({}, DC.state.account.usage, r.usage);
          const sf = r && r.safety;
          if (sf === 'crisis' || (sf && sf.level === 'crisis')) crisis = true;
          sending = false;
          renderThread(); renderLeft(); scrollEnd();
          DC.auth.refreshAccount();
        } catch (e) {
          if (!alive) return;
          sending = false;
          mine.remove(); dots.remove();
          if (!messages().length) renderThread(); else renderStarters();
          refs.input.value = text; autosize();
          if (e.status === 402) { if (DC.ui.allowanceModal) DC.ui.allowanceModal('chat', e.body && e.body.usage); else DC.ui.error(e); }
          else if (e.status === 401) DC.go('#/auth?next=' + encodeURIComponent('#/dream/' + id + '/chat'));
          else if (e.status === 0) DC.ui.toast(e.error === 'timeout' ? T('timeout') : T('offline'), { error: true, ms: 4500 });
          else DC.ui.toast(T('error'), { error: true, ms: 4500 });
        } finally { sending = false; syncSend(); }
      }

      function build() {
        DC.clear(el);
        if (!dream || dream.deleted_at) {
          el.appendChild(DC.ui.empty({ icon: 'moon', title: DC.t('result.missing.title'), text: DC.t('result.missing.text'), action: { label: DC.t('result.missing.action'), onClick: () => DC.go('#/journal') } }));
          return;
        }
        const A = dream.analysis;
        refs.thread = h('div.dc-chat-thread', { 'aria-live': 'polite' });
        refs.starters = h('div.dc-chat-starters');
        refs.crisis = h('div.dc-chat-crisis.dc-hidden', null, DC.ui.crisisCard());
        refs.left = h('div.dc-chat-left');
        refs.input = h('textarea.dc-textarea.dc-chat-input', { rows: 1, maxlength: MAX, placeholder: T('placeholder'), 'aria-label': T('placeholder'),
          oninput: autosize,
          onkeydown: e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !('ontouchstart' in window)) { e.preventDefault(); send(refs.input.value); } } });
        refs.send = h('button.dc-chat-send', { type: 'button', 'aria-label': T('send'), title: T('send'), disabled: true, onclick: () => send(refs.input.value) }, DC.icon('send', 20));
        DC.append(el, [
          h('a.dc-chat-back', { href: '#/dream/' + encodeURIComponent(id) }, DC.icon('arrow-left', 16), T('back')),
          DC.ui.pageTitle({ icon: 'message-circle', title: T('title') }),
          h('div.dc-card.dc-chat-about', null,
            h('div.dc-chat-about-t', null, T('about')),
            h('div.dc-chat-about-q', null, '“' + firstWords(dream) + '”'),
            h('p.dc-chat-intro', null, T('intro')),
            refs.left),
          A && A.safety && A.safety.level === 'crisis' ? h('div.dc-chat-crisis', null, DC.ui.crisisCard()) : null,
          A ? null : h('div.dc-callout.dc-chat-noan', null, h('p', null, T('no_analysis')),
            h('button.dc-btn.small.auto', { type: 'button', onclick: () => (DC.dreamFlow ? DC.dreamFlow.analyze(id) : DC.go('#/dream/' + encodeURIComponent(id))) }, DC.icon('brain', 16), T('analyze'))),
          refs.thread,
          refs.crisis,
          refs.starters,
          h('div.dc-chat-composer', null, refs.input, refs.send)
        ]);
        renderThread(); renderLeft();
        if (messages().length) scrollEnd();
      }

      DC.store.getDream(id).then(d => { if (!alive) return; dream = d; build(); });
      offs.push(DC.on('account', () => renderLeft()));
      offs.push(DC.on('dreams', e => {
        if (!alive || !dream || sending || !e || (e.id && e.id !== id)) return;
        DC.store.getDream(id).then(d => {
          if (!alive || !d || sending) return;
          const before = (dream.chat || []).length, deletedChange = !!d.deleted_at !== !!dream.deleted_at;
          dream = d;
          if (deletedChange) build(); else if ((d.chat || []).length !== before) { extra = []; renderThread(); }
        });
      }));
      return () => { alive = false; offs.forEach(f => f()); };
    }
  });
})();

</script>
<script>/* web/src/screens/community.js */
/* Dream Community (S13): Feed, Share, Chat, Trends and Map, with the first post gate (community name and
   guidelines), reporting, blocking and moderator removal. No seed content: every list has a designed empty state.
   Strings: i18n/<lang>/community.json. Styles: styles/screens/community.css (classes start with dc-cm-). */
(function () {
  'use strict';
  const DC = window.DC, h = DC.h;
  const T = (k, v) => DC.t('community.' + k, v);
  const TN = (k, n) => DC.tn('community.' + k, n);

  const TABS = [['feed', 'share'], ['share', 'heart'], ['chat', 'message-circle'], ['trends', 'trending-up'], ['map', 'map']];
  const PAGE = 20, MAX_TEXT = 4000, POLL_MS = 10000;
  const HANDLE_RE = /^[A-Za-z0-9_]{3,24}$/;
  const REASONS = ['spam', 'harassment', 'sexual', 'hate', 'pii', 'self_harm', 'other'];
  const ROOM_ICONS = { 'welcome': 'sun', 'lucid-dreaming': 'eye', 'recurring-dreams': 'refresh', 'nightmares-support': 'shield', 'symbols-meanings': 'sparkles', 'dream-recall': 'notebook' };
  // Colours of the public dream types (content/README.md), used until the types dictionary has loaded.
  const TYPE_COLORS = {
    normal: '#7A9CFF', lucid: '#3CF07A', semi_lucid: '#2ED3A0', hypnagogic: '#9ED8FF', joyful: '#FFC21A', anxiety: '#FF5A2A',
    nightmare: '#FF1E5A', sexual: '#FF3FC0', grief: '#7E7BFF', comfort: '#8FD3FF', recurring: '#FFA020', progressive: '#9BE01A',
    fragmented: '#E6FF1A', epic: '#FF8A1A', mundane: '#C8CCD8', prophetic: '#FFF01A', healing: '#8CF0A0', problem_solving: '#FFE6C8',
    visitation: '#C77DFF', archetypal: '#FF9A5A', spiritual: '#FFFFFF'
  };
  const SVG_NS = 'http://www.w3.org/2000/svg';

  let S = null;          // state of the open screen (one at a time)
  let menuClose = null;  // closes the open "..." menu

  // ---------- small helpers ----------
  const acct = () => DC.state.account;
  const isMod = () => { const a = acct(); return !!(a && (a.role === 'moderator' || a.role === 'admin')); };
  const authorOf = x => (x && (x.user_id || x.author_id)) || null;
  // The author id decides when the server sends one; the server's own `mine` flag otherwise.
  const isMine = x => { if (!x || !acct()) return false; const a = authorOf(x); return a ? a === acct().id : !!x.mine; };
  const termsKey = () => 'dc.community.terms.' + (acct() ? acct().id : 'guest');
  const termsOk = () => { const a = acct(); return !!(a && (a.community_terms_at || DC.ls.get(termsKey(), null))); };
  const live = my => !!(my && S === my && my.alive);
  const pretty = id => { const s = String(id || '').replace(/[_-]+/g, ' ').trim(); return s ? s[0].toUpperCase() + s.slice(1) : ''; };
  const initials = handle => (String(handle || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 2) || '?').toUpperCase();
  const goSignIn = () => DC.go('#/auth?next=' + encodeURIComponent('#/community'));
  const spinnerBox = () => h('div.dc-cm-loading', null, DC.ui.spinner());

  function autoTitle(text) {
    const w = String(text || '').trim().split(/\s+/).filter(Boolean);
    const t = w.slice(0, 5).join(' ');
    return (w.length > 5 ? t + '...' : t).slice(0, 80);
  }
  function typeInfo(id, label) {
    const t = S && S.types && S.types[id];
    return { id, name: (t && t.name) || label || pretty(id), color: (t && t.color) || TYPE_COLORS[id] || '#2EE6C8' };
  }
  // Only types the public dictionary knows are shown or shared.
  const publicType = id => !!(id && ((S && S.types && S.types[id]) || TYPE_COLORS[id]));
  async function loadTypes() {
    const map = {};
    try { ((await DC.data.types()) || []).forEach(t => { if (t && t.id && !t.hidden) map[t.id] = t; }); } catch (e) { /* dictionary not built yet: fallback colours */ }
    return map;
  }
  async function copyText(s) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(s); return true; } } catch (e) { /* try the old way */ }
    try {
      const ta = h('textarea', { readonly: '', style: { position: 'fixed', top: '-1000px', opacity: '0' } }, s);
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return !!ok;
    } catch (e) { return false; }
  }
  function errorBox(e, retry) {
    return h('div.dc-cm-errorbox', null,
      DC.ui.status('warn', T('load_error'), DC.api.message(e), 'alert-triangle'),
      h('button.dc-btn.outline.small.auto', { type: 'button', onclick: retry }, DC.icon('refresh', 16), T('retry')));
  }
  function stopPoll() { if (S && S.poll) { clearInterval(S.poll); S.poll = null; } }
  function closeMenu() { if (menuClose) menuClose(); }

  // ---------- "..." menu (fixed position so scrolling boxes never clip it) ----------
  function moreMenu(items) {
    const wrap = h('div.dc-cm-more');
    const btn = h('button.dc-iconbtn.dc-cm-more-btn', { type: 'button', 'aria-label': T('menu.label'), 'aria-haspopup': 'true', 'aria-expanded': 'false' }, DC.icon('more', 20));
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const wasOpen = btn.getAttribute('aria-expanded') === 'true';
      closeMenu();
      if (wasOpen) return;
      const menu = h('div.dc-cm-menu', { role: 'menu' }, items.map(it =>
        h('button' + (it.danger ? '.danger' : ''), { type: 'button', role: 'menuitem', onclick: ev => { ev.stopPropagation(); closeMenu(); it.run(); } }, DC.icon(it.icon, 17), h('span', null, it.label))));
      document.body.appendChild(menu);
      const r = btn.getBoundingClientRect(), mh = menu.offsetHeight;
      menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
      menu.style.top = (r.bottom + 4 + mh > window.innerHeight - 8 ? Math.max(8, r.top - mh - 4) : r.bottom + 4) + 'px';
      btn.setAttribute('aria-expanded', 'true');
      const outside = ev => { if (!menu.contains(ev.target) && !wrap.contains(ev.target)) closeMenu(); };
      const esc = ev => { if (ev.key === 'Escape') { closeMenu(); btn.focus(); } };
      const away = () => closeMenu();
      document.addEventListener('click', outside, true);
      document.addEventListener('keydown', esc);
      window.addEventListener('scroll', away, true);
      window.addEventListener('resize', away);
      menuClose = () => {
        menu.remove(); btn.setAttribute('aria-expanded', 'false');
        document.removeEventListener('click', outside, true); document.removeEventListener('keydown', esc);
        window.removeEventListener('scroll', away, true); window.removeEventListener('resize', away);
        menuClose = null;
      };
      const first = menu.querySelector('button');
      if (first) first.focus({ preventScroll: true });
    });
    wrap.appendChild(btn);
    return wrap;
  }
  // Report and Block for other people's items, Delete for your own posts, Remove for moderators.
  function itemMenu(kind, item, onGone) {
    const items = [];
    if (isMine(item)) {
      if (kind === 'post') items.push({ icon: 'trash', label: T('menu.delete'), danger: true, run: () => deletePost(item, onGone) });
    } else {
      items.push({ icon: 'flag', label: T('menu.report'), run: () => report(kind, item.id) });
      items.push({ icon: 'ban', label: T('menu.block'), run: () => block(authorOf(item), item.handle) });
      if (isMod()) items.push({ icon: 'shield', label: T('menu.remove'), danger: true, run: () => modRemove(kind, item, onGone) });
    }
    return items.length ? moreMenu(items) : null;
  }

  // ---------- sign in, guidelines, community name ----------
  function needSignIn() {
    DC.ui.modal({
      title: T('signin.title'), icon: 'users', body: T('signin.text'),
      actions: [{ label: DC.t('core.signin'), onClick: c => { c(); goSignIn(); } }, { label: DC.t('core.cancel'), kind: 'outline' }]
    });
  }
  function guidelinesContent() {
    const rules = [['ban', 'clean'], ['lock', 'private'], ['heart', 'kind'], ['x', 'links'], ['shield', 'support']];
    return h('div.dc-cm-guide', null,
      h('p', null, T('guidelines.intro')),
      h('ul.dc-cm-rules', null, rules.map(([ic, k]) => h('li', null, DC.icon(ic, 18), h('span', null, T('guidelines.rules.' + k))))),
      h('h4.dc-cm-guide-h', null, DC.icon('eye', 17), T('guidelines.mod_title')),
      h('p.dc-cm-small', null, T('guidelines.mod_text')));
  }
  function showGuidelines() {
    DC.ui.modal({ title: T('guidelines.title'), icon: 'shield', body: guidelinesContent(), actions: [{ label: DC.t('core.ok') }] });
  }
  function suggestions() {
    const a = T('handle.words_a').split(',').map(s => s.trim()).filter(Boolean);
    const b = T('handle.words_b').split(',').map(s => s.trim()).filter(Boolean);
    const out = new Set();
    for (let i = 0; i < 20 && out.size < 3 && a.length && b.length; i++) {
      const s = a[Math.floor(Math.random() * a.length)] + b[Math.floor(Math.random() * b.length)] + (10 + Math.floor(Math.random() * 90));
      if (HANDLE_RE.test(s)) out.add(s);
    }
    return Array.from(out);
  }
  // The first post gate: 'handle' (community name, then guidelines when not yet agreed) or 'terms' (guidelines only).
  function gate(start) {
    return new Promise(resolve => {
      let settled = false;
      const body = h('div.dc-cm-gate');
      const m = DC.ui.modal({ title: '.', body, onClose: () => { if (!settled) { settled = true; resolve(false); } } });
      const panel = m.el.querySelector('.dc-modal');
      const titleEl = panel.querySelector('h3');
      const finish = () => { settled = true; m.close(); resolve(true); };
      const total = start === 'handle' && !termsOk() ? 2 : 1;
      const stepTag = n => (total > 1 ? h('div.dc-cm-steptag', null, T('gate.step', { n, total })) : null);
      const cancelBtn = () => h('button.dc-btn.outline', { type: 'button', onclick: () => m.close() }, DC.t('core.cancel'));
      if (start === 'handle') handleStep(); else termsStep(1);

      function handleStep() {
        titleEl.textContent = T('handle.title');
        const input = h('input.dc-input', { type: 'text', maxlength: '24', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: T('handle.ph'), 'aria-label': T('handle.label') });
        const err = h('div.dc-error', { role: 'alert' });
        const btn = h('button.dc-btn', { type: 'button' }, DC.t('core.continue'));
        const submit = async () => {
          const v = input.value.trim();
          if (!HANDLE_RE.test(v)) { err.textContent = T('handle.invalid'); input.focus(); return; }
          btn.disabled = true; err.textContent = '';
          try {
            const r = await DC.api.post('/community/handle', { handle: v });
            const a = r && r.account ? r.account : r;
            const next = a && a.id ? a : Object.assign({}, acct(), { handle: (r && r.handle) || v });
            DC.ls.set('dc.account', next);
            DC.auth.setAccount(next);
            if (termsOk()) finish(); else termsStep(2);

  // Publishes through send(extra) and walks the user through the gate whenever the server (or the account) asks for it.
  async function publish(send, msg) {
    if (!acct()) { needSignIn(); return null; }

    if (!acct().handle) { if (!(await gate('handle'))) return null; } else if (!termsOk()) { if (!(await gate('terms'))) return null; }
    for (let i = 0; i < 3; i++) {

        if (e.error === 'suspended') { msg.error(suspendedText(e)); return null; }
        if (e.error === 'moderation') { msg.error(e.message || T('err.moderation')); return null; }

      if (!index && !pct && you != null && you > 1.5) you = you / 100;
      const prop = v => (v == null ? null : (pct ? v / 100 : v));
      let hv = pick(c, ['h', 'effect', 'effect_size', 'cohen_h', 'cohensH']);
      if (hv == null && you != null && norm != null) hv = cohenH(prop(you), prop(norm));
      if (hv != null && you != null && norm != null && you !== norm) hv = Math.abs(hv) * Math.sign(you - norm);
      return { id: e.id, label: c && c['label_' + DC.lang()] ? c['label_' + DC.lang()] : labelOf(e), desc: descOf(e) || (c ? localized(c.description) : ''), you, norm, h: hv, index, pctScale: pct };
    });
    let summary = [];
    try {
      const s = typeof mod.summary !== 'function' ? null
        : (cmp ? mod.summary(cmp, DC.lang()) : mod.summary(ind, DC.lang(), { norms, sex: NORM_SEX[set] || 'both' }));
      summary = (Array.isArray(s) ? s : (s ? [s] : [])).map(x => (typeof x === 'string' ? x : localized(x && (x.text || x.message || x)))).filter(Boolean);
    } catch (e) { summary = []; }
    return { rows, summary, reliable: Number(mod.reliableDreams) || 0 };
  }
  function fmtVal(row, v) {
    if (v == null) return T('sci.na');
    if (row.index) return v.toFixed(2);
    return Math.round(row.pctScale ? v : v * 100) + '%';
  }
  function effect(row) {
    const hv = row.h;
    if (hv == null || !isFinite(hv)) return { cls: 'na', word: T('sci.na') };
    const a = Math.abs(hv);
    if (a < 0.2) return { cls: 'similar', word: T('sci.effect.similar') };
    const lvl = a < 0.5 ? 1 : (a < 0.8 ? 2 : 3);
    return { cls: hv > 0 ? 'more' : 'less', word: T('sci.effect.' + (hv > 0 ? 'more' : 'less') + lvl) };
  }

  // ---------- charts (plain SVG, drawn at the real width so text stays legible) ----------
  function timelineSvg(w, rows, t0, t1, aria) {
    if (t1 - t0 < 2 * DAY) { t0 -= 3 * DAY; t1 += 3 * DAY; }
    const LW = Math.min(160, Math.max(104, Math.round(w * 0.4)));
    const x0 = LW + 14, x1 = w - 8, RH = 32, top = 2;
    const X = t => x0 + (t - t0) / (t1 - t0) * (x1 - x0);
    const ay = top + rows.length * RH + 4, H = ay + 24;
    const maxCh = Math.max(6, Math.floor((LW - 26) / 7.2));
    const parts = [];
    rows.forEach((r, i) => {
      const y = top + i * RH + RH / 2;
      parts.push(S('line', { x1: x0, x2: x1, y1: y, y2: y, class: 'guide' }));
      const lines = wrap2(r.label, maxCh);
      parts.push(lines.length > 1
        ? S('text', { x: 0, y: y - 2, class: 'lbl two' }, S('tspan', { x: 0 }, lines[0]), S('tspan', { x: 0, dy: 14 }, lines[1]))
        : S('text', { x: 0, y: y + 4.5, class: 'lbl' }, lines[0]));
      parts.push(S('text', { x: LW, y: y + 4.5, 'text-anchor': 'end', class: 'cnt' }, String(r.points.length)));
      r.points.forEach(p => parts.push(S('circle', { cx: X(p.t).toFixed(1), cy: y, r: 6, fill: p.color, class: 'dot' }, S('title', null, p.title))));
    });
    parts.push(S('line', { x1: x0, x2: x1, y1: ay, y2: ay, class: 'axis' }));
    const ticks = w < 440 ? [t0, t1] : [t0, (t0 + t1) / 2, t1];
    ticks.forEach((t, i) => parts.push(S('text', { x: X(t), y: ay + 17, 'text-anchor': i === 0 ? 'start' : (i === ticks.length - 1 ? 'end' : 'middle'), class: 'ax' }, shortDate(t))));
    return S('svg', { width: w, height: H, viewBox: '0 0 ' + w + ' ' + H, role: 'img', 'aria-label': aria, class: 'dc-dash-svg' }, S('title', null, aria), parts);
  }
  // A label on one line, or split at a space onto two (the second clipped if still too long).
  function wrap2(label, max) {
    const s = String(label || '');
    if (s.length <= max) return [s];
    const cut = s.lastIndexOf(' ', max);
    if (cut <= 0) return [clip(s, max)];
    return [s.slice(0, cut), clip(s.slice(cut + 1), max)];
  }
  function barsSvg(w, items, aria) {
    const RH = 42, H = items.length * RH;
    const max = Math.max(1, ...items.map(i => i.count));
    const bw = Math.max(40, w - 36);
    const parts = items.map((it, i) => {
      const y = i * RH;
      return S('g', null,
        S('circle', { cx: 5, cy: y + 11, r: 5, fill: it.color }),
        S('text', { x: 16, y: y + 15.5, class: 'lbl' }, clip(it.label, Math.floor((w - 20) / 7.4))),
        S('rect', { x: 0, y: y + 24, width: bw, height: 10, rx: 5, class: 'track' }),
        S('rect', { x: 0, y: y + 24, width: Math.max(10, it.count / max * bw).toFixed(1), height: 10, rx: 5, fill: it.color }, S('title', null, it.label + ': ' + it.count)),
        S('text', { x: w, y: y + 33.5, 'text-anchor': 'end', class: 'cnt' }, String(it.count)));
    });
    return S('svg', { width: w, height: H, viewBox: '0 0 ' + w + ' ' + H, role: 'img', 'aria-label': aria, class: 'dc-dash-svg' }, S('title', null, aria), parts);
  }
  function stackedSvg(w, weeks, aria) {
    const H = 196, padL = 28, padR = 4, padT = 10, padB = 30;
    const total = wk => TONES.reduce((s, k) => s + (wk.counts[k] || 0), 0);
    const maxV = Math.max(1, ...weeks.map(total));
    const step = maxV <= 4 ? 1 : Math.ceil(maxV / 4);
    const yMax = step * Math.ceil(maxV / step);
    const plotW = w - padL - padR, plotH = H - padT - padB;
    const slot = plotW / weeks.length, bw = Math.min(30, slot * 0.6);
    const Y = v => padT + plotH - v / yMax * plotH;
    const parts = [];
    for (let v = 0; v <= yMax; v += step) {
      parts.push(S('line', { x1: padL, x2: w - padR, y1: Y(v), y2: Y(v), class: v ? 'grid' : 'axis' }));
      parts.push(S('text', { x: padL - 8, y: Y(v) + 4, 'text-anchor': 'end', class: 'ax' }, String(v)));
    }
    const every = slot < 44 ? Math.ceil(44 / slot) : 1;
    weeks.forEach((wk, i) => {
      const x = padL + slot * i + (slot - bw) / 2;
      let acc = 0;
      const tip = T('pat.week_of', { date: shortDate(wk.t) }) + ': ' + TONES.filter(k => wk.counts[k]).map(k => wk.counts[k] + ' ' + T('pat.tone.' + k).toLowerCase()).join(', ');
      const segs = [];
      TONES.forEach(k => {
        const c = wk.counts[k] || 0;
        if (!c) return;
        const y1 = Y(acc), y2 = Y(acc + c);
        segs.push(S('rect', { x: x.toFixed(1), y: (y2 + 0.5).toFixed(1), width: bw.toFixed(1), height: Math.max(1, y1 - y2 - 1).toFixed(1), rx: 2.5, fill: TONE_COLORS[k] }));
        acc += c;
      });
      parts.push(S('g', null, S('title', null, tip), segs));
      if ((weeks.length - 1 - i) % every === 0) parts.push(S('text', { x: (x + bw / 2).toFixed(1), y: H - 9, 'text-anchor': 'middle', class: 'ax' }, shortDate(wk.t)));
    });
    return S('svg', { width: w, height: H, viewBox: '0 0 ' + w + ' ' + H, role: 'img', 'aria-label': aria, class: 'dc-dash-svg' }, S('title', null, aria), parts);
  }
  const legend = items => h('div.dc-dash-legend', null, items.map(it => h('span', null, h('i', { style: { background: it[0] } }), it[1])));

  // ---------- the screen ----------
  DC.screen('dashboard', {
    route: '#/dashboard',
    title: 'dashboard.title',
    render(el, params, query) {
      if (query && TABS.indexOf(query.tab) >= 0) view.tab = query.tab;
      let alive = true, ctx = null, charts = [], sciToken = 0, lastW = 0;
      const offs = [];
      const body = h('div.dc-dash-body', null, h('div.dc-dash-loading', null, DC.ui.spinner(true), T('loading')));
      const tabsEl = DC.ui.tabs(TABS.map(id => ({ id, label: T('tabs.' + id) })), view.tab, id => showTab(id, false));
      DC.append(el, [DC.ui.pageTitle({ title: T('title'), subtitle: T('subtitle') }), DC.slotEl('home', {}), tabsEl, body]);
      scrollTabIntoView();

      function scrollTabIntoView() {
        const b = tabsEl.querySelector('.dc-tab.active');
        if (!b || tabsEl.scrollWidth <= tabsEl.clientWidth) return;
        const left = b.getBoundingClientRect().left - tabsEl.getBoundingClientRect().left + tabsEl.scrollLeft;
        tabsEl.scrollLeft = Math.max(0, left - (tabsEl.clientWidth - b.offsetWidth) / 2);
      }
      function showTab(id, scroll) {
        view.tab = id;
        tabsEl.set(id);
        scrollTabIntoView();
        try { history.replaceState(null, '', '#/dashboard' + (id === 'overview' ? '' : '?tab=' + id)); } catch (e) { /* ignore */ }
        draw();
        if (scroll) window.scrollTo(0, Math.max(0, tabsEl.getBoundingClientRect().top + window.scrollY - 80));
      }

      async function load() {
        const r = await Promise.all([
          DC.store.allDreams(),
          DC.data.types().catch(() => []),
          DC.data.symbols().catch(() => []),
          DC.data.activities().catch(() => [])
        ]);
        const types = {}, symbols = {};
        (Array.isArray(r[1]) ? r[1] : []).forEach(t => { if (t && t.id) types[t.id] = t; });
        (Array.isArray(r[2]) ? r[2] : []).forEach(s => { if (s && s.id) symbols[s.id] = s; });
        const c = { dreams: r[0], types, symbols, activities: Array.isArray(r[3]) ? r[3] : [] };
        c.m = buildModel(c.dreams, c);
        return c;
      }
      async function refresh() {
        try { const c = await load(); if (!alive) return; ctx = c; draw(); }
        catch (e) { console.error('[dashboard]', e); }
      }

      // Charts register a redraw; they are drawn once the body is in the page and again when its width changes.
      function addChart(holder, drawFn) {
        let w0 = 0;
        const redraw = () => {
          const w = Math.floor(holder.clientWidth);
          if (!w || w === w0) return;
          w0 = w;
          DC.clear(holder);
          holder.appendChild(drawFn(w));
        };
        charts.push(redraw);
      }
      const ro = window.ResizeObserver ? new ResizeObserver(DC.debounce(() => {
        const w = body.clientWidth;
        if (w && w !== lastW) { lastW = w; charts.forEach(fn => fn()); }
      }, 100)) : null;

      function draw() {

        charts = [];
        sciToken++;
        const frag = h('div.dc-dash-tab.dc-dash-' + view.tab);
        if (view.tab === 'patterns') patternsTab(frag);
        else if (view.tab === 'science') scienceTab(frag);
        else overviewTab(frag);
        DC.clear(body);
        body.appendChild(frag);
        lastW = body.clientWidth;
        charts.forEach(fn => fn());
      }

      // ================= Overview =================
      function overviewTab(box) {
        const dreams = ctx.dreams;
        if (!DC.signedIn() && dreams.length) {
          box.appendChild(h('div.dc-banner.dc-dash-guest', null, DC.icon('smartphone', 18),
            h('div', null, T('guest'), ' ', h('a', { href: '#/auth' }, T('guest_action')))));
        }
        if (!dreams.length) {
          DC.append(box, [
            DC.ui.empty({ icon: 'moon', title: T('empty.title'), text: T('empty.text'), action: { label: T('empty.action'), onClick: () => DC.go('#/analyze') } }),
            calendarHolder(),
            h('div.dc-card.dc-dash-dictcard', null, dictButtons()),
            recsCard()
          ]);
          return;
        }
        DC.append(box, [calendarHolder(), statsRow(), recentCard(), patternCard(), recsCard()]);
      }

      function calendarHolder() {
        const holder = h('div.dc-dash-calwrap');
        const rebuild = () => { DC.clear(holder); holder.appendChild(calendarCard(rebuild)); };
        rebuild();
        return holder;
      }
      function calendarCard(rebuild) {
        const byDay = new Map();
        ctx.dreams.forEach(d => { const k = dayOf(d); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(d); });
        const now = new Date();
        if (!view.month) {
          let mk = isoDay(now).slice(0, 7);
          const keys = Array.from(byDay.keys()).sort();
          if (keys.length && !keys.some(k => k.slice(0, 7) === mk)) mk = keys[keys.length - 1].slice(0, 7);
          view.month = mk;
        }
        const p = view.month.split('-').map(Number), Y = p[0], M = p[1] - 1;
        const fd = firstDay(), first = new Date(Y, M, 1);
        const lead = (first.getDay() - fd + 7) % 7, daysIn = new Date(Y, M + 1, 0).getDate();
        const cells = Math.ceil((lead + daysIn) / 7) * 7, today = isoDay(now);
        const wd = T('cal.weekdays').split(',');
        const shift = n => { const d = new Date(Y, M + n, 1); view.month = isoDay(d).slice(0, 7); view.day = null; rebuild(); };
        const grid = [];
        for (let i = 0; i < 7; i++) grid.push(h('div.dc-dash-wd', null, wd[(i + fd) % 7] || ''));
        for (let i = 0; i < cells; i++) {
          const date = new Date(Y, M, 1 - lead + i), k = isoDay(date), out = date.getMonth() !== M;
          const list = out ? null : byDay.get(k);
          const cls = '.dc-dash-day' + (out ? '.out' : '') + (list ? '.has' : '') + (list && list.length > 1 ? '.multi' : '') + (k === today ? '.today' : '') + (list && view.day === k ? '.sel' : '');
          if (list) {
            grid.push(h('button' + cls, {
              type: 'button', 'aria-pressed': String(view.day === k),
              'aria-label': DC.fmtDate(k, 'long') + ', ' + TN('n_dreams', list.length),
              onclick: () => { view.day = view.day === k ? null : k; rebuild(); }
            }, h('span.n', null, String(date.getDate())), list.length > 1 ? h('span.mc', null, h('i'), h('sup', null, String(list.length))) : null));
          } else grid.push(h('div' + cls, null, h('span.n', null, String(date.getDate()))));
        }
        const sel = view.day && view.day.slice(0, 7) === view.month ? byDay.get(view.day) : null;
        return h('div.dc-card.dc-dash-cal', null,
          h('div.dc-dash-head', null, h('div.dc-card-title', null, DC.icon('calendar', 20), T('cal.title')), h('span.dc-dash-count', null, TN('cal.count', ctx.dreams.length))),
          h('div.dc-dash-calleg', null,
            h('span', null, h('i.sq'), T('cal.legend_days')),
            h('span', null, h('i.dt'), T('cal.legend_multi'))),
          h('p.dc-dash-hint', null, T('cal.hint')),
          h('div.dc-dash-calnav', null,
            h('button.dc-dash-navbtn', { type: 'button', 'aria-label': T('cal.prev'), onclick: () => shift(-1) }, DC.icon('chevron-left', 18)),
            h('div.dc-dash-month', { 'aria-live': 'polite' }, cap(DC.fmtDate(first, 'month'))),
            h('button.dc-dash-navbtn', { type: 'button', 'aria-label': T('cal.next'), onclick: () => shift(1) }, DC.icon('chevron-right', 18))),
          h('div.dc-dash-grid', null, grid),

      }

      // ---- Personalized Recommendations: rule-based, from the journal ----
      function openActivity(re, typeId) {

        const ti = typeInfo(ctx, typeId);

      function recommendations() {
        const m = ctx.m, out = [];
        const add = (priority, icon, color, text, action) => out.push({ priority, icon, color, text, action });
        if (!ctx.dreams.length) {
          add('high', 'moon', '#2EE6C8', T('rec.first_dream'), () => DC.go('#/analyze'));

        }
        const nm = m.typeCount.get('nightmare') || 0;
