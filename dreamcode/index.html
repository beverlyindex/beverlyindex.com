.dc-screen-home .dc-home-plan.plus{border-color:#3BE37A;box-shadow:0 0 20px rgba(59,227,122,.14)}
.dc-screen-home .dc-home-plan-badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.dc-screen-home .dc-home-plan-badge.popular{background:var(--cyan);color:var(--on-cyan)}
.dc-screen-home .dc-home-plan-badge.best{background:#3BE37A;color:#05240F}
.dc-screen-home .dc-home-plan h3{font-size:21px;color:var(--text);margin-bottom:8px}
.dc-screen-home .dc-home-plan-price{font-family:var(--sans);font-weight:700;font-size:34px;color:var(--cyan);line-height:1.1}
.dc-screen-home .dc-home-plan-period{font-size:14px;color:var(--muted);margin-top:2px}
.dc-screen-home .dc-home-plan-save{font-size:14px;color:#3BE37A;font-weight:600;margin-top:6px}
.dc-screen-home .dc-home-plan-alt{font-size:13px;color:var(--dim);margin-top:2px}
.dc-screen-home .dc-home-plan-feats{list-style:none;padding:0;margin:16px 0 18px;text-align:left}
.dc-screen-home .dc-home-plan-feats li{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#D5DAE3;margin:8px 0}
.dc-screen-home .dc-home-plan-feats li svg{color:#3BE37A;flex:none;margin-top:3px}
.dc-screen-home .dc-home-plan>.dc-btn{margin-top:auto}
.dc-screen-home .dc-home-plan-current[disabled]{background:rgba(0,0,0,.25);border-color:#3A4152;color:var(--muted);cursor:default}
.dc-screen-home .dc-home-allplans{margin-top:4px}

.dc-screen-home .dc-home-brand{text-align:center;margin:40px 0 0}
.dc-screen-home .dc-home-brand img{display:block;width:170px;height:auto;margin:0 auto -8px;filter:drop-shadow(0 0 14px rgba(80,160,255,.25))}
.dc-screen-home .dc-home-brand p{font-family:var(--serif);font-size:14px;color:var(--muted);margin:0}

@media (min-width:700px){
  .dc-screen-home .dc-home-features{grid-template-columns:repeat(3,1fr)}
  .dc-screen-home .dc-home-plans{grid-template-columns:repeat(3,1fr);gap:14px}
  .dc-screen-home .dc-home-plan{padding:28px 14px 16px}
  .dc-screen-home .dc-home-plan-feats li{font-size:14px}
  .dc-screen-home .dc-home-plan>.dc-btn{font-size:15px;padding:10px 8px}
  .dc-screen-home .dc-home-allplans{max-width:360px;display:flex;margin-left:auto;margin-right:auto}
}
.dc-screen-home .dc-home-plan-badge svg{flex:none;width:14px;height:14px;max-width:none}

/* journal.css */
/* Dream Journal (S7). In-page rules are scoped to .dc-screen-journal; elements outside <main>
   (modals, the Undo toast button, the print view) use the dc-journal- prefix. */

/* ---------- guest banner ---------- */
.dc-screen-journal .dc-journal-guest{align-items:center;flex-wrap:wrap;margin:0 0 16px}
.dc-screen-journal .dc-journal-guest>svg{color:#9DB8FF;flex:none}
.dc-screen-journal .dc-journal-guest>span{flex:1 1 180px;color:#D6E2FF;line-height:1.45}
.dc-screen-journal .dc-journal-guest .dc-btn{flex:none;margin-left:auto}

/* ---------- filter card ---------- */
.dc-screen-journal .dc-journal-filters{margin-bottom:18px}
.dc-screen-journal .dc-journal-searchrow{display:flex;gap:8px;align-items:stretch}
.dc-screen-journal .dc-journal-searchrow .dc-field-icon{flex:1;min-width:0}
.dc-screen-journal .dc-journal-searchrow input[type=search]::-webkit-search-cancel-button{filter:invert(.6)}
.dc-screen-journal .dc-journal-menubtn{flex:none;width:48px;border:1px solid #2E3546;background:var(--input);border-radius:var(--radius-sm);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.dc-screen-journal .dc-journal-menubtn:hover{border-color:var(--teal)}
.dc-screen-journal .dc-journal-selects{display:grid;gap:10px;margin-top:10px}
.dc-screen-journal .dc-journal-selects .dc-select{padding-top:11px;padding-bottom:11px}
.dc-screen-journal .dc-journal-count{margin:14px 0 0;color:var(--muted);font-size:14.5px}
@media (min-width:640px){.dc-screen-journal .dc-journal-selects{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ---------- entry card ---------- */
.dc-screen-journal .dc-journal-list{overflow-anchor:auto}
.dc-screen-journal .dc-journal-entry{scroll-margin-top:calc(var(--header-h) + 12px);padding:16px 16px 14px}
.dc-screen-journal .dc-journal-entry+.dc-journal-entry{margin-top:16px}
.dc-screen-journal .dc-journal-entry.open{border-color:rgba(46,230,200,.35);box-shadow:var(--glow-box)}
.dc-screen-journal .dc-journal-head{display:flex;align-items:flex-start;gap:10px}
.dc-screen-journal .dc-journal-head .dc-badge-num{border:1px solid rgba(46,230,200,.35);font-size:13.5px}
.dc-screen-journal .dc-journal-when{display:flex;gap:6px;align-items:flex-start;flex:1;min-width:0;padding-top:2px}
.dc-screen-journal .dc-journal-when>svg{color:var(--teal);flex:none;margin-top:2px}
.dc-screen-journal .dc-journal-when .d{font-weight:600;font-size:14.5px;line-height:1.3;color:var(--text)}
.dc-screen-journal .dc-journal-when .t{color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px}
.dc-screen-journal .dc-journal-actions{display:flex;flex:none;gap:2px;margin:-2px -6px 0 0}
.dc-screen-journal .dc-journal-act{background:none;border:0;color:var(--text);display:inline-flex;align-items:center;gap:5px;padding:7px 7px;border-radius:8px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.dc-screen-journal .dc-journal-act svg{color:var(--teal);flex:none}
.dc-screen-journal .dc-journal-act:hover,.dc-screen-journal .dc-journal-act:active{background:rgba(255,255,255,.08)}
@media (max-width:400px){
  .dc-screen-journal .dc-journal-entry{padding:14px 12px 12px}
  .dc-screen-journal .dc-journal-head{gap:8px}
  .dc-screen-journal .dc-journal-when{gap:5px}
  .dc-screen-journal .dc-journal-when .d{font-size:14px}
  .dc-screen-journal .dc-journal-actions{margin-right:-4px}
  .dc-screen-journal .dc-journal-act{padding:6px 5px;font-size:13px;gap:4px}
  .dc-screen-journal .dc-journal-act svg{width:15px;height:15px}
}
.dc-screen-journal .dc-journal-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 2px}
.dc-screen-journal .dc-journal-tags .dc-sync{margin-left:auto;padding-left:4px}
.dc-screen-journal .dc-journal-type{gap:6px}
.dc-screen-journal .dc-journal-tdot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 4px rgba(255,255,255,.25)}
.dc-screen-journal .dc-journal-title{font-size:19px;color:var(--text);text-shadow:var(--glow-title);margin:12px 0 0;overflow-wrap:anywhere}
.dc-screen-journal .dc-journal-label{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:700;font-size:16.5px;color:var(--text);text-shadow:var(--glow-title);margin:16px 0 8px}
.dc-screen-journal .dc-journal-label svg{color:var(--teal);flex:none}
.dc-screen-journal .dc-journal-quote{margin:0;padding:0 0 0 14px;white-space:pre-line;font-size:16.5px;line-height:1.55;overflow-wrap:anywhere}
.dc-screen-journal .dc-journal-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3;overflow:hidden}
.dc-screen-journal .dc-journal-clamp.l2{-webkit-line-clamp:2;line-clamp:2}
.dc-screen-journal .dc-journal-clamp.l4{-webkit-line-clamp:4;line-clamp:4}
.dc-screen-journal .dc-journal-sub{background:rgba(255,255,255,.025);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;margin-top:10px}
.dc-screen-journal .dc-journal-sub h4{font-family:var(--sans);font-weight:600;font-size:15px;color:var(--teal);margin:0 0 6px}
.dc-screen-journal .dc-journal-sub p{font-size:14.5px;line-height:1.55;color:#D5DCE8;margin:0 0 .6em}
.dc-screen-journal .dc-journal-sub p:last-child{margin-bottom:0}
.dc-screen-journal .dc-journal-sub strong{color:var(--text);font-weight:600}
.dc-screen-journal .dc-journal-reflection{white-space:pre-line;font-size:15px;color:var(--mint);overflow-wrap:anywhere}
.dc-screen-journal .dc-journal-addref{display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.dc-screen-journal .dc-journal-sym+.dc-journal-sym{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)}
.dc-screen-journal .dc-journal-sym .n{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600;color:var(--text);font-size:15px}
.dc-screen-journal .dc-journal-sym .n a{color:var(--text)}
.dc-screen-journal .dc-journal-sym .n a:hover{color:var(--teal)}
.dc-screen-journal .dc-journal-sym p.u{margin:4px 0 0;color:#C3CBD8;font-size:14px}
.dc-screen-journal .dc-journal-sym p.p{margin:4px 0 0;color:var(--muted);font-size:13.5px;font-style:italic}
.dc-screen-journal .dc-journal-uni{font-size:12px;padding:1px 9px;font-weight:500}
.dc-screen-journal .dc-journal-moresym{color:var(--muted);font-size:13.5px;margin:8px 0 0}
.dc-screen-journal .dc-journal-open{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-weight:600;font-size:14.5px}
.dc-screen-journal .dc-journal-dl{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:5px 14px;font-size:14px;margin:0}
.dc-screen-journal .dc-journal-dl dt{color:var(--muted)}
.dc-screen-journal .dc-journal-dl dd{margin:0;color:var(--text);overflow-wrap:anywhere}
.dc-screen-journal .dc-journal-entry .dc-divider{margin:16px 0 12px}
.dc-screen-journal .dc-journal-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.dc-screen-journal .dc-journal-foot .dc-btn{min-height:38px}
.dc-screen-journal .dc-journal-del{margin-right:auto}
.dc-screen-journal .dc-journal-analyze{background:rgba(0,0,0,.2)}
.dc-screen-journal .dc-journal-more{margin-top:18px}
.dc-screen-journal .dc-journal-loading{display:flex;justify-content:center;padding:40px 0}
.dc-screen-journal .dc-journal-emptybox .dc-empty{margin-top:4px}
.dc-screen-journal .dc-journal-emptybox .dc-empty p{max-width:420px;margin-left:auto;margin-right:auto}

/* ---------- edit view ---------- */
.dc-screen-journal .dc-journal-back{display:inline-flex;align-items:center;gap:6px;margin:0 0 4px -4px;font-size:15px}
.dc-screen-journal .dc-journal-form .dc-card+.dc-card{margin-top:14px}
.dc-screen-journal .dc-journal-form .dc-card-title{margin-bottom:2px}
.dc-screen-journal .dc-journal-hint{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.dc-screen-journal .dc-journal-hint.top{margin:2px 0 4px}
.dc-screen-journal .dc-journal-hint.glow{color:var(--mint);text-shadow:var(--glow-text);font-size:14.5px;margin:2px 0 12px}
.dc-screen-journal .dc-journal-ftext{min-height:150px}
.dc-screen-journal .dc-journal-fref{min-height:150px}
.dc-screen-journal .dc-journal-small{min-height:80px}
.dc-screen-journal .dc-journal-form input[type=date]{color-scheme:dark;min-height:48px}
.dc-screen-journal .dc-journal-grid{display:grid;gap:0 14px}
@media (min-width:600px){.dc-screen-journal .dc-journal-grid{grid-template-columns:1fr 1fr}}
.dc-screen-journal .dc-journal-tones{gap:8px}
.dc-screen-journal .dc-journal-tones .dc-chip{padding:7px 13px}
.dc-screen-journal .dc-journal-tones .dc-chip:not(.active){background:#222836;border:1px solid #333B4D}
.dc-screen-journal .dc-journal-tones .dc-chip.active{border:1px solid var(--cyan)}
.dc-screen-journal .dc-journal-groups{display:grid;gap:4px 24px}
@media (min-width:600px){.dc-screen-journal .dc-journal-groups{grid-template-columns:1fr 1fr}}
.dc-screen-journal .dc-journal-group h4{font-family:var(--serif);font-weight:700;font-size:16px;color:var(--text);margin:14px 0 6px}
.dc-screen-journal .dc-journal-cat{display:flex;gap:10px;align-items:center;padding:5px 0;font-family:var(--serif);font-size:15.5px;cursor:pointer;line-height:1.3}
.dc-screen-journal .dc-journal-cat input{width:18px;height:18px;margin:0;accent-color:var(--teal);flex:none;cursor:pointer}
.dc-screen-journal .dc-journal-refcard{border-color:rgba(46,230,200,.35);box-shadow:var(--glow-box)}
.dc-screen-journal .dc-journal-bar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;margin:18px calc(-1 * var(--gutter)) 0;padding:14px var(--gutter) calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,24,38,0),rgba(20,24,38,.94) 28%,rgba(20,24,38,.98))}
.dc-screen-journal .dc-journal-bar .dc-btn{flex:1}
.dc-screen-journal .dc-journal-bar .dc-btn.outline{flex:0 1 40%}
.dc-screen-journal .dc-journal-danger{display:flex;justify-content:center;margin-top:18px}
.dc-screen-journal .dc-journal-notice:empty{display:none}
.dc-screen-journal .dc-journal-notice{margin-bottom:14px}
.dc-screen-journal .dc-journal-callout{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.dc-screen-journal .dc-journal-callout>svg{flex:none;margin-top:2px}
.dc-screen-journal .dc-journal-callout>span{flex:1 1 200px}
.dc-screen-journal .dc-journal-callout .dc-link{padding:0;font-weight:600}
.dc-screen-journal .dc-journal-versions{margin-top:10px}
.dc-screen-journal .dc-journal-rev{border:1px solid var(--card-border);border-radius:12px;padding:12px;background:rgba(255,255,255,.02)}
.dc-screen-journal .dc-journal-rev+.dc-journal-rev{margin-top:10px}
.dc-screen-journal .dc-journal-rev .meta{font-size:13px;color:var(--muted)}
.dc-screen-journal .dc-journal-rev .ttl{font-family:var(--serif);font-weight:700;margin-top:4px}
.dc-screen-journal .dc-journal-rev .txt{margin:6px 0 10px;font-size:14.5px;white-space:pre-line;cursor:pointer;color:#D5DCE8}
.dc-screen-journal .dc-journal-note{font-size:13.5px;color:var(--muted);margin:8px 0 0}

/* ---------- journal menu and recently deleted (modals, outside <main>) ---------- */
.dc-journal-menu h4{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.dc-journal-menu h4:first-child{margin-top:0}
.dc-journal-menu .dc-btn.outline{justify-content:flex-start;text-align:left;min-height:44px;font-size:15px}
.dc-journal-menu .dc-btn.outline svg{color:var(--teal);flex:none}
.dc-journal-menu .dc-btn+.dc-btn{margin-top:8px}
.dc-journal-note{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.45}
.dc-journal-note.top{margin:0 0 12px}
.dc-journal-syncline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14.5px;border:1px solid var(--card-border);border-radius:12px;padding:10px 12px;background:var(--card)}
.dc-journal-syncline>svg{color:var(--teal);flex:none}
.dc-journal-syncline .txt{flex:1 1 160px}
.dc-journal-syncline .dc-btn{flex:none}
.dc-journal-dellist{display:flex;flex-direction:column;gap:10px}
.dc-journal-delitem{display:flex;align-items:center;gap:12px;border:1px solid var(--card-border);border-radius:12px;padding:12px;background:var(--card)}
.dc-journal-delitem .main{flex:1;min-width:0}
.dc-journal-delitem .ttl{font-family:var(--serif);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-journal-delitem .meta{font-size:13px;color:var(--muted);margin-top:2px}
.dc-journal-delitem .dc-btn{flex:none}

/* ---------- Undo inside a core toast ---------- */
.dc-journal-undo{margin-left:auto;flex:none;background:transparent;border:1px solid var(--teal);color:var(--teal);border-radius:8px;padding:4px 12px;font-weight:600;font-size:14px;cursor:pointer}
.dc-journal-undo:hover{background:rgba(46,230,200,.12)}

/* ---------- printable page ---------- */
.dc-journal-print{position:fixed;inset:0;z-index:97;background:#fff;color:#16181D;overflow:auto;-webkit-overflow-scrolling:touch}
html.dc-journal-printing body{overflow:hidden}
.dc-journal-print-bar{position:sticky;top:0;display:flex;gap:10px;justify-content:flex-end;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:#F1F3F5;border-bottom:1px solid #D9DDE3;z-index:1}
.dc-journal-print-bar .pbtn{font:600 15px/1 var(--sans);padding:10px 16px;border-radius:8px;border:1px solid #B9C0CA;background:#fff;color:#16181D;cursor:pointer}
.dc-journal-print-bar .pbtn.primary{background:#16181D;border-color:#16181D;color:#fff}
.dc-journal-paper{max-width:720px;margin:0 auto;padding:28px 20px 60px;font-family:var(--serif);font-size:15px;line-height:1.55;color:#16181D}
.dc-journal-paper .ph-top{border-bottom:2px solid #16181D;padding-bottom:12px;margin-bottom:8px}
.dc-journal-paper .brand{font-weight:700;letter-spacing:.12em;font-size:13px;color:#4A5160}
.dc-journal-paper h1{font-size:30px;margin:4px 0 2px;color:#16181D}
.dc-journal-paper .meta{color:#4A5160;margin:0;font-family:var(--sans);font-size:13px}
.dc-journal-pentry{border-bottom:1px solid #D0D4DA;padding:18px 0}
.dc-journal-pentry .ph{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-family:var(--sans);font-size:13px;color:#4A5160}
.dc-journal-pentry .ph .num{font-weight:700;color:#16181D;font-size:15px}
.dc-journal-pentry .ph .date{font-weight:600;color:#16181D;font-size:14px}
.dc-journal-pentry h2{font-size:19px;margin:8px 0 0;color:#16181D}
.dc-journal-pentry .types{font-family:var(--sans);font-size:13px;color:#4A5160;margin:4px 0 0}
.dc-journal-pentry blockquote{margin:10px 0 0;padding:2px 0 2px 12px;border-left:3px solid #8A93A3;font-style:italic;white-space:pre-line}
.dc-journal-pentry h3{font-size:15px;margin:14px 0 4px;color:#16181D;font-family:var(--sans)}
.dc-journal-pentry p{margin:0 0 6px}
.dc-journal-pentry .pre{white-space:pre-line}
.dc-journal-pentry dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-family:var(--sans);font-size:13px}
.dc-journal-pentry dt{color:#4A5160}
.dc-journal-pentry dd{margin:0}
.dc-journal-pentry ul{margin:0;padding-left:18px}
@media print{
  html.dc-journal-printing,html.dc-journal-printing body{background:#fff!important;overflow:visible!important}
  html.dc-journal-printing body>*:not(.dc-journal-print){display:none!important}
  html.dc-journal-printing .dc-journal-print{position:static;overflow:visible}
  html.dc-journal-printing .dc-journal-print-bar{display:none}
  .dc-journal-paper{padding:0;max-width:none}
  .dc-journal-pentry .ph,.dc-journal-pentry h2{break-after:avoid}
}

/* moderation.css */
/* Moderation queue (designed). Scoped to .dc-screen-moderation; classes start with dc-mod-. */
.dc-screen-moderation .dc-mod-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.dc-screen-moderation .dc-mod-count{font-family:var(--serif);font-weight:700;color:var(--text);text-shadow:var(--glow-title);font-size:17px}
.dc-screen-moderation .dc-mod-order{display:flex;align-items:flex-start;gap:8px;color:var(--muted);font-size:13.5px;margin:0 0 14px}
.dc-screen-moderation .dc-mod-order svg{color:var(--teal);flex:none;margin-top:3px}
.dc-screen-moderation .dc-mod-loading{display:flex;justify-content:center;padding:28px 0}
.dc-screen-moderation .dc-mod-loading .dc-spinner{margin:0}
.dc-screen-moderation .dc-mod-list>.dc-card+.dc-card{margin-top:14px}

.dc-screen-moderation .dc-mod-item{border-left:3px solid var(--teal-bar)}
.dc-screen-moderation .dc-mod-item.urgent{border-color:#C9707E;border-left-color:var(--danger);box-shadow:0 0 18px rgba(255,90,110,.12)}
.dc-screen-moderation .dc-mod-head{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.dc-screen-moderation .dc-mod-meta{color:var(--muted);font-size:13px}
.dc-screen-moderation .dc-mod-urgent{border-color:var(--danger);background:#2A1419;color:#FFC3CD}
.dc-screen-moderation .dc-mod-urgent svg{color:var(--danger)}

.dc-screen-moderation .dc-mod-content{background:var(--input);border:1px solid #232A3A;border-radius:10px;padding:10px 12px}
.dc-screen-moderation .dc-mod-author{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.dc-screen-moderation .dc-mod-author svg{color:var(--teal)}
.dc-screen-moderation .dc-mod-handle{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--text)}
.dc-screen-moderation .dc-mod-title{font-weight:600;color:var(--teal);margin-top:8px;overflow-wrap:anywhere}
.dc-screen-moderation .dc-mod-text{margin:4px 0 0;color:#D3D9E3;font-size:14.5px;white-space:pre-line;overflow-wrap:anywhere}
.dc-screen-moderation .dc-mod-text.clamp{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.dc-screen-moderation .dc-mod-more{padding:4px 0;font-size:13.5px}
.dc-screen-moderation .dc-mod-tags{margin-top:8px}
.dc-screen-moderation .dc-mod-gone{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:0;border:1px dashed #2E3546;border-radius:10px;padding:10px 12px}

.dc-screen-moderation .dc-mod-auto{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:13.5px;color:var(--gold)}
.dc-screen-moderation .dc-mod-auto svg{flex:none;margin-top:2px}
.dc-screen-moderation .dc-mod-block{margin-top:12px}
.dc-screen-moderation .dc-mod-label{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.dc-screen-moderation .dc-mod-note{margin:4px 0;padding-left:10px;border-left:2px solid #3A4152;color:#C9D0DC;font-size:14px;font-style:italic;overflow-wrap:anywhere}
.dc-screen-moderation .dc-mod-note-in{min-height:64px}

.dc-screen-moderation .dc-mod-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dc-screen-moderation .dc-mod-actions .dc-btn{font-size:13.5px;padding:7px 8px;line-height:1.2}
.dc-screen-moderation .dc-mod-actions .dc-btn.danger{grid-column:1 / -1}
@media (min-width:720px){.dc-screen-moderation .dc-mod-actions{grid-template-columns:repeat(3,1fr)}.dc-screen-moderation .dc-mod-actions .dc-btn.danger{grid-column:auto}}

/* practice.css */
/* Practice module (hidden, gated). Everything is scoped to .dc-screen-practice. */
.dc-screen-practice .pr-wrap{min-height:40vh}
.dc-screen-practice .pr-loading{display:flex;justify-content:center;padding:60px 0}
.dc-screen-practice .center{text-align:center}
.dc-screen-practice .pr-muted,.dc-slot .pr-muted{color:var(--muted);font-size:14.5px;margin:6px 0 0}
.dc-screen-practice .pr-note,.dc-slot .pr-note{color:var(--muted);font-size:13px;text-align:center;margin:10px 0 0}
.dc-screen-practice .pr-note.left,.dc-slot .pr-note.left{text-align:left}
.dc-screen-practice .pr-prose p{color:#D5DBE6;font-size:15.5px;line-height:1.65;margin:0 0 .8em}
.dc-screen-practice .pr-prose p:last-child{margin-bottom:0}
.dc-screen-practice .pr-prose.muted p{color:var(--muted);font-size:14.5px}
.dc-screen-practice .dc-tab.active{background:#1F5A55;color:#fff}
.dc-screen-practice .dc-card+.dc-card,.dc-screen-practice .dc-card+.pr-module,.dc-screen-practice .pr-module+.pr-module{margin-top:14px}
.dc-screen-practice .pr-tabbody>*+*{margin-top:14px}
@media (max-width:420px){
  .dc-screen-practice .pr-tabs4{gap:2px}
  .dc-screen-practice .pr-tabs4 .dc-tab{padding:9px 6px;font-size:13.5px;flex:1 1 auto}
}

/* ---------- training header ---------- */
.dc-screen-practice .pr-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 0 10px}
.dc-screen-practice .pr-hero h1{flex:1;min-width:0;font-size:clamp(34px,10vw,46px);line-height:1.12;color:var(--text);text-shadow:var(--glow-title);overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-badge{flex:none;width:78px;height:78px;border-radius:50%;filter:drop-shadow(0 0 12px rgba(46,230,200,.28))}
.dc-screen-practice .pr-badge svg,.dc-screen-practice .pr-badge img{display:block;width:100%;height:100%}
.dc-screen-practice .pr-badge.emblem{background:transparent;filter:drop-shadow(0 0 10px rgba(46,230,200,.35)) drop-shadow(0 0 22px rgba(59,227,122,.18))}
.dc-screen-practice .pr-sub{color:var(--mint);text-shadow:var(--glow-text);font-size:16px;margin:0 0 14px}
.dc-screen-practice .pr-access{display:inline-flex;align-items:center;gap:7px;border:1px solid #3BBE6E;background:#0F2418;color:#BFF5D1;border-radius:999px;padding:5px 14px;font-size:14px;margin:0 0 18px;box-shadow:0 0 12px rgba(59,227,122,.12)}
.dc-screen-practice .pr-access svg{color:var(--ok);flex:none}

/* ---------- titles ---------- */
.dc-screen-practice .pr-title-teal,.dc-slot .pr-title-teal{font-family:var(--serif);font-weight:700;font-size:20px;line-height:1.25;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.35);margin:0 0 10px;overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-title-teal.center,.dc-slot .pr-title-teal.center{text-align:center}
.dc-screen-practice .pr-title-teal.mt,.dc-slot .pr-title-teal.mt{margin-top:20px}
.dc-screen-practice .pr-h2{font-size:24px;color:var(--text);text-shadow:var(--glow-title);margin:4px 0 12px;overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-card-h{font-family:var(--serif);font-size:19px;color:var(--text);text-shadow:var(--glow-title);margin:0 0 10px;overflow-wrap:break-word;hyphens:auto}

/* ---------- overview ---------- */
.dc-screen-practice .pr-evidence{border:1px solid #3E5A92;background:#141C30;border-radius:12px;padding:14px 16px}
.dc-screen-practice .pr-evidence-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dc-screen-practice .pr-evidence-head svg{color:#8FB0FF;flex:none}
.dc-screen-practice .pr-evidence-head strong{font-family:var(--serif);font-size:17px;color:#E4ECFF}
.dc-screen-practice .pr-evidence-head .pr-title-teal{margin:0}
.dc-screen-practice .pr-community .pr-evidence-head svg{color:var(--teal)}
.dc-screen-practice .pr-evidence .pr-prose p{color:#C9D4EC;font-size:14.5px}

/* ---------- exercises ---------- */
.dc-screen-practice .pr-chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.dc-screen-practice .pr-chips::-webkit-scrollbar{display:none}
.dc-screen-practice .pr-chips .dc-chip{flex:none}
.dc-screen-practice .pr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 16px}
.dc-screen-practice .pr-tile{border:1px solid #35405A;border-radius:10px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.02);min-width:0}
.dc-screen-practice .pr-tile-n{font-size:12.5px;color:var(--teal);font-weight:600}
.dc-screen-practice .pr-tile-name{font-family:var(--serif);font-weight:700;font-size:14px;line-height:1.25;color:var(--text);margin-top:2px;overflow-wrap:anywhere;hyphens:auto}
.dc-screen-practice .pr-state{display:block}
.dc-screen-practice .pr-state-head{display:flex;align-items:center;gap:10px}
.dc-screen-practice .pr-state-head svg{color:var(--teal);flex:none}
.dc-screen-practice .pr-state-head h3{font-size:19px;color:var(--text);text-shadow:var(--glow-title)}
.dc-screen-practice .pr-state-text{color:var(--muted);font-size:14.5px;margin:8px 0 0}
.dc-screen-practice .pr-state .dc-btn{margin-top:12px}
.dc-screen-practice .pr-state-practice{border-color:rgba(46,230,200,.45);box-shadow:var(--glow-box)}
.dc-screen-practice .pr-state-done{border-color:#2F8F55;background:#10231C}
.dc-screen-practice .pr-state-done .pr-state-head svg{color:var(--ok)}
.dc-screen-practice .pr-info-item+.pr-info-item{margin-top:12px}
.dc-screen-practice .pr-info-t{font-family:var(--serif);font-weight:700;color:var(--teal);font-size:16px}
.dc-screen-practice .pr-info-item p{color:var(--muted);font-size:14.5px;margin:4px 0 0}
.dc-screen-practice .pr-drills{display:grid;gap:10px;margin-top:14px}
.dc-screen-practice .pr-drill{border:1px solid #2E3A4E;border-radius:12px;padding:12px;background:rgba(255,255,255,.02)}
.dc-screen-practice .pr-drill .dc-btn{margin-top:10px}
.dc-screen-practice .pr-drill-head{display:flex;align-items:center;gap:12px}
.dc-screen-practice .pr-drill-n{font-size:12.5px;color:var(--muted)}
.dc-screen-practice .pr-drill-name{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--teal)}

/* ---------- module cards ---------- */
.dc-screen-practice .pr-module{background:var(--card);border:1px solid var(--teal);border-radius:var(--radius);padding:16px;box-shadow:var(--glow-box)}
.dc-screen-practice .pr-module-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dc-screen-practice .pr-module-head h3{font-size:20px;line-height:1.25;color:var(--text);text-shadow:var(--glow-title);min-width:0;overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-mbadge{flex:none;border:1px solid var(--teal);background:var(--teal-fill);color:var(--teal);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;margin-top:3px}
.dc-screen-practice .pr-module-sub{color:var(--mint);text-shadow:var(--glow-text);font-size:15px;margin:6px 0 0}
.dc-screen-practice .pr-lessons-label{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px}
.dc-screen-practice .pr-lessons-list{list-style:none;margin:0 0 14px;padding:0}
.dc-screen-practice .pr-lessons-list li{display:flex;align-items:baseline;gap:10px;padding:4px 0;color:var(--text);font-size:15px}
.dc-screen-practice .pr-lessons-list li svg{color:var(--ok);flex:none;transform:translateY(2px)}
.dc-screen-practice .pr-lessons-list li.done{color:var(--muted)}
.dc-screen-practice .pr-dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);transform:translateY(-2px)}
.dc-screen-practice .pr-btn-module{background:#1F5A4A;border-color:var(--teal);color:var(--teal)}
.dc-screen-practice .pr-btn-module:hover{background:#246A57}
.dc-screen-practice .pr-btn-module:active{background:#1A4E40}

/* ---------- progress ---------- */
.dc-screen-practice .pr-stats{display:grid;grid-template-columns:1fr;gap:10px}
.dc-screen-practice .pr-stat{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.dc-screen-practice .pr-stat svg{color:var(--teal)}
.dc-screen-practice .pr-stat-v{grid-column:3;grid-row:1;font-family:var(--serif);font-weight:700;font-size:24px;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.35);white-space:nowrap}
.dc-screen-practice .pr-stat-l{grid-column:2;grid-row:1;font-size:14px;color:var(--muted);line-height:1.35}
@media (min-width:560px){
  .dc-screen-practice .pr-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .dc-screen-practice .pr-stat{display:block;text-align:center;padding:14px}
  .dc-screen-practice .pr-stat-v{font-size:26px;margin-top:2px}
  .dc-screen-practice .pr-stat-l{font-size:13px}
}
.dc-screen-practice .pr-hist-h{margin-top:22px}
.dc-screen-practice .pr-history>*+*{margin-top:10px}
.dc-screen-practice .pr-hdate{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--text)}
.dc-screen-practice .pr-hdate svg{color:var(--teal);flex:none}
.dc-screen-practice .pr-hcoord{display:flex;gap:12px;margin-top:8px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.12em;color:var(--cyan)}
.dc-screen-practice .pr-htarget{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--text);margin-top:4px}
.dc-screen-practice .pr-hdetails{margin-top:8px}
.dc-screen-practice .pr-hdetails summary{cursor:pointer;color:var(--teal);font-size:14px}
.dc-screen-practice .pr-hnote{margin-top:10px;padding-left:12px;border-left:2px solid var(--teal-bar)}
.dc-screen-practice .pr-hnote-t{font-size:12.5px;color:var(--muted);font-weight:600}
.dc-screen-practice .pr-hnote p{margin:2px 0 0;font-size:14.5px;color:#D5DBE6;white-space:pre-wrap;overflow-wrap:anywhere}
.dc-screen-practice .pr-hsketch{display:block;width:100%;max-width:300px;margin-top:10px;border-radius:8px;border:1px solid var(--card-border)}

/* ---------- module page ---------- */
.dc-screen-practice .pr-back{margin:0 0 12px}
.dc-screen-practice .pr-mtitle{text-align:center;margin:0 0 18px}
.dc-screen-practice .pr-mtitle h1{font-size:clamp(30px,8.5vw,40px);line-height:1.15;color:var(--text);text-shadow:var(--glow-title);overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-mtitle .pr-sub{margin:10px 0 0}
.dc-screen-practice .pr-srows{border-top:1px solid var(--card-border)}
.dc-screen-practice .pr-srow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:15px}
.dc-screen-practice .pr-srow span{color:var(--muted)}
.dc-screen-practice .pr-srow strong{color:var(--teal);text-align:right;font-weight:600}
.dc-screen-practice .pr-mex{margin:12px 0 14px}
.dc-screen-practice .pr-community .dc-btn,.dc-screen-practice .pr-mover+.dc-btn{margin-top:14px}
.dc-screen-practice .dc-card>.dc-btn{margin-top:14px}
.dc-screen-practice .pr-sq{flex:none;width:40px;height:40px;border-radius:8px;background:var(--teal-dark);border:1px solid rgba(46,230,200,.35);color:var(--teal);font-family:var(--serif);font-weight:700;font-size:19px;display:inline-flex;align-items:center;justify-content:center}
.dc-screen-practice .pr-lesson-head{display:flex;align-items:flex-start;gap:12px}
.dc-screen-practice .pr-lesson-ht{flex:1;min-width:0}
.dc-screen-practice .pr-lesson-ht h3{font-size:20px;line-height:1.25;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.3);overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-min{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13.5px;margin-top:3px}
.dc-screen-practice .pr-check{flex:none;color:var(--ok);display:inline-flex}
.dc-screen-practice .pr-lesson-sum{color:#C8CFDC;font-size:15px;margin:10px 0 0}
.dc-screen-practice .pr-lesson.done{border-color:rgba(59,227,122,.35)}

/* ---------- lesson page ---------- */
.dc-screen-practice .pr-lesson-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dc-screen-practice .pr-lesson-title{font-size:clamp(24px,7vw,30px);line-height:1.2;color:var(--teal);text-shadow:0 0 10px rgba(46,230,200,.4);min-width:0;overflow-wrap:break-word;hyphens:auto}
.dc-screen-practice .pr-done-pill{flex:none;margin-top:4px;border-color:var(--ok);color:var(--ok);background:#0F2418}
.dc-screen-practice .pr-lesson-sub{color:var(--muted);font-size:15px;margin:8px 0 0}
.dc-screen-practice .pr-body{margin-top:14px}
.dc-screen-practice .pr-bh{font-size:18px;color:var(--text);text-shadow:var(--glow-title);margin:20px 0 8px}
.dc-screen-practice .pr-bh4{font-family:var(--serif);font-size:16.5px;color:var(--text);text-shadow:var(--glow-title);margin:16px 0 6px}
.dc-screen-practice .pr-bp{color:#D5DBE6;font-size:15.5px;line-height:1.65;margin:0 0 .8em}
.dc-screen-practice .pr-blead{color:var(--text);font-family:var(--serif)}
.dc-screen-practice .pr-blist,.dc-screen-practice .pr-bsteps{margin:4px 0 14px}
.dc-screen-practice .pr-bnote{margin:10px 0 14px}
.dc-screen-practice .pr-bnote p{color:#C9D4EC;font-size:14.5px;margin:0}
.dc-screen-practice .pr-steps-ol{list-style:none;margin:6px 0 0;padding:0}
.dc-screen-practice .pr-steps-ol li{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:#D5DBE6;font-size:15px}
.dc-screen-practice .pr-stepn{flex:none;width:24px;height:24px;border-radius:50%;background:var(--teal-fill);border:1px solid var(--teal);color:var(--teal);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.dc-screen-practice .pr-complete-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px 16px;margin-top:18px}
.dc-screen-practice .pr-upnext{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.dc-screen-practice .pr-upnext-l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dc-screen-practice .pr-upnext-t{font-family:var(--serif);font-size:16px;color:var(--mint);text-shadow:var(--glow-text);overflow-wrap:break-word}

/* ---------- session ---------- */
.dc-screen-practice .pr-session>*+*{margin-top:14px}
.dc-screen-practice .pr-coord{text-align:center}
.dc-screen-practice .pr-coord-l{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dc-screen-practice .pr-coord-v{display:flex;justify-content:center;gap:18px;margin-top:6px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(30px,10vw,40px);font-weight:700;letter-spacing:.14em;color:var(--cyan);text-shadow:0 0 12px rgba(42,252,228,.55)}
.dc-screen-practice .pr-steps{display:flex;gap:6px}
.dc-screen-practice .pr-steps span{flex:1;height:6px;border-radius:3px;background:#2B303B}
.dc-screen-practice .pr-steps span.done{background:var(--teal-bar)}
.dc-screen-practice .pr-steps span.cur{background:var(--cyan);box-shadow:0 0 8px rgba(42,252,228,.6)}
.dc-screen-practice .pr-stage-of{font-size:13px;color:var(--muted)}
.dc-screen-practice .pr-stage-name{font-size:23px;color:var(--teal);text-shadow:0 0 10px rgba(46,230,200,.4);overflow-wrap:break-word;hyphens:auto;margin-top:2px}
.dc-screen-practice .pr-stage-short{color:var(--mint);text-shadow:var(--glow-text);font-size:15px;margin:6px 0 0}
.dc-screen-practice .pr-timer{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;border:1px solid #2E3A4E;border-radius:12px;padding:8px 12px;margin-top:12px;font-size:14px;color:var(--text);background:#0E1119}
.dc-screen-practice .pr-timer svg{color:var(--teal);flex:none}
.dc-screen-practice .pr-timer-l{color:var(--muted)}
.dc-screen-practice .pr-time{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;letter-spacing:.03em}
.dc-screen-practice .pr-timer .pr-sugg{color:var(--muted);margin-left:auto;font-size:13px}
.dc-screen-practice .pr-timer.over{border-color:#7A6430}
.dc-screen-practice .pr-timer.over svg{color:var(--warn)}
.dc-screen-practice .pr-over{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:13.5px;color:var(--warn)}
.dc-screen-practice .pr-over svg{flex:none;margin-top:2px}

.dc-screen-practice .pr-rate-scale{text-align:center;color:var(--mint);text-shadow:var(--glow-text);font-size:14.5px;margin-top:8px;min-height:1.4em}
.dc-screen-practice .pr-decoy{margin-top:14px}
.dc-screen-practice .pr-decoy-title{font-size:19px;color:var(--text);text-shadow:var(--glow-title);margin:4px 0 0}
.dc-screen-practice .pr-label-h{display:block}
.dc-screen-practice .pr-reflect{min-height:100px}
.dc-screen-practice .pr-hdecoy{font-size:13.5px;color:var(--muted);margin-top:4px}
.dc-screen-practice .pr-stat-v.none{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--muted);text-shadow:none}
.dc-screen-practice .pr-notes{min-height:130px}
.dc-screen-practice .pr-sketch{margin-top:14px}
.dc-screen-practice .pr-nomargin{margin:0}
.dc-screen-practice .pr-canvas{display:block;width:100%;max-width:560px;height:auto;aspect-ratio:3/2;margin-top:8px;border:1px solid #2E3546;border-radius:var(--radius-sm);background:#0A0E16;touch-action:none;cursor:crosshair}

.dc-screen-practice .pr-nav.single{grid-template-columns:1fr}
.dc-screen-practice .pr-target-title{font-size:clamp(24px,7vw,30px);color:var(--text);text-shadow:var(--glow-title);margin:4px 0 10px;overflow-wrap:break-word}
.dc-screen-practice .pr-descs{margin-top:10px}
.dc-screen-practice .pr-desc{display:inline-flex;align-items:center;gap:6px}
.dc-screen-practice .pr-rate-v{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--teal);text-shadow:0 0 8px rgba(46,230,200,.35);text-align:center;margin:10px 0 6px}

@media (min-width:720px){

}

.dc-screen-practice .pr-ex-sum{color:#D5DBE6;font-size:15px;margin:6px 0 0}

/* ---------- introduction film (full screen, once after unlock) ---------- */
.pr-intro{position:fixed;inset:0;z-index:10000;background:#000;display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .45s ease}
.pr-intro.out{opacity:0;pointer-events:none}
.pr-intro-video{width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .5s ease}
.pr-intro-video.on{opacity:1}
.pr-intro-wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mint);text-shadow:var(--glow-text);font-size:15px}
.pr-intro-wait p{margin:0}
.pr-intro-bar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:10px}
.pr-intro-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.42);color:#fff;border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:background .2s,box-shadow .2s}
.pr-intro-btn:hover,.pr-intro-btn:focus-visible{background:rgba(20,40,40,.7);box-shadow:0 0 14px rgba(46,230,200,.45);outline:none}
.pr-intro-play{position:absolute;width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(6,20,24,.6);color:var(--teal);border:1px solid rgba(46,230,200,.6);box-shadow:0 0 28px rgba(46,230,200,.35);cursor:pointer}
.dc-screen-practice .pr-replay{display:flex;justify-content:center;margin-top:14px}

/* ---------- the signature figure ---------- */
.dc-screen-practice .pr-fig{margin:18px 0 6px;padding:16px;border:1px solid rgba(230,222,166,.28);border-radius:var(--radius);background:radial-gradient(120% 80% at 50% 35%,#13214A 0%,#0A1628 55%,#06060C 100%);box-shadow:0 0 26px rgba(88,104,255,.14),inset 0 0 40px rgba(88,104,255,.08)}
.dc-screen-practice .pr-fig.compact{margin:10px 0 0;padding:12px}
.dc-screen-practice .pr-fig-title{margin-top:0;text-align:center;color:var(--gold);text-shadow:0 0 10px rgba(230,222,166,.35)}
/* The whole figure fits on one screen under the fixed header: its height never exceeds the visible height minus the
   header, the title and the caption (width follows from the drawing's 1197 x 1874 proportions). */
.dc-screen-practice .pr-fig-stage{position:relative;width:min(100%,280px,calc((100vh - var(--header-h) - 190px) * .6387));width:min(100%,280px,calc((100svh - var(--header-h) - 190px) * .6387));margin:6px auto 0;opacity:0;transition:opacity .6s ease}
.dc-screen-practice .pr-fig.compact .pr-fig-stage{width:min(100%,210px,calc((100vh - var(--header-h) - 220px) * .6387));width:min(100%,210px,calc((100svh - var(--header-h) - 220px) * .6387))}
.dc-screen-practice .pr-fig{scroll-margin-top:calc(var(--header-h) + 12px)}
.dc-screen-practice .pr-fig-stage.ready{opacity:1}
.dc-screen-practice .pr-fig-img{display:block;width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(120,136,255,.75)) drop-shadow(0 0 18px rgba(88,104,255,.45))}
.dc-screen-practice .pr-fig-mark{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px;line-height:1;color:var(--gold);background:rgba(6,10,24,.82);border:1.5px solid var(--gold);box-shadow:0 0 10px rgba(230,222,166,.4);cursor:pointer;transition:transform .2s,box-shadow .2s,color .2s,border-color .2s}
.dc-screen-practice .pr-fig-mark::before{content:"";position:absolute;inset:-8px}
.dc-screen-practice .pr-fig-mark.on,.dc-screen-practice .pr-fig-mark:focus-visible{color:#04211F;background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 4px rgba(46,230,200,.18),0 0 22px rgba(46,230,200,.8);transform:translate(-50%,-50%) scale(1.14);outline:none}
.dc-screen-practice .pr-fig-cap{color:var(--muted);font-size:13px;font-style:italic;text-align:center;margin:12px 0 0}
.dc-screen-practice .pr-fig-keyh{font-family:var(--serif);font-size:16px;color:var(--text);text-shadow:var(--glow-title);margin:14px 0 8px}
.dc-screen-practice .pr-fig-key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:520px){.dc-screen-practice .pr-fig-key{grid-template-columns:1fr 1fr}.dc-screen-practice .pr-fig-key li:last-child{grid-column:1/-1}}
.dc-screen-practice .pr-fig-row{width:100%;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;text-align:left;padding:8px 10px;border-radius:var(--radius-sm);background:rgba(20,24,38,.7);border:1px solid var(--card-border);color:var(--mint);font:inherit;font-size:14.5px;cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.dc-screen-practice .pr-fig-row.on{border-color:var(--teal);background:var(--teal-fill);box-shadow:0 0 14px rgba(46,230,200,.25)}
.dc-screen-practice .pr-fig-n{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold);border:1px solid rgba(230,222,166,.6)}
.dc-screen-practice .pr-fig-row.on .pr-fig-n{color:#04211F;background:var(--teal);border-color:var(--teal)}
.dc-screen-practice .pr-fig-name{font-weight:600}
.dc-screen-practice .pr-fig-sub{flex-basis:100%;padding-left:34px;color:var(--muted);font-size:13px}
.dc-screen-practice .pr-fig-ref,.dc-slot .pr-fig-ref{margin-top:14px;border:1px solid rgba(230,222,166,.25);border-radius:var(--radius-sm);padding:10px 12px;background:rgba(10,22,40,.6)}
.dc-screen-practice .pr-fig-ref summary,.dc-slot .pr-fig-ref summary{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--gold);font-weight:600;font-size:14.5px;list-style:none}
.dc-screen-practice .pr-fig-ref summary::-webkit-details-marker,.dc-slot .pr-fig-ref summary::-webkit-details-marker{display:none}
.dc-screen-practice .pr-fig-ref[open] summary,.dc-slot .pr-fig-ref[open] summary{margin-bottom:6px}

/* ---------- the plain ideogram mark: black strokes given a luminous edge so they read on the dark screens ---------- */
.pr-mark{display:flex;justify-content:center}
.pr-mark img{display:block;height:64px;width:auto;filter:drop-shadow(0 0 1px #E4FCFC) drop-shadow(0 0 1px #E4FCFC) drop-shadow(0 0 7px rgba(46,230,200,.75)) drop-shadow(0 0 16px rgba(46,230,200,.35))}
.dc-screen-practice .pr-mtitle .pr-mark{margin:0 0 6px}
.pr-mark.large img{height:120px}
.pr-mark.pulse img{animation:pr-mark-pulse 2.4s ease-in-out infinite}
@keyframes pr-mark-pulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}

/* ---------- my tools ---------- */
.dc-screen-practice .pr-tools-intro{margin:0 0 4px}
.dc-screen-practice .pr-tool-head,.dc-slot .pr-tool-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dc-screen-practice .pr-tool-head svg,.dc-slot .pr-tool-head svg{color:var(--gold);flex:none;filter:drop-shadow(0 0 6px rgba(230,222,166,.4))}
.dc-screen-practice .pr-tool-head .pr-title-teal,.dc-slot .pr-tool-head .pr-title-teal{margin:0}
.dc-screen-practice .pr-ideo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:12px 0 4px}
.dc-screen-practice .pr-ideo-grid.small{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;margin-top:8px}
.dc-screen-practice .pr-ideo-tile{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:var(--radius-sm);border:1px dashed rgba(230,222,166,.4);background:#0A0E16;color:var(--mint);font:inherit;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.dc-screen-practice .pr-ideo-tile.has{border-style:solid;border-color:rgba(46,230,200,.45);box-shadow:0 0 12px rgba(46,230,200,.12)}
.dc-screen-practice .pr-ideo-tile.static{cursor:default}
.dc-screen-practice .pr-ideo-tile:not(.static):hover,.dc-screen-practice .pr-ideo-tile:focus-visible{border-color:var(--teal);box-shadow:0 0 16px rgba(46,230,200,.3);outline:none}
.dc-screen-practice .pr-ideo-tile img{display:block;width:100%;aspect-ratio:1;border-radius:6px;filter:drop-shadow(0 0 4px rgba(228,252,252,.35))}
.dc-screen-practice .pr-ideo-empty{display:flex;align-items:center;justify-content:center;aspect-ratio:1;color:rgba(230,222,166,.6)}
.dc-screen-practice .pr-ideo-cap{font-size:12.5px;line-height:1.3;text-align:center;color:var(--muted)}
.dc-screen-practice .pr-ideo-cap b{color:var(--gold);font-family:var(--serif)}
.pr-padwrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.pr-pad{width:min(100%,320px);aspect-ratio:1;border-radius:12px;border:1px solid rgba(46,230,200,.45);box-shadow:0 0 18px rgba(46,230,200,.18);touch-action:none;background:#0A0E16}
.dc-screen-practice .pr-wcat,.dc-slot .pr-wcat{margin-top:12px}
.dc-screen-practice .pr-wcat.small,.dc-slot .pr-wcat.small{margin-top:8px}
.dc-screen-practice .pr-wcat-h,.dc-slot .pr-wcat-h{display:block;font-family:var(--serif);font-size:15px;color:var(--gold);margin-bottom:6px}
.dc-screen-practice .pr-chips-wrap,.dc-slot .pr-chips-wrap{display:flex;flex-wrap:wrap;gap:6px}
.dc-screen-practice .pr-wchip,.dc-slot .pr-wchip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--teal-fill);border:1px solid rgba(46,230,200,.35);color:var(--mint);font-size:13.5px}
.dc-screen-practice .pr-wchip.static,.dc-slot .pr-wchip.static{padding-right:10px}
.dc-screen-practice .pr-wchip-x{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer}
.dc-screen-practice .pr-wchip-x:hover,.dc-screen-practice .pr-wchip-x:focus-visible{color:var(--text);background:rgba(255,255,255,.08);outline:none}
.dc-screen-practice .pr-word-add{display:flex;gap:8px;margin-top:8px}
.dc-screen-practice .pr-word-in{flex:1;min-width:0}
.dc-screen-practice .pr-rules-ta{min-height:160px}
.dc-screen-practice .pr-rules-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.dc-screen-practice .pr-rules-read p{margin:0 0 6px;color:#D5DBE6;font-size:14.5px;line-height:1.5;padding-left:14px;position:relative}
.dc-screen-practice .pr-rules-read p::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.dc-screen-practice .pr-mine,.dc-slot .pr-mine{border-color:rgba(46,230,200,.35)}
.dc-screen-practice .pr-mine summary,.dc-slot .pr-mine summary{color:var(--teal)}
.dc-screen-practice .pr-hdream,.dc-slot .pr-hdream{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px}
.dc-screen-practice .pr-ex-done{display:flex;justify-content:flex-end;margin-bottom:6px}
.dc-screen-practice .pr-ex-progress{color:var(--muted);font-size:13.5px;margin:12px 0 10px}

/* ---------- calibration chart: real (teal, solid) and decoys (violet, dashed); one axis 0 to 5 ---------- */
.dc-screen-practice .pr-calib{--c-real:#2EE6C8;--c-decoy:#C9A0FF}
.dc-screen-practice .pr-calib-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0 4px;font-size:13.5px;color:var(--mint)}
.dc-screen-practice .pr-leg{display:inline-flex;align-items:center;gap:8px}
.dc-screen-practice .pr-leg i{display:inline-block;width:22px;height:0;border-top:2px solid var(--c-real)}
.dc-screen-practice .pr-leg i.decoy{border-top:2px dashed var(--c-decoy)}
.dc-screen-practice .pr-calib-wrap{position:relative}
.dc-screen-practice .pr-calib-svg{display:block;width:100%;height:auto;touch-action:pan-y}
.dc-screen-practice .pr-calib-svg .g{stroke:rgba(255,255,255,.07);stroke-width:1}
.dc-screen-practice .pr-calib-svg .ax{fill:var(--muted);font-size:20px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.dc-screen-practice .pr-calib-svg .ln{fill:none;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.dc-screen-practice .pr-calib-svg .ln.real{stroke:var(--c-real)}
.dc-screen-practice .pr-calib-svg .ln.decoy{stroke:var(--c-decoy);stroke-dasharray:10 8}
.dc-screen-practice .pr-calib-svg .dot{stroke:var(--card);stroke-width:3}
.dc-screen-practice .pr-calib-svg .dot.real{fill:var(--c-real)}
.dc-screen-practice .pr-calib-svg .dot.decoy{fill:var(--c-decoy)}
.dc-screen-practice .pr-calib-svg .lab{fill:var(--mint);font-size:21px;font-family:var(--sans);font-variant-numeric:tabular-nums}
.dc-screen-practice .pr-calib-svg .cross{stroke:rgba(228,252,252,.35);stroke-width:1}
.dc-screen-practice .pr-calib-tip{position:absolute;top:0;width:170px;padding:8px 10px;border-radius:8px;background:#0A0E16;border:1px solid rgba(46,230,200,.35);color:var(--mint);font-size:12.5px;line-height:1.4;pointer-events:none;font-variant-numeric:tabular-nums}
.dc-screen-practice .pr-calib-x{color:var(--muted);font-size:12px;text-align:center;margin-top:2px}
.dc-screen-practice .pr-calib-sum{color:var(--text);font-size:15px;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.dc-screen-practice .pr-calib-table summary{cursor:pointer;color:var(--teal);font-size:14px;margin-top:10px}
.dc-screen-practice .pr-table-scroll{overflow-x:auto;margin-top:8px}
.dc-screen-practice .pr-table-scroll table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.dc-screen-practice .pr-table-scroll th,.dc-screen-practice .pr-table-scroll td{padding:6px 8px;border-bottom:1px solid var(--card-border);text-align:left;color:#D5DBE6}
.dc-screen-practice .pr-table-scroll th{color:var(--muted);font-weight:600}

/* ---------- knowledge check ---------- */
.dc-screen-practice .pr-quiz{display:flex;flex-direction:column;gap:12px}
.dc-screen-practice .pr-qcard{margin:0;border:1px solid var(--card-border)}
.dc-screen-practice .pr-qcard.ok{border-color:rgba(59,227,122,.55)}
.dc-screen-practice .pr-qcard.miss{border-color:rgba(242,193,78,.55)}
.dc-screen-practice .pr-qh{float:left;width:100%;display:flex;gap:10px;align-items:flex-start;font-family:var(--serif);font-size:16.5px;color:var(--text);line-height:1.4;padding:0;margin-bottom:10px}
.dc-screen-practice .pr-qh+*{clear:both}
.dc-screen-practice .pr-qopt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:var(--radius-sm);border:1px solid var(--card-border);margin-top:6px;cursor:pointer;color:#D5DBE6;font-size:14.5px;line-height:1.45}
.dc-screen-practice .pr-qopt input{margin-top:3px;accent-color:var(--teal);flex:none}
.dc-screen-practice .pr-qopt:has(input:checked){border-color:rgba(46,230,200,.6);background:var(--teal-fill)}
.dc-screen-practice .pr-qopt.right,.dc-screen-practice .pr-qopt.right:has(input:checked){border-color:rgba(59,227,122,.7);background:#0F2418}
.dc-screen-practice .pr-qopt.wrong,.dc-screen-practice .pr-qopt.wrong:has(input:checked){border-color:rgba(242,193,78,.7);background:#2A2210}
.dc-screen-practice .pr-qres{margin-top:8px;font-size:14px;color:#D5DBE6}
.dc-screen-practice .pr-qres p{margin:4px 0 0}
.dc-screen-practice .pr-qsum{display:flex;flex-direction:column;gap:8px}
.dc-screen-practice .pr-qsum:empty{display:none}

/* ---------- course completion record ---------- */
.dc-screen-practice .pr-record{margin-top:14px}
.dc-screen-practice .pr-rec-mod{margin-top:12px}
.dc-screen-practice .pr-rec-mh{font-family:var(--serif);font-size:15px;color:var(--gold);margin-bottom:4px}
.dc-screen-practice .pr-rec-list,.dc-slot .pr-rec-list{list-style:none;margin:0;padding:0}
.dc-screen-practice .pr-rec-row,.dc-slot .pr-rec-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);color:var(--muted);font-size:14px}
.dc-screen-practice .pr-rec-row svg,.dc-slot .pr-rec-row svg{flex:none;color:var(--dim)}
.dc-screen-practice .pr-rec-row.ok,.dc-slot .pr-rec-row.ok{color:var(--mint)}
.dc-screen-practice .pr-rec-row.ok svg,.dc-slot .pr-rec-row.ok svg{color:var(--ok)}
.dc-screen-practice .pr-rec-row .dc-link,.dc-slot .pr-rec-row .dc-link{flex:1;text-align:left;font-size:14px}
